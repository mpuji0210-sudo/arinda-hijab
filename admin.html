<script>

function openTab(name){document.querySelectorAll('.tab-content').forEach(c=>c.classList.add('hidden'));document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));$("tab-"+name).classList.remove('hidden');event.target.classList.add('active');}
function showToast(m,e){const t=$("toast");t.innerText=m;t.style.background=e?'#B42318':'#2B1B12';t.style.display='block';setTimeout(()=>t.style.display='none',3500);}
function toBase64(f){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function init(){
 try{const {data}=await supabaseClient.from('settings').select('*');if(data){const get=k=>{const f=data.find(s=>s.key===k);return f?f.value:null;};if(get('store_name'))$("storeName").value=get('store_name');if(get('wa_number'))$("waNumber").value=get('wa_number');if(get('toko_origin_id')){tokoOriginId=get('toko_origin_id');tokoOriginLabel=get('toko_origin_label')||tokoOriginLabel;}if(get('home_koleksi_title'))$("homeKoleksiTitle").value=get('home_koleksi_title');if(get('home_undertone_title'))$("homeUnderTitle").value=get('home_undertone_title');if(get('home_undertone_desc'))$("homeUnderDesc").value=get('home_undertone_desc');if(get('home_undertone_list'))$("homeUnderList").value=get('home_undertone_list');if(get('home_koleksi_terlaris')){try{const p=JSON.parse(get('home_koleksi_terlaris'));if(p.length>0&&typeof p[0]==='object')koleksiSlots=p.map(x=>({url:x.url||'',title:x.title||'',desc:x.desc||''}));}catch(e){}}if(get('home_undertone_images')){try{const p=JSON.parse(get('home_undertone_images'));if(p.length>0)undertoneSlots=p.map(x=>({url:x.url||'',title:x.title||'',desc:x.desc||''}));}catch(e){}}if(get('home_faq_list')){try{faqSlots=JSON.parse(get('home_faq_list'));}catch(e){}}}}catch(e){}
 $("curOrigin").innerText=tokoOriginLabel+" - "+tokoOriginId;await loadCats();await loadProducts();await loadBanners();initVarRows();renderKoleksi();renderUndertone();renderFaq();
}
function initVarRows(){$("varInputs").innerHTML='';addVarRow();}
function addVarRow(color='',img=''){
 const id='varFile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 const d=document.createElement('div');d.className='slot';
 const top=document.createElement('div');top.style.cssText='display:flex;gap:6px;align-items:center';
 const inp=document.createElement('input');inp.className='input var-color';inp.placeholder='Nama WARNA (KREM/HITAM/MAROON)';inp.value=color||'';inp.style.flex='1';
 const del=document.createElement('button');del.type='button';del.className='btn-del';del.innerText='✕ Hapus';del.onclick=()=>d.remove();
 top.appendChild(inp);top.appendChild(del);d.appendChild(top);
 if(img){const im=document.createElement('img');im.src=img;im.className='preview-img';im.style.cssText='width:100%;height:200px;object-fit:cover;object-position:top;border-radius:12px;margin-top:8px';d.appendChild(im);}
 const fileInput=document.createElement('input');fileInput.type='file';fileInput.className='var-file';fileInput.accept='image/*';fileInput.style.display='none';fileInput.id=id;fileInput.onchange=()=>previewNew(fileInput);
 const label=document.createElement('label');label.htmlFor=id;label.className='file-btn';label.innerText=img?'📸 Ganti Foto Warna':'📸 Pilih Foto Warna';
 const hidden=document.createElement('input');hidden.type='hidden';hidden.className='var-old-url';hidden.value=img||'';
 d.appendChild(fileInput);d.appendChild(label);d.appendChild(hidden);$("varInputs").appendChild(d);
}
window.previewNew=(input)=>{const slot=input.closest('.slot');const file=input.files[0];if(!file)return;const url=URL.createObjectURL(file);let img=slot.querySelector('.preview-img');if(!img){img=document.createElement('img');img.className='preview-img';img.style.cssText='width:100%;height:200px;object-fit:cover;border-radius:12px;margin-top:8px';slot.insertBefore(img,input);}img.src=url;slot.querySelector('.var-old-url').value='';};
$("btnAddVar").onclick=()=>addVarRow();
async function loadCats(){const {data}=await supabaseClient.from('categories').select('*');if(!data)return;$("catList").innerHTML=data.map(c=>`<span style="display:inline-block;background:#F6EEE6;border:1px solid #EEE6DF;padding:6px 12px;border-radius:20px;margin:3px;font-size:11px">${escapeHtml(c.name)} <b style="color:#B42318;cursor:pointer" onclick="delCat('${c.id}')">x</b></span>`).join('');$("pCat").innerHTML='<option value="">Pilih Kategori</option>'+data.map(c=>`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');}
$("btnAddCat").onclick=async()=>{const v=$("catName").value.trim();if(!v)return;await supabaseClient.from('categories').insert({name:v});$("catName").value='';loadCats();};
window.delCat=async(id)=>{await supabaseClient.from('categories').delete().eq('id',id);loadCats();showToast('✅ Kategori terhapus');};
function renderKoleksi(){let html='';koleksiSlots.forEach((item,i)=>{html+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small"><b>Slot ${i+1}</b></span><button class="btn-del" onclick="hapusKoleksi(${i})">X Hapus</button></div>${item.url?`<img src="${item.url}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin:8px 0">`:''}<input type="file" style="display:none" id="kFile${i}" accept="image/*" onchange="gantiKoleksi(${i},this)"><label for="kFile${i}" class="file-btn">📸 Pilih File</label><input id="kTitle${i}" class="input" placeholder="Judul" value="${escapeHtml(item.title)}" oninput="koleksiSlots[${i}].title=this.value"><input id="kDesc${i}" class="input" placeholder="Deskripsi" value="${escapeHtml(item.desc)}" oninput="koleksiSlots[${i}].desc=this.value"></div>`;});$("koleksi4Wrap").innerHTML=html;}
window.hapusKoleksi=(i)=>{koleksiSlots.splice(i,1);if(koleksiSlots.length==0)koleksiSlots=[{url:"",title:"",desc:""}];renderKoleksi();};
window.gantiKoleksi=async(i,input)=>{const f=input.files[0];if(!f)return;koleksiSlots[i].url=await toBase64(f);renderKoleksi();};
$("btnAddKoleksi").onclick=()=>{koleksiSlots.push({url:"",title:"",desc:""});renderKoleksi();};
$("koleksiGaleri").addEventListener('change',async e=>{for(let f of e.target.files){koleksiSlots.push({url:await toBase64(f),title:f.name.split('.')[0],desc:""});}renderKoleksi();});
function renderUndertone(){let html='';undertoneSlots.forEach((item,i)=>{html+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small"><b>Foto ${i+1}</b></span><button class="btn-del" onclick="hapusUndertone(${i})">X Hapus</button></div>${item.url?`<img src="${item.url}" style="width:100%;height:160px;object-fit:cover;border-radius:12px;margin:8px 0">`:''}<input type="file" style="display:none" id="uFile${i}" accept="image/*" onchange="gantiUndertone(${i},this)"><label for="uFile${i}" class="file-btn">📸 Pilih File</label><input id="uTitle${i}" class="input" placeholder="Nama" value="${escapeHtml(item.title)}" oninput="undertoneSlots[${i}].title=this.value"></div>`;});$("undertoneWrap").innerHTML=html;}
window.hapusUndertone=(i)=>{undertoneSlots.splice(i,1);if(undertoneSlots.length==0)undertoneSlots=[{url:"",title:"",desc:""}];renderUndertone();};
window.gantiUndertone=async(i,input)=>{const f=input.files[0];if(!f)return;undertoneSlots[i].url=await toBase64(f);renderUndertone();};
$("btnAddUnder").onclick=()=>{undertoneSlots.push({url:"",title:"",desc:""});renderUndertone();};
$("underGaleri").addEventListener('change',async e=>{for(let f of e.target.files){undertoneSlots.push({url:await toBase64(f),title:"",desc:""});}renderUndertone();});
function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small">FAQ ${i+1}</span><button class="btn-del" onclick="hapusFaq(${i})">X Hapus</button></div><input id="faqQ${i}" class="input" placeholder="Pertanyaan" value="${escapeHtml(f.q)}" oninput="faqSlots[${i}].q=this.value"><textarea id="faqA${i}" class="input" rows="2" placeholder="Jawaban" oninput="faqSlots[${i}].a=this.value">${escapeHtml(f.a)}</textarea></div>`;});$("faqWrap").innerHTML=h;}
window.hapusFaq=(i)=>{faqSlots.splice(i,1);if(faqSlots.length==0)faqSlots=[{q:'',a:''}];renderFaq();};
$("btnAddFaq").onclick=()=>{faqSlots.push({q:'',a:''});renderFaq();};
$("btnSaveFaq").onclick=async()=>{const final=faqSlots.filter(x=>x.q&&x.a);await supabaseClient.from('settings').upsert([{key:'home_faq_list',value:JSON.stringify(final)}],{onConflict:'key'});showToast('✅ FAQ tersimpan '+final.length);};
async function loadProducts(){const {data:prods}=await supabaseClient.from('products').select('*').order('id',{ascending:false});$("prodCount").innerText=(prods||[]).length;$("list").innerHTML=(prods||[]).map(p=>`<div class="prod-card"><div style="position:relative"><img class="prod-img" src="${p.image_url}"><span class="badge">${escapeHtml(p.category||'')}</span></div><div style="padding:10px"><div style="font-size:12px;font-weight:700">${escapeHtml(p.name)}</div><div style="font-size:13px;font-weight:800;color:#16A34A">Rp${Number(p.price).toLocaleString('id-ID')}</div><button class="btn" style="margin-top:8px;padding:8px;font-size:11px" onclick="editP('${p.id}')">✏️ EDIT</button><button class="btn" style="margin-top:4px;padding:8px;background:#FFF1F1;color:#B42318;border:1px solid #FECACA;font-size:11px" onclick="delP('${p.id}')">🗑️ HAPUS</button></div></div>`).join('');window._p=prods||[];}
window.editP=async(id)=>{const p=window._p.find(x=>String(x.id)===String(id));if(!p)return;$("editId").value=p.id;$("pName").value=p.name;$("pPrice").value=p.price;$("pCat").value=p.category||'';$("varInputs").innerHTML='';const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id);if(vars&&vars.length>0){vars.forEach(v=>addVarRow(v.color_name,v.image_url));}else{initVarRows();}openTab('produk');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.querySelectorAll('.tab')[4].classList.add('active');showToast('✏️ Edit: '+p.name+' ('+(vars?vars.length:0)+' warna) - tambah sepuasnya!');window.scrollTo({top:0,behavior:'smooth'});};
window.delP=async(id)=>{if(!confirm('Hapus produk & semua warnanya?'))return;await supabaseClient.from('products').delete().eq('id',id);loadProducts();showToast('✅ Produk terhapus');};
// === V32 FIX FINAL - SPASI BENER - UNLIMITED ===
$("btnSaveProd").onclick=async()=>{
 const name=$("pName").value.trim();const price=Number($("pPrice").value);
 if(!name||!price){showToast('Isi nama & harga dulu',true);return;}
 const rows=[...document.querySelectorAll('#varInputs  .slot')];
 console.log('V32 TERDETEKSI:',rows.length,'slot - SPASI BENER!');
 $("saveStatus").innerText='⏳ Terdeteksi '+rows.length+' warna...';
 let finalVars=[];
 for(let r of rows){
  const col=r.querySelector('.var-color')?.value.trim().toUpperCase();
  if(!col) continue;
  const file=r.querySelector('.var-file')?.files[0];
  let oldUrl=r.querySelector('.var-old-url')?.value||r.querySelector('.preview-img')?.src||'';
  if(file){
   const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
   $("saveStatus").innerText='⏳ Upload '+col+'...';
   const {error}=await supabaseClient.storage.from('products').upload(fn,file,{upsert:true});
   if(error){showToast('Upload '+col+' gagal: '+error.message,true);$("saveStatus").innerText='❌ Gagal';return;}
   const url=supabaseClient.storage.from('products').getPublicUrl(fn).data.publicUrl;
   finalVars.push({color_name:col,image_url:url});
  }else if(oldUrl && oldUrl.startsWith('http')){
   finalVars.push({color_name:col,image_url:oldUrl});
  }
 }
 if(finalVars.length==0){showToast('❌ Minimal 1 warna + foto dong Puji',true);$("saveStatus").innerText='❌ 0 warna valid - klik Pilih Foto dulu';return;}
 $("saveStatus").innerText='⏳ Menyimpan '+finalVars.length+' warna ke database...';
 try{
  let pid=$("editId").value;
  if(pid){await supabaseClient.from('products').update({name,price,image_url:finalVars[0].image_url,category:$("pCat").value||null}).eq('id',pid);await supabaseClient.from('product_variants').delete().eq('product_id',pid);}
  else{const {data,error}=await supabaseClient.from('products').insert({name,price,image_url:finalVars[0].image_url,category:$("pCat").value||null}).select().single();if(error) throw error;pid=data.id;}
  await supabaseClient.from('product_variants').insert(finalVars.map(v=>({product_id:pid,color_name:v.color_name,image_url:v.image_url})));
  $("saveStatus").innerText='✅ Berhasil '+finalVars.length+' warna!';showToast('✅ YES! Tersimpan '+finalVars.length+' warna - UNLIMITED!');$("editId").value='';$("pName").value='';$("pPrice").value='';initVarRows();loadProducts();
 }catch(e){showToast('❌ '+e.message,true);$("saveStatus").innerText='❌ '+e.message;}
};
$("btnCariOrigin").onclick=async()=>{const q=$("originSearch").value.trim();if(!q)return;$("originList").innerHTML='Mencari...';const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();$("originList").innerHTML=j.data.map(d=>`<div style="padding:10px;border-bottom:1px solid #eee;cursor:pointer" onclick="pilihOrigin('${d.id}','${d.label.replace(/'/g,"")}')">${d.label}</div>`).join('');};
window.pilihOrigin=(id,label)=>{tokoOriginId=id;tokoOriginLabel=label;$("curOrigin").innerText=label+' - '+id;$("originList").innerHTML='';};
$("filePC").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pcBase=await toBase64(f);$("prevPC").src=pcBase;$("prevPC").style.display='block';});
$("fileHP").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;hpBase=await toBase64(f);$("prevHP").src=hpBase;$("prevHP").style.display='block';});
$("btnSaveToko").onclick=async()=>{const ups=[];if($("storeName").value)ups.push({key:'store_name',value:$("storeName").value});if($("waNumber").value)ups.push({key:'wa_number',value:$("waNumber").value});ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});await supabaseClient.from('settings').upsert(ups,{onConflict:'key'});if(pcBase){const pcBlob=await (await fetch(pcBase)).blob();const fn='pc_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,pcBlob);const pcUrl=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;let hpUrl=pcUrl;if(hpBase){const hpBlob=await (await fetch(hpBase)).blob();const hfn='hp_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(hfn,hpBlob);hpUrl=supabaseClient.storage.from('banners').getPublicUrl(hfn).data.publicUrl;}await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').insert({title:$("bTitle").value||'Promo',image_url:pcUrl,image_mobile_url:hpUrl,link_url:$("bLink").value||'produk.html',is_active:true});}showToast('✅ Toko tersimpan');loadBanners();};
async function saveKoleksiCustom(){const list=koleksiSlots.filter(x=>x.url);if(list.length==0){showToast('Pilih foto koleksi dulu',true);return;}$("koleksiStatus").innerText='⏳ Upload...';let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='koleksi_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);url=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||'',desc:v.desc||''});}await supabaseClient.from('settings').upsert([{key:'home_koleksi_terlaris',value:JSON.stringify(final)},{key:'home_koleksi_title',value:$("homeKoleksiTitle").value}],{onConflict:'key'});showToast('✅ Koleksi tersimpan');}
$("btnSaveKoleksi").onclick=saveKoleksiCustom;
async function saveUnderCustom(){const list=undertoneSlots.filter(x=>x.url);if(list.length==0){showToast('Pilih foto undertone dulu',true);return;}$("underStatus").innerText='⏳ Upload...';let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='undertone_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);url=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||'',desc:v.desc||''});}await supabaseClient.from('settings').upsert([{key:'home_undertone_images',value:JSON.stringify(final)},{key:'home_undertone_title',value:$("homeUnderTitle").value},{key:'home_undertone_desc',value:$("homeUnderDesc").value},{key:'home_undertone_list',value:$("homeUnderList").value}],{onConflict:'key'});showToast('✅ Undertone tersimpan');}
$("btnSaveUnder").onclick=saveUnderCustom;
async function loadBanners(){const {data}=await supabaseClient.from('banners').select('*').order('id',{ascending:false});$("bannerList").innerHTML=(data||[]).map(b=>`<div style="border:1px solid #EEE6DF;border-radius:12px;display:flex;gap:6px;padding:8px;margin-top:6px"><img src="${b.image_url}" style="width:56px;height:36px;object-fit:cover;border-radius:8px"><div style="flex:1;font-size:11px"><b>${escapeHtml(b.title)}</b><br><span style="color:${b.is_active?'#16A34A':'#999'}">${b.is_active?'✅ AKTIF':'Nonaktif'}</span></div><button class="btn" style="width:auto;padding:6px 10px;font-size:10px" onclick="aktifkanBanner('${b.id}')">Aktif</button><button class="btn" style="width:auto;padding:6px 10px;background:#B42318;font-size:10px" onclick="hapusBanner('${b.id}')">Hapus</button></div>`).join('');}
window.aktifkanBanner=async(id)=>{await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').update({is_active:true}).eq('id',id);loadBanners();};
window.hapusBanner=async(id)=>{await supabaseClient.from('banners').delete().eq('id',id);loadBanners();};
init();
</script></body></html>
