<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ARINDA ADMIN V25.4 - FIX EDIT FINAL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Plus+Jakarta+Sans:wght@500;700&display=swap" rel="stylesheet"><style>
body{margin:0;background:#F9F3EE;font-family:'Plus Jakarta Sans',sans-serif;padding:12px;color:#2B1B12}
.card{background:#fff;border:1px solid #EEE6DF;border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:0 6px 20px rgba(43,27,18,.06)}
.input{width:100%;padding:12px;border:1px solid #E7DDD5;border-radius:12px;margin:6px 0;background:#FFFCF9;box-sizing:border-box;font-size:13px;outline:none}
.btn{background:#2B1B12;color:#fff;border:none;padding:12px;border-radius:12px;width:100%;font-weight:700;cursor:pointer}
.btn-brown{background:#8C5A2B}.small{font-size:11px;color:#8C7A6B}
.btn-del{background:#FFF1F1;color:#B42318;border:1px solid #FECACA;border-radius:8px;padding:4px 10px;cursor:pointer;font-size:12px;font-weight:700}
.badge-no{background:#2B1B12;color:#fff;width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:12px;margin-right:8px}
.slot{background:#FFFCF9;border:1px solid #EEE6DF;border-radius:16px;padding:12px;margin-top:10px}
.file-btn{display:block;width:100%;padding:11px;background:#fff;border:1.5px dashed #2B1B12;border-radius:10px;text-align:center;font-size:12px;font-weight:700;cursor:pointer;margin-top:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod-card{background:#fff;border:1px solid #EEE6DF;border-radius:18px;overflow:hidden}.prod-img{width:100%;height:150px;object-fit:cover;object-position:top}
</style></head><body>
<div style="display:flex;justify-content:space-between;margin-bottom:14px"><div><b style="font-family:'Cormorant Garamond';font-size:22px">ARINDA ADMIN V25.4</b><div style="font-size:10px;letter-spacing:2px;color:#16A34A">✅ FIX EDIT WARNA - UDAH BISA GANTI NAMA + FOTO</div></div><button onclick="localStorage.clear();location.href='login.html'" style="background:#B42318;color:#fff;padding:8px 14px;border-radius:12px;border:none;font-weight:700">LOGOUT</button></div>

<div class="card"><h3><span class="badge-no">5</span> Produk + Warna - FIXED</h3><input type="hidden" id="editId"><input id="pName" class="input" placeholder="Nama Produk (Paris Premium)"><input id="pPrice" type="number" class="input" placeholder="Harga 80000"><select id="pCat" class="input"><option value="">Pilih Kategori</option></select><div id="varInputs" style="margin-top:10px"></div><button id="btnAddVar" class="btn" style="background:#fff;color:#2B1B12;border:1px dashed #2B1B12;margin-top:6px">+ Tambah Warna</button><button id="btnSaveProd" class="btn" style="margin-top:12px">SIMPAN PRODUK + WARNA</button><div id="saveStatus" class="small"></div><div style="margin-top:16px"><b>DAFTAR PRODUK</b> <span id="prodCount" class="small"></span><div id="list" class="grid" style="margin-top:8px">Loading...</div></div></div>

<div id="confirmModal" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(0,0,0,.5);align-items:center;justify-content:center;padding:20px"><div style="background:#fff;border-radius:20px;padding:20px;max-width:320px;width:100%"><div style="font-weight:700;font-size:18px" id="modalTitle">Hapus?</div><div id="modalDesc" class="small" style="margin-top:6px"></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px"><button id="btnModalBatal" style="padding:10px;border-radius:12px;border:1px solid #EEE6DF;background:#FFFCF9;font-weight:700">Batal</button><button id="modalOk" style="padding:10px;border-radius:12px;border:none;background:#B42318;color:#fff;font-weight:700">Ya, Hapus</button></div></div></div>
<div id="toast" style="display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2B1B12;color:#fff;padding:10px 18px;border-radius:12px;font-size:12px;z-index:10000;max-width:90%;text-align:center"></div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient=window.supabase.createClient(SUPA_URL,SUPA_KEY);
if(localStorage.getItem('arinda_admin')!=='login'){location.href='login.html';}
const $=id=>document.getElementById(id); let confirmCallback=null;
function showConfirm(t,d,cb){$("modalTitle").innerText=t;$("modalDesc").innerText=d;$("confirmModal").style.display='flex';confirmCallback=cb;}
function closeModal(){$("confirmModal").style.display='none';confirmCallback=null;}
$("btnModalBatal").onclick=closeModal;$("modalOk").onclick=()=>{if(confirmCallback)confirmCallback();closeModal();};
function showToast(m,e){const t=$("toast");t.innerText=m;t.style.background=e?'#B42318':'#2B1B12';t.style.display='block';setTimeout(()=>t.style.display='none',3000);}
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function initVarRows(){$("varInputs").innerHTML='';for(let i=0;i<2;i++)addVarRow();}
function addVarRow(color='',img=''){
 const id='varFile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 const d=document.createElement('div');d.className='slot';
 d.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><input class="input var-color" placeholder="Nama WARNA (KREM/HITAM)" value="${escapeHtml(color)}" style="flex:1;margin:0"><button type="button" class="btn-del" onclick="this.closest('.slot').remove()">X</button></div>
 ${img?`<img src="${img}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px" class="preview-img">`:''}
 <input type="file" class="input var-file" accept="image/*" style="display:none" id="${id}" onchange="previewNew(this)"><label for="${id}" class="file-btn">📸 Pilih / Ganti Foto Warna</label><input type="hidden" class="var-old-url" value="${img}">`;
 $("varInputs").appendChild(d);
}
window.previewNew=(input)=>{
 const slot=input.closest('.slot');
 const file=input.files[0]; if(!file) return;
 const url=URL.createObjectURL(file);
 let img=slot.querySelector('.preview-img');
 if(!img){ img=document.createElement('img'); img.className='preview-img'; img.style.cssText='width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px'; slot.insertBefore(img, input); }
 img.src=url;
};
$("btnAddVar").onclick=()=>addVarRow();

async function loadProducts(){
 const {data:prods}=await supabaseClient.from('products').select('*').order('id',{ascending:false});
 $("prodCount").innerText=(prods||[]).length+' produk';
 $("list").innerHTML=(prods||[]).map(p=>`<div class="prod-card"><img class="prod-img" src="${p.image_url}"><div style="padding:8px"><div style="font-size:12px;font-weight:700">${escapeHtml(p.name)}</div><div style="font-size:13px;font-weight:800">Rp${Number(p.price).toLocaleString('id-ID')}</div><button class="btn" style="margin-top:6px;padding:8px;font-size:11px" onclick="editP('${p.id}')">EDIT</button></div></div>`).join('');
 window._p=prods||[];
 const {data:cats}=await supabaseClient.from('categories').select('*');
 if(cats) $("pCat").innerHTML='<option value="">Pilih Kategori</option>'+cats.map(c=>`<option>${escapeHtml(c.name)}</option>`).join('');
}
window.editP=async(id)=>{
 const p=window._p.find(x=>String(x.id)===String(id)); if(!p)return;
 $("editId").value=p.id; $("pName").value=p.name; $("pPrice").value=p.price; $("pCat").value=p.category||'';
 // FIX DUPLIKAT: KOSONGIN DULU!
 $("varInputs").innerHTML='';
 const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id);
 if(vars && vars.length>0){ vars.forEach(v=>addVarRow(v.color_name,v.image_url)); } else { initVarRows(); }
 window.scrollTo({top:0,behavior:'smooth'});
 showToast('✏️ Edit: '+p.name+' - '+vars.length+' warna');
};

$("btnSaveProd").onclick=async()=>{
 const name=$("pName").value.trim(); const price=Number($("pPrice").value);
 if(!name||!price){showToast('Isi nama & harga',true);return;}

 // FIX KUNCI - ADA SPASI!
 const rows=[...document.querySelectorAll('#varInputs.slot')];
 if(rows.length===0){showToast('Tambah 1 warna dulu',true);return;}

 let finalVars=[];
 for(let r of rows){
  const col=r.querySelector('.var-color')?.value.trim().toUpperCase();
  if(!col) continue; // skip yang kosong kayak di video kamu (slot Nama WARNA kosong)
  const file=r.querySelector('.var-file')?.files[0];
  const oldUrl=r.querySelector('.var-old-url')?.value;
  if(file){
   const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+file.name.replace(/\s+/g,'_');
   const {error}=await supabaseClient.storage.from('products').upload(fn,file);
   if(error){showToast('Upload gagal: '+error.message,true);return;}
   const url=supabaseClient.storage.from('products').getPublicUrl(fn).data.publicUrl;
   finalVars.push({color_name:col,image_url:url});
  } else if(oldUrl){
   finalVars.push({color_name:col,image_url:oldUrl});
  }
 }
 if(finalVars.length===0){showToast('Minimal 1 warna + foto - isi nama warna & pilih foto',true);return;}
 $("saveStatus").innerText='⏳ Menyimpan '+finalVars.length+' warna...';
 try{
  let pid=$("editId").value;
  if(pid){
   await supabaseClient.from('products').update({name,price,image_url:finalVars[0].image_url,category:$("pCat").value}).eq('id',pid);
   await supabaseClient.from('product_variants').delete().eq('product_id',pid);
  } else {
   const {data}=await supabaseClient.from('products').insert({name,price,image_url:finalVars[0].image_url,category:$("pCat").value}).select().single();
   pid=data.id;
  }
  await supabaseClient.from('product_variants').insert(finalVars.map(v=>({product_id:pid,color_name:v.color_name,image_url:v.image_url})));
  $("saveStatus").innerText='✅ Berhasil';
  showToast('✅ Tersimpan '+finalVars.length+' warna!');
  $("editId").value=''; $("pName").value=''; $("pPrice").value=''; initVarRows(); loadProducts();
 }catch(e){showToast('❌ '+e.message,true);}
};
loadProducts(); initVarRows();
</script></body></html>
