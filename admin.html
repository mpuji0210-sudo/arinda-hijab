<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient=window.supabase.createClient(SUPA_URL,SUPA_KEY);
if(localStorage.getItem('arinda_admin')!=='login'){location.href='login.html';}
let tokoOriginId=localStorage.getItem('toko_origin_id')||"17523";let tokoOriginLabel=localStorage.getItem('toko_origin_label')||"CENGKARENG BARAT";
let pcBase='',hpBase='';let allVariants=[];let koleksiSlots=["","","",""];let undertoneSlots=[""];let faqSlots=[{q:'Apakah menerawang?',a:'Tidak sama sekali.'},{q:'Ukuran berapa?',a:'115x115cm.'},{q:'Bisa cek ongkir?',a:'Bisa pakai fitur cek ongkir otomatis.'}];
let confirmCallback=null;
const $=id=>document.getElementById(id);
function showConfirm(t,d,cb){$("modalTitle").innerText=t;$("modalDesc").innerText=d;$("confirmModal").style.display='flex';confirmCallback=cb;}
function closeModal(){$("confirmModal").style.display='none';confirmCallback=null;}
$("btnModalBatal").onclick=closeModal;$("modalOk").onclick=()=>{if(confirmCallback)confirmCallback();closeModal();};
function showToast(m,e){const t=$("toast");t.innerText=m;t.style.background=e?'#B42318':'#2B1B12';t.style.display='block';setTimeout(()=>t.style.display='none',2500);}

async function init(){
 try{
  const {data} = await supabaseClient.from('settings').select('*');
  if(data){
   const get=k=>{const f=data.find(s=>s.key===k);return f?f.value:null;};
   if(get('store_name'))$("storeName").value=get('store_name');
   if(get('wa_number'))$("waNumber").value=get('wa_number');
   if(get('toko_origin_id')){tokoOriginId=get('toko_origin_id');tokoOriginLabel=get('toko_origin_label')||tokoOriginLabel;}
   if(get('home_koleksi_title'))$("homeKoleksiTitle").value=get('home_koleksi_title');
   if(get('home_undertone_title'))$("homeUnderTitle").value=get('home_undertone_title');
   if(get('home_undertone_desc'))$("homeUnderDesc").value=get('home_undertone_desc');
   if(get('home_undertone_list'))$("homeUnderList").value=get('home_undertone_list');
   if(get('home_koleksi_terlaris')){try{koleksiSlots=JSON.parse(get('home_koleksi_terlaris'));}catch(e){}}
   if(get('home_undertone_images')){try{undertoneSlots=JSON.parse(get('home_undertone_images'));}catch(e){}}
   else if(get('home_undertone_image')){undertoneSlots=[get('home_undertone_image')];}
   if(get('home_faq_list')){try{faqSlots=JSON.parse(get('home_faq_list'));}catch(e){}}
  }
 }catch(e){console.log('init error',e);}
 if(koleksiSlots.length==0)koleksiSlots=["","","",""];
 if(undertoneSlots.length==0)undertoneSlots=[""];
 if(faqSlots.length==0)faqSlots=[{q:'',a:''}];
 $("curOrigin").innerText=tokoOriginLabel+" - "+tokoOriginId;
 await loadCats(); await loadProducts(); await loadBanners();
 initVarRows(); renderKoleksi(); renderUndertone(); renderFaq();
}
function initVarRows(){$("varInputs").innerHTML='';for(let i=0;i<2;i++)addVarRow();}
function addVarRow(){const d=document.createElement('div');d.style.cssText='background:#FFFCF9;border:1px solid #EEE6DF;padding:10px;border-radius:12px;margin:8px 0';d.innerHTML='<div style="display:flex;gap:6px"><input class="input var-color" placeholder="WARNA" style="flex:1"><button type="button" class="btn-del" onclick="this.closest(\'div\').parentElement.remove()">X</button></div><input type="file" class="input var-file" accept="image/*">';$("varInputs").appendChild(d);}
$("btnAddVar").onclick=addVarRow;

async function loadCats(){const {data}=await supabaseClient.from('categories').select('*');const list=$("catList");const sel=$("pCat");if(!data)return;list.innerHTML=data.map(c=>'<span class="cat">'+c.name+' <b style="color:#B42318;cursor:pointer" onclick="delCat(\''+c.id+'\')">x</b></span>').join('');sel.innerHTML='<option value="">Pilih Kategori</option>'+data.map(c=>'<option>'+c.name+'</option>').join('');}
$("btnAddCat").onclick=async()=>{const v=$("catName").value.trim();if(!v)return;await supabaseClient.from('categories').insert({name:v});$("catName").value='';loadCats();};
window.delCat=(id)=>{showConfirm('Hapus Kategori?','Kategori akan dihapus',async()=>{await supabaseClient.from('categories').delete().eq('id',id);loadCats();showToast('✅ Kategori terhapus');});};

function renderKoleksi(){let html='';koleksiSlots.forEach((v,i)=>{const isUrl=String(v).startsWith('http')||String(v).startsWith('data:');const img=isUrl?v:(allVariants.find(x=>String(x.id)===String(v))?.image_url||'');html+='<div class="koleksi-slot"><div style="display:flex;justify-content:space-between"><span class="small">Slot '+(i+1)+'</span><span><img src="'+img+'" style="width:28px;height:28px;border-radius:50%;object-fit:cover;'+(img?'':'display:none')+'"> <button class="btn-del" onclick="hapusKoleksi('+i+')">X</button></span></div>'+(isUrl?'<div class="small">🖼️ Galeri</div><input type="hidden" id="koleksi'+i+'" value="'+v+'">':'<select id="koleksi'+i+'" class="input" onchange="ubahKoleksi('+i+',this.value)"><option value="">Pilih warna</option>'+allVariants.map(x=>'<option value="'+x.id+'" '+(String(x.id)===String(v)?'selected':'')+'>'+x.color_name+'</option>').join('')+'</select>')+'</div>';});$("koleksi4Wrap").innerHTML=html+'<button class="btn" style="background:#fff;color:#8C5A2B;border:1px dashed #8C5A2B;grid-column:1/-1" onclick="tambahKoleksi()">+ Tambah Foto Koleksi</button>';}
window.tambahKoleksi=()=>{koleksiSlots.push("");renderKoleksi();};window.hapusKoleksi=(i)=>{koleksiSlots.splice(i,1);if(koleksiSlots.length==0)koleksiSlots=[""];renderKoleksi();};window.ubahKoleksi=(i,val)=>{koleksiSlots[i]=val;};
$("btnKoleksiGaleri").onclick=async()=>{const files=$("koleksiGaleri").files;if(!files.length){showToast('Pilih foto dulu',true);return;}for(let f of files){const b=await toBase64(f);koleksiSlots.push(b);}renderKoleksi();showToast('✅ '+files.length+' foto masuk');};

function renderUndertone(){let html='';undertoneSlots.forEach((url,i)=>{html+='<div class="koleksi-slot"><div style="display:flex;justify-content:space-between"><span class="small">Foto '+(i+1)+'</span><button class="btn-del" onclick="hapusUndertone('+i+')">X</button></div><img src="'+url+'" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-top:6px;'+(url?'':'display:none')+'"><input type="file" class="input" style="margin-top:6px" onchange="gantiUndertone('+i+',this)"><div class="small" style="text-align:center">'+(i==0?'COOL - Biru':i==1?'WARM - Hijau':i==2?'NEUTRAL':'Undertone '+(i+1))+'</div></div>';});$("undertoneWrap").innerHTML=html;}
window.hapusUndertone=(i)=>{undertoneSlots.splice(i,1);if(undertoneSlots.length==0)undertoneSlots=[""];renderUndertone();};
window.gantiUndertone=async(i,input)=>{const f=input.files[0];if(!f)return;undertoneSlots[i]=await toBase64(f);renderUndertone();};
$("btnAddUnder").onclick=()=>{undertoneSlots.push("");renderUndertone();};
$("btnUnderGaleri").onclick=async()=>{const files=$("underGaleri").files;if(!files.length){showToast('Pilih foto dulu',true);return;}for(let f of files){const b=await toBase64(f);undertoneSlots.push(b);}renderUndertone();showToast('✅ '+files.length+' foto undertone masuk');};

function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+='<div style="background:#FFFCF9;border:1px solid #EEE6DF;border-radius:12px;padding:10px;margin:6px 0"><div style="display:flex;justify-content:space-between"><span class="small">FAQ '+(i+1)+'</span><button class="btn-del" onclick="hapusFaq('+i+')">X</button></div><input id="faqQ'+i+'" class="input" placeholder="Pertanyaan" value="'+escapeHtml(f.q)+'"><textarea id="faqA'+i+'" class="input" rows="2" placeholder="Jawaban">'+escapeHtml(f.a)+'</textarea></div>';});$("faqWrap").innerHTML=h;}
window.hapusFaq=(i)=>{showConfirm('Hapus FAQ?','FAQ akan dihapus',()=>{faqSlots.splice(i,1);if(faqSlots.length==0)faqSlots=[{q:'',a:''}];renderFaq();});};
$("btnAddFaq").onclick=()=>{faqSlots.push({q:'',a:''});renderFaq();};
$("btnSaveFaq").onclick=async()=>{const final=[];faqSlots.forEach((_,i)=>{const q=$("faqQ"+i)?.value.trim();const a=$("faqA"+i)?.value.trim();if(q&&a)final.push({q,a});});$("faqStatus").innerText='⏳ Menyimpan...';await supabaseClient.from('settings').upsert([{key:'home_faq_list',value:JSON.stringify(final)}],{onConflict:'key'});$("faqStatus").innerText='✅ Tersimpan '+final.length+' FAQ';showToast('✅ FAQ tersimpan');};

function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toBase64(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}

async function loadProducts(){const {data:prods}=await supabaseClient.from('products').select('*').order('id',{ascending:false});const {data:vars}=await supabaseClient.from('product_variants').select('*');allVariants=vars||[];window._p=prods||[];$("prodCount").innerText=window._p.length+' produk';$("list").innerHTML=window._p.map(p=>'<div class="prod-card"><img class="prod-img" src="'+p.image_url+'"><div style="padding:8px"><div style="font-size:12px;font-weight:700">'+p.name+'</div><div style="font-size:13px;font-weight:800">Rp'+Number(p.price).toLocaleString('id-ID')+'</div><button class="btn" style="margin-top:6px;padding:8px;font-size:11px" onclick="editP(\''+p.id+'\')">EDIT</button><button class="btn" style="margin-top:4px;padding:8px;font-size:11px;background:#FFF1F1;color:#B42318;border:1px solid #FECACA" onclick="delP(\''+p.id+'\')">HAPUS</button></div></div>').join('');renderKoleksi();}
window.editP=(id)=>{const p=window._p.find(x=>String(x.id)===String(id));$("editId").value=p.id;$("pName").value=p.name;$("pPrice").value=p.price;window.scrollTo({top:400,behavior:'smooth'});};
window.delP=(id)=>{showConfirm('Hapus Produk?','Produk & varian akan terhapus',async()=>{await supabaseClient.from('products').delete().eq('id',id);loadProducts();showToast('✅ Produk terhapus');});};

$("btnSaveProd").onclick=async()=>{const name=$("pName").value.trim();const priceStr=$("pPrice").value.trim();if(!name||!priceStr){showToast('Isi nama & harga dulu',true);return;}const price=Number(priceStr);const rows=[...document.querySelectorAll('#varInputs > div')];const vars=[];rows.forEach(r=>{const col=r.querySelector('.var-color')?.value.trim().toUpperCase();const f=r.querySelector('.var-file')?.files[0];if(col&&f)vars.push({color:col,file:f});});if(vars.length==0){showToast('Minimal 1 warna + foto',true);return;}$("saveStatus").innerText='⏳ Uploading...';try{let mainUrl='';const ups=[];for(let v of vars){const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+v.file.name.replace(/\s+/g,'_');const {error}=await supabaseClient.storage.from('products').upload(fn,v.file);if(error)throw error;const url=supabaseClient.storage.from('products').getPublicUrl(fn).data.publicUrl;ups.push({color_name:v.color,image_url:url});if(!mainUrl)mainUrl=url;}let pid=$("editId").value;if(pid){await supabaseClient.from('products').update({name,price,image_url:mainUrl}).eq('id',pid);await supabaseClient.from('product_variants').delete().eq('product_id',pid);}else{const {data}=await supabaseClient.from('products').insert({name,price,image_url:mainUrl}).select().single();pid=data.id;}await supabaseClient.from('product_variants').insert(ups.map(u=>({product_id:pid,color_name:u.color_name,image_url:u.image_url})));$("saveStatus").innerText='✅ Berhasil';showToast('✅ Berhasil');$("editId").value='';$("pName").value='';$("pPrice").value='';initVarRows();loadProducts();}catch(e){showToast('❌ '+e.message,true);}};

$("btnCariOrigin").onclick=async()=>{const q=$("originSearch").value.trim();if(!q)return;$("originList").innerHTML='Mencari...';const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();$("originList").innerHTML=j.data.map(d=>'<div style="padding:10px;border-bottom:1px solid #eee;cursor:pointer" onclick="pilihOrigin(\''+d.id+'\',\''+d.label.replace(/'/g,"")+'\')">'+d.label+'</div>').join('');};
window.pilihOrigin=(id,label)=>{tokoOriginId=id;tokoOriginLabel=label;$("curOrigin").innerText=label+' - '+id;$("originList").innerHTML='';};
$("filePC").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pcBase=await toBase64(f);$("prevPC").src=pcBase;$("prevPC").style.display='block';});
$("fileHP").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;hpBase=await toBase64(f);$("prevHP").src=hpBase;$("prevHP").style.display='block';});
$("btnSaveToko").onclick=async()=>{const ups=[];if($("storeName").value)ups.push({key:'store_name',value:$("storeName").value});if($("waNumber").value)ups.push({key:'wa_number',value:$("waNumber").value});ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});await supabaseClient.from('settings').upsert(ups,{onConflict:'key'});if(pcBase){const pcBlob=await (await fetch(pcBase)).blob();const pcName='pc_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(pcName,pcBlob);const pcUrl=supabaseClient.storage.from('banners').getPublicUrl(pcName).data.publicUrl;let hpUrl=pcUrl;if(hpBase){const hpBlob=await (await fetch(hpBase)).blob();const hpName='hp_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(hpName,hpBlob);hpUrl=supabaseClient.storage.from('banners').getPublicUrl(hpName).data.publicUrl;}await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').insert({title:$("bTitle").value||'Promo',image_url:pcUrl,image_mobile_url:hpUrl,link_url:$("bLink").value||'produk.html',is_active:true});}showToast('✅ Toko tersimpan');loadBanners();};
$("btnSaveHome").onclick=async()=>{const k=koleksiSlots.filter(Boolean);const u=undertoneSlots.filter(Boolean);$("homeStatus").innerText='⏳ Menyimpan...';try{let finalK=[];for(let v of k){if(String(v).startsWith('data:')){const blob=await (await fetch(v)).blob();const fn='koleksi_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);finalK.push(supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl);}else finalK.push(v);}let finalU=[];for(let v of u){if(String(v).startsWith('data:')){const blob=await (await fetch(v)).blob();const fn='undertone_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);finalU.push(supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl);}else if(String(v).startsWith('http'))finalU.push(v);}await supabaseClient.from('settings').upsert([{key:'home_koleksi_terlaris',value:JSON.stringify(finalK)},{key:'home_koleksi_4',value:JSON.stringify(finalK)},{key:'home_undertone_images',value:JSON.stringify(finalU)},{key:'home_undertone_image',value:finalU[0]||''},{key:'home_koleksi_title',value:$("homeKoleksiTitle").value},{key:'home_undertone_title',value:$("homeUnderTitle").value},{key:'home_undertone_desc',value:$("homeUnderDesc").value},{key:'home_undertone_list',value:$("homeUnderList").value}],{onConflict:'key'});$("homeStatus").innerText='✅ Tersimpan '+finalK.length+' koleksi + '+finalU.length+' undertone';showToast('✅ Tersimpan');koleksiSlots=finalK;undertoneSlots=finalU.length?finalU:[""];renderKoleksi();renderUndertone();}catch(e){$("homeStatus").innerText='❌ '+e.message;showToast('❌ '+e.message,true);}};
async function loadBanners(){const {data}=await supabaseClient.from('banners').select('*').order('id',{ascending:false});$("bannerList").innerHTML=(data||[]).map(b=>'<div style="border:1px solid #EEE6DF;border-radius:12px;display:flex;gap:6px;padding:8px;margin-top:6px"><img src="'+b.image_url+'" style="width:56px;height:36px;object-fit:cover;border-radius:8px"><div style="flex:1;font-size:11px"><b>'+b.title+'</b><br><span style="color:'+(b.is_active?'#16A34A':'#999')+'">'+(b.is_active?'✅ AKTIF':'Nonaktif')+'</span></div><button class="btn" style="width:auto;padding:6px 10px;font-size:10px" onclick="aktifkanBanner(\''+b.id+'\')">Aktif</button><button class="btn" style="width:auto;padding:6px 10px;background:#B42318;font-size:10px" onclick="hapusBanner(\''+b.id+'\')">Hapus</button></div>').join('');}
window.aktifkanBanner=async(id)=>{await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').update({is_active:true}).eq('id',id);loadBanners();};
window.hapusBanner=(id)=>{showConfirm('Hapus Banner?','Banner akan dihapus',async()=>{await supabaseClient.from('banners').delete().eq('id',id);loadBanners();});};
init();
</script></body></html>
