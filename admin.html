</style></head><body>

<script>
const supa=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
if(localStorage.getItem('arinda_admin')!=='login'){location.href='login.html';}
let tokoOriginId="17523",tokoOriginLabel="CENGKARENG BARAT";let pcBase='',hpBase='';
let koleksiSlots=[{url:"",title:""}];let undertoneSlots=[{url:"",title:""}];let faqSlots=[{q:'Apakah menerawang?',a:'Tidak.'}];
let masterColorsCache = [];
const $=id=>document.getElementById(id);
function openTab(n,el){document.querySelectorAll('[id^="tab-"]').forEach(c=>c.classList.add('hidden'));$('tab-'+n).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function toast(m){const t=$('toast');t.innerText=m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000)}
function fileToBase64(f){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);});}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
let confirmCb=null;function showConfirm(t,d,cb){$('confirmTitle').innerText=t;$('confirmDesc').innerText=d;$('confirmModal').classList.add('open');confirmCb=cb;}
function closeConfirm(){$('confirmModal').classList.remove('open');confirmCb=null;}
$('confirmOk').onclick=()=>{if(confirmCb)confirmCb();closeConfirm();};
function setBtnLoading(btnId,statusId,loading,loadingText='MENYIMPAN...'){const b=$(btnId); const s=$(statusId);if(!b) return;b.disabled=loading;b.innerText=loading?loadingText:'SIMPAN';if(loading && s) s.innerText='PROSES...';}
async function init(){try{const {data}=await supa.from('settings').select('*');if(data){const g=k=>data.find(s=>s.key===k)?.value;if(g('store_name'))$('storeName').value=g('store_name');if(g('wa_number'))$('waNumber').value=g('wa_number');if(g('toko_origin_id')){tokoOriginId=g('toko_origin_id');tokoOriginLabel=g('toko_origin_label')||tokoOriginLabel;}if(g('home_koleksi_terlaris')){try{const p=JSON.parse(g('home_koleksi_terlaris'));if(p.length)koleksiSlots=p.map(x=>({url:x.url||x||'',title:x.title||''}))}catch(e){}}if(g('home_undertone_images')){try{const p=JSON.parse(g('home_undertone_images'));if(p.length)undertoneSlots=p.map(x=>({url:x.url||x||'',title:x.title||''}))}catch(e){}}if(g('home_faq_list')){try{faqSlots=JSON.parse(g('home_faq_list'))}catch(e){}}}}catch(e){}$('curOrigin').innerText=tokoOriginLabel+' - '+tokoOriginId;await loadCats();await loadMasterColors();await loadProducts();await loadBanners();initVar();renderKoleksi();renderUnder();renderFaq();}
async function loadMasterColors(){const {data}=await supa.from('master_colors').select('*'); masterColorsCache = data||[]; aggregateUndertone();}
function getUndertoneForColor(cName){
  cName=(cName||'').toUpperCase().trim();
  if(!cName) return ['NEUTRAL'];
  let found = masterColorsCache.find(m=>m.name.toUpperCase()===cName);
  if(found) return found.undertone;
  if(['HITAM','BLACK','NAVY','BLUE','PUTIH','WHITE','ABU','GREY','LILAC','PLUM','BURGUNDY','CHARCOAL','DENIM','STONE','EMERALD'].includes(cName)) return ['COOL'];
  if(['MILO','MAROON','MUSTARD','CARAMEL','OLIVE','BROWN','COKSU','PEACH','BEIGE','MOCCA','CORAL','TERRACOTTA','MUSTARD','CARAMEL'].includes(cName)) return ['WARM'];
  if(['CREAM','KREAM','WHITE','KREM','BEIGE','NUDE','TAUPE','DUSTY','MAUVE','ROSE'].includes(cName)) return ['NEUTRAL'];
  if(['SAGE','OLIVE','ARMY','KHAKI','GREEN','MOSS'].includes(cName)) return ['OLIVE'];
  if(cName.includes('SAGE')||cName.includes('OLIVE')) return ['OLIVE'];
  if(cName.includes('BEIGE')||cName.includes('CREAM')) return ['NEUTRAL'];
  if(cName.includes('NAVY')||cName.includes('DENIM')||cName.includes('LILAC')||cName.includes('GREY')) return ['COOL'];
  return ['NEUTRAL'];
}
function aggregateUndertone(){
  const rows=[...document.querySelectorAll('#varInputs.slot')];
  let all = new Set();
  rows.forEach(r=>{
    let checks=[...r.querySelectorAll('.under-check:checked')].map(c=>c.value);
    checks.forEach(v=>all.add(v));
  });
  let arr = Array.from(all);
  if(arr.length===0) arr=['NEUTRAL'];
  $('autoUndertoneBox').innerHTML = arr.map(u=>`<span class="under-badge">${u}</span>`).join('') + ` <span style="font-size:8px;opacity:.7">GABUNGAN DARI ${rows.length} WARNA</span>`;
  return arr;
}
window.addMasterColorQuick=async()=>{let name=$('newMasterColor').value.trim().toUpperCase(); let u=$('newMasterUnder').value.split(',').map(s=>s.trim());if(!name) return toast('ISI NAMA WARNA');await supa.from('master_colors').upsert({name:name, undertone:u}, {onConflict:'name'});$('newMasterColor').value=''; toast(name+' DITAMBAH - '+u.join(',')); await loadMasterColors();};
function initVar(){ const el=$('varInputs'); if(!el) return; el.innerHTML=''; addVarRow(); }
function addVarRow(c,img,stock,avail,undertones){
 c=c||'';img=img||'';stock=stock!=null?stock:10;avail=avail!=null?avail:true;
 undertones = undertones || getUndertoneForColor(c);
 var id='vf_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 var d=document.createElement('div');d.className='slot';
 var underHtml = ['COOL','WARM','NEUTRAL','OLIVE'].map(u=>{
   let checked = undertones.includes(u)?'checked':'';
   return `<label><input type="checkbox" value="${u}" class="under-check" ${checked} onchange="aggregateUndertone()"> ${u}</label>`;
 }).join('');
 var h=`<div style="display:flex;gap:6px;align-items:center"><input class="input var-color" placeholder="NAMA WARNA ex: SAGE" value="${esc(c)}" style="flex:1;margin:0" oninput="autoCheckUndertone(this)"><input class="input var-stock" type="number" value="${stock}" style="width:70px;margin:0;text-align:center"><label style="font-size:8px;display:flex;align-items:center;gap:4px"><input type="checkbox" class="var-avail" ${avail?'checked':''}>READY</label><div class="x" onclick="this.parentElement.parentElement.remove();aggregateUndertone()">x</div></div>`;
 if(img){ h+=`<img src="${img}" class="preview-img">`; }
 h+=`<input type="file" class="var-file" accept="image/*" style="display:none" id="${id}" onchange="prevVar(this)"><label for="${id}" class="file-btn">FOTO WARNA</label><div class="under-per-variant">${underHtml}</div><input type="hidden" class="var-old-url" value="${img}">`;
 d.innerHTML=h; $('varInputs').appendChild(d); aggregateUndertone();
}
window.autoCheckUndertone=(inputEl)=>{
  let cName=inputEl.value.trim().toUpperCase();
  let under = getUndertoneForColor(cName);
  let slot=inputEl.closest('.slot');
  if(!slot) return;
  slot.querySelectorAll('.under-check').forEach(chk=>{
    chk.checked = under.includes(chk.value);
  });
  aggregateUndertone();
};
window.prevVar=(inp)=>{const f=inp.files[0];if(!f)return;const url=URL.createObjectURL(f);let img=inp.closest('.slot').querySelector('.preview-img');if(!img){img=document.createElement('img');img.className='preview-img';img.style.cssText='width:100%;height:200px;object-fit:cover;border:1px solid var(--line);margin-top:8px;object-position:top';inp.closest('.slot').insertBefore(img,inp);}img.src=url;};
async function loadCats(){const {data}=await supa.from('categories').select('*');if(!data)return;$('catList').innerHTML=data.map(c=>'<span style="display:inline-block;border:1px solid var(--line);background:var(--bg);padding:4px 10px;margin:3px;font-size:9px">'+esc(c.name)+' <b style="cursor:pointer" onclick="delCat(\''+c.id+'\')">x</b></span>').join('');$('pCat').innerHTML='<option value="">PILIH BAHAN</option>'+data.map(c=>'<option value="'+esc(c.name)+'">'+esc(c.name)+'</option>').join('');}
window.addCat=async()=>{const v=$('catName').value.trim();if(!v)return;await supa.from('categories').insert({name:v});$('catName').value='';loadCats();};
window.delCat=async(id)=>{showConfirm('HAPUS BAHAN?','Filter bahan akan hilang',async()=>{await supa.from('categories').delete().eq('id',id);loadCats();toast('DIHAPUS');});};
function renderKoleksi(){let h='';koleksiSlots.forEach((it,i)=>{h+='<div class="slot"><div class="x" onclick="koleksiSlots.splice('+i+',1);if(!koleksiSlots.length)koleksiSlots=[{url:\'\'}];renderKoleksi()">x</div>'+(it.url?'<img src="'+it.url+'">':'')+'<input type="file" style="display:none" id="kf'+i+'" accept="image/*" onchange="changeKoleksi('+i+',this)"><label for="kf'+i+'" class="file-btn">FILE</label><input class="input" placeholder="JUDUL" value="'+esc(it.title)+'" oninput="koleksiSlots['+i+'].title=this.value"></div>'});$('koleksi4Wrap').innerHTML=h;}
window.changeKoleksi=async(i,inp)=>{const f=inp.files[0];if(!f)return;koleksiSlots[i].url=await fileToBase64(f);renderKoleksi();};
window.addKoleksi=()=>{koleksiSlots.push({url:""});renderKoleksi();};
$('koleksiGaleri').addEventListener('change',async e=>{for(let f of e.target.files){koleksiSlots.push({url:await fileToBase64(f)});}renderKoleksi();});
function renderUnder(){let h='';undertoneSlots.forEach((it,i)=>{h+='<div class="slot"><div class="x" onclick="undertoneSlots.splice('+i+',1);if(!undertoneSlots.length)undertoneSlots=[{url:\'\'}];renderUnder()">x</div>'+(it.url?'<img src="'+it.url+'">':'')+'<input type="file" style="display:none" id="uf'+i+'" accept="image/*" onchange="changeUnder('+i+',this)"><label for="uf'+i+'" class="file-btn">FILE</label><input class="input" placeholder="LABEL" value="'+esc(it.title)+'" oninput="undertoneSlots['+i+'].title=this.value"></div>'});$('undertoneWrap').innerHTML=h;}
window.changeUnder=async(i,inp)=>{const f=inp.files[0];if(!f)return;undertoneSlots[i].url=await fileToBase64(f);renderUnder();};
window.addUndertone=()=>{undertoneSlots.push({url:""});renderUnder();};
$('underGaleri').addEventListener('change',async e=>{for(let f of e.target.files){undertoneSlots.push({url:await fileToBase64(f)});}renderUnder();});
function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+='<div class="slot"><div class="x" onclick="faqSlots.splice('+i+',1);renderFaq()">x</div><input class="input" placeholder="Q" value="'+esc(f.q)+'" oninput="faqSlots['+i+'].q=this.value"><textarea class="input" rows="2" placeholder="A" oninput="faqSlots['+i+'].a=this.value">'+esc(f.a)+'</textarea></div>'});$('faqWrap').innerHTML=h;}
window.addFaq=()=>{faqSlots.push({q:'',a:''});renderFaq();};
async function loadProducts(){const {data}=await supa.from('products').select('*').order('id',{ascending:false});$('prodCount').innerText=(data||[]).length;$('list').innerHTML=(data||[]).map(p=>'<div class="prod-card"><img src="'+p.image_url+'"><div style="padding:8px"><div style="font-size:10px">'+esc(p.name)+'</div><div style="font-size:12px">Rp'+Number(p.price).toLocaleString('id-ID')+'</div><div style="font-size:7px;opacity:.5;margin-top:4px">'+esc((p.undertone||[]).join(', '))+'</div><button class="btn-light" style="width:100%;margin-top:6px" onclick="editP(\''+p.id+'\')">EDIT</button><button class="btn-light" style="width:100%;margin-top:4px" onclick="delP(\''+p.id+'\')">HAPUS</button></div></div>').join('');window._p=data||[];}
window.editP=async(id)=>{
  const p=window._p.find(x=>String(x.id)===String(id));if(!p)return;
  $('editId').value=p.id;$('pName').value=p.name;$('pPrice').value=p.price;$('pCat').value=p.category||'';$('pSize').value=p.size_info||'110x110cm';$('pFinish').value=p.finishing||'Laser Cut';$('pMaterialDetail').value=p.material_detail||'';$('pDesc').value=p.description||'';$('varInputs').innerHTML='';
  const {data:vars}=await supa.from('product_variants').select('*').eq('product_id',id);
  if(vars&&vars.length){
    vars.forEach(v=>{
      let under = v.undertone || v.undertone_arr || getUndertoneForColor(v.color_name);
      if(typeof under==='string'){try{under=JSON.parse(under)}catch(e){under=[under]}}
      addVarRow(v.color_name,v.image_url, v.stock??10, v.is_available??true, under);
    });
  }else initVar();
  openTab('produk',document.querySelectorAll('.tab')[4]);window.scrollTo({top:0,behavior:'smooth'});toast('EDIT MODE - '+p.name);
};
window.delP=async(id)=>{showConfirm('HAPUS PRODUK?','Akan terhapus permanen',async()=>{await supa.from('products').delete().eq('id',id);loadProducts();toast('DIHAPUS');});};
window.saveProd=async()=>{
 const btn=$('btnProd');if(btn.disabled) return;btn.disabled=true; btn.innerText='MENYIMPAN...';
 const name=$('pName').value.trim();const price=Number($('pPrice').value);if(!name||!price){toast('ISI NAMA & HARGA');btn.disabled=false;btn.innerText='SIMPAN PRODUK';return;}
 const rows=[...document.querySelectorAll('#varInputs.slot')];if(!rows.length){toast('TAMBAH WARNA DULU');btn.disabled=false;btn.innerText='SIMPAN PRODUK';return;}
 $('saveStatus').innerText='PROSES '+rows.length+' WARNA...';
 let finalVars=[];
 for(let idx=0; idx<rows.length; idx++){
   let r=rows[idx];
   const col=r.querySelector('.var-color')?.value.trim().toUpperCase();if(!col)continue;
   const stockVal=Number(r.querySelector('.var-stock')?.value||0);
   const avail=r.querySelector('.var-avail')?.checked;
   const underChecks=[...r.querySelectorAll('.under-check:checked')].map(c=>c.value);
   const underArr = underChecks.length?underChecks:getUndertoneForColor(col);
   const file=r.querySelector('.var-file')?.files[0];
   let oldUrl=r.querySelector('.var-old-url')?.value||'';
   if(file){
     const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
     $('saveStatus').innerText=`UPLOAD ${idx+1}/${rows.length} ${col}...`;
     const {error}=await supa.storage.from('products').upload(fn,file,{upsert:true});
     if(error){toast('UPLOAD GAGAL: '+error.message);$('saveStatus').innerText='GAGAL: '+error.message;btn.disabled=false;btn.innerText='SIMPAN PRODUK';return;}
     finalVars.push({color_name:col,image_url:supa.storage.from('products').getPublicUrl(fn).data.publicUrl, stock:stockVal, is_available:avail, undertone:underArr});
   }else if(oldUrl&&oldUrl.startsWith('http')){
     finalVars.push({color_name:col,image_url:oldUrl, stock:stockVal, is_available:avail, undertone:underArr});
   }
 }
 if(!finalVars.length){toast('MINIMAL 1 FOTO');$('saveStatus').innerText='FOTO KOSONG';btn.disabled=false;btn.innerText='SIMPAN PRODUK';return;}
 try{
   let pid=$('editId').value;
   let allUnder = new Set(); finalVars.forEach(v=>v.undertone.forEach(u=>allUnder.add(u)));
   let productUndertone = Array.from(allUnder);
   if(productUndertone.length===0) productUndertone=['NEUTRAL'];
   $('saveStatus').innerText='SIMPAN DB... PROD:'+productUndertone.join(',');
   if(pid){
     await supa.from('products').update({name,price,image_url:finalVars[0].image_url,category:$('pCat').value||null,description:$('pDesc').value.trim(),size_info:$('pSize').value.trim(),material_detail:$('pMaterialDetail').value.trim(),finishing:$('pFinish').value.trim(),undertone:productUndertone, colors: finalVars.map(v=>v.color_name)}).eq('id',pid);
     await supa.from('product_variants').delete().eq('product_id',pid);
   } else {
     const {data,error}=await supa.from('products').insert({name,price,image_url:finalVars[0].image_url,category:$('pCat').value||null,description:$('pDesc').value.trim(),size_info:$('pSize').value.trim(),material_detail:$('pMaterialDetail').value.trim(),finishing:$('pFinish').value.trim(),undertone:productUndertone, colors: finalVars.map(v=>v.color_name)}).select().single();
     if(error) throw error; pid=data.id;
   }
   // Coba simpan dengan kolom undertone, kalau gagal fallback tanpa undertone
   try{
     await supa.from('product_variants').insert(finalVars.map(v=>({product_id:pid,color_name:v.color_name,image_url:v.image_url, stock:v.stock, is_available:v.is_available, undertone:v.undertone})));
   }catch(e){
     console.log('fallback tanpa undertone col', e);
     await supa.from('product_variants').insert(finalVars.map(v=>({product_id:pid,color_name:v.color_name,image_url:v.image_url, stock:v.stock, is_available:v.is_available})));
   }
   $('saveStatus').innerText='OK '+finalVars.length+' WARNA - '+productUndertone.join(',');toast('TERSIMPAN '+finalVars.length+' WARNA - '+productUndertone.join(','));$('editId').value='';$('pName').value='';$('pPrice').value='';$('pDesc').value='';initVar();loadProducts();
 }catch(e){toast('ERROR: '+e.message);$('saveStatus').innerText='ERROR: '+e.message;} finally {btn.disabled=false; btn.innerText='SIMPAN PRODUK';}
};
async function cariOrigin(){const q=$('originSearch').value.trim();if(!q)return;$('originList').innerHTML='...';const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();$('originList').innerHTML=j.data.map(d=>'<div style="padding:10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px" onclick="pilihOrigin(\''+d.id+'\',\''+d.label.replace(/'/g,"")+'\')">'+d.label+'</div>').join('');}
window.pilihOrigin=(id,label)=>{tokoOriginId=id;tokoOriginLabel=label;$('curOrigin').innerText=label+' - '+id;$('originList').innerHTML='';};
$('filePC').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pcBase=await fileToBase64(f);$('prevPC').src=pcBase;$('prevPC').style.display='block';});
$('fileHP').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;hpBase=await fileToBase64(f);$('prevHP').src=hpBase;$('prevHP').style.display='block';});
window.saveToko=async()=>{const btn=$('btnToko'); if(btn.disabled) return;setBtnLoading('btnToko','statusToko',true,'MENYIMPAN BANNER...');try{const ups=[];if($('storeName').value)ups.push({key:'store_name',value:$('storeName').value});if($('waNumber').value)ups.push({key:'wa_number',value:$('waNumber').value});ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});if(ups.length) await supa.from('settings').upsert(ups,{onConflict:'key'});if(pcBase){$('statusToko').innerText='UPLOAD BANNER PC...';const pcBlob=await (await fetch(pcBase)).blob();const fn='pc_'+Date.now()+'.jpg';const {error:e1}=await supa.storage.from('banners').upload(fn,pcBlob); if(e1) throw e1;const pcUrl=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;let hpUrl=pcUrl;if(hpBase){$('statusToko').innerText='UPLOAD BANNER HP...'; const hpBlob=await (await fetch(hpBase)).blob();const hfn='hp_'+Date.now()+'.jpg';await supa.storage.from('banners').upload(hfn,hpBlob);hpUrl=supa.storage.from('banners').getPublicUrl(hfn).data.publicUrl;}$('statusToko').innerText='SIMPAN DATABASE...';await supa.from('banners').update({is_active:false}).eq('is_active',true);await supa.from('banners').insert({title:$('bTitle').value||'BANNER',image_url:pcUrl,image_mobile_url:hpUrl,link_url:$('bLink').value||'produk.html',is_active:true});}$('statusToko').innerText='BERHASIL DISIMPAN'; toast('BANNER TERSIMPAN'); loadBanners();}catch(e){$('statusToko').innerText='ERROR: '+e.message; toast('GAGAL: '+e.message);} finally {setBtnLoading('btnToko','statusToko',false); setTimeout(()=>{$('statusToko').innerText=''},3000);}};
window.saveKoleksi=async()=>{const btn=$('btnKoleksi'); if(btn.disabled) return;const list=koleksiSlots.filter(x=>x.url); if(!list.length){toast('TAMBAH FOTO DULU');return;}setBtnLoading('btnKoleksi','statusKoleksi',true,'MENYIMPAN...');try{let final=[];for(let i=0;i<list.length;i++){let v=list[i]; $('statusKoleksi').innerText=`UPLOAD ${i+1}/${list.length}...`;let url=v.url; if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='k_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,blob); if(error) throw error; url=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||''});}$('statusKoleksi').innerText='SIMPAN DATABASE...';await supa.from('settings').upsert({key:'home_koleksi_terlaris',value:JSON.stringify(final)},{onConflict:'key'});$('statusKoleksi').innerText=`BERHASIL ${final.length} FOTO`; toast(`BEST ${final.length} TERSIMPAN`);}catch(e){$('statusKoleksi').innerText='ERROR: '+e.message; toast('GAGAL');} finally {setBtnLoading('btnKoleksi','statusKoleksi',false); setTimeout(()=>{$('statusKoleksi').innerText=''},3000);}};
window.saveUndertone=async()=>{const btn=$('btnUnder'); if(btn.disabled) return;const list=undertoneSlots.filter(x=>x.url); if(!list.length){toast('TAMBAH FOTO DULU');return;}setBtnLoading('btnUnder','statusUnder',true,'MENYIMPAN...');try{let final=[];for(let i=0;i<list.length;i++){let v=list[i]; $('statusUnder').innerText=`UPLOAD ${i+1}/${list.length}...`;let url=v.url; if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='u_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,blob); if(error) throw error; url=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||''});}$('statusUnder').innerText='SIMPAN DATABASE...';await supa.from('settings').upsert({key:'home_undertone_images',value:JSON.stringify(final)},{onConflict:'key'});$('statusUnder').innerText=`BERHASIL ${final.length} FOTO`; toast(`UNDERTONE ${final.length} TERSIMPAN`);}catch(e){$('statusUnder').innerText='ERROR: '+e.message; toast('GAGAL');} finally {setBtnLoading('btnUnder','statusUnder',false); setTimeout(()=>{$('statusUnder').innerText=''},3000);}};
window.saveFaq=async()=>{const btn=$('btnFaq'); if(btn.disabled) return;const final=faqSlots.filter(x=>x.q&&x.a); if(!final.length){toast('ISI FAQ DULU');return;}setBtnLoading('btnFaq','statusFaq',true,'MENYIMPAN...');try{$('statusFaq').innerText='SIMPAN DATABASE...';await supa.from('settings').upsert({key:'home_faq_list',value:JSON.stringify(final)},{onConflict:'key'});$('statusFaq').innerText=`BERHASIL ${final.length} FAQ`; toast(`FAQ ${final.length} TERSIMPAN`);}catch(e){$('statusFaq').innerText='ERROR: '+e.message;} finally {setBtnLoading('btnFaq','statusFaq',false); setTimeout(()=>{$('statusFaq').innerText=''},3000);}};
async function loadBanners(){const {data}=await supa.from('banners').select('*').order('id',{ascending:false});$('bannerList').innerHTML=(data||[]).map(b=>'<div style="border:1px solid var(--line);display:flex;gap:8px;padding:8px;margin-top:6px;background:#fff"><img src="'+b.image_url+'" style="width:56px;height:36px;object-fit:cover"><div style="flex:1;font-size:9px">'+esc(b.title)+'<br><span style="opacity:.5">'+(b.is_active?'AKTIF':'-')+'</span></div><button class="btn-light" style="width:auto" onclick="aktifB(\''+b.id+'\')">AKTIF</button><button class="btn-light" style="width:auto" onclick="hapusB(\''+b.id+'\')">HAPUS</button></div>').join('');}
window.aktifB=async(id)=>{await supa.from('banners').update({is_active:false}).eq('is_active',true);await supa.from('banners').update({is_active:true}).eq('id',id);loadBanners();toast('AKTIF');};
window.hapusB=async(id)=>{showConfirm('HAPUS BANNER?','Tidak bisa dikembalikan',async()=>{await supa.from('banners').delete().eq('id',id);loadBanners();toast('HAPUS');});};
init();
