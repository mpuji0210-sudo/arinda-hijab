<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN ARINDA </title>
<meta name="robots" content="noindex, nofollow">

<style>
:root{--bg:#FFFCF9;--line:#EDE8E1;--black:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:Inter,sans-serif;font-weight:300}
header{position:sticky;top:0;z-index:20;background:rgba(255,252,249,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:serif;letter-spacing:6px;font-size:16px}
.tabs{position:sticky;top:53px;z-index:19;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:24px;padding:0 16px;overflow-x:auto}
.tab{padding:14px 0;font-size:9px;letter-spacing:3px;cursor:pointer;opacity:.35;border-bottom:1px solid transparent;white-space:nowrap}.tab.active{opacity:1;border-bottom-color:var(--black)}
.wrap{max-width:720px;margin:0 auto;padding:16px}
.card{background:#fff;border:1px solid var(--line);padding:16px;margin-bottom:14px}
.input{width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--black);background:transparent;outline:none;font-size:12px;margin:6px 0}
.btn{width:100%;background:var(--black);color:#fff;border:none;padding:13px;font-size:9px;letter-spacing:3px;cursor:pointer;margin-top:10px}
.btn:disabled{opacity:.5}
.btn-light{background:#fff;color:var(--black);border:1px solid var(--black);font-size:9px;letter-spacing:2px;padding:9px;cursor:pointer}
.btn-line{background:#fff;border:1px dashed var(--black);font-size:9px;letter-spacing:2px;padding:10px;width:100%;cursor:pointer;margin-top:8px}
.slot{border:1px solid var(--line);background:var(--bg);padding:10px;margin-top:12px;position:relative}
.slot img{width:100%;height:200px;object-fit:cover;display:block;border:1px solid var(--line)}
.x{position:absolute;top:6px;right:6px;width:22px;height:22px;background:#fff;border:1px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:2}
.file-btn{display:block;width:100%;padding:10px;background:#fff;border:1px solid var(--black);font-size:9px;letter-spacing:2px;text-align:center;cursor:pointer;margin-top:8px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hidden{display:none}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;font-size:9px;letter-spacing:2px;opacity:0;transition:.3s;z-index:99;border-radius:20px}#toast.show{opacity:1}
.save-status{font-size:9px;text-align:center;margin-top:8px;opacity:.7;min-height:12px}
</style></head><body>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const _guard=window.supabase.createClient(SUPA_URL,SUPA_KEY);
(async()=>{const {data:{session}}=await _guard.auth.getSession();if(!session)location.href='login.html';})();

<header><div class="logo">ARINDA </div><button onclick="_guard.auth.signOut().then(()=>{localStorage.clear();location.href='login.html'})" style="background:none;border:1px solid #EDE8E1;padding:6px 12px;font-size:8px;letter-spacing:2px;cursor:pointer">LOGOUT</button></header>
<div class="tabs">
<div class="tab active" onclick="openTab('toko',this)">BANNER & TOKO</div>
<div class="tab" onclick="openTab('koleksi',this)">BEST</div>
<div class="tab" onclick="openTab('undertone',this)">UNDERTONE</div>

<div class="wrap">
<div id="tab-toko"><div class="card">
<h3>TOKO & BANNER - KONEK KE INDEX</h3>
<input id="storeName" class="input" placeholder="NAMA TOKO">
<input id="waNumber" class="input" placeholder="WA 628...">
<div style="font-size:9px;margin-top:12px;opacity:.5">ORIGIN: <span id="curOrigin">-</span></div>
<div style="display:flex;gap:8px"><input id="originSearch" class="input" placeholder="KECAMATAN"><button class="btn" style="width:80px;margin:0" onclick="cariOrigin()">CARI</button></div><div id="originList"></div>
<hr style="border:none;border-top:1px solid var(--line);margin:14px 0">
<input type="file" id="filePC" accept="image/*" style="display:none"><label for="filePC" class="file-btn">BANNER PC</label><img id="prevPC" style="width:100%;height:180px;object-fit:cover;display:none;margin-top:8px;border:1px solid var(--line)">
<input type="file" id="fileHP" accept="image/*" style="display:none"><label for="fileHP" class="file-btn" style="margin-top:10px">BANNER HP</label><img id="prevHP" style="width:100%;height:180px;object-fit:cover;display:none;margin-top:8px;border:1px solid var(--line)">

<div id="tab-undertone" class="hidden"><div class="card"><h3>UNDERTONE</h3><input type="file" id="underGaleri" accept="image/*" multiple style="display:none"><label for="underGaleri" class="file-btn">+ GALERI UNDERTONE</label><div id="undertoneWrap"></div><button class="btn" id="btnUnder" onclick="saveUndertone()">SIMPAN UNDERTONE</button><div id="statusUnder" class="save-status"></div></div></div>

<!--SPLIT--><div id="tab-produk" class="hidden">
<div class="card"><h3>PRODUK - EDIT DARI ADMIN</h3>
<input type="hidden" id="editId"><input id="pName" class="input" placeholder="NAMA PRODUK"><input id="pPrice" type="number" class="input" placeholder="HARGA">
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><select id="pJenis" class="input"><option value="">JENIS</option></select><select id="pCat" class="input"><option value="">BAHAN</option></select></div>
<input id="pSize" class="input" value="110x110cm"><input id="pFinish" class="input" value="Laser Cut"><textarea id="pDesc" class="input" rows="3" placeholder="DESKRIPSI"></textarea>
<div style="margin-top:10px;border:1px solid var(--line);padding:10px;background:var(--bg)"><div style="font-size:8px;font-weight:700">KELOLA JENIS</div><div style="display:flex;gap:6px"><input id="jenisName" class="input" placeholder="JENIS BARU" style="margin:0"><button class="btn" style="width:60px;margin:0" onclick="addJenis()">ADD</button></div><div id="jenisList"></div></div>
<div style="margin-top:10px;border:1px solid var(--line);padding:10px;background:var(--bg)"><div style="font-size:8px;font-weight:700">KELOLA BAHAN</div><div style="display:flex;gap:6px"><input id="catName" class="input" placeholder="BAHAN BARU" style="margin:0"><button class="btn" style="width:60px;margin:0" onclick="addCat()">ADD</button></div><div id="catList"></div></div>
<div id="varInputs" style="margin-top:12px"></div><button class="btn-line" onclick="addVarRow()">+ WARNA + FOTO</button>
<button class="btn" id="btnProd" onclick="saveProd()">SIMPAN PRODUK</button><div id="saveStatus" class="save-status"></div>
</div>
<div class="card"><h3>DAFTAR (<span id="prodCount">0</span>)</h3><div id="list" class="grid">Loading</div></div>
</div>
</div>

<script>
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);
let tokoOriginId="11730",tokoOriginLabel="CENGKARENG BARAT";let pcBase='',hpBase='';
let koleksiSlots=[{url:""}];let undertoneSlots=[{url:""}];let faqSlots=[{q:'Apakah menerawang?',a:'Tidak.'}];
const $=id=>document.getElementById(id);
function openTab(n,el){document.querySelectorAll('[id^="tab-"]').forEach(c=>c.classList.add('hidden'));$('tab-'+n).classList.remove('hidden');document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));el.classList.add('active');}
function toast(m){const t=$('toast');t.innerText=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000)}
function fileToBase64(f){return new Promise(r=>{const rd=new FileReader();rd.onload=e=>r(e.target.result);rd.readAsDataURL(f);});}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
async function init(){
  try{const {data}=await supa.from('settings').select('*');if(data){const g=k=>data.find(s=>s.key===k)?.value;if(g('store_name'))$('storeName').value=g('store_name');if(g('wa_number'))$('waNumber').value=g('wa_number');if(g('toko_origin_id')){tokoOriginId=g('toko_origin_id');tokoOriginLabel=g('toko_origin_label')||tokoOriginLabel;}if(g('home_koleksi_terlaris')){try{const p=JSON.parse(g('home_koleksi_terlaris'));if(p.length)koleksiSlots=p.map(x=>({url:x.url||x||'',title:x.title||''}))}catch(e){}}if(g('home_undertone_images')){try{const p=JSON.parse(g('home_undertone_images'));if(p.length)undertoneSlots=p.map(x=>({url:x.url||x||'',title:x.title||''}))}catch(e){}}if(g('home_faq_list')){try{faqSlots=JSON.parse(g('home_faq_list'))}catch(e){}}}}catch(e){}
  $('curOrigin').innerText=tokoOriginLabel+' - '+tokoOriginId;
  await loadJenis();await loadCats();await loadProducts();await loadBanners();initVar();renderKoleksi();renderUnder();renderFaq();
}
function initVar(){const el=$('varInputs');if(!el)return;el.innerHTML='';addVarRow();}
function addVarRow(c,img,stock){c=c||'';img=img||'';stock=stock!=null?stock:10;const id='vf_'+Date.now()+'_'+Math.random().toString(36).slice(2);const d=document.createElement('div');d.className='slot';d.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><input class="input var-color" placeholder="WARNA" value="${esc(c)}" style="flex:1;margin:0"><input class="input var-stock" type="number" value="${stock}" style="width:60px;margin:0;text-align:center"><div class="x" onclick="this.parentElement.parentElement.remove()">x</div></div>${img?`<img src="${img}">`:''}<input type="file" class="var-file" accept="image/*" style="display:none" id="${id}" onchange="prevVar(this)"><label for="${id}" class="file-btn">FOTO WARNA</label><input type="hidden" class="var-old" value="${img}">`; $('varInputs').appendChild(d);}
window.prevVar=(inp)=>{const f=inp.files[0];if(!f)return;const url=URL.createObjectURL(f);let img=inp.closest('.slot').querySelector('img');if(!img){img=document.createElement('img');inp.closest('.slot').insertBefore(img,inp);}img.src=url;};
async function loadJenis(){const {data}=await supa.from('jenis_produk').select('*').order('name');$('pJenis').innerHTML='<option value="">JENIS</option>'+(data||[]).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');$('jenisList').innerHTML=(data||[]).map(c=>`<span style="display:inline-block;border:1px solid var(--line);padding:4px 8px;margin:3px;font-size:9px">${esc(c.name)} <b style="cursor:pointer" onclick="delJenis('${c.id}')">x</b></span>`).join('');}
window.addJenis=async()=>{const v=$('jenisName').value.trim().toUpperCase();if(!v)return;await supa.from('jenis_produk').insert({name:v});$('jenisName').value='';loadJenis();};
window.delJenis=async(id)=>{if(!confirm('HAPUS JENIS?'))return;await supa.from('jenis_produk').delete().eq('id',id);loadJenis();};
async function loadCats(){const {data}=await supa.from('categories').select('*').order('name');$('pCat').innerHTML='<option value="">BAHAN</option>'+(data||[]).map(c=>`<option value="${esc(c.name)}">${esc(c.name)}</option>`).join('');$('catList').innerHTML=(data||[]).map(c=>`<span style="display:inline-block;border:1px solid var(--line);padding:4px 8px;margin:3px;font-size:9px">${esc(c.name)} <b style="cursor:pointer" onclick="delCat('${c.id}')">x</b></span>`).join('');}
window.addCat=async()=>{const v=$('catName').value.trim().toUpperCase();if(!v)return;await supa.from('categories').insert({name:v});$('catName').value='';loadCats();};
window.delCat=async(id)=>{if(!confirm('HAPUS BAHAN?'))return;await supa.from('categories').delete().eq('id',id);loadCats();};
function renderKoleksi(){let h='';koleksiSlots.forEach((it,i)=>{h+=`<div class="slot"><div class="x" onclick="koleksiSlots.splice(${i},1);renderKoleksi()">x</div>${it.url?`<img src="${it.url}">`:''}<input type="file" style="display:none" id="kf${i}" accept="image/*" onchange="changeKoleksi(${i},this)"><label for="kf${i}" class="file-btn">FILE</label></div>`});$('koleksi4Wrap').innerHTML=h;}
window.changeKoleksi=async(i,inp)=>{const f=inp.files[0];if(!f)return;koleksiSlots[i].url=await fileToBase64(f);renderKoleksi();};
$('koleksiGaleri').addEventListener('change',async e=>{for(let f of e.target.files){koleksiSlots.push({url:await fileToBase64(f)});}renderKoleksi();});
function renderUnder(){let h='';undertoneSlots.forEach((it,i)=>{h+=`<div class="slot"><div class="x" onclick="undertoneSlots.splice(${i},1);renderUnder()">x</div>${it.url?`<img src="${it.url}">`:''}<input type="file" style="display:none" id="uf${i}" accept="image/*" onchange="changeUnder(${i},this)"><label for="uf${i}" class="file-btn">FILE</label></div>`});$('undertoneWrap').innerHTML=h;}
window.changeUnder=async(i,inp)=>{const f=inp.files[0];if(!f)return;undertoneSlots[i].url=await fileToBase64(f);renderUnder();};
$('underGaleri').addEventListener('change',async e=>{for(let f of e.target.files){undertoneSlots.push({url:await fileToBase64(f)});}renderUnder();});
function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+=`<div class="slot"><div class="x" onclick="faqSlots.splice(${i},1);renderFaq()">x</div><input class="input" placeholder="Q" value="${esc(f.q)}" oninput="faqSlots[${i}].q=this.value"><textarea class="input" rows="2" placeholder="A" oninput="faqSlots[${i}].a=this.value">${esc(f.a)}</textarea></div>`});$('faqWrap').innerHTML=h;}
window.addFaq=()=>{faqSlots.push({q:'',a:''});renderFaq();};
async function loadProducts(){const {data}=await supa.from('products').select('*').order('id',{ascending:false});$('prodCount').innerText=(data||[]).length;$('list').innerHTML=(data||[]).map(p=>`<div style="border:1px solid var(--line);background:#fff"><img src="${p.image_url}" style="width:100%;height:120px;object-fit:cover"><div style="padding:8px"><div style="font-size:10px">${esc(p.name)}</div><div style="font-size:11px">Rp${Number(p.price).toLocaleString('id-ID')}</div><button class="btn-light" style="width:100%;margin-top:6px" onclick="editP('${p.id}')">EDIT</button></div></div>`).join('');window._p=data||[];}
window.editP=async(id)=>{const p=window._p.find(x=>String(x.id)===String(id));if(!p)return;$('editId').value=p.id;$('pName').value=p.name;$('pPrice').value=p.price;$('pCat').value=p.category||'';$('pJenis').value=p.product_type||p.kategori_produk||'';$('pDesc').value=p.description||'';const {data:vars}=await supa.from('product_variants').select('*').eq('product_id',id);$('varInputs').innerHTML='';if(vars&&vars.length)vars.forEach(v=>addVarRow(v.color_name,v.image_url,v.stock));else initVar();openTab('produk',document.querySelectorAll('.tab')[4]);window.scrollTo({top:0,behavior:'smooth'});};
window.saveProd=async()=>{
  const name=$('pName').value.trim();const price=Number($('pPrice').value);if(!name||!price){toast('ISI NAMA & HARGA');return;}
  const rows=[...document.querySelectorAll('#varInputs.slot')];let finalVars=[];
  for(let r of rows){const col=r.querySelector('.var-color')?.value.trim().toUpperCase();if(!col)continue;const stock=Number(r.querySelector('.var-stock')?.value||10);const file=r.querySelector('.var-file')?.files[0];let old=r.querySelector('.var-old')?.value||'';if(file){const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';const {error}=await supa.storage.from('products').upload(fn,file,{upsert:true});if(error){toast(error.message);return;}finalVars.push({color_name:col,image_url:supa.storage.from('products').getPublicUrl(fn).data.publicUrl,stock});}else if(old)finalVars.push({color_name:col,image_url:old,stock});}
  if(!finalVars.length){toast('FOTO KOSONG');return;}
  let pid=$('editId').value;let payload={name,price,image_url:finalVars[0].image_url,category:$('pCat').value,product_type:$('pJenis').value,kategori_produk:$('pJenis').value,description:$('pDesc').value};
  if(pid){await supa.from('products').update(payload).eq('id',pid);await supa.from('product_variants').delete().eq('product_id',pid);}else{const {data,error}=await supa.from('products').insert(payload).select().single();if(error){toast(error.message);return;}pid=data.id;}
  await supa.from('product_variants').insert(finalVars.map(v=>({product_id:pid,...v})));toast('PRODUK TERSIMPAN - KONEK KE TOKO');$('editId').value='';loadProducts();
};
async function cariOrigin(){const q=$('originSearch').value.trim();if(!q)return;$('originList').innerHTML='...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();$('originList').innerHTML=j.data.map(d=>`<div style="padding:10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:11px" onclick="pilihOrigin('${d.id}','${d.label.replace(/'/g,"")}')">${d.label}</div>`).join('');}catch(e){$('originList').innerHTML='<div style="font-size:10px;opacity:.6">GAGAL CARI API</div>';}}
window.pilihOrigin=(id,label)=>{tokoOriginId=id;tokoOriginLabel=label;$('curOrigin').innerText=label+' - '+id;$('originList').innerHTML='';};
$('filePC').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pcBase=await fileToBase64(f);$('prevPC').src=pcBase;$('prevPC').style.display='block';});
$('fileHP').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;hpBase=await fileToBase64(f);$('prevHP').src=hpBase;$('prevHP').style.display='block';});
window.saveToko=async()=>{
  const btn=$('btnToko');if(btn.disabled)return;btn.disabled=true;const s=$('statusToko');s.innerText='PROSES...';btn.innerText='MENYIMPAN...';
  try{
    const ups=[];if($('storeName').value)ups.push({key:'store_name',value:$('storeName').value});if($('waNumber').value)ups.push({key:'wa_number',value:$('waNumber').value});
    ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});
    if(ups.length) await supa.from('settings').upsert(ups,{onConflict:'key'});
    if(pcBase||hpBase){
      const toBlob=async b64=>(await fetch(b64)).blob();
      let pcUrl=null,hpUrl=null;
      if(pcBase){const b=await toBlob(pcBase);const fn='pc_'+Date.now()+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,b,{contentType:'image/jpeg',upsert:true});if(error)throw error;pcUrl=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}
      if(hpBase){const b=await toBlob(hpBase);const fn='hp_'+Date.now()+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,b,{contentType:'image/jpeg',upsert:true});if(error)throw error;hpUrl=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}
      if(!pcUrl)pcUrl=hpUrl;if(!hpUrl)hpUrl=pcUrl;
      await supa.from('banners').update({is_active:false}).eq('is_active',true);
      const {error:errIns}=await supa.from('banners').insert({banner_pc_url:pcUrl,banner_hp_url:hpUrl,is_active:true});
      if(errIns)throw errIns;
    }
    s.innerText='BERHASIL - KONEK KE TOKO';toast('TOKO & BANNER TERSIMPAN');loadBanners();
  }catch(e){$('statusToko').innerText='ERROR: '+e.message;toast(e.message);}finally{btn.disabled=false;btn.innerText='SIMPAN TOKO & BANNER';}
};
window.saveKoleksi=async()=>{
  const list=koleksiSlots.filter(x=>x.url);if(!list.length){toast('FOTO KOSONG');return;}
  const btn=$('btnKoleksi');btn.disabled=true;btn.innerText='MENYIMPAN...';
  try{let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='k_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;url=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url});}await supa.from('settings').upsert({key:'home_koleksi_terlaris',value:JSON.stringify(final)},{onConflict:'key'});toast('BEST TERSIMPAN - KONEK KE TOKO');}catch(e){toast(e.message);}finally{btn.disabled=false;btn.innerText='SIMPAN BEST';}
};
window.saveUndertone=async()=>{
  const list=undertoneSlots.filter(x=>x.url);if(!list.length){toast('FOTO KOSONG');return;}
  const btn=$('btnUnder');btn.disabled=true;btn.innerText='MENYIMPAN...';
  try{let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='u_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';const {error}=await supa.storage.from('banners').upload(fn,blob,{contentType:'image/jpeg',upsert:true});if(error)throw error;url=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url});}await supa.from('settings').upsert({key:'home_undertone_images',value:JSON.stringify(final)},{onConflict:'key'});toast('UNDERTONE TERSIMPAN - KONEK KE TOKO');}catch(e){toast(e.message);}finally{btn.disabled=false;btn.innerText='SIMPAN UNDERTONE';}
};
window.saveFaq=async()=>{
  const final=faqSlots.filter(x=>x.q&&x.a);if(!final.length){toast('ISI FAQ');return;}
  const btn=$('btnFaq');btn.disabled=true;
  try{await supa.from('settings').upsert({key:'home_faq_list',value:JSON.stringify(final)},{onConflict:'key'});toast('FAQ TERSIMPAN - KONEK KE TOKO');}catch(e){toast(e.message);}finally{btn.disabled=false;}
};
async function loadBanners(){const {data}=await supa.from('banners').select('*').order('created_at',{ascending:false});$('bannerList').innerHTML=(data||[]).map(b=>`<div style="border:1px solid var(--line);display:flex;gap:8px;padding:8px;margin-top:6px;background:#fff"><img src="${b.banner_pc_url}" style="width:56px;height:36px;object-fit:cover"><div style="flex:1;font-size:9px">${b.is_active?'AKTIF':'-'}<br><span style="opacity:.5">${(b.banner_pc_url||'').slice(-18)}</span></div><button class="btn-light" style="width:auto" onclick="aktifB('${b.id}')">AKTIF</button><button class="btn-light" style="width:auto" onclick="hapusB('${b.id}')">HAPUS</button></div>`).join('');}
window.aktifB=async(id)=>{await supa.from('banners').update({is_active:false}).eq('is_active',true);await supa.from('banners').update({is_active:true}).eq('id',id);loadBanners();toast('AKTIF');};
window.hapusB=async(id)=>{if(!confirm('HAPUS BANNER?'))return;await supa.from('banners').delete().eq('id',id);loadBanners();toast('HAPUS');};
init();
</script></body></html>
