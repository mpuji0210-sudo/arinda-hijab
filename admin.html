<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin ARINDA Hijab</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;background:#FFFCF9;padding:20px;max-width:600px;margin:auto}
.box{background:#fff;border:1px solid #EAE6E1;padding:16px;border-radius:12px;margin-bottom:16px}
h1{font-size:20px;text-align:center} label{font-size:12px;display:block;margin-top:10px}
input{width:100%;padding:10px;margin-top:4px;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{background:#2B1B12;color:#fff;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;margin-top:10px;width:100%}
#preview{width:100%;max-height:200px;object-fit:cover;margin-top:10px;border-radius:8px;display:none}
.item{border:1px solid #eee;padding:8px;border-radius:8px;margin-top:8px;display:flex;gap:10px;align-items:center}
.item img{width:60px;height:60px;object-fit:cover;border-radius:6px}
</style>
</head>
<body>
<h1>ARINDA - Admin Panel</h1>

<div class="box">
<h3>Setting Toko</h3>
<label>Nama Toko (misal: ARINDA HIJAB)</label>
<input id="storeName" placeholder="ARINDA">
<label>Nomor WA (contoh: 628123456789)</label>
<input id="waNumber" placeholder="628xxxx">
<button onclick="saveSettings()">Simpan Setting Toko</button>
<div id="msgSet" style="font-size:12px;margin-top:6px"></div>
</div>

<div class="box">
<h3>Tambah Produk Baru</h3>
<label>Nama Produk</label>
<input id="pName" placeholder="Paris Premium">
<label>Harga</label>
<input id="pPrice" type="number" placeholder="35000">
<label>📷 Foto Produk (Pilih dari Galeri HP)</label>
<input type="file" id="pFile" accept="image/*" onchange="uploadFoto()">
<img id="preview">
<div id="msgFoto" style="font-size:12px;margin-top:6px"></div>
<label>Deskripsi</label>
<input id="pDesc" placeholder="Bahan voal premium...">
<button onclick="addProduct()">Tambah Produk</button>
</div>

<div class="box">
<h3>Daftar Produk</h3>
<div id="list">Loading...</div>
</div>

<script>
const SUPABASE_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPABASE_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let uploadedImageUrl='';

async function loadSettings(){
 const {data}=await supabaseClient.from('settings').select('*').eq('id',1).single();
 if(data){ document.getElementById('storeName').value=data.store_name; document.getElementById('waNumber').value=data.wa_number; }
}
async function saveSettings(){
 const name=document.getElementById('storeName').value;
 const wa=document.getElementById('waNumber').value;
 const {error}=await supabaseClient.from('settings').upsert({id:1,store_name:name,wa_number:wa});
 document.getElementById('msgSet').innerText=error?'Gagal: '+error.message:'✅ Nama toko & WA berhasil disimpan!';
}

async function uploadFoto(){
 const file=document.getElementById('pFile').files[0];
 if(!file) return;
 document.getElementById('msgFoto').innerText='⏳ Uploading...';
 const fileName=Date.now()+'-'+file.name;
 const {error}=await supabaseClient.storage.from('product-images').upload(fileName,file);
 if(error){ document.getElementById('msgFoto').innerText='❌ Gagal: '+error.message; return; }
 const {data}=supabaseClient.storage.from('product-images').getPublicUrl(fileName);
 uploadedImageUrl=data.publicUrl;
 document.getElementById('preview').src=uploadedImageUrl;
 document.getElementById('preview').style.display='block';
 document.getElementById('msgFoto').innerText='✅ Foto berhasil diupload!';
}

async function addProduct(){
 if(!uploadedImageUrl){ alert('Upload foto dulu!'); return; }
 const name=document.getElementById('pName').value;
 const price=document.getElementById('pPrice').value;
 const desc=document.getElementById('pDesc').value;
 if(!name||!price){ alert('Isi nama & harga!'); return; }
 const {error}=await supabaseClient.from('products').insert({name,price,description:desc,image_url:uploadedImageUrl});
 if(error){ alert('Gagal: '+error.message); return; }
 alert('✅ Produk berhasil ditambah!');
 uploadedImageUrl=''; document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pDesc').value=''; document.getElementById('pFile').value=''; document.getElementById('preview').style.display='none'; document.getElementById('msgFoto').innerText='';
 loadProducts();
}

async function loadProducts(){
 const {data}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
 let html='';
 if(!data||data.length==0) html='Belum ada produk';
 else data.forEach(p=>{ html+=`<div class="item"><img src="${p.image_url}"><div style="flex:1"><b>${p.name}</b><br>Rp${p.price}<br><button style="width:auto;padding:4px 8px;font-size:11px;margin-top:4px" onclick="del('${p.id}')">Hapus</button></div></div>`; });
 document.getElementById('list').innerHTML=html;
}
async function del(id){ if(!confirm('Hapus?')) return; await supabaseClient.from('products').delete().eq('id',id); loadProducts(); }
loadSettings(); loadProducts();
</script>
</body>
</html>
