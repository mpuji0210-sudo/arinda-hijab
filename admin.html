<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Aeni HIJAB FULL</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--esp:#2B1B12;--bg:#FFFCF9;--line:#EAE6E1}body{margin:0;background:var(--bg);font-family:sans-serif;padding:16px}.wrap{max-width:900px;margin:auto}.card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:6px 0}.btn{background:var(--esp);color:#fff;border:none;padding:11px;border-radius:8px;cursor:pointer;width:100%;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prod{border:1px solid var(--line);border-radius:10px;overflow:hidden}</style></head><body><div class="wrap">
<h2>Aeni HIJAB - ADMIN FULL CUSTOM</h2>

<div class="card"><h3>1. CUSTOM NAMA TOKO</h3><input id="storeName" class="input" placeholder="Contoh: Aeni HIJAB"><button class="btn" onclick="saveStore()">SIMPAN NAMA TOKO</button><p id="storeStatus" style="font-size:12px"></p></div>

<div class="card"><h3>2. CUSTOM PRODUK - Tambah / Edit</h3><input type="hidden" id="editId"><input id="pName" class="input" placeholder="Nama Produk - contoh: PARIS PREMIUM Navy"><input id="pPrice" class="input" type="number" placeholder="Harga - 80000"><input id="pImage" class="input" placeholder="Link Foto / nama file - navy.jpg"><input id="pFile" type="file" accept="image/*" class="input"><div style="display:flex;gap:8px"><button class="btn" onclick="saveProduct()">SIMPAN PRODUK</button><button class="btn" style="background:#eee;color:#333" onclick="resetForm()">BATAL</button></div><p id="status" style="font-size:12px"></p></div>

<div class="card"><h3>3. DAFTAR PRODUK - Edit & Hapus Jalan</h3><div id="list" class="grid">Loading...</div></div>

</div><script>
const supabaseClient = supabase.createClient('https://qjgevvizqeebtdcqbgmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');

async function loadStore(){try{const {data}=await supabaseClient.from('settings').select('*').eq('id',1).single();if(data)storeName.value=data.store_name||'';}catch(e){}}
async function saveStore(){const name=storeName.value.trim();if(!name)return alert('Isi nama toko');const {error}=await supabaseClient.from('settings').upsert({id:1,store_name:name});if(error)alert(error.message);else{storeStatus.innerText='Berhasil disimpan!';alert('Nama toko jadi: '+name);}}

async function loadProducts(){const {data,error}=await supabaseClient.from('products').select('*').order('id',{ascending:false});if(error){list.innerText='Error: '+error.message+' - cek ANON KEY!';return;}window._products=data||[];if(window._products.length==0){list.innerText='Belum ada produk (padahal di Supabase ada 1) - ANON KEY salah!';return;}list.innerHTML=window._products.map(p=>`<div class="prod"><img src="${p.image_url}" style="width:100%;height:130px;object-fit:cover" onerror="this.src='https://via.placeholder.com/200'"><div style="padding:8px"><b>${p.name}</b><br><small>Rp${Number(p.price).toLocaleString('id-ID')}</small><div style="display:flex;gap:5px;margin-top:6px"><button class="btn" style="padding:6px;font-size:12px" onclick="editProduct('${p.id}')">EDIT</button><button class="btn" style="padding:6px;font-size:12px;background:#b42318" onclick="deleteProduct('${p.id}')">HAPUS</button></div></div></div>`).join('');}
function editProduct(id){const p=window._products.find(x=>String(x.id)===String(id));if(!p)return;editId.value=p.id;pName.value=p.name;pPrice.value=p.price;pImage.value=p.image_url;window.scrollTo({top:0,behavior:'smooth'});status.innerText='Mode EDIT ID '+id;}
function resetForm(){editId.value='';pName.value='';pPrice.value='';pImage.value='';pFile.value='';status.innerText='';}
async function saveProduct(){let image_url=pImage.value.trim();const file=pFile.files[0];if(file){status.innerText='Uploading...';const fn=Date.now()+'_'+file.name;const {error}=await supabaseClient.storage.from('products').upload(fn,file);if(error){alert('Bucket belum ada, pakai URL manual. Error: '+error.message);return;}const {data}=supabaseClient.storage.from('products').getPublicUrl(fn);image_url=data.publicUrl;}if(!pName.value||!pPrice.value)return alert('Nama & harga wajib');const payload={name:pName.value,price:Number(pPrice.value),image_url:image_url};let error;if(editId.value){const r=await supabaseClient.from('products').update(payload).eq('id',editId.value);error=r.error;}else{const r=await supabaseClient.from('products').insert(payload);error=r.error;}if(error)alert(error.message);else{status.innerText='Berhasil!';resetForm();loadProducts();}}
async function deleteProduct(id){if(!confirm('Yakin HAPUS?'))return;const {error}=await supabaseClient.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts();}
loadStore();loadProducts();
</script></body></html>
