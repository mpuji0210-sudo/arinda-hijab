<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ADMIN - Aeni HIJAB</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Instrument+Serif&display=swap" rel="stylesheet">
<style>
:root{--esp:#2B1B12;--champ:#EAE6E1;--bg:#FFFCF9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:'Plus Jakarta Sans',sans-serif;color:var(--esp)}
.wrap{max-width:900px;margin:0 auto;padding:24px}
h1{font-family:'Instrument Serif',serif;font-size:28px;margin:0}
.sub{font-size:11px;color:#8C7A6B;letter-spacing:1px;margin:6px 0 20px}
.card{background:#fff;border:1px solid var(--champ);border-radius:16px;padding:18px;margin-bottom:18px}
.card h2{font-size:14px;letter-spacing:1px;margin:0 0 12px}
.input{width:100%;padding:12px 14px;border:1px solid var(--champ);border-radius:10px;margin-bottom:10px;font-size:13px}
.btn{background:var(--esp);color:#fff;border:none;padding:11px 18px;border-radius:10px;font-size:12px;letter-spacing:1px;cursor:pointer}
.btn-red{background:#b42318}
.btn-gray{background:#eee;color:#333}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px;margin-top:10px}
.prod{border:1px solid var(--champ);border-radius:14px;overflow:hidden;background:#fff}
.prod img{width:100%;height:220px;object-fit:cover;object-position:top center;display:block;background:#fff}
.info{padding:10px}
.actions{display:flex;gap:8px;margin-top:10px}
.actions button{flex:1}
</style>
</head>
<body>
<div class="wrap">
<h1>Aeni HIJAB</h1>
<div class="sub">ADMIN PANEL - 1 AKSES FULL CUSTOM - TAMBAH / EDIT / HAPUS</div>

<div class="card">
<h2>1. NAMA TOKO</h2>
<input id="storeName" class="input" placeholder="Contoh: Aeni HIJAB">
<button class="btn" onclick="saveStore()">Simpan Nama Toko</button>
</div>

<div class="card">
<h2>2. TAMBAH / EDIT PRODUK</h2>
<input type="hidden" id="editId">
<input id="pName" class="input" placeholder="Nama Produk - contoh: PARIS PREMIUM Navy">
<input id="pPrice" class="input" type="number" placeholder="Harga - contoh: 80000">
<input id="pImage" class="input" placeholder="Link Foto - contoh: navy.jpg atau https://...">
<div style="font-size:10px;color:#8C7A6B;margin:-6px 0 10px">Kalau punya file foto baru, pakai upload dibawah. Kalau enggak, isi nama file aja (navy.jpg)</div>
<input id="pFile" type="file" accept="image/*" class="input">
<div style="display:flex;gap:8px">
<button class="btn" onclick="saveProduct()">SIMPAN PRODUK</button>
<button class="btn btn-gray" onclick="resetForm()">BATAL EDIT</button>
</div>
<div id="status" style="font-size:11px;margin-top:10px;color:#8C7A6B"></div>
</div>

<div class="card">
<h2>3. DAFTAR PRODUK - KLIK HAPUS UNTUK HAPUS</h2>
<div id="list" class="grid">Loading produk...</div>
</div>
</div>

<script>
const supabaseClient = supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');

async function loadStore(){
  const {data} = await supabaseClient.from('settings').select('*').eq('id',1).single();
  if(data && data.store_name) document.getElementById('storeName').value = data.store_name;
}
async function saveStore(){
  const name = document.getElementById('storeName').value.trim();
  if(!name) return alert('Isi nama toko');
  const {error} = await supabaseClient.from('settings').upsert({id:1, store_name:name});
  if(error) alert(error.message); else alert('Nama toko disimpan!');
}

async function loadProducts(){
  const {data,error} = await supabaseClient.from('products').select('*').order('id',{ascending:false});
  if(error){ document.getElementById('list').innerText = error.message; return; }
  document.getElementById('list').innerHTML = data.map(p=>`
    <div class="prod">
      <img src="${p.image_url}" onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'">
      <div class="info">
        <div style="font-weight:600;font-size:13px">${p.name}</div>
        <div style="font-size:12px;color:#8C7A6B">Rp${Number(p.price).toLocaleString('id-ID')}</div>
        <div class="actions">
          <button class="btn" onclick="editProduct(${p.id},'${p.name.replace(/'/g,"\\'")}',${p.price},'${p.image_url}')">EDIT</button>
          <button class="btn btn-red" onclick="deleteProduct(${p.id},'${p.name.replace(/'/g,"\\'")}')">HAPUS</button>
        </div>
      </div>
    </div>
  `).join('') || '<div style="font-size:12px;color:#8C7A6B">Belum ada produk</div>';
}

function editProduct(id,name,price,image_url){
  document.getElementById('editId').value = id;
  document.getElementById('pName').value = name;
  document.getElementById('pPrice').value = price;
  document.getElementById('pImage').value = image_url;
  document.getElementById('status').innerText = 'MODE EDIT ID '+id+' - Ubah lalu klik SIMPAN';
  window.scrollTo({top:0,behavior:'smooth'});
}

function resetForm(){
  document.getElementById('editId').value='';
  document.getElementById('pName').value='';
  document.getElementById('pPrice').value='';
  document.getElementById('pImage').value='';
  document.getElementById('pFile').value='';
  document.getElementById('status').innerText='';
}

async function uploadFile(file){
  const fileName = Date.now()+'_'+file.name.replace(/\s+/g,'_');
  const {error} = await supabaseClient.storage.from('products').upload(fileName, file);
  if(error) throw error;
  const {data} = supabaseClient.storage.from('products').getPublicUrl(fileName);
  return data.publicUrl;
}

async function saveProduct(){
  const id = document.getElementById('editId').value;
  const name = document.getElementById('pName').value.trim();
  const price = document.getElementById('pPrice').value.trim();
  let image_url = document.getElementById('pImage').value.trim();
  const file = document.getElementById('pFile').files[0];

  if(!name ||!price) return alert('Nama & Harga wajib isi');
  document.getElementById('status').innerText = 'Menyimpan...';

  try{
    if(file){
      image_url = await uploadFile(file);
    }
    if(!image_url) return alert('Isi Link Foto atau Upload File');

    if(id){
      const {error} = await supabaseClient.from('products').update({name, price:Number(price), image_url}).eq('id',id);
      if(error) throw error;
    }else{
      const {error} = await supabaseClient.from('products').insert({name, price:Number(price), image_url});
      if(error) throw error;
    }
    resetForm();
    document.getElementById('status').innerText = 'Berhasil!';
    loadProducts();
  }catch(e){
    document.getElementById('status').innerText = 'Error: '+e.message;
    alert(e.message);
  }
}

async function deleteProduct(id,name){
  if(!confirm('YAKIN HAPUS "'+name+'"? Tidak bisa dikembalikan!')) return;
  const {error} = await supabaseClient.from('products').delete().eq('id',id);
  if(error) alert(error.message);
  else { alert('Terhapus: '+name); loadProducts(); }
}

loadStore();
loadProducts();
</script>
</body>
</html>
