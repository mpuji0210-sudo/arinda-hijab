<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin - Aeni HIJAB</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#FFFCF9;font-family:sans-serif;padding:15px}.card{background:#fff;border:1px solid #EAE6E1;border-radius:12px;padding:16px;margin-bottom:12px}.input{width:100%;padding:10px;border:1px solid #ddd;border-radius:8px;margin:5px 0}.btn{background:#2B1B12;color:#fff;border:none;padding:10px;border-radius:8px;width:100%;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body>
<div id="adminPage"><h2>ADMIN FULL CUSTOM - FIXED</h2>
<div class="card"><h4>3. PRODUK - Edit & Hapus</h4><input type="hidden" id="editId"><input id="pName" class="input" placeholder="Nama Produk"><input id="pPrice" class="input" type="number" placeholder="Harga"><input id="pImage" class="input" placeholder="URL Gambar"><input id="pFile" type="file" class="input"><button class="btn" onclick="saveProduct()">SIMPAN PRODUK</button><p id="status"></p></div>
<div class="card"><h4>4. DAFTAR PRODUK</h4><div id="list" class="grid">Loading...</div></div></div>
<script>
const supabaseClient = supabase.createClient('https://qjgevvizqeebtdcqbgmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
async function loadProducts(){
  const {data,error}=await supabaseClient.from('products').select('*').order('id',{ascending:false});
  if(error){document.getElementById('list').innerText='Error: '+error.message;return;}
  window._products=data||[];
  if(window._products.length==0){document.getElementById('list').innerText='Kosong - cek Table Editor';return;}
  document.getElementById('list').innerHTML=window._products.map(p=>`<div class="card"><img src="${p.image_url||'https://via.placeholder.com/200'}" style="width:100%;height:120px;object-fit:cover"><p><b>${p.name}</b><br>Rp${p.price}</p><button class="btn" onclick="editProd('${p.id}')">EDIT</button><button class="btn" style="background:#b42318;margin-top:5px" onclick="delProd('${p.id}')">HAPUS</button></div>`).join('');
}
function editProd(id){const p=window._products.find(x=>String(x.id)===String(id));if(!p)return;editId.value=p.id;pName.value=p.name;pPrice.value=p.price;pImage.value=p.image_url||'';window.scrollTo({top:0,behavior:'smooth'});}
async function delProd(id){if(!confirm('Yakin HAPUS?'))return;const {error}=await supabaseClient.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts();}
async function saveProduct(){let image_url=pImage.value.trim();const file=pFile.files[0];if(file){const fn=Date.now()+'_'+file.name;const {error}=await supabaseClient.storage.from('products').upload(fn,file);if(error){alert('Upload gagal, pakai URL manual: '+error.message);return;}const {data}=supabaseClient.storage.from('products').getPublicUrl(fn);image_url=data.publicUrl;}const payload={name:pName.value,price:Number(pPrice.value),image_url};let error;if(editId.value){const r=await supabaseClient.from('products').update(payload).eq('id',editId.value);error=r.error;}else{const r=await supabaseClient.from('products').insert(payload);error=r.error;}if(error)alert(error.message);else{editId.value='';pName.value='';pPrice.value='';pImage.value='';loadProducts();}}
loadProducts();
</script></body></html>
