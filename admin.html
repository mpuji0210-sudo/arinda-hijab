<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient=window.supabase.createClient(SUPA_URL,SUPA_KEY);
if(localStorage.getItem('arinda_admin')!=='login'){location.href='login.html';}
let tokoOriginId="17523",tokoOriginLabel="CENGKARENG BARAT";let pcBase='',hpBase='';
let koleksiSlots=[{url:"",title:"KREM - Best Seller",desc:"Paling laris"}];
let undertoneSlots=[{url:"",title:"COOL",desc:""},{url:"",title:"WARM",desc:""},{url:"",title:"NEUTRAL",desc:""}];
let faqSlots=[{q:'Apakah menerawang?',a:'Tidak.'}];
const $=id=>document.getElementById(id);let confirmCallback=null;
function showConfirm(t,d,cb){$("modalTitle").innerText=t;$("modalDesc").innerText=d;$("confirmModal").style.display='flex';confirmCallback=cb;}
function closeModal(){$("confirmModal").style.display='none';confirmCallback=null;}
$("btnModalBatal").onclick=closeModal;$("modalOk").onclick=()=>{if(confirmCallback)confirmCallback();closeModal();};
function showToast(m,e){const t=$("toast");t.innerText=m;t.style.background=e?'#B42318':'#2B1B12';t.style.display='block';setTimeout(()=>t.style.display='none',2800);}
function toBase64(f){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});}
function escapeHtml(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

async function init(){
 try{
  const {data}=await supabaseClient.from('settings').select('*');
  if(data){
   const get=k=>{const f=data.find(s=>s.key===k);return f?f.value:null;};
   if(get('store_name'))$("storeName").value=get('store_name');
   if(get('wa_number'))$("waNumber").value=get('wa_number');
   if(get('toko_origin_id')){tokoOriginId=get('toko_origin_id');tokoOriginLabel=get('toko_origin_label')||tokoOriginLabel;}
   if(get('home_koleksi_title'))$("homeKoleksiTitle").value=get('home_koleksi_title');
   if(get('home_undertone_title'))$("homeUnderTitle").value=get('home_undertone_title');
   if(get('home_undertone_desc'))$("homeUnderDesc").value=get('home_undertone_desc');
   if(get('home_undertone_list'))$("homeUnderList").value=get('home_undertone_list');
   if(get('home_koleksi_terlaris')){try{const p=JSON.parse(get('home_koleksi_terlaris'));if(p.length>0&&typeof p[0]==='object')koleksiSlots=p.map(x=>({url:x.url||'',title:x.title||'',desc:x.desc||''}));}catch(e){}}
   if(get('home_undertone_images')){try{const p=JSON.parse(get('home_undertone_images'));if(p.length>0)undertoneSlots=p.map(x=>({url:x.url||'',title:x.title||'',desc:x.desc||''}));}catch(e){}}
   if(get('home_faq_list')){try{faqSlots=JSON.parse(get('home_faq_list'));}catch(e){}}
  }
 }catch(e){}
 $("curOrigin").innerText=tokoOriginLabel+" - "+tokoOriginId;
 await loadCats(); await loadProducts(); await loadBanners();
 initVarRows(); renderKoleksi(); renderUndertone(); renderFaq();
}
function initVarRows(){$("varInputs").innerHTML='';for(let i=0;i<2;i++)addVarRow();}
function addVarRow(color='',img=''){
 const id='varFile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 const d=document.createElement('div');d.className='slot';
 d.innerHTML=`<div style="display:flex;gap:6px;align-items:center"><input class="input var-color" placeholder="Nama WARNA (KREM/HITAM)" value="${escapeHtml(color)}" style="flex:1"><button type="button" class="btn-del" onclick="this.closest('.slot').remove()">X</button></div>
 ${img?`<img src="${img}" style="width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px" class="preview-img">`:''}
 <input type="file" class="input var-file" accept="image/*" style="display:none" id="${id}" onchange="previewNew(this)"><label for="${id}" class="file-btn">📸 Pilih / Ganti Foto Warna</label><input type="hidden" class="var-old-url" value="${img}">`;
 $("varInputs").appendChild(d);
}
window.previewNew=(input)=>{
 const slot=input.closest('.slot'); const file=input.files[0]; if(!file) return;
 const url=URL.createObjectURL(file);
 let img=slot.querySelector('.preview-img');
 if(!img){ img=document.createElement('img'); img.className='preview-img'; img.style.cssText='width:100%;height:120px;object-fit:cover;border-radius:10px;margin-top:6px'; slot.insertBefore(img, input); }
 img.src=url;
};
$("btnAddVar").onclick=()=>addVarRow();
async function loadCats(){const {data}=await supabaseClient.from('categories').select('*');if(!data)return;$("catList").innerHTML=data.map(c=>`<span style="display:inline-block;background:#F6EEE6;border:1px solid #EEE6DF;padding:6px 12px;border-radius:20px;margin:3px;font-size:11px">${escapeHtml(c.name)} <b style="color:#B42318;cursor:pointer" onclick="delCat('${c.id}')">x</b></span>`).join('');$("pCat").innerHTML='<option value="">Pilih Kategori</option>'+data.map(c=>`<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('');}
$("btnAddCat").onclick=async()=>{const v=$("catName").value.trim();if(!v)return;await supabaseClient.from('categories').insert({name:v});$("catName").value='';loadCats();};
window.delCat=(id)=>{showConfirm('Hapus Kategori?','Kategori akan dihapus',async()=>{await supabaseClient.from('categories').delete().eq('id',id);loadCats();showToast('✅ Kategori terhapus');});};
function renderKoleksi(){let html='';koleksiSlots.forEach((item,i)=>{html+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small"><b>Slot ${i+1}</b></span><button class="btn-del" onclick="hapusKoleksi(${i})">X Hapus</button></div>${item.url?`<img src="${item.url}" style="width:100%;height:200px;object-fit:cover;border-radius:12px;margin:8px 0">`:''}<input type="file" style="display:none" id="kFile${i}" accept="image/*" onchange="gantiKoleksi(${i},this)"><label for="kFile${i}" class="file-btn">📸 Pilih File Koleksi ${i+1}</label><input id="kTitle${i}" class="input" placeholder="Judul" value="${escapeHtml(item.title)}" oninput="updateKoleksiMeta(${i})"><input id="kDesc${i}" class="input" placeholder="Deskripsi" value="${escapeHtml(item.desc)}" oninput="updateKoleksiMeta(${i})"></div>`;});$("koleksi4Wrap").innerHTML=html;}
window.updateKoleksiMeta=(i)=>{koleksiSlots[i].title=$("kTitle"+i).value;koleksiSlots[i].desc=$("kDesc"+i).value;};
window.hapusKoleksi=(i)=>{koleksiSlots.splice(i,1);if(koleksiSlots.length==0)koleksiSlots=[{url:"",title:"",desc:""}];renderKoleksi();};
window.gantiKoleksi=async(i,input)=>{const f=input.files[0];if(!f)return;koleksiSlots[i].url=await toBase64(f);renderKoleksi();};
$("btnAddKoleksi").onclick=()=>{koleksiSlots.push({url:"",title:"",desc:""});renderKoleksi();};
$("koleksiGaleri").addEventListener('change',async e=>{for(let f of e.target.files){koleksiSlots.push({url:await toBase64(f),title:f.name.split('.')[0],desc:""});}renderKoleksi();});
function renderUndertone(){let html='';undertoneSlots.forEach((item,i)=>{html+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small"><b>Foto ${i+1}</b></span><button class="btn-del" onclick="hapusUndertone(${i})">X Hapus</button></div>${item.url?`<img src="${item.url}" style="width:100%;height:180px;object-fit:cover;border-radius:12px;margin:8px 0">`:''}<input type="file" style="display:none" id="uFile${i}" accept="image/*" onchange="gantiUndertone(${i},this)"><label for="uFile${i}" class="file-btn">📸 Pilih File Undertone</label><input id="uTitle${i}" class="input" placeholder="Nama" value="${escapeHtml(item.title)}" oninput="updateUnderMeta(${i})"><input id="uDesc${i}" class="input" placeholder="Deskripsi" value="${escapeHtml(item.desc)}" oninput="updateUnderMeta(${i})"></div>`;});$("undertoneWrap").innerHTML=html;}
window.updateUnderMeta=(i)=>{undertoneSlots[i].title=$("uTitle"+i).value;undertoneSlots[i].desc=$("uDesc"+i).value;};
window.hapusUndertone=(i)=>{undertoneSlots.splice(i,1);if(undertoneSlots.length==0)undertoneSlots=[{url:"",title:"",desc:""}];renderUndertone();};
window.gantiUndertone=async(i,input)=>{const f=input.files[0];if(!f)return;undertoneSlots[i].url=await toBase64(f);renderUndertone();};
$("btnAddUnder").onclick=()=>{undertoneSlots.push({url:"",title:"",desc:""});renderUndertone();};
$("underGaleri").addEventListener('change',async e=>{for(let f of e.target.files){undertoneSlots.push({url:await toBase64(f),title:"",desc:""});}renderUndertone();});
function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+=`<div class="slot"><div style="display:flex;justify-content:space-between"><span class="small">FAQ ${i+1}</span><button class="btn-del" onclick="hapusFaq(${i})">X</button></div><input id="faqQ${i}" class="input" placeholder="Pertanyaan" value="${escapeHtml(f.q)}"><textarea id="faqA${i}" class="input" rows="2">${escapeHtml(f.a)}</textarea></div>`;});$("faqWrap").innerHTML=h;}
window.hapusFaq=(i)=>{faqSlots.splice(i,1);if(faqSlots.length==0)faqSlots=[{q:'',a:''}];renderFaq();};
$("btnAddFaq").onclick=()=>{faqSlots.push({q:'',a:''});renderFaq();};
$("btnSaveFaq").onclick=async()=>{const final=[];faqSlots.forEach((_,i)=>{const q=$("faqQ"+i)?.value.trim();const a=$("faqA"+i)?.value.trim();if(q&&a)final.push({q,a});});await supabaseClient.from('settings').upsert([{key:'home_faq_list',value:JSON.stringify(final)}],{onConflict:'key'});showToast('✅ FAQ tersimpan');};

async function loadProducts(){
 const {data:prods}=await supabaseClient.from('products').select('*').order('id',{ascending:false});
 $("prodCount").innerText=(prods||[]).length+' produk';
 $("list").innerHTML=(prods||[]).map(p=>`<div class="prod-card"><img class="prod-img" src="${p.image_url}"><div style="padding:8px"><div style="font-size:12px;font-weight:700">${escapeHtml(p.name)}</div><div style="font-size:13px;font-weight:800">Rp${Number(p.price).toLocaleString('id-ID')}</div><button class="btn" style="margin-top:6px;padding:8px;font-size:11px" onclick="editP('${p.id}')">EDIT</button><button class="btn" style="margin-top:4px;padding:8px;background:#FFF1F1;color:#B42318;border:1px solid #FECACA;font-size:11px" onclick="delP('${p.id}')">HAPUS</button></div></div>`).join('');
 window._p=prods||[];
}
window.editP=async(id)=>{
 const p=window._p.find(x=>String(x.id)===String(id)); if(!p)return;
 $("editId").value=p.id;$("pName").value=p.name;$("pPrice").value=p.price;$("pCat").value=p.category||'';
 $("varInputs").innerHTML='';
 const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id);
 if(vars && vars.length>0){ vars.forEach(v=>addVarRow(v.color_name,v.image_url)); } else { initVarRows(); }
 showToast('✏️ Edit: '+p.name+' ('+vars.length+' warna)');
};
window.delP=(id)=>{showConfirm('Hapus Produk?','Produk & varian akan terhapus',async()=>{await supabaseClient.from('products').delete().eq('id',id);loadProducts();showToast('✅ Produk terhapus');});};

// INI FIX UTAMA V25.6 - PAKAI SPASI!
$("btnSaveProd").onclick=async()=>{
 const name=$("pName").value.trim();const price=Number($("pPrice").value);
 if(!name||!price){showToast('Isi nama & harga',true);return;}
 const rows=[...document.querySelectorAll('#varInputs.slot')]; // <-- FIX SPASI ADA DISINI!
 let finalVars=[];
 for(let r of rows){
  const col=r.querySelector('.var-color')?.value.trim().toUpperCase();
  if(!col) continue;
  const file=r.querySelector('.var-file')?.files[0];
  const oldUrl=r.querySelector('.var-old-url')?.value;
  if(file){
   const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+file.name.replace(/\s+/g,'_');
   const {error}=await supabaseClient.storage.from('products').upload(fn,file);
   if(error){showToast('Upload gagal: '+error.message,true);return;}
   const url=supabaseClient.storage.from('products').getPublicUrl(fn).data.publicUrl;
   finalVars.push({color_name:col,image_url:url});
  } else if(oldUrl){
   finalVars.push({color_name:col,image_url:oldUrl});
  }
 }
 if(finalVars.length==0){showToast('Minimal 1 warna + foto - isi nama & foto',true);return;}
 $("saveStatus").innerText='⏳ Menyimpan '+finalVars.length+' warna...';
 try{
  let pid=$("editId").value;
  if(pid){
   await supabaseClient.from('products').update({name,price,image_url:finalVars[0].image_url,category:$("pCat").value}).eq('id',pid);
   await supabaseClient.from('product_variants').delete().eq('product_id',pid);
  }else{
   const {data}=await supabaseClient.from('products').insert({name,price,image_url:finalVars[0].image_url,category:$("pCat").value}).select().single();
   pid=data.id;
  }
  await supabaseClient.from('product_variants').insert(finalVars.map(v=>({product_id:pid,color_name:v.color_name,image_url:v.image_url})));
  $("saveStatus").innerText='✅ Berhasil';showToast('✅ Produk tersimpan '+finalVars.length+' warna');
  $("editId").value='';$("pName").value='';$("pPrice").value='';initVarRows();loadProducts();
 }catch(e){showToast('❌ '+e.message,true);}
};

 const ups=[];if($("storeName").value)ups.push({key:'store_name',value:$("storeName").value});if($("waNumber").value)ups.push({key:'wa_number',value:$("waNumber").value});
 ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});
 await supabaseClient.from('settings').upsert(ups,{onConflict:'key'});
 if(pcBase){const pcBlob=await (await fetch(pcBase)).blob();const fn='pc_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,pcBlob);const pcUrl=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;let hpUrl=pcUrl;if(hpBase){const hpBlob=await (await fetch(hpBase)).blob();const hfn='hp_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(hfn,hpBlob);hpUrl=supabaseClient.storage.from('banners').getPublicUrl(hfn).data.publicUrl;}await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').insert({title:$("bTitle").value||'Promo',image_url:pcUrl,image_mobile_url:hpUrl,link_url:$("bLink").value||'produk.html',is_active:true});}
 showToast('✅ Toko tersimpan');loadBanners();
};
async function saveKoleksiCustom(){const list=koleksiSlots.filter(x=>x.url);if(list.length==0){showToast('Pilih foto koleksi dulu',true);return;}$("koleksiStatus").innerText='⏳ Upload...';let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='koleksi_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);url=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||'',desc:v.desc||''});}await supabaseClient.from('settings').upsert([{key:'home_koleksi_terlaris',value:JSON.stringify(final)},{key:'home_koleksi_title',value:$("homeKoleksiTitle").value}],{onConflict:'key'});showToast('✅ Koleksi tersimpan');}
$("btnSaveKoleksi").onclick=saveKoleksiCustom;
async function saveUnderCustom(){const list=undertoneSlots.filter(x=>x.url);if(list.length==0){showToast('Pilih foto undertone dulu',true);return;}$("underStatus").innerText='⏳ Upload...';let final=[];for(let v of list){let url=v.url;if(String(url).startsWith('data:')){const blob=await (await fetch(url)).blob();const fn='undertone_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);url=supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl;}final.push({url,title:v.title||'',desc:v.desc||''});}await supabaseClient.from('settings').upsert([{key:'home_undertone_images',value:JSON.stringify(final)},{key:'home_undertone_title',value:$("homeUnderTitle").value},{key:'home_undertone_desc',value:$("homeUnderDesc").value},{key:'home_undertone_list',value:$("homeUnderList").value}],{onConflict:'key'});showToast('✅ Undertone tersimpan');}
$("btnSaveUnder").onclick=saveUnderCustom;
async function loadBanners(){const {data}=await supabaseClient.from('banners').select('*').order('id',{ascending:false});$("bannerList").innerHTML=(data||[]).map(b=>`<div style="border:1px solid #EEE6DF;border-radius:12px;display:flex;gap:6px;padding:8px;margin-top:6px"><img src="${b.image_url}" style="width:56px;height:36px;object-fit:cover;border-radius:8px"><div style="flex:1;font-size:11px"><b>${escapeHtml(b.title)}</b><br><span style="color:${b.is_active?'#16A34A':'#999'}">${b.is_active?'✅ AKTIF':'Nonaktif'}</span></div><button class="btn" style="width:auto;padding:6px 10px;font-size:10px" onclick="aktifkanBanner('${b.id}')">Aktif</button><button class="btn" style="width:auto;padding:6px 10px;background:#B42318;font-size:10px" onclick="hapusBanner('${b.id}')">Hapus</button></div>`).join('');}
window.aktifkanBanner=async(id)=>{await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').update({is_active:true}).eq('id',id);loadBanners();};
window.hapusBanner=(id)=>{showConfirm('Hapus Banner?','Banner akan dihapus',async()=>{await supabaseClient.from('banners').delete().eq('id',id);loadBanners();});};
init();
</script></body></html>
