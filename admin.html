<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';

function toBase64(file){return new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(file);});}

 try{const {data}=await supabaseClient.from('settings').select('*');if(data){const get=k=>{const f=data.find(s=>s.key===k);return f?f.value:null;};if(get('store_name'))$("storeName").value=get('store_name');if(get('wa_number'))$("waNumber").value=get('wa_number');if(get('toko_origin_id')){tokoOriginId=get('toko_origin_id');tokoOriginLabel=get('toko_origin_label')||tokoOriginLabel;}if(get('home_koleksi_title'))$("homeKoleksiTitle").value=get('home_koleksi_title');if(get('home_undertone_title'))$("homeUnderTitle").value=get('home_undertone_title');if(get('home_undertone_desc'))$("homeUnderDesc").value=get('home_undertone_desc');if(get('home_undertone_list'))$("homeUnderList").value=get('home_undertone_list');if(get('home_koleksi_terlaris')){try{koleksiSlots=JSON.parse(get('home_koleksi_terlaris'));}catch(e){}}if(get('home_undertone_images')){try{undertoneSlots=JSON.parse(get('home_undertone_images'));}catch(e){}}if(get('home_faq_list')){try{faqSlots=JSON.parse(get('home_faq_list'));}catch(e){}}}}catch(e){}
 if(koleksiSlots.length==0)koleksiSlots=["","","",""];if(undertoneSlots.length==0)undertoneSlots=[""];if(faqSlots.length==0)faqSlots=[{q:'',a:''}];
 $("curOrigin").innerText=tokoOriginLabel+" - "+tokoOriginId;await loadCats();await loadProducts();await loadBanners();initVarRows();renderKoleksi();renderUndertone();renderFaq();
}

function initVarRows(){$("varInputs").innerHTML='';for(let i=0;i<1;i++)addVarRow();}
function addVarRow(color='',img=''){
 const id='varFile_'+Date.now()+'_'+Math.random().toString(36).slice(2);
 const d=document.createElement('div');d.className='slot';
 const top=document.createElement('div');top.style.cssText='display:flex;gap:6px;align-items:center';
 const inp=document.createElement('input');inp.className='input var-color';inp.placeholder='Nama WARNA (KREM/HITAM)';inp.value=color||'';inp.style.flex='1';
 const del=document.createElement('button');del.type='button';del.className='btn-del';del.innerText='X';del.onclick=()=>d.remove();
 top.appendChild(inp);top.appendChild(del);d.appendChild(top);
 if(img){const im=document.createElement('img');im.src=img;im.className='preview-img';im.style.cssText='width:100%;height:180px;object-fit:cover;border-radius:10px;margin-top:6px';d.appendChild(im);}
 const fileInput=document.createElement('input');fileInput.type='file';fileInput.className='input var-file';fileInput.accept='image/*';fileInput.style.display='none';fileInput.id=id;fileInput.onchange=()=>previewNew(fileInput);
 const label=document.createElement('label');label.htmlFor=id;label.className='file-btn';label.innerText=img?'📸 Ganti Foto Warna':'📸 Pilih Foto Warna';
 const hidden=document.createElement('input');hidden.type='hidden';hidden.className='var-old-url';hidden.value=img||'';
 d.appendChild(fileInput);d.appendChild(label);d.appendChild(hidden);$("varInputs").appendChild(d);
}
window.previewNew=(input)=>{const slot=input.closest('.slot');const file=input.files[0];if(!file)return;const url=URL.createObjectURL(file);let img=slot.querySelector('.preview-img');if(!img){img=document.createElement('img');img.className='preview-img';img.style.cssText='width:100%;height:180px;object-fit:cover;border-radius:10px;margin-top:6px';slot.insertBefore(img,input);}img.src=url;slot.querySelector('.var-old-url').value='';};
$("btnAddVar").onclick=()=>addVarRow();
async function loadCats(){const {data}=await supabaseClient.from('categories').select('*');if(!data)return;$("catList").innerHTML=data.map(c=>'<span class="cat">'+c.name+' <b style="color:#B42318;cursor:pointer" onclick="delCat(\''+c.id+'\')">x</b></span>').join('');$("pCat").innerHTML='<option value="">Pilih Kategori</option>'+data.map(c=>'<option>'+c.name+'</option>').join('');}

window.delCat=(id)=>{showConfirm('Hapus Kategori?','',async()=>{await supabaseClient.from('categories').delete().eq('id',id);loadCats();showToast('✅ Kategori terhapus');});};
function renderKoleksi(){let html='';koleksiSlots.forEach((v,i)=>{const isUrl=String(v).startsWith('http')||String(v).startsWith('data:');const img=isUrl?v:(allVariants.find(x=>String(x.id)===String(v))?.image_url||'');html+='<div class="koleksi-slot"><div style="display:flex;justify-content:space-between"><span class="small">Slot '+(i+1)+'</span><button class="btn-del" onclick="hapusKoleksi('+i+')">X</button></div>'+(isUrl?'<img src="'+v+'" style="width:100%;height:80px;object-fit:cover;border-radius:8px;margin-top:4px"><input type="hidden" id="koleksi'+i+'" value="'+v+'">':'<select id="koleksi'+i+'" class="input" onchange="ubahKoleksi('+i+',this.value)"><option value="">Pilih warna</option>'+allVariants.map(x=>'<option value="'+x.id+'" '+(String(x.id)===String(v)?'selected':'')+'>'+x.color_name+'</option>').join('')+'</select>')+'</div>';});$("koleksi4Wrap").innerHTML=html+'<button class="btn" style="background:#fff;color:#8C5A2B;border:1px dashed #8C5A2B;grid-column:1/-1" onclick="tambahKoleksi()">+ Tambah Foto Koleksi</button>';}
window.tambahKoleksi=()=>{koleksiSlots.push("");renderKoleksi();};window.hapusKoleksi=(i)=>{koleksiSlots.splice(i,1);if(koleksiSlots.length==0)koleksiSlots=[""];renderKoleksi();};window.ubahKoleksi=(i,val)=>{koleksiSlots[i]=val;};
$("btnKoleksiGaleri").onclick=async()=>{const files=$("koleksiGaleri").files;if(!files.length){showToast('Pilih foto dulu',true);return;}for(let f of files){const b=await toBase64(f);koleksiSlots.push(b);}renderKoleksi();};
function renderUndertone(){let html='';undertoneSlots.forEach((url,i)=>{html+='<div class="koleksi-slot"><div style="display:flex;justify-content:space-between"><span class="small">Foto '+(i+1)+'</span><button class="btn-del" onclick="hapusUndertone('+i+')">X</button></div><img src="'+url+'" style="width:100%;height:100px;object-fit:cover;border-radius:10px;margin-top:6px;'+(url?'':'display:none')+'"><input type="file" class="input" style="margin-top:6px" onchange="gantiUndertone('+i+',this)"></div>';});$("undertoneWrap").innerHTML=html;}
window.hapusUndertone=(i)=>{undertoneSlots.splice(i,1);if(undertoneSlots.length==0)undertoneSlots=[""];renderUndertone();};
window.gantiUndertone=async(i,input)=>{const f=input.files[0];if(!f)return;undertoneSlots[i]=await toBase64(f);renderUndertone();};
$("btnAddUnder").onclick=()=>{undertoneSlots.push("");renderUndertone();};
$("btnUnderGaleri").onclick=async()=>{const files=$("underGaleri").files;if(!files.length){showToast('Pilih foto dulu',true);return;}for(let f of files){const b=await toBase64(f);undertoneSlots.push(b);}renderUndertone();};
function renderFaq(){let h='';faqSlots.forEach((f,i)=>{h+='<div style="background:#FFFCF9;border:1px solid #EEE6DF;border-radius:12px;padding:10px;margin:6px 0"><div style="display:flex;justify-content:space-between"><span class="small">FAQ '+(i+1)+'</span><button class="btn-del" onclick="hapusFaq('+i+')">X</button></div><input id="faqQ'+i+'" class="input" placeholder="Pertanyaan" value="'+escapeHtml(f.q)+'"><textarea id="faqA'+i+'" class="input" rows="2">'+escapeHtml(f.a)+'</textarea></div>';});$("faqWrap").innerHTML=h;}

async function loadProducts(){const {data:prods}=await supabaseClient.from('products').select('*').order('id',{ascending:false});const {data:vars}=await supabaseClient.from('product_variants').select('*');allVariants=vars||[];window._p=prods||[];$("prodCount").innerText=window._p.length+' produk';$("list").innerHTML=window._p.map(p=>'<div class="prod-card"><img class="prod-img" src="'+p.image_url+'"><div style="padding:8px"><div style="font-size:12px;font-weight:700">'+escapeHtml(p.name)+'</div><div style="font-size:13px;font-weight:800">Rp'+Number(p.price).toLocaleString('id-ID')+'</div><button class="btn" style="margin-top:6px;padding:8px;font-size:11px" onclick="editP(\''+p.id+'\')">EDIT</button><button class="btn" style="margin-top:4px;padding:8px;font-size:11px;background:#FFF1F1;color:#B42318;border:1px solid #FECACA" onclick="delP(\''+p.id+'\')">HAPUS</button></div></div>').join('');renderKoleksi();}
window.editP=async(id)=>{const p=window._p.find(x=>String(x.id)===String(id));if(!p)return;$("editId").value=p.id;$("pName").value=p.name;$("pPrice").value=p.price;$("pCat").value=p.category||'';$("varInputs").innerHTML='';const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id);if(vars&&vars.length>0){vars.forEach(v=>addVarRow(v.color_name,v.image_url));}else{initVarRows();}showToast('✏️ Edit: '+p.name+' ('+(vars?vars.length:0)+' warna) - bisa tambah sepuasnya');window.scrollTo({top:800,behavior:'smooth'});};

$("btnSaveProd").onclick=async()=>{
 const name=$("pName").value.trim();const price=Number($("pPrice").value);
 if(!name||!price){showToast('Isi nama & harga dulu',true);return;}
 const rows=[...document.querySelectorAll('#varInputs.slot')];
 console.log('V30 TERDETEKSI:',rows.length);
 let finalVars=[];
 for(let r of rows){
  const col=r.querySelector('.var-color')?.value.trim().toUpperCase();
  if(!col) continue;
  const file=r.querySelector('.var-file')?.files[0];
  let oldUrl=r.querySelector('.var-old-url')?.value||r.querySelector('.preview-img')?.src||'';
  if(file){
   const fn='var_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';
   $("saveStatus").innerText='⏳ Upload '+col+'...';
   const {error}=await supabaseClient.storage.from('products').upload(fn,file,{upsert:true});
   if(error){showToast('Upload '+col+' gagal: '+error.message,true);$("saveStatus").innerText='❌ Upload gagal';return;}
   const url=supabaseClient.storage.from('products').getPublicUrl(fn).data.publicUrl;
   finalVars.push({color_name:col,image_url:url});
  }else if(oldUrl && oldUrl.startsWith('http')){
   finalVars.push({color_name:col,image_url:oldUrl});
  }
 }
 if(finalVars.length==0){showToast('Minimal 1 warna + foto',true);$("saveStatus").innerText='❌ 0 warna valid - klik Pilih Foto';return;}
 $("saveStatus").innerText='⏳ Menyimpan '+finalVars.length+' warna...';
 try{
  let pid=$("editId").value;
  if(pid){await supabaseClient.from('products').update({name,price,image_url:finalVars[0].image_url,category:$("pCat").value||null}).eq('id',pid);await supabaseClient.from('product_variants').delete().eq('product_id',pid);}
  else{const {data,error}=await supabaseClient.from('products').insert({name,price,image_url:finalVars[0].image_url,category:$("pCat").value||null}).select().single();if(error) throw error;pid=data.id;}

 }catch(e){showToast('❌ '+e.message,true);$("saveStatus").innerText='❌ '+e.message;}
};

$("filePC").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;pcBase=await toBase64(f);$("prevPC").src=pcBase;$("prevPC").style.display='block';});
$("fileHP").addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;hpBase=await toBase64(f);$("prevHP").src=hpBase;$("prevHP").style.display='block';});
$("btnSaveToko").onclick=async()=>{const ups=[];if($("storeName").value)ups.push({key:'store_name',value:$("storeName").value});if($("waNumber").value)ups.push({key:'wa_number',value:$("waNumber").value});ups.push({key:'toko_origin_id',value:tokoOriginId},{key:'toko_origin_label',value:tokoOriginLabel});await supabaseClient.from('settings').upsert(ups,{onConflict:'key'});if(pcBase){const pcBlob=await (await fetch(pcBase)).blob();const pcName='pc_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(pcName,pcBlob);const pcUrl=supabaseClient.storage.from('banners').getPublicUrl(pcName).data.publicUrl;let hpUrl=pcUrl;if(hpBase){const hpBlob=await (await fetch(hpBase)).blob();const hpName='hp_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(hpName,hpBlob);hpUrl=supabaseClient.storage.from('banners').getPublicUrl(hpName).data.publicUrl;}await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').insert({title:$("bTitle").value||'Promo',image_url:pcUrl,image_mobile_url:hpUrl,link_url:$("bLink").value||'produk.html',is_active:true});}showToast('✅ Toko tersimpan');loadBanners();};
$("btnSaveHome").onclick=async()=>{const k=koleksiSlots.filter(Boolean);const u=undertoneSlots.filter(Boolean);$("homeStatus").innerText='⏳ Menyimpan...';try{let finalK=[];for(let v of k){if(String(v).startsWith('data:')){const blob=await (await fetch(v)).blob();const fn='koleksi_'+Date.now()+'_'+Math.random().toString(36).slice(2)+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);finalK.push(supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl);}else finalK.push(v);}let finalU=[];for(let v of u){if(String(v).startsWith('data:')){const blob=await (await fetch(v)).blob();const fn='undertone_'+Date.now()+'.jpg';await supabaseClient.storage.from('banners').upload(fn,blob);finalU.push(supabaseClient.storage.from('banners').getPublicUrl(fn).data.publicUrl);}else if(String(v).startsWith('http'))finalU.push(v);}await supabaseClient.from('settings').upsert([{key:'home_koleksi_terlaris',value:JSON.stringify(finalK)},{key:'home_undertone_images',value:JSON.stringify(finalU)},{key:'home_koleksi_title',value:$("homeKoleksiTitle").value},{key:'home_undertone_title',value:$("homeUnderTitle").value},{key:'home_undertone_desc',value:$("homeUnderDesc").value},{key:'home_undertone_list',value:$("homeUnderList").value}],{onConflict:'key'});$("homeStatus").innerText='✅ Tersimpan';showToast('✅ Tersimpan');koleksiSlots=finalK;undertoneSlots=finalU.length?finalU:[""];renderKoleksi();renderUndertone();}catch(e){$("homeStatus").innerText='❌ '+e.message;}};
async function loadBanners(){const {data}=await supabaseClient.from('banners').select('*').order('id',{ascending:false});$("bannerList").innerHTML=(data||[]).map(b=>'<div style="border:1px solid #EEE6DF;border-radius:12px;display:flex;gap:6px;padding:8px;margin-top:6px"><img src="'+b.image_url+'" style="width:56px;height:36px;object-fit:cover;border-radius:8px"><div style="flex:1;font-size:11px"><b>'+b.title+'</b><br><span style="color:'+(b.is_active?'#16A34A':'#999')+'">'+(b.is_active?'✅ AKTIF':'Nonaktif')+'</span></div><button class="btn" style="width:auto;padding:6px 10px;font-size:10px" onclick="aktifkanBanner(\''+b.id+'\')">Aktif</button><button class="btn" style="width:auto;padding:6px 10px;background:#B42318;font-size:10px" onclick="hapusBanner(\''+b.id+'\')">Hapus</button></div>').join('');}
window.aktifkanBanner=async(id)=>{await supabaseClient.from('banners').update({is_active:false}).eq('is_active',true);await supabaseClient.from('banners').update({is_active:true}).eq('id',id);loadBanners();};
window.hapusBanner=(id)=>{showConfirm('Hapus Banner?','',async()=>{await supabaseClient.from('banners').delete().eq('id',id);loadBanners();});};
init();
</script></body></html>
