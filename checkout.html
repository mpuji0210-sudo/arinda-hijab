<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - ARINDA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#FAFAFA]">
<div class="max-w-[460px] mx-auto bg-white border p-5 m-3">
  <div style="font-family:serif;letter-spacing:7px;font-size:20px">ARINDA</div>
  <div style="font-size:8px;letter-spacing:4px;opacity:.4">LANGKAH 1 - ALAMAT</div>

  <div id="ringkasan" class="bg-[#FAFAFA] border p-3 my-4 text-[11px]"></div>

  <input id="nama" placeholder="Nama Lengkap" style="width:100%;border:1px solid #000;padding:14px;margin-bottom:10px">
  <input id="wa" placeholder="No WA" style="width:100%;border:1px solid #000;padding:14px;margin-bottom:10px">
  <input id="kota" placeholder="Kota / Kecamatan" style="width:100%;border:1px solid #000;padding:14px;margin-bottom:10px">
  <textarea id="alamat" placeholder="Alamat Lengkap" style="width:100%;border:1px solid #000;padding:14px;margin-bottom:10px"></textarea>

  <button id="btnBayar" onclick="prosesCheckout()" class="w-full bg-black text-white py-4 text-[10px] tracking-[3px]">LANJUT KE PEMBAYARAN</button>
  <div id="status" style="font-size:10px;margin-top:10px;text-align:center"></div>
</div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);

const cart = JSON.parse(localStorage.getItem('arinda_cart2')||'[]');
const ongkir = Number(localStorage.getItem('selectedOngkirCost')||0);
const kotaOngkir = localStorage.getItem('selectedOngkirCity')||'';
let subtotal=0; cart.forEach(i=>subtotal+=i.harga*i.qty);
let total=subtotal+ongkir;

document.getElementById('ringkasan').innerHTML=
  cart.map(i=>`• ${i.warna} x${i.qty} = Rp${(i.harga*i.qty).toLocaleString('id-ID')}`).join('<br>')+
  `<br><br>Subtotal: Rp${subtotal.toLocaleString('id-ID')}<br>Ongkir ${kotaOngkir}: Rp${ongkir.toLocaleString('id-ID')}<br><b>TOTAL: Rp${total.toLocaleString('id-ID')}</b>`;

async function prosesCheckout(){
  const nama=document.getElementById('nama').value.trim();
  const wa=document.getElementById('wa').value.trim();
  const kota=document.getElementById('kota').value.trim();
  const alamat=document.getElementById('alamat').value.trim();
  if(!nama||!wa||!kota||!alamat){alert('Lengkapi semua!');return;}

  document.getElementById('btnBayar').innerText='MENYIMPAN PESANAN...';
  document.getElementById('btnBayar').disabled=true;

  const orderData={
    customer_name:nama,
    wa:wa,
    kota:kota,
    alamat:alamat,
    total:total,
    total_price:total,
    kota_tujuan:kotaOngkir||kota,
    ongkir:ongkir,
    items:cart,
    status:'MENUNGGU_BAYAR',
    created_at:new Date().toISOString()
  };

  try{
    const {data, error} = await supa.from('orders').insert([orderData]).select();
    if(error) throw error;

    const newId=data[0].id;
    localStorage.setItem('arinda_last_order_id', newId);
    localStorage.setItem('arinda_last_order', JSON.stringify({nama,kota,alamat,total,cart,kota_tujuan:kotaOngkir}));
    document.getElementById('status').innerText='Berhasil! Mengalihkan ke pembayaran...';

    // Lempar ke bayar.html dengan ID beneran
    setTimeout(()=>{
      window.location.href=`bayar.html?total=${total}&nama=${encodeURIComponent(nama)}&kota=${encodeURIComponent(kota)}`;
    },800);

  }catch(e){
    console.log(e);
    // Kalau gagal lagi, tetap lanjut tapi kasih tau
    document.getElementById('status').innerText='Gagal simpan ke pusat: '+e.message+' - Tetap lanjut...';
    const tempId='temp-'+Date.now();
    localStorage.setItem('arinda_last_order_id', tempId);
    localStorage.setItem('arinda_last_order', JSON.stringify({nama,kota,alamat,total,cart}));
    setTimeout(()=>{window.location.href=`bayar.html?total=${total}&nama=${encodeURIComponent(nama)}&kota=${encodeURIComponent(kota)}`},1000);
  }
}
</script>
</body></html>
