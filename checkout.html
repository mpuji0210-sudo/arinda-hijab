<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://qjgevvizqeebtdqcbqmt.supabase.co";
const SUPABASE_KEY="sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19";
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const NO_WA_ARINDA="6285178098354"; // <-- GANTI NOMOR WA KAKAK DISINI

function beliWA(namaProduk, harga){
  const nama = prompt("Nama kakak siapa?");
  if(!nama) return;
  const kota = prompt("Kota Tujuan (contoh: Papua / Bandung)?");
  if(!kota) return;
  const qty = parseInt(prompt("Mau berapa pcs?", "1")||"1");
  const ongkir = kota.toLowerCase().includes('papua') ? 40000 : 17000;
  const jenisOngkir = ongkir==40000 ? "YES - 1 HARI" : "REG (8 day)";
  const subtotal = harga*qty;
  const total = subtotal + ongkir;

  // 1. Simpan ke Supabase biar masuk admin
  supa.from('orders').insert([{
    customer_name: nama,
    alamat: '-',
    kota_tujuan: kota,
    total: total,
    total_price: total,
    status: 'MENUNGGU PEMBAYARAN'
  }]);

  // 2. Format WA persis kayak foto kakak
  const pesan = `Halo ARINDA\nSaya mau pesan:\n- ${namaProduk} x${qty} = Rp${subtotal.toLocaleString('id-ID')}\n\nKota Tujuan: ${kota}\nSUBTOTAL Rp${subtotal.toLocaleString('id-ID')}\nONGKIR ${jenisOngkir}: Rp${ongkir.toLocaleString('id-ID')}\nTOTAL Rp${total.toLocaleString('id-ID')}`;
  
  window.open(`https://wa.me/${NO_WA_ARINDA}?text=${encodeURIComponent(pesan)}`, '_blank');
}
</script>
