<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';</script>
<style>body{margin:0;background:#fff;color:#000;font-family:'Inter',sans-serif}*{box-sizing:border-box}.btn{width:100%;height:52px;background:#000;color:#fff;border:none;font-size:10px;letter-spacing:3px;cursor:pointer}</style>
</head><body>
<nav style="position:sticky;top:0;background:#fff;border-bottom:1px solid #E9E9E9;z-index:9"><div style="max-width:480px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between"><div style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:18px">ARINDA</div><div style="font-size:8px;letter-spacing:3px;opacity:.4">CHECKOUT</div></div></nav>
<div style="max-width:480px;margin:0 auto;padding:20px 16px">
<div id="ringkasan" style="border:1px solid #E9E9E9;padding:16px;background:#FAFAFA"></div>
<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">
<input id="nama" placeholder="Nama Lengkap" style="width:100%;height:52px;padding:0 16px;border:1px solid #000;outline:none">
<input id="wa" placeholder="No WA 08xx" style="width:100%;height:52px;padding:0 16px;border:1px solid #000;outline:none" inputmode="numeric">
<input id="kota" placeholder="Kota tujuan" readonly style="width:100%;height:52px;padding:0 16px;background:#F9F6F1;border:1px solid #E8E0D0;font-weight:600">
<textarea id="alamat" placeholder="Alamat lengkap" style="width:100%;height:100px;padding:14px 16px;border:1px solid #000;outline:none"></textarea>
</div>
<button onclick="bukaModal()" style="width:100%;margin-top:16px;height:52px;background:#000;color:#fff;border:none;font-size:10px;letter-spacing:3px">LANJUT KE PEMBAYARAN →</button>
<div id="errorMsg" style="display:none;margin-top:12px;text-align:center;font-size:11px;color:#B42318;background:#FFF5F5;border:1px solid #FECDCA;padding:10px"></div>
</div>

<div id="modalCheckout" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:99;align-items:center;justify-content:center;padding:16px"><div style="background:#fff;width:100%;max-width:400px;padding:20px;border:1px solid #E9E9E9"><div style="display:flex;justify-content:space-between"><b style="letter-spacing:2px;font-size:11px">KONFIRMASI PESANAN</b><button onclick="tutupModal()" style="border:none;background:none;font-size:22px">×</button></div><div id="modalContent" style="margin-top:12px;background:#FAFAFA;border:1px solid #F2F2F2;padding:12px;font-size:12px"></div><div style="display:flex;justify-content:space-between;margin-top:12px;font-weight:700"><span>TOTAL BAYAR</span><span id="modalTotal"></span></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="tutupModal()" style="flex:1;height:44px;background:#fff;border:1px solid #000">KEMBALI</button><button onclick="prosesCheckout()" id="btnKonfirm" style="flex:1;height:44px;background:#000;color:#fff;border:none;font-size:9px;letter-spacing:2px">YA, KONFIRMASI WA</button></div></div></div>

<script>
const supa=supabase.createClient(SUPA_URL,SUPA_KEY);
let cart=[];try{cart=JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){cart=[]}
let ongkirData=null;try{ongkirData=JSON.parse(sessionStorage.getItem('checkout_ongkir')||'null');if(!ongkirData)ongkirData=JSON.parse(localStorage.getItem('checkout_ongkir_backup')||'null');}catch(e){}
let ongkir=Number(ongkirData?.cost||0);const kotaOngkir=ongkirData?.city||'';const serviceLabel=ongkirData?.service||'';const originId=ongkirData?.origin_id||'17523';const destId=ongkirData?.destination_id||'';
const formatRp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function renderRingkasan(){if(!cart.length){document.getElementById('ringkasan').innerHTML='<div style="text-align:center;opacity:.4">KERANJANG KOSONG</div>';return;}let sub=0;cart.forEach(i=>sub+=Number(i.harga)*Number(i.qty));let tot=sub+ongkir;document.getElementById('ringkasan').innerHTML=`${cart.map(i=>`<div style="display:flex;justify-content:space-between;margin-top:6px;font-size:12px"><span>${esc(i.warna)} x${i.qty}</span><span>${formatRp(i.harga*i.qty)}</span></div>`).join('')}<div style="border-top:1px solid #E9E9E9;margin-top:12px;padding-top:10px;font-size:11px"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>${formatRp(sub)}</span></div><div style="display:flex;justify-content:space-between;margin-top:6px"><span>Ongkir ${esc(kotaOngkir)} ${esc(serviceLabel)}</span><span>${formatRp(ongkir)}</span></div><div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:10px"><span>TOTAL</span><span>${formatRp(tot)}</span></div></div>`;document.getElementById('modalTotal').innerText=formatRp(tot);}
renderRingkasan();document.getElementById('kota').value=kotaOngkir;
let tempData={};
function bukaModal(){
  const nama=document.getElementById('nama').value.trim();
  const wa=document.getElementById('wa').value.trim().replace(/[^0-9]/g,'');
  const alamat=document.getElementById('alamat').value.trim();
  if(!nama||nama.length<3||!wa||wa.length<10||!alamat||alamat.length<10){
    document.getElementById('errorMsg').style.display='block';document.getElementById('errorMsg').innerText='Lengkapi nama, WA, alamat dulu ya kak';return;
  }
  if(!ongkir||ongkir<5000){document.getElementById('errorMsg').style.display='block';document.getElementById('errorMsg').innerText='Ongkir belum ada - balik ke produk & cek ongkir dulu';return;}
  document.getElementById('errorMsg').style.display='none';
  let sub=0;cart.forEach(i=>sub+=Number(i.harga)*Number(i.qty));
  tempData={nama,wa,alamat,total:sub+ongkir,subtotal:sub};
  document.getElementById('modalContent').innerHTML=`<div>Nama <b>${esc(nama)}</b></div><div>WA <b>${esc(wa)}</b></div><div>Alamat <b>${esc(alamat)}</b></div><div>Tujuan <b>${esc(kotaOngkir)} - ${esc(serviceLabel)}</b></div>`;
  document.getElementById('modalCheckout').style.display='flex';
}
function tutupModal(){document.getElementById('modalCheckout').style.display='none';}

// INI YANG BIKIN STOK OTOMATIS BERKURANG TANPA ALERT
async function kurangiStokOtomatis(){
  for(const item of cart){
    try{
      const colorName=item.warna.split(' - ').pop().trim();
      const prodName=item.warna.split(' - ')[0].trim();
      let pid=null;
      const {data:prod}=await supa.from('products').select('id').ilike('name',`%${prodName}%`).limit(1).maybeSingle();
      if(prod) pid=prod.id;
      let q=supa.from('product_variants').select('id,stock').ilike('color_name',`%${colorName}%`);
      if(pid) q=q.eq('product_id',pid);
      const {data:v}=await q.limit(1).maybeSingle();
      if(v){
        const newStock=Math.max(0,Number(v.stock)-Number(item.qty));
        await supa.from('product_variants').update({stock:newStock}).eq('id',v.id);
      }
    }catch(e){}
  }
}

async function prosesCheckout(){
  const {nama,wa,alamat,total,subtotal}=tempData;
  const btn=document.getElementById('btnKonfirm');btn.innerText='MENYIMPAN...';btn.disabled=true;
  try{
    const {data,error}=await supa.from('orders').insert([{customer_name:nama,customer_phone:wa,alamat:alamat,kota:kotaOngkir,total:total,subtotal:subtotal,ongkir:ongkir,items:cart,status:'MENUNGGU_BAYAR',origin_id:originId,destination_id:destId}]).select();
    if(error) throw error;
    await kurangiStokOtomatis(); // <-- STOK BERKURANG OTOMATIS DI SINI, TANPA ALERT
    localStorage.removeItem('arinda_cart2');
    localStorage.setItem('arinda_last_order_id',data[0].id);
    localStorage.setItem('arinda_total',String(total));
    window.location.href='bayar.html';
  }catch(e){
    document.getElementById('errorMsg').style.display='block';document.getElementById('errorMsg').innerText='Gagal: '+e.message;
    btn.innerText='YA, KONFIRMASI WA';btn.disabled=false;
  }
}
</script></body></html>
