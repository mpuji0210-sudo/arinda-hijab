<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - ARINDA</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
body{font-family:'Inter',sans-serif;background:#FFFFFF;color:#000}
.font-serif{font-family:'Cormorant Garamond',serif}
.input-clean{border:1px solid #000;background:#fff;transition:all .2s}
.input-clean:focus{border-color:#000;outline:none}
</style>
</head>
<body>

<!-- HEADER SAMA KAYAK FILE PRODUK -->
<nav style="position:sticky;top:0;z-index:99;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #E9E9E9">
  <div style="max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center">
    <div>
      <div style="font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px">ARINDA</div>
      <span style="display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px">HIJAB PREMIUM</span>
    </div>
  </div>
</nav>

<div style="max-width:480px;margin:0 auto;padding:24px 16px 40px">

  <!-- RINGKASAN CLEAN -->
  <div id="ringkasan" style="border:1px solid #E9E9E9;padding:16px;background:#fff"></div>

  <!-- FORM CLEAN TANPA TULISAN RAME -->
  <div style="margin-top:24px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <input id="nama" placeholder="Nama Lengkap" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <input id="wa" placeholder="No WA" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <input id="kota" placeholder="Kota / Kecamatan" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <textarea id="alamat" placeholder="Alamat Lengkap (Jalan, No Rumah, RT/RW)" class="input-clean" style="width:100%;padding:14px 16px;font-size:13px;height:100px;resize:none"></textarea>
    </div>
    <p id="errorMsg" style="display:none;margin-top:12px;text-align:center;font-size:11px;color:#B42318;background:#FFF5F5;border:1px solid #FECDCA;padding:10px"></p>
    <button id="mainBtn" onclick="bukaModal()" style="width:100%;margin-top:16px;height:52px;background:#000;color:#fff;border:none;font-size:10px;letter-spacing:3px">LANJUT KE PEMBAYARAN →</button>
    <p id="status" style="font-size:11px;text-align:center;margin-top:8px;opacity:.4"></p>
  </div>
</div>

<!-- FOOTER SAMA KAYAK FILE PRODUK -->
<footer style="margin-top:32px;padding:48px 16px 40px;text-align:center;border-top:1px solid #E9E9E9;background:#FFFFFF">
  <div style="font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:18px">ARINDA</div>
  <div style="font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:6px">HIJAB PREMIUM</div>
  <div style="margin-top:18px;font-size:8px;letter-spacing:3px;opacity:.3">© 2026 ARINDA HIJAB PREMIUM</div>
</footer>

<!-- MODAL KONFIRMASI CLEAN -->
<div id="modalCheckout" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99;padding:16px">
  <div style="background:#fff;width:100%;max-width:400px;border:1px solid #E9E9E9;padding:20px">
    <div style="display:flex;justify-content:space-between"><b style="font-family:'Cormorant Garamond';font-size:18px;letter-spacing:1px">KONFIRMASI PESANAN</b><button onclick="tutupModal()" style="border:none;background:none;font-size:20px">×</button></div>
    <div id="modalContent" style="margin-top:16px;border:1px solid #F2F2F2;padding:12px;background:#FAFAFA"></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-weight:600"><span>TOTAL</span><span id="modalTotal"></span></div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button onclick="tutupModal()" style="flex:1;height:44px;background:#fff;border:1px solid #000;font-size:9px;letter-spacing:2px">KEMBALI</button>
      <button onclick="prosesCheckout()" id="btnKonfirm" style="flex:1;height:44px;background:#000;color:#fff;border:1px solid #000;font-size:9px;letter-spacing:2px">YA, BAYAR</button>
    </div>
  </div>
</div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);
const cart = JSON.parse(localStorage.getItem('arinda_cart2')||'[]');
const ongkir = Number(localStorage.getItem('selectedOngkirCost')||localStorage.getItem('arinda_ongkir_cost')||0);
const kotaOngkir = localStorage.getItem('selectedOngkirCity')||localStorage.getItem('arinda_ongkir_service')||'';
let subtotal=0; cart.forEach(i=>subtotal+=i.harga*i.qty);
let total=subtotal+ongkir;
const formatRp=n=>'Rp'+n.toLocaleString('id-ID');

document.getElementById('ringkasan').innerHTML=`
  <div style="font-size:9px;letter-spacing:3px;opacity:.4;margin-bottom:12px">${cart.length} ITEM</div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:12px">${cart.map(i=>`<div style="display:flex;justify-content:space-between"><span>${i.warna} x${i.qty}</span><span>${formatRp(i.harga*i.qty)}</span></div>`).join('') || '<div style="opacity:.4">Keranjang kosong</div>'}</div>
  <div style="border-top:1px solid #E9E9E9;margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:11px">
    <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Subtotal</span><span>${formatRp(subtotal)}</span></div>
    <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Ongkir ${kotaOngkir||''}</span><span>${formatRp(ongkir)}</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:8px"><span>TOTAL</span><span>${formatRp(total)}</span></div>
  </div>
`;
document.getElementById('modalTotal').innerText=formatRp(total);

let tempData={};
function bukaModal(){
  const nama=document.getElementById('nama').value.trim();
  const wa=document.getElementById('wa').value.trim();
  const kota=document.getElementById('kota').value.trim();
  const alamat=document.getElementById('alamat').value.trim();
  const err=document.getElementById('errorMsg');
  if(!nama||!wa||!kota||!alamat){
    err.innerText='Lengkapi Nama, WA, Kota, Alamat dulu kak';
    err.style.display='block'; return;
  }
  err.style.display='none';
  tempData={nama,wa,kota,alamat};
  document.getElementById('modalContent').innerHTML=`
    <div style="font-size:12px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Nama</span><b>${nama}</b></div>
      <div style="display:flex;justify-content:space-between"><span style="opacity:.5">WA</span><b>${wa}</b></div>
      <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Kota</span><b>${kota}</b></div>
      <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Alamat</span><b style="text-align:right;max-width:60%">${alamat}</b></div>
    </div>
  `;
  document.getElementById('modalCheckout').style.display='flex';
}
function tutupModal(){document.getElementById('modalCheckout').style.display='none';}
async function prosesCheckout(){
  const {nama,wa,kota,alamat}=tempData;
  document.getElementById('btnKonfirm').innerText='MENYIMPAN...';document.getElementById('btnKonfirm').disabled=true;
  const orderData={customer_name:nama,wa,kota,alamat,total,total_price:total,kota_tujuan:kotaOngkir||kota,ongkir,items:cart,status:'MENUNGGU_BAYAR',created_at:new Date().toISOString()};
  try{
    const {data}=await supa.from('orders').insert([orderData]).select();
    if(data&&data[0]) localStorage.setItem('arinda_last_order_id',data[0].id);
  }catch(e){}
  localStorage.setItem('checkout_nama',nama);
  window.location.href=`bayar.html?total=${total}&nama=${encodeURIComponent(nama)}&kota=${encodeURIComponent(kota)}`;
}
</script>
</body></html>
