<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout - ARINDA HIJAB</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-[#FAFAFA]">
<div class="max-w-[460px] mx-auto bg-white border border-[#E9E9E9] m-3 p-5">
  <div style="font-family:serif;letter-spacing:7px;font-size:20px">ARINDA</div>
  <div style="font-size:8px;letter-spacing:4px;opacity:.4">LANGKAH 1 - CHECKOUT KE BAYAR</div>

  <div id="ringkasan" class="bg-[#FAFAFA] border p-3 my-4 text-[11px] leading-6">Loading...</div>

  <input id="customer_name" placeholder="NAMA LENGKAP" class="w-full border border-black p-3 mb-3 text-[11px] outline-none">
  <input id="kota_tujuan" placeholder="KOTA TUJUAN (Papua / Surabaya)" class="w-full border border-black p-3 mb-3 text-[11px] outline-none">
  <textarea id="alamat" placeholder="ALAMAT LENGKAP" rows="3" class="w-full border border-black p-3 mb-3 text-[11px] outline-none"></textarea>

  <div class="flex justify-between text-[12px]"><span>SUBTOTAL</span><b id="subEl">Rp0</b></div>
  <div class="flex justify-between text-[12px] mt-1"><span>ONGKIR <small id="layananEl" class="opacity-50"></small></span><span id="ongkirEl">Rp0</span></div>
  <div class="flex justify-between text-[15px] font-bold mt-2 pt-2 border-t border-black"><span>TOTAL</span><span id="totalEl">Rp0</span></div>

  <button id="btn" onclick="lanjutBayar()" class="w-full bg-black text-white py-4 mt-5 text-[10px] tracking-[3px]">LANJUT KE PEMBAYARAN</button>
  <div style="text-align:center;font-size:8px;opacity:.3;margin-top:8px">WA Arinda: 085178098354</div>
</div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);

let cart = JSON.parse(localStorage.getItem('arinda_cart2')||'[]');
let ongkir = parseInt(localStorage.getItem('arinda_ongkir_cost')||'0');
let layanan = localStorage.getItem('arinda_ongkir_service')||'REG';
let lastCity = localStorage.getItem('arinda_last_city')||'';
let subtotal = 0; cart.forEach(i=>subtotal+= (i.harga*(i.qty||1)) );

document.getElementById('ringkasan').innerHTML = cart.length? cart.map(i=>`• ${i.warna} x${i.qty||1} = Rp${(i.harga*(i.qty||1)).toLocaleString('id-ID')}`).join('<br>') : 'Keranjang kosong - buka produk.html dulu kak';
document.getElementById('subEl').innerText='Rp'+subtotal.toLocaleString('id-ID');
document.getElementById('ongkirEl').innerText='Rp'+ongkir.toLocaleString('id-ID');
document.getElementById('totalEl').innerText='Rp'+(subtotal+ongkir).toLocaleString('id-ID');
document.getElementById('layananEl').innerText=layanan? '('+layanan+')' : '';
document.getElementById('kota_tujuan').value=lastCity;

async function lanjutBayar(){
  const nama=document.getElementById('customer_name').value.trim();
  const kota=document.getElementById('kota_tujuan').value.trim();
  const alamat=document.getElementById('alamat').value.trim();
  const btn=document.getElementById('btn');
  if(!nama||!kota||!alamat){alert('Isi Nama, Kota Tujuan, Alamat dulu kak');return;}
  if(!cart.length){alert('Keranjang kosong kak');return;}

  btn.innerText='MENYIMPAN KE ADMIN...'; btn.disabled=true;
  const total=subtotal+ongkir;

  // Simpan ke Supabase biar admin-orders.html gak --- lagi
  const {data,error} = await supa.from('orders').insert([{
    customer_name:nama,
    alamat:alamat,
    kota_tujuan:kota,
    kota:kota,
    total:total,
    total_price:total,
    harga_total:total,
    ongkir:ongkir,
    status:'MENUNGGU PEMBAYARAN',
    items:cart
  }]).select();

  if(data && data[0]) localStorage.setItem('arinda_last_order_id', data[0].id);
  localStorage.setItem('arinda_last_order', JSON.stringify({nama,kota,alamat,total,cart}));

  // LOMPAT KE HALAMAN BAYAR
  window.location.href = `bayar.html?total=${total}&nama=${encodeURIComponent(nama)}&kota=${encodeURIComponent(kota)}`;
}
</script>
</body>
</html>
