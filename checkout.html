<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Checkout</title>
<meta name="robots" content="noindex, nofollow">
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif;background:#fff;color:#000}.font-serif{font-family:'Cormorant Garamond',serif}.input-clean{border:1px solid #000;background:#fff}.input-clean:focus{outline:none}</style>
</head><body>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
// ANTI-KEDIP STORE
const STORE_CACHED = localStorage.getItem('store_name_cache') || localStorage.getItem('checkout_store') || 'ARINDA';
document.title='Checkout - '+STORE_CACHED;
</script>
<nav style="position:sticky;top:0;z-index:99;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #E9E9E9">
  <div style="max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between">
    <div><div id="navLogo" style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:21px">LOADING</div><span style="display:block;font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px">HIJAB PREMIUM</span></div>
  </div>
</nav>
<div style="max-width:480px;margin:0 auto;padding:24px 16px 40px">
  <div id="ringkasan" style="border:1px solid #E9E9E9;padding:16px;background:#fff"></div>
  <div style="margin-top:24px">
    <div style="display:flex;flex-direction:column;gap:12px">
      <input id="nama" placeholder="Nama Lengkap" maxlength="80" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <input id="wa" placeholder="No WA 08xxxx" maxlength="15" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <input id="kota" placeholder="Kota / Kecamatan" maxlength="60" class="input-clean" style="width:100%;height:52px;padding:0 16px;font-size:13px">
      <textarea id="alamat" placeholder="Alamat Lengkap" maxlength="200" class="input-clean" style="width:100%;padding:14px 16px;font-size:13px;height:100px;resize:none"></textarea>
    </div>
    <p id="errorMsg" style="display:none;margin-top:12px;text-align:center;font-size:11px;color:#B42318;background:#FFF5F5;border:1px solid #FECDCA;padding:10px"></p>
    <button id="mainBtn" onclick="bukaModal()" style="width:100%;margin-top:16px;height:52px;background:#000;color:#fff;border:none;font-size:10px;letter-spacing:3px">LANJUT KE PEMBAYARAN →</button>
    <p id="status" style="font-size:11px;text-align:center;margin-top:8px;opacity:.4"></p>
  </div>
</div>
<footer style="margin-top:32px;padding:48px 16px;text-align:center;border-top:1px solid #E9E9E9"><div id="footLogo" style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:18px">LOADING</div><div style="font-size:7px;letter-spacing:6px;opacity:.4;margin-top:6px">HIJAB PREMIUM</div></footer>
<div id="modalCheckout" style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99;padding:16px">
  <div style="background:#fff;width:100%;max-width:400px;border:1px solid #E9E9E9;padding:20px">
    <div style="display:flex;justify-content:space-between"><b style="font-family:'Cormorant Garamond';font-size:18px">KONFIRMASI PESANAN</b><button onclick="tutupModal()" style="border:none;background:none;font-size:20px">×</button></div>
    <div id="modalContent" style="margin-top:16px;border:1px solid #F2F2F2;padding:12px;background:#FAFAFA"></div>
    <div style="margin-top:12px;display:flex;justify-content:space-between;font-weight:600"><span>TOTAL</span><span id="modalTotal"></span></div>
    <div style="display:flex;gap:8px;margin-top:16px"><button onclick="tutupModal()" style="flex:1;height:44px;background:#fff;border:1px solid #000;font-size:9px">KEMBALI</button><button onclick="prosesCheckout()" id="btnKonfirm" style="flex:1;height:44px;background:#000;color:#fff;border:1px solid #000;font-size:9px">YA, BAYAR</button></div>
  </div>
</div>
<script>
const cart = JSON.parse(localStorage.getItem('arinda_cart2')||'[]');
// BACA ONGKIR BARU + LAMA BIAR KOMPATIBEL
let ongkirData=null; try{ ongkirData=JSON.parse(localStorage.getItem('checkout_ongkir')||'null'); }catch(e){}
const ongkir = Number(ongkirData?.cost || localStorage.getItem('selectedOngkirCost')||localStorage.getItem('arinda_ongkir_cost')||0);
const kotaOngkir = ongkirData?.service? (ongkirData.service+' - '+ongkirData.city) : (localStorage.getItem('selectedOngkirCity')||localStorage.getItem('arinda_ongkir_service')||'');
const originLabel = ongkirData?.origin || localStorage.getItem('store_origin_label') || 'JAKARTA';
let subtotal=0; cart.forEach(i=>subtotal+= Number(i.harga||0)*Number(i.qty||0));
let total=subtotal+ongkir;
const formatRp=n=>'Rp'+Number(n||0).toLocaleString('id-ID');

// APPLY STORE NAME DARI CACHE + SUPABASE
function applyStore(name){
  if(!name) return;
  const up=name.toUpperCase();
  document.getElementById('navLogo').innerText=up;
  document.getElementById('footLogo').innerText=up;
  document.title='Checkout - '+name;
}
applyStore(STORE_CACHED);
(async()=>{
  try{
    const {data}=await supa.from('settings').select('value').eq('key','store_name').single();
    if(data?.value){ applyStore(data.value); localStorage.setItem('store_name_cache', data.value); }
  }catch(e){}
})();

document.getElementById('ringkasan').innerHTML=`
  <div style="font-size:9px;letter-spacing:3px;opacity:.4;margin-bottom:12px">${cart.length} ITEM - dari ${esc(originLabel)}</div>
  <div style="display:flex;flex-direction:column;gap:8px;font-size:12px">${cart.map(i=>`<div style="display:flex;justify-content:space-between"><span>${esc(i.warna)} x${Number(i.qty)}</span><span>${formatRp(Number(i.harga)*Number(i.qty))}</span></div>`).join('') || '<div style="opacity:.4">Keranjang kosong</div>'}</div>
  <div style="border-top:1px solid #E9E9E9;margin-top:12px;padding-top:12px;display:flex;flex-direction:column;gap:4px;font-size:11px">
    <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Subtotal</span><span>${formatRp(subtotal)}</span></div>
    <div style="display:flex;justify-content:space-between"><span style="opacity:.5">Ongkir ${esc(kotaOngkir||'')}</span><span>${formatRp(ongkir)}</span></div>
    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:14px;margin-top:8px"><span>TOTAL</span><span>${formatRp(total)}</span></div>
  </div>
`;
document.getElementById('modalTotal').innerText=formatRp(total);
let tempData={};
async function validasiStok(){
  const err=document.getElementById('errorMsg');
  for(let item of cart){
    let warnaOnly = item.warna.split(' - ').pop().trim();
    try{
      const {data} = await supa.from('product_variants').select('stock,is_available,color_name').ilike('color_name', warnaOnly).limit(1).maybeSingle();
      if(!data) continue;
      if(data.is_available===false || (data.stock!=null && Number(data.stock) < Number(item.qty))){
        err.innerText = `Maaf kak, warna ${esc(warnaOnly)} SISA ${data.stock??0}, gak cukup untuk ${item.qty} pcs.`;
        err.style.display='block'; return false;
      }
    }catch(e){}
  }
  err.style.display='none'; return true;
}
async function bukaModal(){
  const nama=document.getElementById('nama').value.trim();
  const wa=document.getElementById('wa').value.trim().replace(/[^0-9]/g,'');
  const kota=document.getElementById('kota').value.trim() || ongkirData?.city || '';
  const alamat=document.getElementById('alamat').value.trim();
  const err=document.getElementById('errorMsg');
  if(!nama||!wa||!kota||!alamat){ err.innerText='Lengkapi Nama, WA, Kota, Alamat dulu kak'; err.style.display='block'; return; }
  if(wa.length<10){ err.innerText='No WA minimal 10 angka'; err.style.display='block'; return; }
  if(cart.length===0){ err.innerText='Keranjang kosong'; err.style.display='block'; return; }
  document.getElementById('mainBtn').innerText='CEK STOK...';
  let ok = await validasiStok();
  document.getElementById('mainBtn').innerText='LANJUT KE PEMBAYARAN →';
  if(!ok) return;
  err.style.display='none';
  tempData={nama,wa,kota,alamat};
  document.getElementById('modalContent').innerHTML=`<div style="font-size:12px;display:flex;flex-direction:column;gap:8px"><div style="display:flex;justify-content:space-between"><span style="opacity:.5">Nama</span><b>${esc(nama)}</b></div><div style="display:flex;justify-content:space-between"><span style="opacity:.5">WA</span><b>${esc(wa)}</b></div><div style="display:flex;justify-content:space-between"><span style="opacity:.5">Kota</span><b>${esc(kota)}</b></div><div style="display:flex;justify-content:space-between"><span style="opacity:.5">Alamat</span><b style="text-align:right;max-width:60%">${esc(alamat)}</b></div><div style="display:flex;justify-content:space-between"><span style="opacity:.5">Origin</span><b>${esc(originLabel)}</b></div></div>`;
  document.getElementById('modalCheckout').style.display='flex';
}
function tutupModal(){document.getElementById('modalCheckout').style.display='none';}
async function prosesCheckout(){
  const {nama,wa,kota,alamat}=tempData;
  const btn=document.getElementById('btnKonfirm'); btn.innerText='MENYIMPAN...';btn.disabled=true;
  let ok = await validasiStok(); if(!ok){ btn.innerText='YA, BAYAR';btn.disabled=false; tutupModal(); return; }
  let sub=0; cart.forEach(i=>sub+= Number(i.harga||0)*Number(i.qty||0)); let tot=sub+ongkir;
  const orderData={customer_name:nama,wa,kota,alamat,total:tot,total_price:tot,kota_tujuan:kotaOngkir||kota,ongkir,items:cart,status:'MENUNGGU_BAYAR',created_at:new Date().toISOString(),origin_label:originLabel};
  try{
    const {data, error}=await supa.from('orders').insert([orderData]).select(); if(error) throw error;
    if(data&&data[0]) localStorage.setItem('arinda_last_order_id',data[0].id);
    localStorage.setItem('arinda_customer', JSON.stringify({name:nama, wa:wa, alamat:alamat, kota:kota, total:tot}));
    localStorage.setItem('arinda_total', String(tot));
  }catch(e){ document.getElementById('errorMsg').innerText='Gagal simpan order: '+e.message; document.getElementById('errorMsg').style.display='block'; btn.innerText='YA, BAYAR';btn.disabled=false; return; }
  window.location.href=`bayar.html?total=${tot}`;
}
</script>
</body></html>
