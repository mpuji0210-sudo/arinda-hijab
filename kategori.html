<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kategori - ARINDA HIJAB PREMIUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--esp:#111;--taupe:#8C7A6B;--line:#E9E6E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--esp);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,0.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-top{max-width:1240px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:400;letter-spacing:8px;font-size:21px}
.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;color:var(--taupe);margin-top:5px}
.icons{display:flex;gap:22px;align-items:center}.icon-btn{background:none;border:none;cursor:pointer;position:relative;padding:0}.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-7px;right:-9px;background:#111;color:#fff;font-size:7px;min-width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-menu{border-top:1px solid #F6F1EB;background:#fff;overflow-x:auto;scrollbar-width:none}.nav-menu::-webkit-scrollbar{display:none}
.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:40px}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:14px 0;opacity:.4;white-space:nowrap;border-bottom:1px solid transparent}.menu a.active{opacity:1;border-bottom-color:#111}
.section{max-width:1240px;margin:0 auto;padding:18px 16px 0}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
@media(min-width:700px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat-card{position:relative;border:1px solid #F2EFEA;background:#fff;cursor:pointer;overflow:hidden}
.cat-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;object-position:top;background:#FFFCF9}
.cat-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top, rgba(17,17,17,.7), transparent);padding:14px;color:#fff}
.cat-info b{font-family:'Cormorant Garamond';font-size:16px;letter-spacing:2px;font-weight:400}
.cat-info span{font-size:8px;letter-spacing:2px;opacity:.8;font-family:'Inter'}
.badge-count{background:#fff;color:#111;border-radius:10px;padding:2px 7px;font-size:8px;margin-left:6px;font-family:'Inter';letter-spacing:1px}
@media(max-width:800px){
.nav-top{padding:15px 16px}.logo{font-size:18px;letter-spacing:6px}.menu{padding:0 16px;gap:28px}
.cat-grid{grid-template-columns:repeat(2,1fr);gap:10px}
}
</style></head><body>
<nav><div class="nav-top"><div class="logo" id="storeLogo">ARINDA<span>HIJAB PREMIUM</span></div><div class="icons"><a href="produk.html" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></a></div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a class="active" href="kategori.html">KATEGORI</a></div></div></nav>

<div class="section">
<div style="font-family:'Cormorant Garamond';font-size:26px;font-weight:300;letter-spacing:2px">Kategori</div>
<div style="font-size:9px;letter-spacing:3px;opacity:.5;margin:4px 0 12px" id="catSub">READY STOCK</div>
<div class="cat-grid" id="catGrid"><div style="grid-column:span 2;text-align:center;padding:40px;opacity:.5;font-size:11px">Memuat kategori...</div></div>
</div>

<footer style="margin-top:32px;background:#FFFCF9;padding:48px 16px 36px;text-align:center;border-top:1px solid #F2EFEA">
<div style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:14px">ARINDA</div>
<div style="font-size:7px;letter-spacing:5px;color:#8C7A6B;margin-top:6px">HIJAB PREMIUM</div>
<div style="margin-top:18px;font-size:8px;letter-spacing:3px;opacity:.4">© 2026 ARINDA HIJAB PREMIUM — ALL RIGHTS RESERVED</div>
</footer>

<script>
const supa = supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function updateCount(){document.getElementById('cCount').innerText=getCart().reduce((a,b)=>a+(b.qty||0),0);}
async function load(){
  updateCount();
  try{
    const {data: cats} = await supa.from('categories').select('*').order('name');
    const {data: prods} = await supa.from('products').select('id,name,category,image_url');
    const {data: settings} = await supa.from('settings').select('*').eq('key','home_koleksi_terlaris').single();
    let koleksiCover = null;
    try{ if(settings?.value){ const k=JSON.parse(settings.value); if(k[0]?.url) koleksiCover=k[0].url; else if(typeof k[0]==='string' && k[0].startsWith('http')) koleksiCover=k[0]; } }catch(e){}
    try{
      const {data: allSettings} = await supa.from('settings').select('*');
      const get = k => allSettings?.find(s=>s.key===k)?.value;
      const sName = get('store_name');
      if(sName){const parts=sName.split(' ');document.getElementById('storeLogo').innerHTML=parts[0]+'<span>'+parts.slice(1).join(' ')+'</span>';}
    }catch(e){}
    if(!cats || cats.length===0){
      document.getElementById('catGrid').innerHTML='<div style="grid-column:span 2;text-align:center;padding:20px;font-size:11px;opacity:.5">Belum ada kategori. Tambah di Admin.</div>';
      return;
    }
    document.getElementById('catGrid').innerHTML = cats.map(c=>{
      const prod = prods?.find(p => (p.category||'').toLowerCase() === c.name.toLowerCase()) || prods?.find(p => c.name.toLowerCase().includes((p.category||'').toLowerCase()));
      const count = prods?.filter(p => (p.category||'').toLowerCase() === c.name.toLowerCase()).length || 0;
      let img = c.image_url || prod?.image_url || koleksiCover || 'https://via.placeholder.com/600x800/FFFCF9/8C7A6B?text='+encodeURIComponent(c.name);
      return `<div class="cat-card" onclick="location.href='produk.html?cat=${encodeURIComponent(c.name.toLowerCase())}'"><img src="${img}" loading="lazy"><div class="cat-info"><b>${c.name.toUpperCase()} <span class="badge-count">${count}</span></b><br><span>KLIK UNTUK LIHAT PRODUK</span></div></div>`;
    }).join('') + `<div class="cat-card" onclick="location.href='produk.html'"><img src="${koleksiCover || 'https://via.placeholder.com/600x800/FFFCF9/8C7A6B?text=ALL'}"><div class="cat-info"><b>ALL COLLECTION <span class="badge-count">${prods?.length||0}</span></b><br><span>LIHAT SEMUA PRODUK</span></div></div>`;
    document.getElementById('catSub').innerText = `${cats.length} KATEGORI • ${prods?.length||0} PRODUK READY`;
  }catch(e){ document.getElementById('catGrid').innerHTML='Gagal load: '+e.message }
}
load();
</script></body></html>
