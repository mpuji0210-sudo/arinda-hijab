<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kategori - ARINDA HIJAB PREMIUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@700&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif}
nav{position:sticky;top:0;z-index:99;background:#FFFCF9F2;backdrop-filter:blur(10px);border-bottom:1px solid var(--champ)}
.nav-in{max-width:1120px;margin:0 auto;padding:10px 14px}
.nav-top{display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:700;letter-spacing:4px;font-size:18px}
.menu{display:flex;gap:14px;margin-top:8px;padding-top:8px;border-top:1px solid var(--champ)}
.menu a{font-size:11px;letter-spacing:1.5px;color:var(--taupe);text-decoration:none}.menu a.active{color:var(--esp);border-bottom:1.5px solid var(--esp)}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:12px}
.cat-card{position:relative;border:1px solid var(--champ);border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;transition:transform .15s}
.cat-card:active{transform:scale(.97)}
.cat-card img{width:100%;height:190px;object-fit:cover;display:block;background:var(--champ)}
.cat-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top, rgba(0,0,0,.65), transparent);padding:12px;color:#fff}
.cat-info b{font-family:'Cormorant Garamond';font-size:18px;letter-spacing:1px}
.cat-info span{font-size:10px;letter-spacing:1.5px;opacity:.9}
</style></head><body>
<nav><div class="nav-in"><div class="nav-top"><div class="logo">ARINDA PREMIUM</div></div>
<div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a class="active">KATEGORI</a></div></div></nav>
<div style="max-width:1120px;margin:0 auto;padding:14px">
<div style="font-family:'Cormorant Garamond';font-size:24px">Kategori</div>
<div style="font-size:10px;letter-spacing:2px;color:#8C7A6B;margin:4px 0 12px">Ready Stock</div>
<div class="cat-grid" id="catGrid"><div style="grid-column:span 2;text-align:center;padding:40px;color:#8C7A6B">Memuat kategori...</div></div>
</div>
<script>
const supa = supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');

async function load(){
  try{
    const {data: cats} = await supa.from('categories').select('*').order('name');
    if(!cats || cats.length===0) return;
    
    document.getElementById('catGrid').innerHTML = cats.map(c=>{
      // fix image URL jika storage private
      let img = c.image_url || 'https://arinda-hijab.vercel.app/banner.jpg';
      // kalau masih nama file doang, tempel base url
      if(img && !img.startsWith('http')) img = 'https://arinda-hijab.vercel.app/' + img;

      return `
      <div class="cat-card" onclick="location.href='produk.html?cat=${encodeURIComponent(c.name.toLowerCase())}'">
        <img src="${img}" loading="lazy" onerror="this.src='https://arinda-hijab.vercel.app/banner.jpg'">
        <div class="cat-info"><b>${c.name.toUpperCase()}</b><br><span>KLIK UNTUK LIHAT PRODUK</span></div>
      </div>`;
    }).join('') + `<div class="cat-card" onclick="location.href='produk.html'"><img src="https://arinda-hijab.vercel.app/banner-hp.jpg"><div class="cat-info"><b>ALL COLLECTION</b><br><span>LIHAT SEMUA</span></div></div>`;
  }catch(e){ console.log(e); document.getElementById('catGrid').innerHTML='Gagal load kategori' }
}
load();
</script></body></html>
