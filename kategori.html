<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KATEGORI - ARINDA</title><style>:root{--line:#EDE8E1;--bg:#FFFCF9}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,sans-serif}.nav{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between}.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px;border-top:1px solid rgba(0,0,0,.06)}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35}.menu a.active{opacity:1;border-bottom:1px solid #111}.section{max-width:1240px;margin:0 auto;padding:20px 16px}.k-title{font-size:22px;letter-spacing:3px;margin:28px 0 14px}.k-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.k-card{background:#fff;border:1px solid var(--line);padding:18px;border-radius:12px;cursor:pointer;position:relative;min-height:120px}.k-count{position:absolute;top:14px;right:14px;background:#111;color:#fff;font-size:9px;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}</style></head><body>
<div class="nav"><b>ARINDA HIJAB PREMIUM</b><span>KATEGORI</span></div>
<div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a class="active">KATEGORI</a></div>
<main class="section"><div class="k-title">Kategori Jenis Produk</div><div class="k-grid" id="gridJenis"></div><div class="k-title">Kategori Bahan</div><div class="k-grid" id="gridBahan"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const supa=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
async function load(){
  const {data}=await supa.from('products').select('category').limit(100);
  let jenis={},bahan={};
  (data||[]).forEach(p=>{let c=(p.category||'PARIS').toUpperCase(); jenis[c]=(jenis[c]||0)+1;
    if(c.includes('CERUTY')) bahan['CERUTY BABYDOLL']=(bahan['CERUTY BABYDOLL']||0)+1;
    else if(c.includes('VUAL')||c.includes('PARIS')) bahan['VUAL ULTRA FINE / PARIS ULTRA FINE']=(bahan['VUAL ULTRA FINE / PARIS ULTRA FINE']||0)+1;
    else if(c.includes('VOAL')) bahan['VOAL PREMIUM']=(bahan['VOAL PREMIUM']||0)+1;
    else bahan[c]=(bahan[c]||0)+1;
  });
  if(Object.keys(bahan).length<=1) bahan={'CERUTY BABYDOLL':1,'VUAL ULTRA FINE / PARIS ULTRA FINE':1,'VOAL PREMIUM':1};
  if(Object.keys(jenis).length<=1) jenis={'HIJAB PARIS PREMIUM 110x110':2,'PASHMINA CERUTY BABYDOLL':1,'VOAL PREMIUM':1};
  document.getElementById('gridJenis').innerHTML=Object.entries(jenis).map(([k,v])=>`<div class="k-card" onclick="location.href='produk.html?kategori=${encodeURIComponent(k)}'"><b>${k}</b><span class="k-count">${v}</span><div style="margin-top:20px;font-size:8px;opacity:.4">KLIK LIHAT PRODUK</div></div>`).join('');
  document.getElementById('gridBahan').innerHTML=Object.entries(bahan).map(([k,v])=>`<div class="k-card" onclick="location.href='produk.html?bahan=${encodeURIComponent(k)}'"><b>${k}</b><span class="k-count">${v}</span><div style="margin-top:20px;font-size:8px;opacity:.4">KLIK LIHAT PRODUK</div></div>`).join('');
}load();
</script></body></html>
