<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kategori - ARINDA HIJAB PREMIUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px}.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}
.icons{display:flex;gap:20px;align-items:center}.icon-btn{background:none;border:none;cursor:pointer;position:relative}.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-7px;right:-9px;background:#111;color:#fff;font-size:7px;min-width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-menu{border-top:1px solid #F6F1EB;background:#fff;overflow-x:auto}.nav-menu::-webkit-scrollbar{display:none}
.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35;border-bottom:1px solid transparent;white-space:nowrap}.menu a.active{opacity:1;border-bottom-color:#111}
.section{max-width:1240px;margin:0 auto;padding:20px 16px 0}
.cat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:18px}
@media(min-width:700px){.cat-grid{grid-template-columns:repeat(4,1fr)}}
.cat-card{position:relative;border:1px solid var(--line);background:#fff;cursor:pointer;overflow:hidden;transition:.2s}.cat-card:hover{border-color:#111}
.cat-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block;object-position:top;background:var(--bg)}
.cat-info{position:absolute;bottom:0;left:0;right:0;background:linear-gradient(to top, rgba(17,17,17,.72), transparent);padding:14px;color:#fff}
.cat-info b{font-family:'Cormorant Garamond';font-size:16px;letter-spacing:2px;font-weight:400}
.cat-info span{font-size:8px;letter-spacing:2px;opacity:.8}
.badge-count{background:#fff;color:#111;border-radius:10px;padding:2px 7px;font-size:8px;margin-left:6px;letter-spacing:1px}
</style></head><body>
<nav><div class="nav-top"><div class="logo" id="storeLogo">ARINDA<span>HIJAB PREMIUM</span></div><div class="icons">
<button class="icon-btn" onclick="location.href='produk.html'"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<a href="kontak.html" class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3"/><path d="M5 19c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></a>
<a href="produk.html" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></a>
</div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a class="active">KATEGORI</a></div></div></nav>

<div class="section">
<div style="display:flex;justify-content:space-between;align-items:flex-end">
<div><div style="font-family:'Cormorant Garamond';font-size:26px;font-weight:300;letter-spacing:2px">Kategori</div><div style="font-size:9px;letter-spacing:3px;opacity:.5;margin:4px 0 0" id="catSub">READY STOCK LV</div></div>
<div style="font-size:9px;letter-spacing:3px;opacity:.35">ARINDA LV</div>
</div>
<div class="cat-grid" id="catGrid"><div style="grid-column:span 2;text-align:center;padding:40px;opacity:.4;font-size:11px;letter-spacing:2px">Memuat kategori...</div></div>
</div>

<footer style="margin-top:32px;padding:36px 16px 28px;text-align:center;border-top:1px solid var(--line)"><div style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:14px">ARINDA</div><div style="font-size:7px;letter-spacing:5px;opacity:.4;margin-top:6px">HIJAB PREMIUM</div><div style="margin-top:14px;font-size:8px;letter-spacing:3px;opacity:.3">© 2026 ARINDA</div></footer>

<script>
const supa = supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function updateCount(){const el=document.getElementById('cCount');if(el)el.innerText=getCart().reduce((a,b)=>a+(b.qty||0),0);}
async function load(){
  updateCount();
  try{
    const {data: cats} = await supa.from('categories').select('*').order('name');
    const {data: prods} = await supa.from('products').select('id,name,category,image_url');
    const {data: settings} = await supa.from('settings').select('*');
    const get=k=>settings?.find(s=>s.key===k)?.value||'';
    let koleksiCover=null; try{ const k=JSON.parse(get('home_koleksi_terlaris')||'[]'); if(k[0]?.url) koleksiCover=k[0].url; else if(typeof k[0]==='string') koleksiCover=k[0]; }catch(e){}
    const sName=get('store_name'); if(sName){const parts=sName.split(' ');const logo=document.getElementById('storeLogo');if(logo)logo.innerHTML=parts[0]+'<span>'+parts.slice(1).join(' ')+'</span>';}
    if(!cats || cats.length===0){
      document.getElementById('catGrid').innerHTML='<div style="grid-column:span 4;text-align:center;padding:30px;font-size:11px;opacity:.5;letter-spacing:2px">Belum ada kategori. Tambah di Admin LV.</div>';
      return;
    }
    document.getElementById('catGrid').innerHTML = cats.map(c=>{
      const prod = prods?.find(p => (p.category||'').toLowerCase() === c.name.toLowerCase());
      const count = prods?.filter(p => (p.category||'').toLowerCase() === c.name.toLowerCase()).length || 0;
      let img = c.image_url || prod?.image_url || koleksiCover || 'https://via.placeholder.com/600x800/FFFCF9/111111?text='+encodeURIComponent(c.name);
      return `<div class="cat-card" onclick="location.href='produk.html?cat=${encodeURIComponent(c.name.toLowerCase())}'"><img src="${img}" loading="lazy"><div class="cat-info"><b>${c.name.toUpperCase()} <span class="badge-count">${count}</span></b><br><span>KLIK UNTUK LIHAT PRODUK</span></div></div>`;
    }).join('') + `<div class="cat-card" onclick="location.href='produk.html'"><img src="${koleksiCover || 'https://via.placeholder.com/600x800/FFFCF9/111111?text=ALL'}"><div class="cat-info"><b>ALL COLLECTION <span class="badge-count">${prods?.length||0}</span></b><br><span>LIHAT SEMUA PRODUK LV</span></div></div>`;
    document.getElementById('catSub').innerText = `${cats.length} KATEGORI • ${prods?.length||0} PRODUK READY`;
  }catch(e){ document.getElementById('catGrid').innerHTML='Gagal load: '+e.message }
}
load();
</script></body></html>
