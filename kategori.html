<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KATEGORI - ARINDA HIJAB PREMIUM</title>
<link rel="preconnect" href="https://qjgevvizqeebtdqcbqmt.supabase.co" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
/* CLEAN LV PATCH */
:root{--black:#000;--line:#E9E9E9;--bg:#FFFFFF}
*{box-sizing:border-box}body{margin:0;background:#FFFFFF;color:#000;font-family:'Inter',sans-serif;font-weight:300;letter-spacing:0.2px;-webkit-font-smoothing:antialiased}
nav{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #E9E9E9}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px}.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}
.nav-menu{border-top:1px solid #F2F2F2;overflow-x:auto}.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#000;text-decoration:none;padding:13px 0;opacity:.35;white-space:nowrap}.menu a.active{opacity:1;border-bottom:1px solid #000}
.section{max-width:1240px;margin:0 auto;padding:24px 20px 40px}
.sec-head{display:flex;justify-content:space-between;align-items:baseline;margin:36px 0 14px}
.sec-head h2{font-family:'Cormorant Garamond';font-size:20px;letter-spacing:3px;font-weight:300;margin:0}
.sec-head span{font-size:9px;letter-spacing:3px;opacity:.4}
.k-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#E9E9E9;border:1px solid #E9E9E9}
@media(min-width:700px){.k-grid{grid-template-columns:repeat(3,1fr);gap:1px}}
.k-card{background:#fff;border:none;border-radius:0px;padding:18px 16px;cursor:pointer;position:relative;transition:.15s}
.k-card:hover{background:#FAFAFA}
.k-card b{display:block;font-size:11px;letter-spacing:2px;font-weight:400;line-height:1.4}
.k-card small{display:block;margin-top:6px;font-size:8px;letter-spacing:2px;opacity:.45}
.k-count{position:absolute;top:12px;right:12px;background:#000;color:#fff;font-size:8px;min-width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;padding:0 6px}
.k-icon{width:36px;height:36px;border-radius:50%;background:#FFFFFF;border:1px solid #E9E9E9;display:flex;align-items:center;justify-content:center;margin-bottom:12px;font-size:14px}
</style></head><body>
<nav><div class="nav-top"><div class="logo">ARINDA<span>HIJAB PREMIUM</span></div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a class="active">KATEGORI</a></div></div></nav>

<main class="section">
  <div class="sec-head"><h2>JENIS PRODUK</h2><span id="countJenis">0 KATEGORI</span></div>
  <div class="k-grid" id="gridJenis"></div>

  <div class="sec-head"><h2>JENIS BAHAN</h2><span id="countBahan">0 BAHAN</span></div>
  <div class="k-grid" id="gridBahan"></div>
</main>

<footer style="margin-top:0px;padding:36px 16px 28px;text-align:center;border-top:1px solid #E9E9E9;background:#FFFFFF"><div style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:14px">ARINDA</div><div style="font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px">HIJAB PREMIUM</div><div style="margin-top:14px;font-size:8px;letter-spacing:3px;opacity:.3">© 2026 ARINDA HIJAB PREMIUM</div></footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = supabase.createClient(SUPA_URL,SUPA_KEY);

async function loadKategori(){
  const {data:products} = await supa.from('products').select('id,name,category').limit(100);
  let jenisMap={}, bahanMap={};

  (products||[]).forEach(p=>{
    let name = (p.name||'').toUpperCase();
    let cat = (p.category||'').toUpperCase();
    let jenis = 'SEGI EMPAT';
    if(name.includes('PASHMINA') || cat.includes('PASHMINA')) jenis='PASHMINA';
    else if(name.includes('SEGI EMPAT') || cat.includes('SEGI')) jenis='SEGI EMPAT';
    else if(name.includes('HIJAB PARIS') || cat.includes('PARIS')) jenis='SEGI EMPAT PARIS';
    jenisMap[jenis]=(jenisMap[jenis]||0)+1;

    let bahan='VOAL PREMIUM';
    if(cat.includes('CERUTY') || name.includes('CERUTY')) bahan='CERUTY BABYDOLL';
    else if(cat.includes('VUAL') || cat.includes('PARIS') || name.includes('VUAL')) bahan='VUAL ULTRA FINE / PARIS ULTRA FINE';
    else if(cat.includes('VOAL') || name.includes('VOAL')) bahan='VOAL PREMIUM';
    bahanMap[bahan]=(bahanMap[bahan]||0)+1;
  });

  if(Object.keys(jenisMap).length===0) jenisMap={'SEGI EMPAT':1,'PASHMINA':1};
  if(Object.keys(bahanMap).length===0) bahanMap={'CERUTY BABYDOLL':1,'VOAL PREMIUM':1,'VUAL ULTRA FINE / PARIS ULTRA FINE':1};

  document.getElementById('countJenis').innerText=Object.keys(jenisMap).length+' KATEGORI';
  document.getElementById('countBahan').innerText=Object.keys(bahanMap).length+' BAHAN';

  document.getElementById('gridJenis').innerHTML=Object.entries(jenisMap).map(([k,v])=>{
    let icon = k.includes('PASHMINA')? '🧣' : '◫';
    return `<div class="k-card" onclick="location.href='produk.html?kategori=${encodeURIComponent(k)}'"><div class="k-icon">${icon}</div><b>${k}</b><small>${v} PRODUK READY</small><span class="k-count">${v}</span></div>`
  }).join('');

  document.getElementById('gridBahan').innerHTML=Object.entries(bahanMap).map(([k,v])=>{
    return `<div class="k-card" onclick="location.href='produk.html?bahan=${encodeURIComponent(k)}'"><div class="k-icon">✦</div><b>${k}</b><small>BAHAN ${v} PRODUK</small><span class="k-count">${v}</span></div>`
  }).join('');
}
loadKategori();
</script>
</body></html>
