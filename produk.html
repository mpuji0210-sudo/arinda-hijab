OTAL</span><span id="cartTotalPrice">Rp0</span></div><button onclick="checkoutWA()" class="btn" style="margin-top:12px;padding:14px">CHAT WA & PESAN</button><button onclick="askClearCart()" class="btn-light">KOSONGKAN</button></div></div></div>

<script>
const supabaseClient=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
let allProducts=[],WA_NUMBER="6285178098354",STORE_NAME="ARINDA",tokoOriginId="17523",tokoOriginLabel="CENGKARENG BARAT";
let selectedDestId=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[],activeBahan='ALL',activeWarna='ALL',activeUnder='ALL';let confirmCb=null;
function showConfirm(t,d,cb){document.getElementById('confirmTitle').innerText=t;document.getElementById('confirmDesc').innerText=d;document.getElementById('confirmModal').classList.add('open');confirmCb=cb;}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');confirmCb=null;}
document.getElementById('confirmOk').onclick=()=>{if(confirmCb)confirmCb();closeConfirm();};
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');if(el){el.innerText=getCart().reduce((a,b)=>a+(b.qty||0),0); el.classList.add('bump'); setTimeout(()=>el.classList.remove('bump'),350);}}
function isOut(v){ if(v.is_available===false) return true; if(v.stock!==undefined && v.stock!==null) return Number(v.stock)<=0; return false; }
function flyToCart(imgUrl, startEl){
  document.querySelectorAll('.fly-img').forEach(e=>e.remove());
  const cartIcon=document.getElementById('cartIcon'); if(!cartIcon) return;
  const cartRect=cartIcon.getBoundingClientRect();
  let startRect = startEl? startEl.getBoundingClientRect() : null;
  if(!startRect || startRect.width===0){
    const big = document.getElementById('bigImg');
    startRect = big? big.getBoundingClientRect() : {left: window.innerWidth/2, top: window.innerHeight/2, width: 80, height: 80};
  }
  const startX = startRect.left + startRect.width/2 - 28;
  const startY = startRect.top + startRect.height/2 - 28;
  const endX = cartRect.left + cartRect.width/2 - 28;
  const endY = cartRect.top + cartRect.height/2 - 28;
  const fly=document.createElement('img');
  fly.src=imgUrl; fly.className='fly-img';
  fly.style.transform=`translate(${startX}px, ${startY}px) scale(1)`;
  fly.style.opacity='1';
  document.body.appendChild(fly);
  fly.getBoundingClientRect();
  requestAnimationFrame(()=>{ requestAnimationFrame(()=>{
    fly.style.transform=`translate(${endX}px, ${endY}px) scale(0.15)`;
    fly.style.opacity='0';
  });});
  setTimeout(()=>fly.remove(),950);
}
function doSearch(){const q=document.getElementById('q').value.toLowerCase().trim();if(!q){applyFilters();return;}const filtered=allProducts.filter(p=>p.name.toLowerCase().includes(q)||(p.category||'').toLowerCase().includes(q)||(window._varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(q)));document.getElementById('prodCount').innerText=filtered.length+' PRODUK';render(filtered);}
async function loadFilters(){
 try{
  const {data:cats}=await supabaseClient.from('categories').select('name');
  let bahanList=[...new Set((cats||[]).map(c=>c.name.toUpperCase()))];
  if(!bahanList.length){ bahanList=[...new Set(allProducts.map(p=>(p.category||'').toUpperCase()).filter(Boolean))]; }
  document.getElementById('filterBahan').innerHTML='<button class="active" onclick="filterBahan(\'ALL\',this)">ALL BAHAN</button>'+bahanList.slice(0,12).map(c=>`<button onclick="filterBahan('${c}',this)">${c}</button>`).join('');
  const {data:vars}=await supabaseClient.from('product_variants').select('color_name');
  let colors=[...new Set((vars||[]).map(v=>v.color_name.toUpperCase()))];
  if(!colors.length)colors=['KREM','HITAM','NAVY','MAROON'];
  const order=['KREM','HITAM','NAVY','MAROON']; colors.sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);if(ia!==-1&&ib!==-1)return ia-ib;if(ia!==-1)return-1;if(ib!==-1)return 1;return a.localeCompare(b);});
  document.getElementById('filterWarna').innerHTML='<button class="active" onclick="filterWarna(\'ALL\',this)">ALL WARNA</button>'+colors.slice(0,12).map(c=>`<button onclick="filterWarna('${c}',this)">${c}</button>`).join('');
 }catch(e){}
}
function filterBahan(bahan,btn){activeBahan=bahan;document.querySelectorAll('#filterBahan button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function filterWarna(warna,btn){activeWarna=warna;document.querySelectorAll('#filterWarna button').forEach(b=>b.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
// === V52 FIX CASE INSENSITIVE + DESKRIPSI ===
function normalizeUndertoneToCode(raw){
  if(!raw) return [];
  let arr = Array.isArray(raw)? raw : [raw];
  return arr.flatMap(s=>{
    const low = String(s).toLowerCase();
    if(low.includes('cool') || low.includes('putih') || low.includes('kemerahan') || low.includes('pink') || low.includes('blue')) return ['COOL'];
    if(low.includes('warm') || low.includes('kuning') || low.includes('langs') || low.includes('yellow') || low.includes('orange')) return ['WARM'];
    if(low.includes('neutral') || low.includes('mauve') || low.includes('dusty') || low.includes('beige')) return ['NEUTRAL'];
    if(low.includes('olive') || low.includes('sawo') || low.includes('matang') || low.includes('sage') || low.includes('khaki')) return ['OLIVE'];
    return [String(s).toUpperCase()];
  });
}
function filterUndertone(u,btn){
  activeUnder = (u||'ALL').toUpperCase();
  document.querySelectorAll('#filterUnder button').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  else {
    // kalau dari URL, aktifin tombol yang cocok
    document.querySelectorAll('#filterUnder button').forEach(b=>{
      if(b.textContent.toUpperCase().includes(activeUnder)) b.classList.add('active');
      if(activeUnder==='ALL' && b.textContent.includes('ALL')) b.classList.add('active');
    });
  }
  applyFilters();
}
function applyFilters(){
  let list=[...allProducts];
  if(activeBahan!=='ALL'){
    const bLow = activeBahan.toLowerCase();
    list=list.filter(p=>(p.category||'').toLowerCase()===bLow);
  }
  if(activeWarna!=='ALL'){
    const wLow = activeWarna.toLowerCase();
    list=list.filter(p=>(window._varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(wLow)));
  }
  if(activeUnder!=='ALL'){
    list=list.filter(p=> {
      const codes = normalizeUndertoneToCode(p.undertone);
      return codes.includes(activeUnder);
    });
  }
  document.getElementById('prodCount').innerText=list.length+' PRODUK';
  render(list);
}
function render(list){
 const el=document.getElementById('list'); if(!list||!list.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 0;opacity:.4;font-size:11px">TIDAK ADA PRODUK - COBA GANTI FILTER UNDERTONE</div>';return;}
 el.innerHTML=list.map(p=>{
  const vars=window._varMap[p.id]||[];let img=p.image_url;let colName=vars[0]?.color_name||'';let allOut=vars.length>0 && vars.every(v=>isOut(v));
  if(activeWarna!=='ALL'){const m=vars.find(v=>v.color_name.toLowerCase()===activeWarna.toLowerCase())||vars.find(v=>v.color_name.toLowerCase().includes(activeWarna.toLowerCase()));if(m){img=m.image_url;colName=m.color_name; allOut=isOut(m);}}
  const underDisplay = normalizeUndertoneToCode(p.undertone).join(' + ') || (Array.isArray(p.undertone)?p.undertone.join(' + '):p.undertone) || 'NEUTRAL';
  return `<div class="prod-card ${allOut?'out-of-stock':''}" onclick="${allOut?'':'openProd(\''+p.id+'\')'}">${allOut?'<div class="stock-badge">HABIS</div>':''}<div class="heart-btn" onclick="event.stopPropagation();${allOut?'':`quickAdd('${p.id}')`}"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}" src="${img}" loading="lazy"><div style="padding:10px;border-top:1px solid #F6F1EB"><div style="font-size:11px;font-family:'Cormorant Garamond'">${p.name}</div><div style="font-size:8px;letter-spacing:2px;opacity:.4;margin-top:2px">${underDisplay} • ${activeWarna!=='ALL'?activeWarna:colName}</div><div style="font-size:12px;font-family:'Cormorant Garamond';margin-top:6px">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
 }).join('');
}
function quickAdd(id){const p=allProducts.find(x=>String(x.id)===String(id));if(!p)return; const vars=window._varMap[id]||[];let v=vars[0];if(activeWarna!=='ALL'){const mf=vars.find(x=>x.color_name.toLowerCase()===activeWarna.toLowerCase())||vars.find(x=>x.color_name.toLowerCase().includes(activeWarna.toLowerCase()));if(mf)v=mf;} if(v && isOut(v)){ showCartToast('HABIS', v.image_url); return; } const name=v?p.name+' - '+v.color_name:p.name;const img=v?v.image_url:p.image_url;const color=v?v.color_name:'KREM'; const imgEl=document.getElementById('img-'+id); flyToCart(img, imgEl); const btnEl = imgEl?.parentElement?.querySelector('.heart-btn'); if(btnEl){btnEl.classList.add('loved');setTimeout(()=>btnEl.classList.remove('loved'),600);} addCart(name,p.price,img); showCartToast(color,img);}
async function openProd(id){
 document.getElementById('prodModal').classList.add('show'); document.getElementById('pBox').innerHTML='<div style="padding:20px">Loading...</div>';
 const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single(); const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');
 curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:p.category||'KREM',image_url:p.image_url, stock:1}]; curColor=curVariants[0].color_name;curImg=curVariants[0].image_url;
 if(activeWarna!=='ALL'){const mf=curVariants.find(v=>v.color_name.toLowerCase()===activeWarna.toLowerCase())||curVariants.find(v=>v.color_name.toLowerCase().includes(activeWarna.toLowerCase()));if(mf){curColor=mf.color_name;curImg=mf.image_url;}}
 const sizeTxt = p.size_info||'110x110cm'; const matDetail = p.material_detail||p.category||'Paris Premium'; const finishTxt = p.finishing||'Laser Cut'; const underTxt = normalizeUndertoneToCode(p.undertone).join(' + ') || 'NEUTRAL'; const descTxt = p.description||'Bahan adem, tidak menerawang, mudah dibentuk dan tegak di dahi.';
document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${curImg}"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<img src="${v.image_url}" class="${v.image_url===curImg?'active':''} ${isOut(v)?'out':''}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})">`).join('')}</div></div><div class="p-info"><div style="display:flex;justify-content:space-between"><div style="font-size:9px;letter-spacing:3px;opacity:.4">BESTSELLER • ${underTxt}</div><div style="cursor:pointer;font-size:22px" onclick="closeProd()">×</div></div><div style="font-family:'Cormorant Garamond';font-size:22px;margin-top:6px">${p.name}</div><div style="font-family:'Cormorant Garamond';font-size:32px;margin:6px 0">Rp${Number(p.price).toLocaleString('id-ID')}</div>
<div class="detail-box"><div class="detail-row"><span>UKURAN</span><b>${sizeTxt}</b></div><div class="detail-row"><span>BAHAN DETAIL</span><b>${matDetail}</b></div><div class="detail-row"><span>FINISHING</span><b>${finishTxt}</b></div><div class="detail-row"><span>UNDERTONE</span><b>${underTxt}</b></div><div style="margin-top:10px;font-size:9px;letter-spacing:2px;opacity:.5">DESKRIPSI</div><div style="font-size:11px;line-height:18px;margin-top:6px;white-space:pre-line">${descTxt}</div></div>
<div style="font-size:9px;letter-spacing:2px;margin:16px 0 8px">PILIH WARNA: <b id="selCol">${curColor}</b> <span id="stockInfo" style="margin-left:8px;opacity:.5"></span></div><div style="display:flex;gap:8px;flex-wrap:wrap">${curVariants.map((v,i)=>{const out=isOut(v);return `<button id="btn-${i}" ${out?'disabled':''} style="padding:10px 16px;border:1px solid ${v.image_url===curImg?'#111':'#F2EFEA'};background:${out?'#F2EFEA':(v.image_url===curImg?'#111':'#fff')};color:${out?'#999':(v.image_url===curImg?'#fff':'#000')};font-size:9px;letter-spacing:1px;cursor:${out?'not-allowed':'pointer'}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})">${v.color_name} ${out?'- HABIS':''}</button>`}).join('')}</div><div style="display:flex;gap:8px;margin-top:18px"><button id="btnAddCart" class="btn" style="background:#fff;border:1px solid #111;color:#111" onclick="addToCartFromModal()">+ KERANJANG</button><button id="btnBuy" class="btn" onclick="buyFromModal()">BELI SEKARANG</button></div></div>`; updateStockUI(); }
function pickColor(c,i,idx){curColor=c;curImg=i;document.getElementById('bigImg').src=i;document.getElementById('selCol').innerText=c;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j==idx));curVariants.forEach((v,j)=>{const b=document.getElementById('btn-'+j);if(b){const a=v.image_url===i;b.style.background=isOut(v)?'#F2EFEA':(a?'#111':'#fff');b.style.color=isOut(v)?'#999':(a?'#fff':'#000');b.style.borderColor=a?'#111':'#F2EFEA';}}); updateStockUI();}
function updateStockUI(){ const cur=curVariants.find(v=>v.image_url===curImg)||curVariants[0]; const out=cur?isOut(cur):false; const info=document.getElementById('stockInfo'); const b1=document.getElementById('btnAddCart'); const b2=document.getElementById('btnBuy'); if(info) info.innerText=out?'STOK HABIS':(cur.stock?cur.stock+' TERSISA':'READY'); if(b1) b1.disabled=out; if(b2) b2.disabled=out; if(b1) b1.innerText=out?'HABIS':'+ KERANJANG'; }
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showCartToast(c,i){const t=document.getElementById('cartToast');document.getElementById('toastImg').src=i;document.getElementById('toastText').innerText=c+(c==='HABIS'?'':' MASUK KERANJANG');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){ const cur=curVariants.find(v=>v.image_url===curImg); if(cur && isOut(cur)) return; const bigImg=document.getElementById('bigImg'); flyToCart(curImg,bigImg); addCart(curProd.name+' - '+curColor,curProd.price,curImg); showCartToast(curColor,curImg); }
function buyFromModal(){ const cur=curVariants.find(v=>v.image_url===curImg); if(cur && isOut(cur)) return; let msg=`Halo ${STORE_NAME} %0A%0ASaya mau beli:%0A- ${curProd.name} - ${curColor} = Rp${Number(curProd.price).toLocaleString('id-ID')}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const list=document.getElementById('cartList');const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPrice').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');if(!c.length){list.innerHTML='<p style="font-size:11px;opacity:.4;text-align:center;padding:20px">KERANJANG KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;align-items:center;border-bottom:1px solid #F2EFEA;padding:10px 0"><img src="${it.img}" style="width:54px;height:54px;object-fit:cover;border-radius:50%;border:1px solid var(--line)"><div style="flex:1"><div style="font-size:11px;font-family:'Cormorant Garamond'">${it.warna}</div><div style="font-size:10px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:50%">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border:1px solid var(--line);background:#fff;border-radius:50%">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function askClearCart(){if(!getCart().length)return;showConfirm('KOSONGKAN KERANJANG?','Semua item akan dihapus.',()=>{saveCart([]);selectedOngkirCost=0;selectedService='';document.getElementById('ongkirLabel').innerText='BELUM CEK';renderCart();});}
async function searchDest(){const q=document.getElementById('destSearch').value.trim();if(!q)return;const dl=document.getElementById('destList');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;border-bottom:1px solid #F2EFEA;cursor:pointer;font-size:11px" onclick="pilihDest('${d.id}','${d.label.replace(/'/g,"")}')">${d.label}</div>`).join('');}catch(e){dl.innerHTML='ERROR';}}
function pilihDest(id,label){selectedDestId=id;document.getElementById('destSearch').value=label;document.getElementById('destList').innerHTML='<div style="padding:10px;background:var(--bg)">'+label+'</div>';}
async function cekOngkir(){if(!selectedDestId)return;document.getElementById('ongkirResult').innerHTML='MENGECEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelect').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:(arr.costs||[]);let html='<div style="font-size:9px;letter-spacing:2px;margin-bottom:4px">PILIH LAYANAN:</div>';list.forEach(c=>{html+=`<div onclick="setOngkir(${c.cost||0},'${c.service||'REG'}','${c.etd||'-'}')" style="padding:10px;border:1px solid var(--line);margin:4px 0;display:flex;justify-content:space-between;cursor:pointer;background:#fff"><div><b style="font-size:11px">${c.service}</b><br><small style="font-size:10px;opacity:.5">${c.etd} hari</small></div><b style="font-size:11px">Rp${Number(c.cost).toLocaleString('id-ID')}</b></div>`;});document.getElementById('ongkirResult').innerHTML=html;}catch(e){document.getElementById('ongkirResult').innerHTML='ERROR '+e.message;}}
function setOngkir(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirLabel').innerText=selectedService;document.getElementById('ongkirResult').innerHTML='<div style="padding:10px;background:var(--bg)">'+service+' - Rp'+selectedOngkirCost.toLocaleString('id-ID')+'</div>';renderCart();}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ${STORE_NAME} %0A%0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`%0ASubtotal: Rp${sub.toLocaleString('id-ID')}%0A`;if(selectedOngkirCost>0)msg+=`Ongkir (${selectedService}): Rp${selectedOngkirCost.toLocaleString('id-ID')}%0A`;msg+=`Total: Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
// TRANSPARAN SCROLL
window.addEventListener('scroll',()=>{const nav=document.getElementById('mainNav');if(window.scrollY>20)nav.classList.add('scrolled');else nav.classList.remove('scrolled');});
async function load(){try{const {data}=await supabaseClient.from('settings').select('*');if(data){const wa=data.find(s=>s.key==='wa_number')?.value;const oid=data.find(s=>s.key==='toko_origin_id')?.value;const olabel=data.find(s=>s.key==='toko_origin_label')?.value;if(wa)WA_NUMBER=wa;if(oid){tokoOriginId=oid;const oi=document.getElementById('originInfo');if(oi)oi.innerText=olabel||oid;}}}catch(e){}try{const {data}=await supabaseClient.from('products').select('*').order('id',{ascending:false});const {data:vars}=await supabaseClient.from('product_variants').select('*');allProducts=data||[];window._varMap={};(vars||[]).forEach(v=>{if(!window._varMap[v.product_id])window._varMap[v.product_id]=[];window._varMap[v.product_id].push(v);});document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';render(allProducts);await loadFilters();
  const params=new URLSearchParams(window.location.search); const u=params.get('undertone'); const q=params.get('q'); if(u){ setTimeout(()=>filterUndertone(u, null), 300); } if(q){ document.getElementById('q').value=q; setTimeout(()=>doSearch(),300); }
}catch(e){console.error(e)}updateCount();}
load();
</script></body></html>
