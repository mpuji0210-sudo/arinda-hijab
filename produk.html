function normalizeUnder(arr){if(!arr)return[];let a=Array.isArray(arr)?arr:[arr];try{if(typeof arr==='string'&&arr.startsWith('['))a=JSON.parse(arr);}catch(e){}return a.map(x=>String(x).toUpperCase());}
function getMatchedVariant(pid,q,under){let vs=window._varMap[pid]||[];let ready=vs.filter(v=>!isOut(v));let pool=ready.length?ready:vs;if(under&&under!=='ALL'){let f=pool.find(v=>normalizeUnder(v.undertone||[]).includes(under));if(f)return f;}if(q){let f=pool.find(v=>(v.color_name||'').toLowerCase().includes(q));if(f)return f;}return pool[0]||vs[0];}
function applyFilters(qOverride){
 let q=(qOverride!==undefined?qOverride:lastSearchQuery).toLowerCase().trim();

 let flat=[];base.forEach(p=>{(window._varMap[p.id]||[]).filter(v=>!isOut(v)).forEach(v=>{let u=normalizeUnder(v.undertone||p.undertone||[]);let matchU=activeUnder==='ALL'||u.includes(activeUnder);let matchQ=!q||v.color_name.toLowerCase().includes(q)||p.name.toLowerCase().includes(q);if(matchU&&matchQ)flat.push({p,v})})});

function quickAdd(id,btnEl,idx,colorName){let p=allProducts.find(x=>String(x.id)===String(id));let vars=window._varMap[id]||[];let v=vars.find(x=>x.color_name===colorName)||getMatchedVariant(id,lastSearchQuery,activeUnder)||vars[0];if(isOut(v)){alert('Habis');return;}let imgEl=document.getElementById(`img-${id}-${idx}`)||btnEl.closest('.prod-card').querySelector('img');if(imgEl)flyToCart(v.image_url,imgEl);let c=getCart(),k=p.name+' - '+v.color_name,ix=c.findIndex(a=>a.warna==k);if(ix>-1)c[ix].qty++;else c.push({warna:k,qty:1,harga:Number(p.price),img:v.image_url});saveCart(c);showToast(v.color_name,v.image_url);}
async function openProd(id,colorName){document.getElementById('prodModal').classList.add('show');document.getElementById('pBox').innerHTML='<div style="padding:40px">Loading...</div>';let {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();let {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:'KREM',image_url:p.image_url,stock:1,undertone:p.undertone||['NEUTRAL']}];let initial=getMatchedVariant(id,colorName||lastSearchQuery,activeUnder)||curVariants.find(v=>!isOut(v))||curVariants[0];if(colorName){let f=curVariants.find(v=>v.color_name.toLowerCase()===colorName.toLowerCase());if(f)initial=f;}curColor=initial.color_name;curImg=initial.image_url;curUnder=initial.undertone||p.undertone||['NEUTRAL'];document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}"></div><div class="p-thumbs">${curVariants.map((v,i)=>{let out=isOut(v);return `<div style="position:relative"><img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})" style="${out?'opacity:.4;filter:grayscale(1)':''}"><span style="position:absolute;bottom:2px;left:2px;${out?'background:#D32F2F':'background:#000'};color:#fff;font-size:5px;padding:2px 3px">${out?'HABIS':'SISA '+(v.stock??0)}</span></div>`}).join('')}</div></div><div class="p-info"><div style="font-size:20px;font-family:Cormorant Garamond">${esc(p.name)}</div><div style="margin-top:6px">${underBadgeHtml(curUnder)}</div><div style="font-size:22px;margin-top:6px">Rp${Number(p.price).toLocaleString('id-ID')}</div><div style="margin-top:10px;font-size:10px;font-weight:600;letter-spacing:1px;padding:6px 10px;border:1px solid #000;display:inline-block" id="stokArea">${(() => {let cur=curVariants.find(v=>v.image_url===curImg)||curVariants[0];return isOut(cur)?'<span style="color:#D32F2F">● HABIS</span>':'● SISA '+(cur.stock??0)+' PCS';})()}</div><div style="margin-top:10px;font-size:8px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${esc(curColor)}</b></div><div class="variant-wrap">${curVariants.map((v,i)=>{let out=isOut(v);return `<button id="btn-${i}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})" style="${out?'opacity:.4':''}">${esc(v.color_name)} - ${out?'HABIS':'SISA '+(v.stock??0)}</button>`}).join('')}</div><div style="margin-top:10px;font-size:8px;opacity:.6">UNDERTONE: ${normalizeUnder(curUnder).join(', ')}</div><div style="margin-top:14px;padding:12px;background:#FFFFFF;border:1px solid #E9E9E9"><div style="font-size:8px;letter-spacing:2px;opacity:.5;margin-bottom:8px;font-weight:700">CEK ONGKIR DARI ${esc(tokoOriginLabel)}</div><div style="display:flex;gap:6px"><input id="destSearchProd" placeholder="Kecamatan min 3 huruf" style="flex:1;padding:10px;border:1px solid #E9E9E9;font-size:11px"><button onclick="searchDestProd()" style="padding:10px 14px;background:#000;color:#fff;border:none;font-size:9px">CARI</button></div><div id="destListProd" style="display:none;margin-top:8px;max-height:100px;overflow:auto;background:#fff;border:1px solid #E9E9E9"></div><div style="display:flex;gap:6px;margin-top:8px"><select id="courierSelectProd" style="flex:1;padding:9px;border:1px solid #E9E9E9;font-size:11px"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="pos">POS</option></select><button onclick="cekOngkirProd()" style="flex:1;padding:9px;background:#fff;border:1px solid #000;font-size:9px">CEK ONGKIR</button></div><div id="ongkirResultProd" style="margin-top:8px"></div><div id="ongkirSelectedProd" style="margin-top:8px;font-size:10px;font-weight:600">${selectedService?'✓ '+esc(selectedService)+' - Rp'+selectedOngkirCost.toLocaleString('id-ID'):''}</div></div><div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI SEKARANG</button></div></div>`;}
function pickColorByIdx(i){let v=curVariants[i];if(isOut(v))return;curColor=v.color_name;curImg=v.image_url;curUnder=v.undertone||curProd.undertone||['NEUTRAL'];document.getElementById('bigImg').src=getOptImg(v.image_url,600);document.getElementById('selCol').innerText=v.color_name;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j===i));document.querySelectorAll('.variant-wrap button').forEach((b,j)=>b.classList.toggle('active',j===i));let out=isOut(v);document.getElementById('stokArea').innerHTML=out?'<span style="color:#D32F2F">● HABIS</span>':'● SISA '+(v.stock??0)+' PCS';}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showToast(c,i){let t=document.getElementById('cartToast');document.getElementById('toastImg').src=getOptImg(i,80);document.getElementById('toastText').innerText=c+' MASUK KERANJANG';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){let cur=curVariants.find(v=>v.image_url===curImg);if(isOut(cur))return;let big=document.getElementById('bigImg');if(big)flyToCart(curImg,big);let c=getCart(),k=curProd.name+' - '+curColor,ix=c.findIndex(a=>a.warna==k);if(ix>-1)c[ix].qty++;else c.push({warna:k,qty:1,harga:Number(curProd.price),img:curImg});saveCart(c);showToast(curColor,curImg);}
function buyFromModal(){addToCartFromModal();if(!saveOngkirLS())return;location='checkout.html';}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){let c=getCart();let sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';let list=document.getElementById('cartList');if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2F2F2;align-items:center"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${esc(it.warna)}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function saveOngkirLS(){let cityCart=document.getElementById('destCityCart')?.value||'';let cityProd=document.getElementById('destSearchProd')?.value||'';let finalCity=cityCart||cityProd||'';let finalDestId=selectedDestIdCart||selectedDestId||'';if(!finalCity){alert('Pilih kecamatan dulu');return false;}let payload={city:finalCity,cost:selectedOngkirCost,service:selectedService,origin:tokoOriginLabel,origin_id:tokoOriginId,destination_id:finalDestId};sessionStorage.setItem('checkout_ongkir',JSON.stringify(payload));localStorage.setItem('checkout_ongkir_backup',JSON.stringify(payload));return true;}
async function searchDestCart(){let q=document.getElementById('destCityCart').value.trim();if(q.length<3){alert('Ketik min 3 huruf');return;}let dl=document.getElementById('destListCart');dl.style.display='block';dl.innerHTML='Mencari...';try{let r=await fetch('/api/search?q='+encodeURIComponent(q));let j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestCart('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='Gagal';}}
function pilihDestCart(id,label){selectedDestIdCart=id;document.getElementById('destCityCart').value=label;document.getElementById('destListCart').style.display='none';cekOngkirCartReal();}
async function cekOngkirCartReal(){if(!selectedDestIdCart)return;let box=document.getElementById('ongkirOptionsCart');box.style.display='block';box.innerHTML='Cek ongkir...';try{let res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestIdCart,weight:1000,courier:'jne'})});let data=await res.json();let arr=data.data||[];let list=Array.isArray(arr)?arr:arr.costs||[];if(!list.length){box.innerHTML='Tidak ada';return;}box.innerHTML=list.map(c=>`<label style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #000;margin-top:6px;cursor:pointer"><span style="font-size:10px"><b>${esc(c.service||c.name)}</b><br><small style="opacity:.5">${esc(c.etd||'')}</small></span><span style="display:flex;gap:8px"><b style="font-size:11px">Rp${Number(c.cost).toLocaleString('id-ID')}</b><input type="radio" name="ongkirCart" onchange="pilihOngkirCart(${c.cost},'${esc(c.service)}')"></span></label>`).join('');}catch(e){box.innerHTML='Error';}}
function pilihOngkirCart(cost,service){selectedOngkirCost=Number(cost);selectedService=service;saveOngkirLS();renderCart();}
async function searchDestProd(){let q=document.getElementById('destSearchProd').value.trim();if(q.length<3){alert('Ketik min 3 huruf');return;}let dl=document.getElementById('destListProd');dl.style.display='block';dl.innerHTML='Mencari...';try{let r=await fetch('/api/search?q='+encodeURIComponent(q));let j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestProd('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='Gagal';}}
function pilihDestProd(id,label){selectedDestId=id;document.getElementById('destSearchProd').value=label;document.getElementById('destListProd').style.display='none';}
async function cekOngkirProd(){if(!selectedDestId){document.getElementById('ongkirResultProd').innerText='Pilih kecamatan dulu';return;}document.getElementById('ongkirResultProd').innerText='Cek...';try{let res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelectProd').value})});let data=await res.json();let arr=data.data||[];let list=Array.isArray(arr)?arr:arr.costs||[];let h='';list.forEach(c=>{h+=`<div onclick="setOngkirProd(${c.cost},'${esc(c.service)}','${esc(c.etd||'')}')" style="padding:10px;border:1px solid #000;margin:4px 0;cursor:pointer;font-size:11px"><b>${esc(c.service)}</b> - Rp${Number(c.cost).toLocaleString('id-ID')}</div>`});document.getElementById('ongkirResultProd').innerHTML=h||'Tidak ada';}catch(e){document.getElementById('ongkirResultProd').innerText='Error';}}
function setOngkirProd(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirSelectedProd').innerText='✓ '+selectedService+' - Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('ongkirResultProd').innerHTML='';renderCart();saveOngkirLS();}
function checkoutWA(){if(!selectedOngkirCost){alert('Cek ongkir dulu');return;}if(!saveOngkirLS())return;location='checkout.html';}
document.getElementById('storeLogo').innerHTML=STORE_CACHE.toUpperCase()+'<span>HIJAB PREMIUM</span>';
</script>
<script>
(async()=>{
  let supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);
  try{let {data:cfg}=await supabaseClient.from('settings').select('key,value').in('key',['store_name','toko_origin_id','toko_origin_label']);let g=k=>cfg?.find(s=>s.key===k)?.value||'';let n=g('store_name'),id=g('toko_origin_id'),lb=g('toko_origin_label');if(n){localStorage.setItem('store_name_cache',n);document.getElementById('storeLogo').innerHTML=n.toUpperCase()+'<span>HIJAB PREMIUM</span>';document.getElementById('pageTitle').innerText='PRODUK - '+n.toUpperCase();}if(id)tokoOriginId=id;if(lb)tokoOriginLabel=lb;}catch(e){}
  let {data:all}=await supabase.createClient(SUPA_URL,SUPA_KEY).from('products').select('id,name,price,image_url,category,product_type,undertone').order('id',{ascending:false}).limit(500);
  let {data:vars}=await supabase.createClient(SUPA_URL,SUPA_KEY).from('product_variants').select('product_id,color_name,image_url,stock,is_available,undertone').limit(2000);
  allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{if(!window._varMap[v.product_id])window._varMap[v.product_id]=[];window._varMap[v.product_id].push(v);});
  let params=new URLSearchParams(location.search);let u=params.get('undertone');if(u)activeUnder=u.toUpperCase();let q=params.get('warna')||params.get('q');if(q){document.getElementById('q').value=q;lastSearchQuery=q.toLowerCase();}
  updateCount();applyFilters(lastSearchQuery);
})();
</script>
