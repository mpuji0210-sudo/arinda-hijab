<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arinda Hijab</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;background:#f5f5f5;color:#222;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:20;background:white;display:flex;align-items:center;gap:10px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.topbar .search{flex:1;background:#f0f0f0;border-radius:20px;padding:8px 14px;font-size:13px;color:#999}
.badge-cart{position:absolute;top:-6px;right:-6px;background:#ee4d2d;color:white;font-size:10px;padding:2px 5px;border-radius:10px;font-weight:700}
.galeri{background:white;display:flex;justify-content:center;align-items:center;height:380px;font-size:120px}
.hargaBox{background:white;padding:12px 14px}
.harga{color:#ee4d2d;font-size:26px;font-weight:800}
.judul{background:white;padding:10px 14px;font-size:14px;font-weight:600;line-height:1.4;margin-top:6px}
.label{font-size:14px;font-weight:700;margin:16px 0 8px}
.warnaBox{background:white;padding:12px 14px;margin-top:6px}
.warna-list{display:flex;gap:10px}
.warna-item{width:60px;height:60px;border-radius:8px;border:2px solid #eee;display:flex;justify-content:center;align-items:center;font-size:30px;cursor:pointer;background:#fafafa}
.warna-item.active{border-color:#ee4d2d;background:#fff5f2}
.ukuranBox{background:white;padding:12px 14px;margin-top:6px}
.ukur-btn{border:1px solid #ddd;padding:8px 16px;border-radius:6px;background:white;margin-right:8px;font-size:13px;cursor:pointer}
.ukur-btn.active{border-color:#ee4d2d;color:#ee4d2d;background:#fff5f2}
.infoCard{background:white;padding:12px 14px;margin-top:6px;display:flex;justify-content:space-between;align-items:center}
.bottomBar{position:fixed;bottom:0;left:0;right:0;display:flex;height:60px;z-index:30}
.bottomBar button{border:0;color:white;font-weight:700;font-size:13px}
.chat{background:#00bfa5;width:25%}
.cart{background:#00bfa5;width:30%;border-left:1px solid rgba(255,255,255,.3)!important}
.beli{background:#ee4d2d;width:45%;line-height:1.2}
.beli b{font-size:15px;display:block}
</style>
</head>
<body>

<div class="topbar">
  <span onclick="location.href='index.html'">←</span>
  <div class="search">🔍 Arinda Hijab Premium Adem</div>
  <div style="position:relative">🛒<span class="badge-cart" id="cartBadge">0</span></div>
</div>

<div class="galeri" id="mainImg">🧕</div>

<div class="hargaBox">
  <div><span class="harga"><small>Rp</small><span id="hargaText">18.000</span></span></div>
  <div style="text-align:right;font-size:12px;color:#777;margin-top:6px"><span>482</span> Terjual ❤️</div>
</div>

<div class="judul">
  <span style="background:#ee4d2d;color:white;padding:2px 6px;border-radius:4px;font-size:11px">Star+</span>
  Arinda Hijab Premium - Voal & Diamond Adem Anti Kusut 4 Warna Best Seller
</div>

<div class="warnaBox">
  <div class="label">Warna</div>
  <div class="warna-list">
    <div class="warna-item active" onclick="pilihWarna(this,'🧕','Hitam')">🖤</div>
    <div class="warna-item" onclick="pilihWarna(this,'👩‍🦰','Krem')">🤎</div>
    <div class="warna-item" onclick="pilihWarna(this,'🧕🏻','Maroon')">❤️</div>
    <div class="warna-item" onclick="pilihWarna(this,'👩‍🦱','Navy')">💙</div>
  </div>
  <div style="font-size:13px;margin-top:10px">Pilihan: <b id="warnaText">Hitam</b></div>
</div>

<div class="ukuranBox">
  <div class="label">Ukuran</div>
  <button class="ukur-btn active" onclick="pilihUkuran(this)">STANDAR</button>
  <button class="ukur-btn" onclick="pilihUkuran(this)">SYARI</button>
</div>

<div class="infoCard"><span>🏆 Top 5 terlaris di Hijab Segi Empat</span><span>></span></div>

<div class="bottomBar">
  <button class="chat" onclick="chatWA()">💬<br>Chat Sekarang</button>
  <button class="cart" onclick="addToCart()">🛒<br>Masukkan Keranjang</button>
  <button class="beli" onclick="beliLangsung()"><b>Beli Sekarang<br>Rp<span id="hargaBawah">18.000</span></b></button>
</div>

<script>
let cart=JSON.parse(localStorage.getItem('cart'))||[];
let selectedEmot='🧕',selectedHarga=18000,selectedWarna='Hitam',selectedUkuran='STANDAR';
function updateBadge(){document.getElementById('cartBadge').innerText=cart.length;localStorage.setItem('cart',JSON.stringify(cart));}
function pilihWarna(el,emot,warna){
 document.querySelectorAll('.warna-item').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');
 document.getElementById('mainImg').innerText=emot;
 selectedEmot=emot;selectedWarna=warna;
 document.getElementById('warnaText').innerText=warna;
}
function pilihUkuran(el){
 document.querySelectorAll('.ukur-btn').forEach(x=>x.classList.remove('active'));
 el.classList.add('active');selectedUkuran=el.innerText;
}
function addToCart(){
 cart.push({name:`Arinda Hijab ${selectedWarna} - ${selectedUkuran}`,price:selectedHarga});
 updateBadge();alert('Berhasil masuk keranjang! 🛒 '+selectedWarna);
}
function beliLangsung(){
 addToCart();
 let total=cart.reduce((a,b)=>a+b.price,0);
 let txt=`Halo Kak Aeni, mau order:%0A`;
 cart.forEach((c,i)=>{txt+=`${i+1}. ${c.name} - Rp ${c.price.toLocaleString('id-ID')}%0A`});
 txt+=`Total: Rp ${total.toLocaleString('id-ID')}`;
 window.open(`https://wa.me/6285178098354?text=${txt}`,'_blank');
}
function chatWA(){
 window.open(`https://wa.me/6285178098354?text=Halo Kak, mau tanya Arinda Hijab ${selectedWarna} ukuran ${selectedUkuran}`,'_blank');
}
updateBadge();
</script>
</body>
</html>
