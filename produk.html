<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">

<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif;font-weight:300}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(17,17,17,0.06)}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px}
.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}
.icons{display:flex;gap:20px;align-items:center}
.icon-btn{background:none;border:none;cursor:pointer;position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}
.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-2px;right:-2px;background:#111;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-menu{border-top:1px solid rgba(17,17,17,0.06);overflow-x:auto}
.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}
.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35;white-space:nowrap}
.menu a.active{opacity:1;border-bottom:1px solid #111}
.search-wrap{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;border-top:1px solid rgba(17,17,17,0.06)}
.search-wrap input{flex:1;padding:12px 0;border:none;border-bottom:1px solid #111;background:transparent;font-size:12px;outline:none}
.section{max-width:1240px;margin:0 auto;padding:20px 8px 0}
.filter-group{margin:12px 0}
.filter-label{font-size:8px;letter-spacing:3px;opacity:.4;margin-bottom:6px}
.filter{display:flex;gap:6px;flex-wrap:wrap}
.filter button{padding:7px 12px;border:1px solid var(--line);background:#fff;font-size:8px;letter-spacing:2px;cursor:pointer;border-radius:20px}
.filter button.active{background:#111!important;color:#fff!important;border-color:#111!important}
.prod-grid{display:grid!important;grid-template-columns:repeat(3,1fr)!important;gap:6px!important}
@media(min-width:700px){.prod-grid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important}}
.prod-card{border:1px solid var(--line);background:#fff;cursor:pointer;position:relative;overflow:hidden;border-radius:12px!important}
.prod-card img{width:100%!important;height:135px!important;object-fit:cover!important;display:block!important;background:#F8F4EF!important}
@media(min-width:700px){.prod-card img{height:210px!important}}
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}
#cartModal.open{display:flex}
#cartBox{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:none;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:8px}
/* FIX V69.2 - FOTO BESAR KIRI, KECIL KANAN */
#prodModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:8px}
#prodModal.show{display:flex}
.p-box{background:#fff;max-width:960px;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;max-height:94vh;border:1px solid var(--line);overflow:hidden;border-radius:18px}
.p-gallery{display:grid;grid-template-columns:1fr 74px;gap:10px;padding:10px;background:#FFFCF9;overflow:hidden}
.p-main{width:100%;aspect-ratio:4/5;overflow:hidden;display:flex;justify-content:center;background:#F8F4EF;border-radius:14px}
.p-main img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.p-thumbs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:72vh;padding-right:2px}
.p-thumbs img{width:66px;height:66px;object-fit:cover;opacity:.5;border:2px solid transparent;cursor:pointer;border-radius:10px;flex-shrink:0;background:#eee}
.p-thumbs img.active{opacity:1;border-color:#111}
.p-info{padding:18px 18px 12px;overflow:auto;background:#fff;display:flex;flex-direction:column}
@media(max-width:720px){
 .p-box{grid-template-columns:1fr;max-height:96vh;overflow-y:auto}
 .p-gallery{grid-template-columns:1fr 68px}
 .p-main{aspect-ratio:1/1}
 .p-thumbs{max-height:380px}
}
</style>
</head>
<body>
<nav>
<div class="nav-top">
<div class="logo">ARINDA<span>HIJAB PREMIUM</span></div>
<div class="icons">
<button class="icon-btn" onclick="document.getElementById('q').focus()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<button class="icon-btn" id="cartIcon" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></button>
</div>
</div>
<div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a class="active">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div>
<div class="search-wrap"><input id="q" type="search" placeholder="CARI WARNA - BABY BLUE, LILAC, NAVY, EMERALD..." oninput="doSearch()"><button onclick="doSearch()" style="background:#111;color:#fff;border:none;padding:8px 14px;border-radius:20px;font-size:8px">CARI</button></div>
</nav>
<main class="section">
<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="font-family:'Cormorant Garamond';font-size:20px;letter-spacing:2px;font-weight:300;margin:0">PRODUK READY</h1><div id="prodCount" style="font-size:9px;letter-spacing:3px;opacity:.4">LOADING...</div></div>
<div class="filter-group" style="background:#111;padding:12px;border-radius:12px">
<div class="filter-label" style="color:#fff;opacity:.7">FIND YOUR UNDERTONE - FILTER SESUAI WARNA KULIT</div>
<div class="filter" id="filterUnder">
<button class="active" onclick="filterUndertone('ALL',this)">ALL SKIN</button>
<button onclick="filterUndertone('COOL',this)">COOL ❄️</button>
<button onclick="filterUndertone('WARM',this)">WARM ☀️</button><footer style="margin-top:32px;padding:36px 16px;text-align:center;border-top:1px solid var(--line)"><div style="font-family:'Cormorant Garamond';letter-spacing:8px">ARINDA</div><div style="margin-top:14px;font-size:8px;letter-spacing:3px;opacity:.3">© 2026 ARINDA V69.2 FULL 209 BARIS</div></footer>
<div id="cartModal" onclick="if(event.target.id==='cartModal')closeCart()"><div id="cartBox"><div style="display:flex;justify-content:space-between"><b>KERANJANG (<span id="cartTotalQty">0</span>)</b><button onclick="closeCart()" style="border:none;background:none;font-size:22px">×</button></div><div id="cartList"></div><div style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:11px"><span>SUBTOTAL</span><span id="cartSubtotal">Rp0</span></div><div style="display:flex;justify-content:space-between;margin-top:8px"><b>TOTAL</b><b id="cartTotalPrice">Rp0</b></div><button onclick="checkoutWA()" class="btn" style="margin-top:12px">CHAT WA & PESAN</button></div></div></div>
<div id="prodModal" onclick="if(event.target.id=='prodModal')closeProd()"><div class="p-box" id="pBox">Loading...</div></div>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
let allProducts=[],_varMap={},activeBahan='ALL',activeWarna='ALL',activeUnder='ALL';
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){document.getElementById('cCount').innerText=getCart().reduce((a,b)=>a+(b.qty||0),0)}
function getOptImg(url,w=300){if(!url) return ''; if(url.includes('/storage/v1/object/public/')){const path=url.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${path}?width=${w}&height=${w}&quality=70&format=webp&resize=cover`;}return url;}
function getVariantUndertoneArray(v){let raw=v.undertone;if(!raw || (Array.isArray(raw)&&raw.length==0)) return [];if(Array.isArray(raw)){return raw.map(x=>String(x).replace(/[^A-Za-z]/g,'').toUpperCase()).filter(Boolean);}if(typeof raw==='string'){try{let pr=JSON.parse(raw);if(Array.isArray(pr)) return pr.map(x=>String(x).replace(/[^A-Za-z]/g,'').toUpperCase()).filter(Boolean);}catch(e){}return raw.replace(/[\\[\\]\\{\\}\"]/g,'').split(',').map(x=>x.trim().replace(/[^A-Za-z]/g,'').toUpperCase()).filter(Boolean);}return [];}
async function loadFilters(){let b=[...new Set(allProducts.map(p=>(p.category||'').toUpperCase()).filter(Boolean))];document.getElementById('filterBahan').innerHTML='<button class="active" onclick="filterBahan(\'ALL\',this)">ALL BAHAN</button>'+b.slice(0,12).map(c=>`<button onclick="filterBahan('${c}',this)">${c}</button>`).join('');const allV=Object.values(_varMap||{}).flat();let col=[...new Set(allV.map(v=>(v.color_name||'').toUpperCase()))];document.getElementById('filterWarna').innerHTML='<button class="active" onclick="filterWarna(\'ALL\',this)">ALL WARNA</button>'+col.slice(0,24).map(c=>`<button onclick="filterWarna('${c}',this)">${c}</button>`).join('');}
function filterBahan(b,btn){activeBahan=b;document.querySelectorAll('#filterBahan button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function filterWarna(w,btn){activeWarna=w;document.querySelectorAll('#filterWarna button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function filterUndertone(u,btn){activeUnder=(u||'ALL').toUpperCase();document.querySelectorAll('#filterUnder button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function doSearch(){applyFilters();}
function applyFilters(){
  const q=(document.getElementById('q').value||'').toLowerCase().trim();
  if(activeUnder!=='ALL'){
    let variantList=[];
    Object.values(_varMap).forEach(vars=>{
      vars.forEach(v=>{
        let codes=getVariantUndertoneArray(v);
        if(codes.length===0) return;
        let matchUnder=codes.includes(activeUnder);
        let matchBahan=true;
        if(activeBahan!=='ALL'){
          let prod=allProducts.find(p=>String(p.id)===String(v.product_id));
          if(prod) matchBahan=(prod.category||'').toLowerCase().includes(activeBahan.toLowerCase());
        }
        let matchWarna=true;
        if(activeWarna!=='ALL'){matchWarna=(v.color_name||'').toLowerCase().includes(activeWarna.toLowerCase());}
        let matchSearch=true;
        if(q){matchSearch=(v.color_name||'').toLowerCase().includes(q);}
        if(matchUnder&&matchBahan&&matchWarna&&matchSearch){variantList.push(v);}
      });
    });
    document.getElementById('prodCount').innerText=variantList.length+' WARNA - '+activeUnder;
    renderVariants(variantList);return;
  }
  let list=[...allProducts];
  if(activeBahan!=='ALL'){const l=activeBahan.toLowerCase();list=list.filter(p=>(p.category||'').toLowerCase().includes(l));}
  if(activeWarna!=='ALL'){const l=activeWarna.toLowerCase();list=list.filter(p=>(_varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(l)));}
  if(q){list=list.filter(p=>p.name.toLowerCase().includes(q)||(_varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(q)));}
  document.getElementById('prodCount').innerText=list.length+' PRODUK';render(list);
}
function renderVariants(vList){
  const el=document.getElementById('list');
  if(!vList.length){
    el.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:40px 8px"><div style="font-size:13px;font-weight:500">TIDAK ADA WARNA UNTUK ${activeUnder}</div><button onclick="activeUnder='ALL';document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));document.querySelectorAll('#filterUnder button')[0].classList.add('active');applyFilters()" style="margin-top:14px;padding:10px 18px;background:#111;color:#fff;border-radius:20px;font-size:9px;border:none">RESET KE ALL SKIN</button></div>`;
    return;
  }
  el.innerHTML=vList.map(v=>{
    const prod=allProducts.find(p=>String(p.id)===String(v.product_id))||{name:'Pashmina',price:0};
    const opt=getOptImg(v.image_url,400);
    const under=getVariantUndertoneArray(v).join(' + ');
    return `<div class="prod-card" onclick="openProd('${v.product_id}','${(v.color_name||'').replace(/'/g,"")}')"><div style="position:absolute;top:6px;left:6px;background:#111;color:#fff;font-size:6px;padding:4px 7px;border-radius:4px;z-index:2;letter-spacing:1px">${under}</div><img src="${opt}" loading="lazy" width="400" height="400" alt="${v.color_name}"><div style="padding:8px;border-top:1px solid #F6F1EB"><div style="font-size:9px;opacity:.5">${prod.name}</div><div style="font-size:10px;font-weight:600;margin-top:2px">${v.color_name}</div><div style="font-size:6px;opacity:.45;margin-top:3px">${under} • COCOK UNTUK ${activeUnder}</div><div style="font-size:11px;margin-top:4px;font-weight:500">Rp${Number(prod.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');
}
function render(list){
  const el=document.getElementById('list');
  if(!list.length){
    el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 0"><div style="font-size:12px;opacity:.6">TIDAK ADA PRODUK</div><button onclick="activeWarna=\'ALL\';activeBahan=\'ALL\';activeUnder=\'ALL\';document.querySelectorAll(\'.filter button\').forEach(b=>b.classList.remove(\'active\'));document.querySelectorAll(\'#filterUnder button\')[0].classList.add(\'active\');document.querySelectorAll(\'#filterBahan button\')[0].classList.add(\'active\');document.querySelectorAll(\'#filterWarna button\')[0].classList.add(\'active\');applyFilters()" style="margin-top:12px;padding:8px 14px;background:#111;color:#fff;border-radius:20px;font-size:8px">RESET FILTER</button></div>';
    return;
  }
  el.innerHTML=list.map(p=>{
    const vars=_varMap[p.id]||[];
    const opt=getOptImg(p.image_url,300);
    return `<div class="prod-card" onclick="openProd('${p.id}')"><img src="${opt}" loading="lazy" width="300" height="300"><div style="padding:7px"><div style="font-size:9px">${p.name}</div><div style="font-size:6px;opacity:.4">${vars.length} WARNA • KLIK DETAIL</div><div style="font-size:10px">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');
}
async function openProd(id,selectedColor){
  document.getElementById('prodModal').classList.add('show');
  document.getElementById('pBox').innerHTML='<div style="padding:40px;text-align:center">Loading...</div>';
  try{
    const [rP,rV]=await Promise.all([
      fetch(`${SUPA_URL}/rest/v1/products?id=eq.${id}&select=*`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}),
      fetch(`${SUPA_URL}/rest/v1/product_variants?product_id=eq.${id}&select=*&order=id`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})
    ]);
    const pArr=await rP.json(); const p=pArr[0]; const vars=await rV.json();
    let idx=0;if(selectedColor){idx=vars.findIndex(v=>v.color_name===selectedColor);if(idx<0) idx=0;}
    let curImg=vars[idx]?.image_url||p.image_url;let curColor=vars[idx]?.color_name||'';let underInfo=getVariantUndertoneArray(vars[idx]||{}).join(', ')||'BELUM DI SET';
    document.getElementById('pBox').innerHTML=`
      <div class="p-gallery">
        <div class="p-main"><img id="bigImg" src="${getOptImg(curImg,700)}"></div>
        <div class="p-thumbs">${vars.map((v,i)=>`<img src="${getOptImg(v.image_url,80)}" class="${i==idx?'active':''}" onclick="document.getElementById('bigImg').src=getOptImg('${v.image_url}',700);document.getElementById('curColorName').innerText='${(v.color_name||'').replace(/'/g,"")}';document.getElementById('curUnder').innerText='${getVariantUndertoneArray(v).join(', ')}';document.querySelectorAll('.p-thumbs img').forEach(im=>im.classList.remove('active'));this.classList.add('active');">`).join('')}</div>
      </div>
      <div class="p-info">
        <div style="display:flex;justify-content:space-between;align-items:start;gap:8px"><div style="font-size:22px;font-family:'Cormorant Garamond';font-weight:500;line-height:1.1">${p.name}</div><button onclick="closeProd()" style="border:none;background:#F6F1EB;width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer">×</button></div>
        <div style="font-size:10px;opacity:.6;margin-top:6px">Warna: <b id="curColorName" style="text-transform:uppercase">${curColor}</b> • <span id="curUnder" style="background:#111;color:#fff;padding:3px 8px;border-radius:20px;font-size:7px;letter-spacing:1px">${underInfo}</span></div>
        <div style="font-size:30px;font-weight:700;margin-top:14px">Rp${Number(p.price).toLocaleString('id-ID')}</div>
        <div style="margin-top:14px"><div style="font-size:7px;letter-spacing:2px;opacity:.4;margin-bottom:8px">PILIH WARNA - 13 WARNA</div><div style="display:flex;gap:6px;flex-wrap:wrap;max-height:130px;overflow-y:auto">${vars.map(v=>`<button onclick="document.getElementById('bigImg').src=getOptImg('${v.image_url}',700);document.getElementById('curColorName').innerText='${(v.color_name||'').replace(/'/g,"")}';document.getElementById('curUnder').innerText='${getVariantUndertoneArray(v).join(', ')}';" style="padding:7px 10px;border:1px solid #EDE8E1;background:#fff;border-radius:20px;font-size:7px">${v.color_name}</button>`).join('')}</div></div>
        <div style="margin-top:auto;padding-top:18px;display:flex;gap:10px;position:sticky;bottom:0;background:#fff">
          <button style="flex:1;padding:15px;background:#fff;color:#111;border:1.5px solid #111;border-radius:30px;font-size:9px;letter-spacing:2px;font-weight:600" onclick="addCart('${p.name} - '+document.getElementById('curColorName').innerText,${p.price},document.getElementById('bigImg').src);closeProd();openCart();">+ KERANJANG</button>
          <button style="flex:1;padding:15px;background:#111;color:#fff;border:none;border-radius:30px;font-size:9px;letter-spacing:2px;font-weight:600" onclick="window.open('https://wa.me/6285178098354?text=Halo ARINDA saya mau ${p.name} - '+document.getElementById('curColorName').innerText+' Rp${Number(p.price).toLocaleString('id-ID')}','_blank')">BELI SEKARANG</button>
        </div>
      </div>`;
  }catch(e){document.getElementById('pBox').innerHTML='ERROR: '+e.message}
}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const list=document.getElementById('cartList');const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+sub.toLocaleString('id-ID');if(!c.length){list.innerHTML='<p style="text-align:center;padding:20px">KOSONG</p>';return;}list.innerHTML=c.map(it=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #eee"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div></div></div>`).join('');}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty}%0A`;});window.open('https://wa.me/6285178098354?text='+msg,'_blank');}
async function loadProductsFetch(){try{const [rP,rV]=await Promise.all([fetch(`${SUPA_URL}/rest/v1/products?select=id,name,price,image_url,category&order=id.desc&limit=24`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}}),fetch(`${SUPA_URL}/rest/v1/product_variants?select=product_id,color_name,image_url,stock,is_available,undertone&limit=300`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}})]);const prods=await rP.json(); const vars=await rV.json();allProducts=prods||[]; _varMap={};(vars||[]).forEach(v=>{if(!_varMap[v.product_id])_varMap[v.product_id]=[];_varMap[v.product_id].push(v);});document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';await loadFilters(); updateCount(); applyFilters();}catch(e){document.getElementById('list').innerHTML='<div style="padding:20px;background:#FFE0E0;border-radius:10px">ERROR: '+e.message+'</div>';}}
loadProductsFetch();
</script>
</body>

<div id="list" class="prod-grid"></div>
</main>
