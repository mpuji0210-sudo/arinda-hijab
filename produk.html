<script>
// BAGIAN 9A: KONEKSI DATABASE
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
let supabaseClient,allProducts=[],WA_NUMBER="6285178098354",tokoOriginId="17523",selectedDestId=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[],activeBahan='ALL',activeWarna='ALL',activeUnder='ALL',confirmCb=null;
// BAGIAN 9B: FUNGSI KERANJANG
function showConfirm(t,d,cb){document.getElementById('confirmTitle').innerText=t;document.getElementById('confirmDesc').innerText=d;document.getElementById('confirmModal').classList.add('open');confirmCb=cb;}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');confirmCb=null;}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');if(el){el.innerText=getCart().reduce((a,b)=>a+(b.qty||0),0)}}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function getOptImg(url,w=300){if(!url) return ''; if(url.includes('/storage/v1/object/public/')){const path=url.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${path}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return url;}
function flyToCart(imgUrl,startEl){const cartIcon=document.getElementById('cartIcon');if(!cartIcon)return;const cartRect=cartIcon.getBoundingClientRect();let s=startEl?startEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:80,height:80};const fly=document.createElement('img');fly.src=getOptImg(imgUrl,80);fly.className='fly-img';fly.style.transform=`translate(${s.left}px,${s.top}px) scale(1)`;document.body.appendChild(fly);requestAnimationFrame(()=>{fly.style.transform=`translate(${cartRect.left}px,${cartRect.top}px) scale(0.15)`;fly.style.opacity='0';});setTimeout(()=>fly.remove(),900);}
// BAGIAN 9C: SEARCH & FILTER
function doSearch(){const q=document.getElementById('q').value.toLowerCase().trim();if(!q){applyFilters();return;}const warnaList=['hitam','maroon','navy','krem','milo','sage','dusty','olive','coksu','mocca','grey','abu'];const foundWarna=warnaList.find(w=>q.includes(w));if(foundWarna){activeWarna=foundWarna.toUpperCase();document.querySelectorAll('#filterWarna button').forEach(b=>{b.classList.toggle('active',b.innerText.trim().toLowerCase()===foundWarna)});}applyFilters(q);}
function getUndertoneArray(p){let raw=p.undertone;if(!raw)return[];if(Array.isArray(raw))return raw.map(x=>String(x).toUpperCase());if(typeof raw==='string'){try{const pr=JSON.parse(raw);if(Array.isArray(pr))return pr.map(x=>String(x).toUpperCase())}catch(e){}return raw.replace(/[\[\]\{\}"]/g,'').split(',').map(x=>x.trim().toUpperCase()).filter(Boolean)}return[];}
function normalizeUndertoneToCode(raw){const arr=Array.isArray(raw)?raw:getUndertoneArray({undertone:raw});return arr.flatMap(s=>{const low=String(s).toLowerCase();if(low.includes('cool'))return['COOL'];if(low.includes('warm'))return['WARM'];if(low.includes('neutral'))return['NEUTRAL'];if(low.includes('olive'))return['OLIVE'];return[String(s).toUpperCase()];});}
async function loadFilters(){let b=[...new Set(allProducts.map(p=>(p.category||'').toUpperCase()).filter(Boolean))];document.getElementById('filterBahan').innerHTML='<button class="active" onclick="filterBahan(\'ALL\',this)">ALL BAHAN</button>'+b.slice(0,12).map(c=>`<button onclick="filterBahan('${c}',this)">${c}</button>`).join('');const allV=Object.values(window._varMap).flat();let col=[...new Set(allV.map(v=>v.color_name.toUpperCase()))];document.getElementById('filterWarna').innerHTML='<button class="active" onclick="filterWarna(\'ALL\',this)">ALL WARNA</button>'+col.slice(0,18).map(c=>`<button onclick="filterWarna('${c}',this)">${c}</button>`).join('');}
function filterBahan(b,btn){activeBahan=b;document.querySelectorAll('#filterBahan button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function filterWarna(w,btn){activeWarna=w;document.querySelectorAll('#filterWarna button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');const qEl=document.getElementById('q'); if(w!=='ALL'&&qEl) qEl.value=w.toLowerCase(); applyFilters();}
function filterUndertone(u,btn){activeUnder=(u||'ALL').toUpperCase();document.querySelectorAll('#filterUnder button').forEach(x=>x.classList.remove('active'));if(btn)btn.classList.add('active');applyFilters();}
function applyFilters(qOverride){const q=(qOverride!==undefined? qOverride : (document.getElementById('q').value||'')).toLowerCase().trim();let list=[...allProducts];if(activeBahan!=='ALL'){const l=activeBahan.toLowerCase();list=list.filter(p=>(p.category||'').toLowerCase().includes(l));}if(activeWarna!=='ALL'){const l=activeWarna.toLowerCase();list=list.filter(p=>(window._varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(l)));}if(activeUnder!=='ALL'){list=list.filter(p=>{const codes=getUndertoneArray(p);const norm=normalizeUndertoneToCode(codes);return norm.includes(activeUnder)||codes.includes(activeUnder);});}if(q && activeWarna==='ALL'){list=list.filter(p=>p.name.toLowerCase().includes(q)||(window._varMap[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(q)));}document.getElementById('prodCount').innerText=list.length+' PRODUK';render(list);}
function handleUrlSearch(){const p=new URLSearchParams(location.search);const q=(p.get('q')||'').toLowerCase().trim();const warna=p.get('warna')||'';const ut=p.get('undertone')||'';if(warna){activeWarna=warna.toUpperCase(); const inp=document.getElementById('q'); if(inp) inp.value=warna.toLowerCase();}else if(q){const inp=document.getElementById('q'); if(inp) inp.value=q; const wl=['hitam','maroon','navy','krem','milo','sage','dusty','olive']; const f=wl.find(w=>q.includes(w)); if(f) activeWarna=f.toUpperCase();}if(ut){activeUnder=ut.toUpperCase();}setTimeout(()=>{document.querySelectorAll('#filterWarna button').forEach(b=>{if(b.innerText.trim().toUpperCase()===activeWarna) b.classList.add('active'); else if(activeWarna!=='ALL') b.classList.remove('active');});document.querySelectorAll('#filterUnder button').forEach(b=>{if(b.innerText.includes(activeUnder)) b.classList.add('active');});applyFilters();},100);}// BAGIAN 9D: RENDER PRODUK
function render(list){const el=document.getElementById('list');if(!list.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px 0">TIDAK ADA PRODUK</div>';return;}el.innerHTML=list.map((p,i)=>{const vars=window._varMap[p.id]||[];let img=p.image_url;let col=vars[0]?.color_name||'';let out=vars.length>0&&vars.every(v=>isOut(v));if(activeWarna!=='ALL'){const m=vars.find(v=>v.color_name.toLowerCase()===activeWarna.toLowerCase())||vars.find(v=>v.color_name.toLowerCase().includes(activeWarna.toLowerCase()));if(m){img=m.image_url;col=m.color_name;out=isOut(m);}}const under=getUndertoneArray(p).join(' + ')||'NEUTRAL';const opt=getOptImg(img,300);const eager=i<6?`fetchpriority="high" loading="eager" decoding="async"`:`loading="lazy" decoding="async"`;return `<div class="prod-card ${out?'out-of-stock':''}" onclick="${out?'':'openProd(\''+p.id+'\')'}">${out?'<div class="stock-badge">HABIS</div>':''}<div class="heart-btn" onclick="event.stopPropagation();${out?'':`quickAdd('${p.id}')`}"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}" src="${opt}" ${eager} width="300" height="300" alt="${p.name}"><div style="padding:7px;border-top:1px solid #F6F1EB"><div style="font-size:9px;font-family:'Cormorant Garamond';line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="font-size:6px;opacity:.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${under} • ${col}</div><div style="font-size:10px;margin-top:3px;font-weight:400">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;}).join('');}
function quickAdd(id){const p=allProducts.find(x=>String(x.id)===String(id));const vars=window._varMap[id]||[];let v=vars[0];if(activeWarna!=='ALL'){const mf=vars.find(x=>x.color_name.toLowerCase()===activeWarna.toLowerCase())||vars.find(x=>x.color_name.toLowerCase().includes(activeWarna.toLowerCase()));if(mf)v=mf;}if(v&&isOut(v))return;flyToCart(v?v.image_url:p.image_url,document.getElementById('img-'+id));addCart(p.name+' - '+v.color_name,p.price,v?v.image_url:p.image_url);showCartToast(v.color_name,v?v.image_url:p.image_url);}
// BAGIAN 9E: MODAL PRODUK FIX FOTO BESAR KIRI KECIL KANAN V69.3
async function openProd(id){document.getElementById('prodModal').classList.add('show');document.getElementById('pBox').innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:p.category||'KREM',image_url:p.image_url,stock:1}];curColor=curVariants[0].color_name;curImg=curVariants[0].image_url;document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}" width="600" height="600" alt="${p.name}"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})" alt="${v.color_name}">`).join('')}</div></div><div class="p-info"><div style="font-size:20px;font-family:'Cormorant Garamond'">${p.name}</div><div style="font-size:28px;margin-top:4px">Rp${Number(p.price).toLocaleString('id-ID')}</div><div style="margin-top:12px;font-size:9px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${curColor}</b></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${curVariants.map((v,i)=>`<button id="btn-${i}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})" style="padding:10px 14px;border:1px solid ${v.image_url===curImg?'#111':'#eee'};background:${v.image_url===curImg?'#111':'#fff'};color:${v.image_url===curImg?'#fff':'#111'};border-radius:6px;font-size:8px;letter-spacing:1px">${v.color_name} ${isOut(v)?'- HABIS':''}</button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="background:#fff;color:#111;border:1px solid #111" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI</button></div></div></div>`;}
function pickColor(c,i,idx){curColor=c;curImg=i;document.getElementById('bigImg').src=getOptImg(i,600);document.getElementById('selCol').innerText=c;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j==idx));document.querySelectorAll('[id^="btn-"]').forEach((b,j)=>{const active=j===idx;b.style.background=active?'#111':'#fff';b.style.color=active?'#fff':'#111';b.style.borderColor=active?'#111':'#eee';});}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showCartToast(c,i){const t=document.getElementById('cartToast');document.getElementById('toastImg').src=getOptImg(i,80);document.getElementById('toastText').innerText=c+' MASUK KERANJANG';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur))return;flyToCart(curImg,document.getElementById('bigImg'));addCart(curProd.name+' - '+curColor,curProd.price,curImg);showCartToast(curColor,curImg);}
function buyFromModal(){let msg=`Halo ARINDA %0ASaya mau beli:%0A- ${curProd.name} - ${curColor} = Rp${Number(curProd.price).toLocaleString('id-ID')}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const list=document.getElementById('cartList');const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPrice').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');if(!c.length){list.innerHTML='<p style="text-align:center;padding:20px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2EFEA"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function askClearCart(){showConfirm('KOSONGKAN?','Hapus semua?',()=>{saveCart([]);selectedOngkirCost=0;});}
async function searchDest(){const q=document.getElementById('destSearch').value.trim();if(!q)return;const dl=document.getElementById('destList');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee" onclick="pilihDest('${d.id}','${d.label.replace(/'/g,'')}')">${d.label}</div>`).join('');}catch(e){dl.innerHTML='ERROR';}}
function pilihDest(id,label){selectedDestId=id;document.getElementById('destSearch').value=label;document.getElementById('destList').innerHTML='<div style="padding:10px;background:var(--bg);border-radius:6px">'+label+'</div>';}
async function cekOngkir(){if(!selectedDestId)return;document.getElementById('ongkirResult').innerHTML='MENGECEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelect').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:(arr.costs||[]);let h='';list.forEach(c=>{h+=`<div onclick="setOngkir(${c.cost||0},'${c.service}','${c.etd}')" style="padding:10px;border:1px solid #ddd;margin:4px 0;cursor:pointer;border-radius:6px"><b>${c.service}</b> - Rp${Number(c.cost).toLocaleString('id-ID')} (${c.etd} hari)</div>`;});document.getElementById('ongkirResult').innerHTML=h;}catch(e){document.getElementById('ongkirResult').innerHTML='ERROR';}}
function setOngkir(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirLabel').innerText=selectedService;renderCart();}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`Total: Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
document.getElementById('confirmOk').onclick=()=>{if(confirmCb)confirmCb();closeConfirm();};
</script>
<!-- BAGIAN 10: LOAD DATA DARI SUPABASE -->
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" onload="(async()=>{supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);const {data:all}=await supabaseClient.from('products').select('id,name,price,image_url,category,undertone').order('id',{ascending:false}).limit(24);const {data:vars}=await supabaseClient.from('product_variants').select('product_id,color_name,image_url,stock,is_available').limit(200);allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{if(!window._varMap[v.product_id])window._varMap[v.product_id]=[];window._varMap[v.product_id].push(v);});document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';await loadFilters();updateCount();handleUrlSearch();})()"></script>
