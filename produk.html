<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produk - ARINDA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:sans-serif}
nav{position:sticky;top:0;z-index:99;background:#FFFCF9F2;border-bottom:1px solid var(--champ)}
.nav-in{max-width:1120px;margin:0 auto;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}
.logo{font-weight:700;letter-spacing:4px}.menu{display:flex;gap:12px}.menu a{font-size:11px;letter-spacing:1.5px;color:var(--taupe);text-decoration:none}.menu a.active{color:#2B1B12;border-bottom:1.5px solid #2B1B12}
.section{max-width:1120px;margin:0 auto;padding:16px 14px}
.prod-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.prod{border:1px solid var(--champ);background:#fff;border-radius:10px;overflow:hidden}
.prod img{width:100%;height:210px;object-fit:cover;display:block}
.prod-info{padding:10px}.price{font-weight:700;color:var(--taupe);margin-top:4px}
.btn{display:block;background:#2B1B12;color:#fff;padding:10px;text-align:center;font-size:11px;letter-spacing:1px;text-decoration:none;margin-top:8px;border-radius:6px}
</style></head><body>
<nav><div class="nav-in"><div class="logo" id="storeLogo">ARINDA</div><div class="menu"><a href="index.html">BERANDA</a><a class="active">PRODUK</a><a href="kontak.html">KONTAK</a></div></div></nav>
<div class="section">
<h2 style="font-size:20px;margin:0">Semua Produk Ready Stock</h2>
<p style="font-size:11px;color:#8C7A6B;letter-spacing:1px">Otomatis dari Admin - Upload dari HP</p>
<div id="list" class="prod-grid">Loading...</div>
</div>
<script>
const SUPABASE_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPABASE_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
async function load(){
 const {data:set}=await supabaseClient.from('settings').select('*').eq('id',1).single();
 if(set?.store_name) document.getElementById('storeLogo').innerText=set.store_name;
 const {data}=await supabaseClient.from('products').select('*').order('created_at',{ascending:false});
 if(!data||data.length==0){ document.getElementById('list').innerHTML='<p>Belum ada produk. Tambah di admin.html</p>'; return; }
 let html=''; 
 data.forEach(p=>{
  html+=`<div class="prod"><img src="${p.image_url}"><div class="prod-info"><b>${p.name}</b><div style="font-size:12px;color:#666">${p.description||''}</div><div class="price">Rp${Number(p.price).toLocaleString('id-ID')}</div><a href="https://wa.me/${set?.wa_number||'628123456789'}?text=Halo kak mau pesan ${p.name}" class="btn">PESAN VIA WA</a></div></div>`;
 });
 document.getElementById('list').innerHTML=html;
}
load();
</script>
</body></html>
