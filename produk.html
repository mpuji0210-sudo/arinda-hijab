<style>body{margin:0;background:#fff;color:#000;font-family:'Inter',sans-serif;font-weight:300}*{box-sizing:border-box}nav{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-bottom:1px solid #E9E9E9}.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:'Cormorant Garamond';letter-spacing:8px;font-size:21px;text-transform:uppercase}.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}.icon-btn{background:none;border:none;cursor:pointer;position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}.icon-btn svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:1.1}.badge{position:absolute;top:-2px;right:-2px;background:#000;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}.nav-menu{border-top:1px solid #F2F2F2;overflow-x:auto}.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#000;text-decoration:none;padding:13px 0;opacity:.35}.menu a.active{opacity:1;border-bottom:1px solid #000}.search-clean{max-width:1240px;margin:0 auto;padding:0 20px}.search-clean input{width:100%;padding:16px 0;border:none;border-bottom:1px solid #E9E9E9;background:transparent;font-size:12px;outline:none;letter-spacing:2px;opacity:.6}.section{max-width:1240px;margin:0 auto;padding:20px 8px 0}.prod-grid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:1px!important;background:#E9E9E9;border:1px solid #E9E9E9}@media(min-width:700px){.prod-grid{grid-template-columns:repeat(4,1fr)!important}}.prod-card{background:#fff;cursor:pointer;position:relative;overflow:hidden}.prod-card img{width:100%!important;height:200px!important;object-fit:cover!important;display:block!important}.heart-btn{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #E9E9E9;z-index:2}.heart-btn svg{width:11px;height:11px;stroke:#000;fill:none;stroke-width:1.2}.fly-img{position:fixed;left:0;top:0;z-index:99999;width:68px;height:68px;object-fit:cover;border-radius:50%;pointer-events:none;box-shadow:0 16px 32px rgba(0,0,0,.3);border:3px solid #fff;transition:all.75s cubic-bezier(.4,0,.2,1)}@keyframes cartBoom{0%{transform:scale(1)}30%{transform:scale(1.38)}60%{transform:scale(.9)}100%{transform:scale(1)}}.cart-boom{animation:cartBoom.38s cubic-bezier(.34,1.56,.64,1)!important}#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:200;align-items:flex-end}#cartModal.open{display:flex}#cartBox{background:#fff;width:100%;max-width:440px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:20px 16px}.btn{width:100%;padding:14px;background:#000;color:#fff;border:none;font-size:9px;letter-spacing:3px;cursor:pointer}.btn-light{width:100%;padding:12px;background:#fff;border:1px solid #000;font-size:9px;letter-spacing:2px;cursor:pointer;margin-top:8px}#prodModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;align-items:center;justify-content:center;padding:12px}#prodModal.show{display:flex}.p-box{background:#fff;max-width:960px;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;max-height:90vh;border:1px solid #E9E9E9;overflow:hidden}.p-gallery{display:grid;grid-template-columns:1fr 66px;gap:10px;padding:12px;background:#fff}.p-main{width:100%;height:320px;overflow:hidden;display:flex;justify-content:center;background:#FAFAFA;border:1px solid #F2F2F2}.p-main img{width:100%;height:100%;object-fit:cover;display:block}.p-thumbs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;height:320px}.p-thumbs img{width:60px;height:60px;object-fit:cover;opacity:.55;border:1px solid #E9E9E9;cursor:pointer}.p-thumbs img.active{opacity:1;border-color:#000}.p-info{padding:18px 20px;overflow:auto;max-height:90vh;display:flex;flex-direction:column;background:#fff;border-left:1px solid #F2F2F2}.variant-wrap{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:110px;overflow-y:auto}.variant-wrap button{padding:10px 14px;border:1px solid #E9E9E9;background:#fff;color:#000;font-size:9px;letter-spacing:1px;cursor:pointer;text-transform:uppercase}.variant-wrap button.active{background:#000;color:#fff;border-color:#000}.under-badge{display:inline-block;padding:4px 8px;background:#000;color:#fff;font-size:7px;letter-spacing:1px;margin:2px}@media(max-width:800px){.p-box{grid-template-columns:1fr;max-height:92vh;overflow:auto}.p-info{border-left:none;border-top:1px solid #F2F2F2}}#confirmModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:500;align-items:center;justify-content:center;padding:20px}#confirmModal.show{display:flex}#confirmBox{background:#fff;width:100%;max-width:360px;border:1px solid #E9E9E9;padding:22px}#cartToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:10px 18px;display:flex;align-items:center;gap:12px;z-index:9999;transition:.5s;opacity:0;border-radius:20px}#cartToast.show{transform:translateX(-50%) translateY(0);opacity:1}#ongkirLockModal{display:none;position:fixed;inset:0;background:rgba(20,15,10,.55);backdrop-filter:blur(12px);z-index:9999;align-items:center;justify-content:center;padding:20px}#ongkirLockModal.show{display:flex}</style></head><body>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';let supabaseClient,allProducts=[],tokoOriginId=ORIGIN_ID_CACHE,tokoOriginLabel=ORIGIN_LABEL_CACHE,selectedDestId=null,selectedDestIdCart=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[],lastQuery='';
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');let t=getCart().reduce((a,b)=>a+(b.qty||0),0);el.innerText=t;el.style.display=t>0?'flex':'none';}
function clearCart(){document.getElementById('confirmModal').classList.add('show');}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');}
function doClearCart(){saveCart([]);selectedOngkirCost=0;selectedService='';closeConfirm();sessionStorage.removeItem('checkout_ongkir');localStorage.removeItem('checkout_ongkir_backup');}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function hasReady(pid){const vars=window._varMap[pid]||[];return vars.some(v=>!isOut(v));}
function getOptImg(u,w=300){if(!u) return ''; if(u.includes('/storage/v1/object/public/')){const p=u.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return u;}
function flyToCart(imgUrl,startEl){document.querySelectorAll('.fly-img').forEach(e=>e.remove());const cartIcon=document.getElementById('cartIcon');if(!cartIcon)return;const cartRect=cartIcon.getBoundingClientRect();const targetX=cartRect.left+cartRect.width/2-34-6;const targetY=cartRect.top+cartRect.height/2-34-4;let rect=startEl?startEl.getBoundingClientRect():{left:innerWidth/2-34,top:innerHeight/2-34,width:68,height:68};const fly=document.createElement('img');fly.src=getOptImg(imgUrl,120);fly.className='fly-img';fly.style.left=(rect.left+rect.width/2-34)+'px';fly.style.top=(rect.top+rect.height/2-34)+'px';document.body.appendChild(fly);requestAnimationFrame(()=>{requestAnimationFrame(()=>{fly.style.left=targetX+'px';fly.style.top=targetY+'px';fly.style.transform='scale(0.14)';fly.style.opacity='0.15';});});setTimeout(()=>{fly.remove();cartIcon.classList.remove('cart-boom');void cartIcon.offsetWidth;cartIcon.classList.add('cart-boom');setTimeout(()=>cartIcon.classList.remove('cart-boom'),420);},720);}
function normalizeUnder(arr){if(!arr)return[];let a=Array.isArray(arr)?arr:[arr];try{if(typeof arr==='string'&&arr.startsWith('['))a=JSON.parse(arr);}catch(e){}return a.map(x=>String(x).toUpperCase().trim()).filter(Boolean);}
function underBadgeHtml(arr){if(!arr||!arr.length)return'';return normalizeUnder(arr).map(u=>`<span class="under-badge">${u}</span>`).join('');}
function isUnderMatch(v,target){return normalizeUnder(v.undertone||[]).includes(target.toUpperCase().trim());}
function getMatchedVariant(pid,q){
  const vars=window._varMap[pid]||[];
  if(!vars.length) return null;
  if(q){
    let qq=q.toLowerCase().trim();
    if(["cool","warm","neutral","olive"].includes(qq)){
      let byUnder=vars.find(v=> isUnderMatch(v,qq) &&!isOut(v));
      if(byUnder) return byUnder;
    }
    let exact=vars.find(v=> (v.color_name||'').toLowerCase().trim()===qq);
    if(exact &&!isOut(exact)) return exact;
    let inc=vars.find(v=> (v.color_name||'').toLowerCase().includes(qq) &&!isOut(v));
    if(inc) return inc;
    let incAny=vars.find(v=> (v.color_name||'').toLowerCase().includes(qq));
    if(incAny) return incAny;
  }
  return vars.find(v=>!isOut(v))||vars[0]||null;
}
function doSearch(){
  let raw=document.getElementById('q').value.trim().toLowerCase();
  lastQuery=raw;
  if(!raw){renderProducts(allProducts,'');return;}
  let filtered=allProducts.filter(p=>{
    const vars=window._varMap[p.id]||[];
    return p.name.toLowerCase().includes(raw) || vars.some(v=> v.color_name.toLowerCase().includes(raw) || normalizeUnder(v.undertone).join(' ').toLowerCase().includes(raw));
  });
  renderProducts(filtered,raw);
}
function renderProducts(list,q=''){
  const el=document.getElementById('list');
  const readyOnly=(list||[]).filter(p=>hasReady(p.id));
  if(!readyOnly.length){el.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;border:1px solid #E9E9E9"><div style="font-size:11px;letter-spacing:2px">TIDAK ADA PRODUK READY UNTUK "'+esc(q||lastQuery||'KATEGORI INI')+'"</div><div style="font-size:9px;opacity:.4;margin-top:8px">Belum ada produk di kategori ini</div><a href="produk.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #000;font-size:9px;text-decoration:none;color:#000;letter-spacing:2px">LIHAT SEMUA PRODUK</a></div>';document.getElementById('prodCount').innerText='0 PRODUK';return;}
  const query = q || lastQuery || '';
  el.innerHTML=readyOnly.map((p,i)=>{
    const m=getMatchedVariant(p.id,query)||{image_url:p.image_url,color_name:p.name,stock:1,undertone:p.undertone};
    return `<div class="prod-card"><div style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:7px;padding:4px 6px;z-index:2">SISA ${m.stock??0}</div><div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}',this,${i},'${esc(m.color_name)}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}-${i}" src="${getOptImg(m.image_url,400)}" loading="lazy" onclick="openProd('${p.id}','${esc(m.color_name)}')"><div style="padding:8px;border-top:1px solid #F2F2F2" onclick="openProd('${p.id}','${esc(m.color_name)}')"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.color_name)}</div><div style="margin-top:2px">${underBadgeHtml(m.undertone||p.undertone||[])}</div><div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');document.getElementById('prodCount').innerText=readyOnly.length+' PRODUK';
}
function showToast(t){const el=document.getElementById('cartToast');document.getElementById('toastText').innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function quickAdd(id,btnEl,idx,colorName){const p=allProducts.find(x=>String(x.id)===String(id));const vars=window._varMap[id]||[];let v=vars.find(x=>x.color_name===colorName)||getMatchedVariant(id,lastQuery);if(!v||isOut(v)){showToast('Habis');return;}const imgEl=document.getElementById(`img-${id}-${idx}`)||btnEl?.closest('.prod-card')?.querySelector('img');if(imgEl)flyToCart(v.image_url,imgEl);addCart(p.name+' - '+v.color_name,p.price,v.image_url);showToast(v.color_name+' masuk keranjang');}
async function openProd(id,colorName){
  document.getElementById('prodModal').classList.add('show');
  document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main">MEMUAT...</div></div><div class="p-info">MEMUAT...</div>`;
  const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();
  const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');
  curProd=p;curVariants=(vars||[]).filter(v=>!isOut(v));
  if(!curVariants.length){document.getElementById('pBox').innerHTML='<div style="padding:40px;text-align:center">HABIS</div>';return;}
  let initial=curVariants.find(v=>v.color_name===colorName)||getMatchedVariant(id,colorName)||curVariants[0];
  curColor=initial.color_name;curImg=initial.image_url;
  document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<div style="position:relative"><img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})"><span style="position:absolute;bottom:2px;left:2px;background:#000;color:#fff;font-size:5px;padding:2px 3px">SISA ${v.stock??0}</span></div>`).join('')}</div></div><div class="p-info"><div style="font-size:22px;font-family:'Cormorant Garamond'">${esc(p.name)}</div><div style="margin-top:6px">${underBadgeHtml(initial.undertone||p.undertone||[])}</div><div style="font-size:20px;margin-top:6px">Rp${Number(p.price).toLocaleString('id-ID')}</div><div style="margin-top:14px;font-size:8px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${esc(curColor)}</b></div><div class="variant-wrap">${curVariants.map((v,i)=>`<button id="btn-${i}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})">${esc(v.color_name)}</button>`).join('')}</div><div style="margin-top:16px;background:#FAFAFA;border:1px solid #F0EBE3;padding:10px"><div style="display:flex;gap:6px"><input id="destSearchProd" placeholder="Kota tujuan" style="flex:1;padding:11px;border:1px solid #111;background:#fff;font-size:12px"><button onclick="searchDestProd()" style="padding:11px 14px;background:#000;color:#fff;border:none;font-size:8px">CEK</button></div><div id="destListProd" style="display:none;margin-top:8px;max-height:100px;overflow:auto;background:#fff;border:1px solid #E9E9E9"></div><div style="display:flex;gap:6px;margin-top:8px"><select id="courierSelectProd" style="flex:1;padding:10px;border:1px solid #E9E9E9;font-size:11px"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="sicepat">SiCepat</option><option value="pos">POS</option></select><button onclick="cekOngkirProd()" style="flex:1;padding:10px;background:#fff;border:1px solid #000;font-size:8px">CEK ONGKIR</button></div><div id="ongkirResultProd" style="margin-top:8px"></div><div id="ongkirSelectedProd" style="margin-top:8px;font-size:10px;font-weight:600"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI SEKARANG</button></div></div>`;
}
function pickColorByIdx(idx){const v=curVariants[idx];if(!v)return;curColor=v.color_name;curImg=v.image_url;const big=document.getElementById('bigImg');if(big)big.src=getOptImg(v.image_url,600);document.getElementById('selCol').innerText=v.color_name;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j===idx));document.querySelectorAll('.variant-wrap button').forEach((b,j)=>b.classList.toggle('active',j===idx));}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(!cur||isOut(cur)){showToast('Habis');return;}const big=document.getElementById('bigImg');if(big)flyToCart(curImg,big);addCart(curProd.name+' - '+curColor,curProd.price,curImg);showToast(curColor+' masuk keranjang');}
function wajibCekOngkir(){if(!selectedOngkirCost||selectedOngkirCost<5000){document.getElementById('ongkirLockModal').classList.add('show');return false;}return true;}
function closeOngkirLock(){document.getElementById('ongkirLockModal').classList.remove('show');openCart();}
function buyFromModal(){if(!wajibCekOngkir())return;addCart(curProd.name+' - '+curColor,curProd.price,curImg);if(!saveOngkirLS())return;window.location.href='checkout.html';}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1){c[idx].qty++;}else{c.push({warna:n,qty:1,harga:Number(p),img:i});}saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';const list=document.getElementById('cartList');if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2F2F2;align-items:center"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${esc(it.warna)}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function saveOngkirLS(){const cityCart=document.getElementById('destCityCart')?.value||'';const cityProd=document.getElementById('destSearchProd')?.value||'';const finalCity=cityCart||cityProd||'';const finalDestId=selectedDestIdCart||selectedDestId||'';if(!finalCity){showToast('Pilih kota dulu');return false;}const payload={city:finalCity,cost:selectedOngkirCost,service:selectedService,origin:tokoOriginLabel,origin_id:tokoOriginId,destination_id:finalDestId};sessionStorage.setItem('checkout_ongkir',JSON.stringify(payload));localStorage.setItem('checkout_ongkir_backup',JSON.stringify(payload));return true;}
async function searchDestCart(){const q=document.getElementById('destCityCart').value.trim();if(!q||q.length<3){showToast('Ketik 3 huruf');return;}const dl=document.getElementById('destListCart');dl.style.display='block';dl.innerHTML='<div style="padding:10px;font-size:10px">MENCARI...</div>';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestCart('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='Gagal';}}
function pilihDestCart(id,label){selectedDestIdCart=id;document.getElementById('destCityCart').value=label;document.getElementById('destListCart').style.display='none';cekOngkirCartReal();}
async function cekOngkirCartReal(){if(!selectedDestIdCart)return;const box=document.getElementById('ongkirOptionsCart');box.style.display='block';box.innerHTML='CEK ONGKIR...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestIdCart,weight:1000,courier:'jne'})});const data=await res.json();const list=data.data||data.costs||[];const arr=Array.isArray(list)?list:list.costs||[];box.innerHTML=arr.map(c=>`<label style="display:flex;justify-content:space-between;padding:10px;border:1px solid #000;margin-top:6px;cursor:pointer"><span style="font-size:10px"><b>${esc(c.service)}</b></span><span><b>Rp${Number(c.cost).toLocaleString('id-ID')}</b> <input type="radio" name="ongkirCart" onchange="pilihOngkirCart(${c.cost},'${esc(c.service)}')"></span></label>`).join('');}catch(e){box.innerHTML='Gagal';}}
function pilihOngkirCart(cost,service){selectedOngkirCost=Number(cost);selectedService=service;saveOngkirLS();renderCart();}
async function searchDestProd(){const q=document.getElementById('destSearchProd').value.trim();if(!q||q.length<3){showToast('Min 3 huruf');return;}const dl=document.getElementById('destListProd');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestProd('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='GAGAL';}}
function pilihDestProd(id,label){selectedDestId=id;document.getElementById('destSearchProd').value=label;document.getElementById('destListProd').style.display='none';}
async function cekOngkirProd(){if(!selectedDestId){showToast('Pilih kota dulu');return;}document.getElementById('ongkirResultProd').innerHTML='CEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelectProd').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:arr.costs||[];let h='';list.forEach(c=>{h+=`<div onclick="setOngkirProd(${c.cost},'${esc(c.service)}','${esc(c.etd)}')" style="padding:10px;border:1px solid #000;margin:4px 0;cursor:pointer;font-size:11px"><b>${esc(c.service)}</b> - Rp${Number(c.cost).toLocaleString('id-ID')}</div>`;});document.getElementById('ongkirResultProd').innerHTML=h||'TIDAK ADA';}catch(e){document.getElementById('ongkirResultProd').innerHTML='ERROR';}}
function setOngkirProd(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirSelectedProd').innerHTML=`✓ ${esc(selectedService)} - Rp${selectedOngkirCost.toLocaleString('id-ID')}`;document.getElementById('ongkirResultProd').innerHTML='';renderCart();saveOngkirLS();}
function checkoutWA(){const c=getCart();if(!c.length){showToast('Keranjang kosong');return;}if(!wajibCekOngkir())return;if(!saveOngkirLS()){openCart();return;}window.location.href='checkout.html';}
</script>
<script>
(async()=>{
  supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);
  let storeName='';try{const {data:cfg}=await supabaseClient.from('settings').select('key,value').in('key',['store_name','wa_number','toko_origin_id','toko_origin_label']);const get=k=>cfg?.find(s=>s.key===k)?.value||'';storeName=get('store_name')||'TOKO';const sWa=get('wa_number');const sId=get('toko_origin_id');const sLabel=get('toko_origin_label');if(sWa) localStorage.setItem('wa_number_cache',sWa);if(sId){tokoOriginId=sId;localStorage.setItem('toko_origin_id',sId);}if(sLabel){tokoOriginLabel=sLabel;localStorage.setItem('store_origin_label',sLabel);}}catch(e){storeName=localStorage.getItem('store_name_cache')||'TOKO';}
  document.getElementById('storeLogo').innerHTML=(storeName||'TOKO').toUpperCase()+'<span>HIJAB PREMIUM</span>';
  document.getElementById('footLogo').innerText=(storeName||'TOKO').toUpperCase();
  document.title='PRODUK - '+(storeName||'TOKO').toUpperCase();
  localStorage.setItem('store_name_cache',storeName);
  const {data:all}=await supabaseClient.from('products').select('*').order('id',{ascending:false}).limit(100);
  const {data:vars}=await supabaseClient.from('product_variants').select('product_id,color_name,image_url,stock,is_available,undertone').limit(800);
  allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{const key=(v.color_name||'').toLowerCase().trim()+'|'+(v.image_url||'');if(!window._varMap[v.product_id]){window._varMap[v.product_id]=[];window._varMap[v.product_id]._seen=new Set();}if(window._varMap[v.product_id]._seen.has(key))return;window._varMap[v.product_id]._seen.add(key);window._varMap[v.product_id].push(v);});
  const params=new URLSearchParams(location.search);
  const kat=params.get('kategori');
  const bah=params.get('bahan');
  const under=params.get('undertone');
  const qParam=params.get('warna')||params.get('q')||'';

  if(under){
    const U = under.toUpperCase().trim();
    lastQuery=under.toLowerCase();
    document.getElementById('q').value=under;
    const titleEl=document.querySelector('h1');
    if(titleEl) titleEl.innerText='PRODUK ' + U;
    const el=document.getElementById('list');
    let variantList=[];
    allProducts.forEach(p=>{
      (window._varMap[p.id]||[]).forEach(v=>{
        if(!isOut(v) && normalizeUnder(v.undertone).includes(U)){
          variantList.push({product:p, variant:v});
        }
      });
    });
    if(!variantList.length){
      el.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center;border:1px solid #E9E9E9"><div style="font-size:11px;letter-spacing:2px">TIDAK ADA WARNA UNTUK UNDERTONE "'+esc(under)+'"</div><a href="produk.html" style="display:inline-block;margin-top:14px;padding:10px 18px;border:1px solid #000;font-size:9px;text-decoration:none;color:#000;letter-spacing:2px">LIHAT SEMUA</a></div>';
      document.getElementById('prodCount').innerText='0 PRODUK';
    }else{
      el.innerHTML=variantList.map(({product:p,variant:m},i)=>`
        <div class="prod-card">
          <div style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:7px;padding:4px 6px;z-index:2">SISA ${m.stock??0}</div>
          <div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}',this,${i},'${esc(m.color_name)}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div>
          <img src="${getOptImg(m.image_url,400)}" loading="lazy" onclick="openProd('${p.id}','${esc(m.color_name)}')">
          <div style="padding:8px;border-top:1px solid #F2F2F2" onclick="openProd('${p.id}','${esc(m.color_name)}')">
            <div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.color_name)}</div>
            <div style="margin-top:2px">${underBadgeHtml(m.undertone)}</div>
            <div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div>
          </div>
        </div>`).join('');
      document.getElementById('prodCount').innerText=variantList.length+' WARNA';
    }
  }else if(kat){
    lastQuery=kat.toLowerCase(); document.getElementById('q').value=kat;
    const KU=kat.toUpperCase().trim();
    const filtered=allProducts.filter(p=> (p.product_type||'').toUpperCase()===KU || (p.jenis||'').toUpperCase()===KU);
    renderProducts(filtered, kat);
  }else if(bah){
    lastQuery=bah.toLowerCase(); document.getElementById('q').value=bah;
    const BU=bah.toUpperCase().trim();
    const filtered=allProducts.filter(p=> (p.category||'').toUpperCase()===BU || (p.bahan||'').toUpperCase()===BU);
    renderProducts(filtered, bah);
  }else if(qParam){
    document.getElementById('q').value=qParam;lastQuery=qParam.toLowerCase();
    renderProducts(allProducts,lastQuery);
  }else{
    renderProducts(allProducts,'');
  }
  updateCount();renderCart();
})();
</script></body></html>
