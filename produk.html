<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif;font-weight:300}

.prod-card img{width:100%!important;height:135px!important;aspect-ratio:1/1!important;object-fit:cover!important;object-position:center top!important;display:block!important;background:#F8F4EF!important}

.heart-btn{position:absolute;top:6px;right:6px;width:24px;height:24px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);z-index:2}

#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}#cartModal.open{display:flex}
#cartBox{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:85vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:none;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:8px}
.btn-light{width:100%;padding:11px;background:#fff;border:1px solid var(--line);font-size:9px;letter-spacing:2px;cursor:pointer;margin-top:8px;border-radius:8px}
#prodModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:8px}#prodModal.show{display:flex}
.p-box{background:#fff;max-width:960px;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;max-height:94vh;border:1px solid var(--line);overflow:hidden;border-radius:18px}
.p-gallery{display:grid;grid-template-columns:1fr 74px;gap:10px;padding:10px;background:#FFFCF9;overflow:hidden}
.p-main{width:100%;aspect-ratio:4/5;overflow:hidden;display:flex;justify-content:center;background:#F8F4EF;border-radius:14px}.p-main img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.p-thumbs{display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:72vh}.p-thumbs img{width:66px;height:66px;object-fit:cover;opacity:.5;border:2px solid transparent;cursor:pointer;border-radius:10px;background:#eee}
.p-thumbs img.active{opacity:1;border-color:#111}.p-info{padding:18px 18px 12px;overflow:auto;background:#fff;display:flex;flex-direction:column}
@media(max-width:720px){.p-box{grid-template-columns:1fr;max-height:96vh;overflow-y:auto}.p-gallery{grid-template-columns:1fr 68px}.p-main{aspect-ratio:1/1}.p-thumbs{max-height:380px}}
#cartToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#111;color:#fff;padding:10px 18px;border-radius:30px;display:flex;align-items:center;gap:12px;z-index:9999;transition:.5s;opacity:0}
#cartToast.show{transform:translateX(-50%) translateY(0);opacity:1}#cartToast img{width:32px;height:32px;border-radius:50%;object-fit:cover}
#confirmModal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;display:none;align-items:center;justify-content:center;padding:20px}#confirmModal.open{display:flex}
.confirm-box{background:#fff;padding:22px;max-width:340px;width:100%;text-align:center;border:1px solid var(--line);border-radius:12px}
</style></head><body>

</div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a class="active">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div></nav>

<main style="max-width:1280px;margin:0 auto;padding:16px">

<div style="display:flex;gap:10px;align-items:center;margin:12px 0 18px">
<input id="q" onkeyup="if(event.key==='Enter')doSearch()" placeholder="CARI WARNA - MIS: PUTIH, NAVY, BLUSH" style="flex:1;padding:14px 20px;border:1px solid #111;border-radius:30px;font-size:12px;letter-spacing:1px;outline:none">

<div style="display:flex;justify-content:space-between;align-items:center"><b>KERANJANG (<span id="cartTotalQty">0</span>)</b><button onclick="closeCart()" style="border:none;background:none;font-size:22px">×</button></div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
let supabaseClient,allProducts=[],WA_NUMBER="6285178098354",curProd={},curColor='',curImg='',curVariants=[],activeWarna='ALL',activeUnder='ALL',confirmCb=null;
function showConfirm(t,d,cb){document.getElementById('confirmTitle').innerText=t;document.getElementById('confirmDesc').innerText=d;document.getElementById('confirmModal').classList.add('open');confirmCb=cb;}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('open');confirmCb=null;}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');if(el)el.innerText=getCart().reduce((a,b)=>a+(b.qty||0),0);}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function getOptImg(u,w=300){if(!u) return ''; if(u.includes('/storage/v1/object/public/')){const p=u.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return u;}
function flyToCart(imgUrl,startEl){const cartIcon=document.getElementById('cartIcon');if(!cartIcon)return;const cartRect=cartIcon.getBoundingClientRect();let s=startEl?startEl.getBoundingClientRect():{left:innerWidth/2,top:innerHeight/2,width:80,height:80};const fly=document.createElement('img');fly.src=getOptImg(imgUrl,80);fly.className='fly-img';fly.style.transform=`translate(${s.left}px,${s.top}px) scale(1)`;document.body.appendChild(fly);requestAnimationFrame(()=>{fly.style.transform=`translate(${cartRect.left}px,${cartRect.top}px) scale(0.15)`;fly.style.opacity='0';});setTimeout(()=>fly.remove(),900);}
const COCOK_UNTUK={COOL:['PUTIH','WHITE','NAVY','BLUE','ABU','GREY','LILAC','PLUM','BURGUNDY','ROSE','PINK','CHARCOAL','HITAM','BLACK','DUSTY','ASH'],WARM:['KREM','CREAM','MILO','MUSTARD','CARAMEL','OLIVE','BROWN','COKSU','MAROON','PEACH','CORAL','BEIGE','MOCCA','BLUSH'],NEUTRAL:['HITAM','PUTIH','KREM','ABU','BEIGE','NUDE','IVORY','MOCCA','GREY'],OLIVE:['OLIVE','SAGE','ARMY','GREEN','KHAKI','MOSS','FOREST','EMERALD','CHARCOAL']};
function doSearch(){applyFilters(document.getElementById('q').value.toLowerCase().trim());}
function applyFilters(qOverride){
  const q=(qOverride!==undefined?qOverride:(document.getElementById('q').value||'')).toLowerCase().trim();
  let list=[...allProducts];
  if(activeUnder!=='ALL'){
    const kata=COCOK_UNTUK[activeUnder]||[];
    document.getElementById('judulPage').innerText='PRODUK UNTUK '+activeUnder;
    list=list.filter(p=>{
      const vars=window._varMap[p.id]||[];
      if(!vars.length) return false;
      return vars.some(v=>{
        const w=(v.color_name||'').toUpperCase();
        return kata.some(k=>w.includes(k));
      });
    });
  }
  if(activeWarna!=='ALL'){
    document.getElementById('judulPage').innerText='WARNA: '+activeWarna;
    list=list.filter(p=>(window._varMap[p.id]||[]).some(v=>(v.color_name||'').toUpperCase().includes(activeWarna)));
  }
  if(q){
    document.getElementById('judulPage').innerText='HASIL: '+q.toUpperCase();
    list=list.filter(p=>p.name.toLowerCase().includes(q)||(window._varMap[p.id]||[]).some(v=>(v.color_name||'').toLowerCase().includes(q)));
  }
  if(activeUnder==='ALL'&&activeWarna==='ALL'&&!q) document.getElementById('judulPage').innerText='PRODUK READY';
  document.getElementById('prodCount').innerText=list.length+' PRODUK';
  render(list);
}
function handleUrlSearch(){
  const p=new URLSearchParams(location.search);
  const q=(p.get('q')||p.get('warna')||'').toLowerCase().trim();
  const ut=(p.get('undertone')||'').toUpperCase();
  if(ut) activeUnder=ut;
  if(q){activeWarna=q.toUpperCase(); const inp=document.getElementById('q'); if(inp) inp.value=q;}
  setTimeout(()=>applyFilters(q),300);
}
function render(list){
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:60px 20px;opacity:.5">TIDAK ADA PRODUK<br><br><button onclick="location.href=\'produk.html\'" style="padding:10px 20px;border:1px solid #111;background:#fff;border-radius:30px;font-size:10px">LIHAT SEMUA</button></div>';return;}
  el.innerHTML=list.map((p,i)=>{
    const vars=window._varMap[p.id]||[]; let img=p.image_url; let col=vars[0]?.color_name||''; let out=vars.length>0&&vars.every(v=>isOut(v));
    if(activeWarna!=='ALL'){const m=vars.find(v=>(v.color_name||'').toLowerCase()===activeWarna.toLowerCase())||vars.find(v=>(v.color_name||'').toLowerCase().includes(activeWarna.toLowerCase())); if(m){img=m.image_url;col=m.color_name;out=isOut(m);}}
    const opt=getOptImg(img,300); const eager=i<6?`fetchpriority="high" loading="eager"`:`loading="lazy"`;
    return `<div class="prod-card ${out?'out-of-stock':''}" onclick="${out?'':'openProd(\''+p.id+'\')'}">${out?'<div style="position:absolute;top:6px;left:6px;background:#111;color:#fff;font-size:6px;padding:4px 6px;border-radius:4px;z-index:2">HABIS</div>':''}<div class="heart-btn" onclick="event.stopPropagation();${out?'':`quickAdd('${p.id}')`}"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}" src="${opt}" ${eager} width="300" height="300" alt="${p.name}"><div style="padding:7px;border-top:1px solid #F6F1EB"><div style="font-size:9px;font-family:'Cormorant Garamond';line-height:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.name}</div><div style="font-size:6px;opacity:.4;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${col}</div><div style="font-size:10px;margin-top:3px">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');
}
function quickAdd(id){const p=allProducts.find(x=>String(x.id)===String(id));const vars=window._varMap[id]||[];let v=vars[0];if(activeWarna!=='ALL'){const mf=vars.find(x=>(x.color_name||'').toLowerCase()===activeWarna.toLowerCase())||vars.find(x=>(x.color_name||'').toLowerCase().includes(activeWarna.toLowerCase()));if(mf)v=mf;}if(v&&isOut(v))return;flyToCart(v?v.image_url:p.image_url,document.getElementById('img-'+id));addCart(p.name+' - '+v.color_name,p.price,v?v.image_url:p.image_url);showCartToast(v.color_name,v?v.image_url:p.image_url);}
async function openProd(id){document.getElementById('prodModal').classList.add('show');document.getElementById('pBox').innerHTML='<div style="padding:20px;text-align:center">Loading...</div>';const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:p.category||'KREM',image_url:p.image_url,stock:1}];curColor=curVariants[0].color_name;curImg=curVariants[0].image_url;document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}" width="600" height="600"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})">`).join('')}</div></div><div class="p-info"><div style="font-size:20px;font-family:'Cormorant Garamond'">${p.name}</div><div style="font-size:28px;margin-top:4px">Rp${Number(p.price).toLocaleString('id-ID')}</div><div style="margin-top:12px;font-size:9px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${curColor}</b></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px">${curVariants.map((v,i)=>`<button id="btn-${i}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})" style="padding:10px 14px;border:1px solid ${v.image_url===curImg?'#111':'#eee'};background:${v.image_url===curImg?'#111':'#fff'};color:${v.image_url===curImg?'#fff':'#111'};border-radius:6px;font-size:8px">${v.color_name} ${isOut(v)?'- HABIS':''}</button>`).join('')}</div><div style="display:flex;gap:8px;margin-top:18px"><button class="btn" style="background:#fff;color:#111;border:1px solid #111" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI</button></div></div></div>`;}
function pickColor(c,i,idx){curColor=c;curImg=i;document.getElementById('bigImg').src=getOptImg(i,600);document.getElementById('selCol').innerText=c;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j==idx));document.querySelectorAll('[id^="btn-"]').forEach((b,j)=>{const active=j===idx;b.style.background=active?'#111':'#fff';b.style.color=active?'#fff':'#111';b.style.borderColor=active?'#111':'#eee';});}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showCartToast(c,i){const t=document.getElementById('cartToast');document.getElementById('toastImg').src=getOptImg(i,80);document.getElementById('toastText').innerText=c+' MASUK KERANJANG';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur))return;flyToCart(curImg,document.getElementById('bigImg'));addCart(curProd.name+' - '+curColor,curProd.price,curImg);showCartToast(curColor,curImg);}
function buyFromModal(){let msg=`Halo ARINDA %0ASaya mau beli:%0A- ${curProd.name} - ${curColor} = Rp${Number(curProd.price).toLocaleString('id-ID')}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const list=document.getElementById('cartList');const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+sub.toLocaleString('id-ID');if(!c.length){list.innerHTML='<p style="text-align:center;padding:20px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2EFEA"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function askClearCart(){showConfirm('KOSONGKAN?','Hapus semua?',()=>{saveCart([]);});}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`Total: Rp${sub.toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
