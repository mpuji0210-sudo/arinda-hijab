<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Produk - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--off:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--off);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif}
h1,h2{font-family:'Cormorant Garamond',serif}
nav{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;background:rgba(255,252,249,.85);backdrop-filter:blur(12px);border-bottom:1px solid var(--champ)}
nav a{font-size:10px;letter-spacing:2px;text-transform:uppercase;text-decoration:none;color:var(--taupe);margin-left:20px;font-weight:600}
nav a.active{color:var(--esp)}
.badge{display:flex;align-items:center;gap:6px;border:1px solid var(--champ);padding:8px 14px;border-radius:100px;font-size:11px;background:white;cursor:pointer}
.detail{max-width:1120px;margin:24px auto;display:grid;background:white;border:1px solid var(--champ)}
@media(min-width:860px){.detail{grid-template-columns:440px 1fr}}
.galeri{background:#F7F3EF;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:36px;min-height:420px}
.big{width:260px;height:260px;border-radius:50%;border:1px solid var(--champ);box-shadow:0 20px 40px rgba(0,0,0,.06)}
.eye{font-size:10px;letter-spacing:3px;text-transform:uppercase;color:var(--taupe);display:block;margin-bottom:10px}
.price{font-family:'Cormorant Garamond';font-size:38px;font-weight:600}
.lab{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--taupe);margin:28px 0 12px;font-weight:600}
.c{width:86px;height:86px;border:1px solid var(--champ);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;background:white}
.c.active{border-color:var(--esp);border-width:1.5px}
.dot{width:32px;height:32px;border-radius:50%}
.btn{flex:1;padding:15px;border:1px solid var(--champ);font-size:11px;letter-spacing:2px;text-transform:uppercase;background:white;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
.btn-dark{background:var(--esp);color:white;border-color:var(--esp)}
</style>
</head>
<body>
<nav><div style="font-family:'Cormorant Garamond';font-weight:700;letter-spacing:3px">ARINDA</div><div><a href="index.html">BERANDA</a><a href="produk.html" class="active">PRODUK</a><a href="index.html#kontak">KONTAK</a></div><div class="badge" onclick="openCart()"><i data-lucide="shopping-bag" style="width:14px"></i> <span id="cnt">0</span></div></nav>
<div class="detail">
<div class="galeri"><div class="big" id="mainCircle" style="background:#111"></div><div id="warnaName" style="font-family:'Cormorant Garamond';font-size:20px;margin-top:18px">Hitam Pekat</div><div style="font-size:10px;letter-spacing:2px;color:#8C7A6B;text-transform:uppercase;margin-top:4px">Premium Voal • 110x110 • Laser Cut</div></div>
<div style="padding:28px">
<span class="eye">Bestseller • Premium Voal</span>
<div class="price">Rp<span id="harga">18.000</span></div>
<div style="font-family:'Cormorant Garamond';font-size:22px;margin-top:8px;line-height:1.3">Arinda Hijab Premium - Adem, Tidak Mudah Kusut, Jahit Rapi</div>
<div class="lab">Pilih Warna</div>
<div style="display:flex;gap:10px">
<div class="c active" onclick="pickW(this,'#111','Hitam Pekat')"><div class="dot" style="background:#111"></div><span style="font-size:9px;margin-top:8px;color:#8C7A6B">HITAM</span></div>
<div class="c" onclick="pickW(this,'#E8D5B5','Krem Elegan')"><div class="dot" style="background:#E8D5B5"></div><span style="font-size:9px;margin-top:8px;color:#8C7A6B">KREM</span></div>
<div class="c" onclick="pickW(this,'#7A1C1C','Maroon')"><div class="dot" style="background:#7A1C1C"></div><span style="font-size:9px;margin-top:8px;color:#8C7A6B">MAROON</span></div>
<div class="c" onclick="pickW(this,'#1E2A4A','Navy')"><div class="dot" style="background:#1E2A4A"></div><span style="font-size:9px;margin-top:8px;color:#8C7A6B">NAVY</span></div>
</div>
<div class="lab">Ukuran</div>
<div style="display:flex;gap:8px"><button id="b1" class="btn" onclick="pickS(this)">STANDAR 110X110</button><button id="b2" class="btn" onclick="pickS(this)">SYARI 130X130</button></div>
<style>.buy{width:100%;margin-top:10px;padding:16px;background:#2B1B12;color:white;border:0;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer}
#cartModal{display:none;position:fixed;inset:0;background:rgba(43,27,18,.15);backdrop-filter:blur(8px);z-index:50;justify-content:flex-end}
#cartBox{background:white;width:100%;max-width:380px;height:100%;padding:24px;display:flex;flex-direction:column;border-left:1px solid #EAE6E1}</style>
<div style="display:flex;gap:10px;margin-top:28px"><button class="btn" onclick="chatWA()"><i data-lucide="message-circle" style="width:14px"></i> Chat</button><button class="btn btn-dark" onclick="addCart()"><i data-lucide="shopping-bag" style="width:14px"></i> Keranjang</button></div>
<button class="buy" onclick="addCart()">Beli Sekarang - Rp<span id="hargaB">18.000</span></button>
<div style="margin-top:18px;display:flex;gap:16px;font-size:11px;color:#8C7A6B"><span style="display:flex;gap:6px"><i data-lucide="truck" style="width:14px"></i> Kirim dari Jakarta</span><span style="display:flex;gap:6px"><i data-lucide="shield-check" style="width:14px"></i> COD & QRIS</span></div>
</div></div>
<div id="cartModal" onclick="if(event.target==this)closeCart()"><div id="cartBox"><div style="display:flex;justify-content:space-between;align-items:center"><h3 style="font-family:'Cormorant Garamond';margin:0;font-size:26px">Keranjang</h3><button onclick="closeCart()" style="border:1px solid #EAE6E1;background:white;width:32px;height:32px"><i data-lucide="x" style="width:14px"></i></button></div><div id="list" style="flex:1;overflow:auto;margin-top:20px"></div><div style="border-top:1px solid #EAE6E1;padding-top:12px;display:flex;justify-content:space-between;font-family:'Cormorant Garamond';font-size:20px"><span>Total</span><span id="tot">Rp 0</span></div><a id="waLink" style="display:block;text-align:center;background:#2B1B12;color:white;padding:15px;margin-top:12px;text-decoration:none;font-size:11px;letter-spacing:2px">Checkout WhatsApp</a></div></div>
<script>
// Bersihin data lama yang bikin NaN
let cart = JSON.parse(localStorage.getItem('cart'))||[];
cart = cart.filter(c=>c && c.price &&!isNaN(c.qty)).map(c=>({...c, qty: Number(c.qty)||1, price: Number(c.price)||18000}));
localStorage.setItem('cart', JSON.stringify(cart));

let warna='Hitam Pekat',ukuran='STANDAR 110X110',harga=18000;
function upd(){document.getElementById('cnt').innerText=cart.reduce((a,b)=>a+(Number(b.qty)||0),0);localStorage.setItem('cart',JSON.stringify(cart))}
function pickW(el,hex,nama){document.querySelectorAll('.c').forEach(x=>x.classList.remove('active'));el.classList.add('active');document.getElementById('mainCircle').style.background=hex;document.getElementById('warnaName').innerText=nama;warna=nama}
function pickS(el){document.getElementById('b1').classList.remove('active','btn-dark');document.getElementById('b2').classList.remove('active','btn-dark');el.classList.add('active','btn-dark');ukuran=el.innerText;harga=ukuran.includes('SYARI')?25000:18000;document.getElementById('harga').innerText=harga.toLocaleString('id-ID');document.getElementById('hargaB').innerText=harga.toLocaleString('id-ID')}
function addCart(){let k=warna+'-'+ukuran;let f=cart.find(c=>c.key==k);if(f)f.qty=Number(f.qty)+1;else cart.push({key:k,name:`Arinda ${warna} - ${ukuran}`,price:harga,qty:1});upd();openCart()}
function openCart(){render();document.getElementById('cartModal').style.display='flex'}
function closeCart(){document.getElementById('cartModal').style.display='none'}
function kurang(i){cart[i].qty=Number(cart[i].qty)-1;if(cart[i].qty<1)cart.splice(i,1);upd();render()}
function tambah(i){cart[i].qty=Number(cart[i].qty)+1;upd();render()}
function hapus(i){cart.splice(i,1);upd();render()}
function render(){let l=document.getElementById('list');l.innerHTML='';let total=0;let txt='Halo Kak Aeni, mau order:%0A';if(!cart.length)l.innerHTML='<p style="color:#8C7A6B;text-align:center;padding:20px;font-size:13px">Kosong</p>';cart.forEach((c,i)=>{c.qty=Number(c.qty)||1;c.price=Number(c.price)||18000;let sub=c.price*c.qty;total+=sub;txt+=`${i+1}. ${c.name} x${c.qty} - Rp ${sub.toLocaleString('id-ID')}%0A`;l.innerHTML+=`<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0;padding-bottom:14px;border-bottom:1px solid #EAE6E1"><div><div style="font-family:Cormorant Garamond">${c.name}</div><div style="font-size:11px;color:#8C7A6B">Rp${c.price.toLocaleString('id-ID')} x ${c.qty}</div></div><div style="display:flex;align-items:center;gap:6px"><button onclick="kurang(${i})" style="width:28px;height:28px;border:1px solid #EAE6E1;background:white">−</button><span style="min-width:16px;text-align:center;font-size:12px">${c.qty}</span><button onclick="tambah(${i})" style="width:28px;height:28px;background:#2B1B12;color:white;border:0">+</button><button onclick="hapus(${i})" style="margin-left:6px;width:32px;height:32px;border:1px solid #EAE6E1;background:white"><i data-lucide="trash-2" style="width:14px"></i></button></div></div>`});document.getElementById('tot').innerText='Rp '+total.toLocaleString('id-ID');document.getElementById('waLink').href=`https://wa.me/6285178098354?text=${txt}%0ATotal: Rp ${total.toLocaleString('id-ID')}`;lucide.createIcons()}
function chatWA(){window.open(`https://wa.me/6285178098354?text=Halo Kak, mau tanya ${warna} ${ukuran}`,'_blank')}
upd();lucide.createIcons();document.getElementById('b1').classList.add('btn-dark','active');
</script>
</body>
</html>
