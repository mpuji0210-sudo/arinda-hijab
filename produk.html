<style>

<main class="section"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h1 style="font-family:'Cormorant Garamond';font-size:20px;letter-spacing:2px;font-weight:300;margin:0">PRODUK READY</h1><div id="prodCount" style="font-size:9px;letter-spacing:3px;opacity:.4">0 PRODUK</div></div><div id="list" class="prod-grid"></div></main>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
let supabaseClient,allProducts=[],WA_NUMBER="6285178098354",tokoOriginId="17523",selectedDestId=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[],activeUnder='ALL',lastSearchQuery='',curUnder=[];
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');if(!el)return;let t=getCart().reduce((a,b)=>a+(b.qty||0),0);el.innerText=t;el.style.display=t>0?'flex':'none';}
function clearCart(){if(!confirm('Kosongkan?'))return;saveCart([]);selectedOngkirCost=0;selectedService='';}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function getOptImg(u,w=300){if(!u) return ''; if(u.includes('/storage/v1/object/public/')){const p=u.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return u;}
function flyToCart(imgUrl,startEl){
  const cartIcon=document.getElementById('cartIcon');if(!cartIcon)return;
  const cartRect=cartIcon.getBoundingClientRect();
  let rect = startEl? startEl.getBoundingClientRect() : {left:innerWidth/2-28,top:innerHeight/2-28,width:56,height:56};
  if(rect.width===0) rect={left:innerWidth/2-28,top:innerHeight/2-28,width:56,height:56};
  const fly=document.createElement('img');
  fly.src=getOptImg(imgUrl,80);
  fly.className='fly-img';
  fly.style.left=(rect.left + rect.width/2 - 28)+'px';
  fly.style.top=(rect.top + rect.height/2 - 28)+'px';
  fly.style.transform='scale(1)';fly.style.opacity='1';
  document.body.appendChild(fly);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    fly.style.left=(cartRect.left + cartRect.width/2 - 10)+'px';
    fly.style.top=(cartRect.top + cartRect.height/2 - 10)+'px';
    fly.style.transform='scale(0.15)';fly.style.opacity='0';
  });});
  setTimeout(()=>fly.remove(),900);
}
function doSearch(){const q=document.getElementById('q').value.toLowerCase().trim();lastSearchQuery=q;applyFilters(q);}
function applyFilters(qOverride){
  let q=(qOverride!==undefined?qOverride:(document.getElementById('q').value||'')).toLowerCase().trim();
  lastSearchQuery=q;
  let list=[...allProducts];
  if(!q && activeUnder!=='ALL'){
    const kata={COOL:['PUTIH','NAVY','ABU','LILAC'],WARM:['KREM','MILO','CARAMEL','OLIVE']}[activeUnder]||[];
    list=list.filter(p=>{const vars=window._varMap[p.id]||[];return vars.some(v=>kata.some(k=>(v.color_name||'').toUpperCase().includes(k)));});
  }
  if(q){
    list=list.filter(p=>{
      const vars=window._varMap[p.id]||[];
      return p.name.toLowerCase().includes(q)||vars.some(v=>(v.color_name||'').toLowerCase().includes(q));
    });
  }
  document.getElementById('prodCount').innerText=list.length+' PRODUK';
  render(list);
}
function handleUrlSearch(){const p=new URLSearchParams(location.search);const q=(p.get('warna')||p.get('q')||'').toLowerCase();if(q){document.getElementById('q').value=q;lastSearchQuery=q;setTimeout(()=>applyFilters(q),300);}else setTimeout(()=>applyFilters(''),300);}
function underBadgeHtml(arr){
  if(!arr||!arr.length) return '';
  let a = Array.isArray(arr)?arr: (typeof arr==='string'? [arr] : []);
  try{if(typeof arr==='string' && arr.startsWith('[')) a=JSON.parse(arr)}catch(e){}
  return a.map(u=>`<span class="under-badge">${u}</span>`).join('');
}
function render(list){
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML=`<div style="grid-column:1/-1;text-align:center;padding:60px 0;opacity:.5">TIDAK ADA PRODUK UNTUK "${document.getElementById('q').value}"<br><button onclick="document.getElementById('q').value='';applyFilters('')" style="margin-top:10px;padding:8px 16px;border-radius:20px;border:1px solid #111;background:#fff;font-size:9px">LIHAT SEMUA</button></div>`;return;}
  el.innerHTML=list.map((p,i)=>{
    const vars=window._varMap[p.id]||[];
    let matchedVar = null;
    if(lastSearchQuery){
      matchedVar = vars.find(v=>(v.color_name||'').toLowerCase().includes(lastSearchQuery));
    }
    let v = matchedVar || vars[0];
    let img = v? v.image_url : p.image_url;
    let col = v? v.color_name : p.name;
    let under = v? (v.undertone||p.undertone||[]) : (p.undertone||[]);
    return `<div class="prod-card"><div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}',this,${i},'${(col||'').replace(/'/g,'')}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}-${i}" src="${getOptImg(img,400)}" loading="lazy" onclick="openProd('${p.id}','${(col||'').replace(/'/g,'')}')"><div style="padding:8px;border-top:1px solid #F6F1EB" onclick="openProd('${p.id}','${(col||'').replace(/'/g,'')}')"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${col}</div><div style="font-size:8px;margin-top:2px">${underBadgeHtml(under)}</div><div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');
}
function quickAdd(id,btnEl,idx,colorName){
  const p=allProducts.find(x=>String(x.id)===String(id));
  const vars=window._varMap[id]||[];
  let v = vars.find(x=>x.color_name===colorName) || vars.find(x=>(x.color_name||'').toLowerCase().includes(lastSearchQuery)) || vars[0] || {color_name:p.name,image_url:p.image_url};
  if(isOut(v))return;
  const imgEl=document.getElementById(`img-${id}-${idx}`) || btnEl?.closest('.prod-card')?.querySelector('img');
  if(imgEl) flyToCart(v.image_url, imgEl);
  addCart(p.name+' - '+v.color_name,p.price,v.image_url);showCartToast(v.color_name,v.image_url);
}
async function openProd(id,colorName){
  document.getElementById('prodModal').classList.add('show');
  document.getElementById('pBox').innerHTML='<div style="padding:40px;text-align:center">Loading...</div>';
  const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();
  const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');
  curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:'KREM',image_url:p.image_url,stock:1, undertone:p.undertone||['NEUTRAL']}];
  let initial = curVariants[0];
  if(colorName){
    const found = curVariants.find(v=>v.color_name.toLowerCase()===colorName.toLowerCase() || v.color_name.toLowerCase().includes(colorName.toLowerCase()));
    if(found) initial = found;
  }else if(lastSearchQuery){
    const found = curVariants.find(v=>v.color_name.toLowerCase().includes(lastSearchQuery));
    if(found) initial = found;
  }
  curColor=initial.color_name;curImg=initial.image_url;curUnder=initial.undertone||p.undertone||['NEUTRAL'];
  document.getElementById('pBox').innerHTML=`
  <div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})">`).join('')}</div></div>
  <div class="p-info"><div style="font-size:20px;font-family:'Cormorant Garamond'">${p.name}</div>
  <div style="margin-top:6px" id="underBadgeArea">${underBadgeHtml(curUnder)}</div>
  <div style="font-size:22px;margin-top:6px">Rp${Number(p.price).toLocaleString('id-ID')}</div>
  <div style="margin-top:10px;font-size:8px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${curColor}</b></div>
  <div class="variant-wrap">${curVariants.map((v,i)=>`<button id="btn-${i}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})">${v.color_name}</button>`).join('')}</div>
  <div style="margin-top:10px;font-size:8px;opacity:.6">UNDERTONE WARNA INI: <span id="selUnderText">${(curUnder||[]).join(', ')}</span></div>
  <div style="margin-top:14px;padding:12px;background:#FFFCF9;border:1px solid #EDE8E1;border-radius:12px"><div style="font-size:8px;letter-spacing:2px;opacity:.5;margin-bottom:8px;font-weight:700">CEK ONGKIR DULU SEBELUM BELI</div><div style="display:flex;gap:6px"><input id="destSearchProd" placeholder="Kecamatan - Beji Depok" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:11px"><button onclick="searchDestProd()" style="padding:10px 14px;background:#111;color:#fff;border:none;border-radius:8px;font-size:9px">CARI</button></div><div id="destListProd" style="display:none;margin-top:8px;max-height:100px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px"></div><div style="display:flex;gap:6px;margin-top:8px"><select id="courierSelectProd" style="flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:11px"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="sicepat">SiCepat</option><option value="pos">POS</option></select><button onclick="cekOngkirProd()" style="flex:1;padding:9px;background:#fff;border:1px solid #111;border-radius:8px;font-size:9px">CEK ONGKIR</button></div><div id="ongkirResultProd" style="margin-top:8px"></div><div id="ongkirSelectedProd" style="margin-top:8px;font-size:10px;font-weight:600">${selectedService?'✓ '+selectedService+' - Rp'+selectedOngkirCost.toLocaleString('id-ID'):''}</div></div>
  <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:#fff;color:#111;border:1px solid #111" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI</button></div></div>`;
}
function pickColorByIdx(idx){
  const v=curVariants[idx];if(!v) return;
  curColor=v.color_name;curImg=v.image_url;curUnder=v.undertone||curProd.undertone||['NEUTRAL'];
  const big=document.getElementById('bigImg');if(big) big.src=getOptImg(v.image_url,600);
  const sel=document.getElementById('selCol');if(sel) sel.innerText=v.color_name;
  const selU=document.getElementById('selUnderText');if(selU) selU.innerText=(curUnder||[]).join(', ');
  const badgeArea=document.getElementById('underBadgeArea');if(badgeArea) badgeArea.innerHTML=underBadgeHtml(curUnder);
  document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j===idx));
  document.querySelectorAll('.variant-wrap button').forEach((b,j)=>b.classList.toggle('active',j===idx));
}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showCartToast(c,i){const t=document.getElementById('cartToast');document.getElementById('toastImg').src=getOptImg(i,80);document.getElementById('toastText').innerText=c+' MASUK KERANJANG';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur))return;const big=document.getElementById('bigImg');if(big) flyToCart(curImg,big);addCart(curProd.name+' - '+curColor,curProd.price,curImg);showCartToast(curColor,curImg);}
function buyFromModal(){let msg=`Halo ARINDA %0A- ${curProd.name} - ${curColor} (${(curUnder||[]).join(',')}) = Rp${Number(curProd.price).toLocaleString('id-ID')}%0A`;if(selectedOngkirCost>0) msg+=`ONGKIR ${selectedService}: Rp${selectedOngkirCost.toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';const list=document.getElementById('cartList');if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2EFEA;align-items:center"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
async function searchDestProd(){const q=document.getElementById('destSearchProd').value.trim();if(!q)return;const dl=document.getElementById('destListProd');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestProd('${d.id}','${d.label.replace(/'/g,'')}')">${d.label}</div>`).join('');}catch(e){dl.innerHTML='GAGAL';}}
function pilihDestProd(id,label){selectedDestId=id;document.getElementById('destSearchProd').value=label;document.getElementById('destListProd').style.display='none';}
async function cekOngkirProd(){if(!selectedDestId){document.getElementById('ongkirResultProd').innerHTML='<div style="color:red;font-size:10px">Pilih kecamatan</div>';return;}document.getElementById('ongkirResultProd').innerHTML='CEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelectProd').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:(arr.costs||[]);let h='';list.forEach(c=>{h+=`<div onclick="setOngkirProd(${c.cost||0},'${c.service}','${c.etd}')" style="padding:10px;border:1px solid #111;margin:4px 0;cursor:pointer;border-radius:8px;font-size:11px"><b>${c.service}</b> - Rp${Number(c.cost).toLocaleString('id-ID')} (${c.etd})</div>`;});document.getElementById('ongkirResultProd').innerHTML=h||'TIDAK ADA';}catch(e){document.getElementById('ongkirResultProd').innerHTML='ERROR';}}
function setOngkirProd(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirSelectedProd').innerHTML=`✓ ${selectedService} - Rp${selectedOngkirCost.toLocaleString('id-ID')}`;document.getElementById('ongkirResultProd').innerHTML='';renderCart();}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`TOTAL Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" onload="(async()=>{supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);const {data:all}=await supabaseClient.from('products').select('id,name,price,image_url,category,undertone').order('id',{ascending:false}).limit(50);const {data:vars}=await supabaseClient.from('product_variants').select('product_id,color_name,image_url,stock,is_available,undertone').limit(400);allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{if(!window._varMap[v.product_id])window._varMap[v.product_id]=[];window._varMap[v.product_id].push(v);});updateCount();handleUrlSearch();})()"></script>
