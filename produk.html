<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produk - Arinda Hijab</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{font-family:'Plus Jakarta Sans',sans-serif;margin:0;background:#fffbf7}
.container{max-width:1100px;margin:0 auto;padding:20px 24px}
nav{background:white;padding:12px 15px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 8px rgba(0,0,0,.06);position:sticky;top:0;z-index:20}
nav a{text-decoration:none;color:#92400e;font-weight:600;font-size:14px;padding:8px 18px;border-radius:25px}
nav a.active{background:#d97706;color:white}
.cart-badge{background:#c9a86a;color:white;padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:20px}
@media(min-width:768px){.grid{grid-template-columns:1fr 1fr 1fr 1fr}}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px rgba(0,0,0,.06);border:1px solid #fef3c7}
.card img{width:100%;height:160px;object-fit:cover}
.card-body{padding:12px}
.card-body h3{font-size:14px;margin:0 0 4px;font-family:'Poppins'}
.harga{color:#d97706;font-weight:700;font-size:16px}
.btn-cart{width:100%;background:#d97706;color:white;border:0;padding:10px;border-radius:10px;font-weight:700;margin-top:8px;cursor:pointer}
.btn-cart:hover{background:#92400e}
#cartModal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.5);z-index:50;justify-content:center;align-items:center}
#cartBox{background:white;width:90%;max-width:400px;border-radius:20px;padding:20px;max-height:80vh;overflow:auto}
.cart-item{display:flex;justify-content:space-between;margin:10px 0;font-size:14px}
.btn-wa{width:100%;background:#25D366;color:white;padding:14px;border-radius:12px;text-align:center;text-decoration:none;display:block;font-weight:700;margin-top:15px}
</style>
</head>
<body>
<nav>
  <div>
    <a href="index.html">Beranda</a>
    <a href="produk.html" class="active">Produk</a>
    <a href="kontak.html">Kontak</a>
  </div>
  <div class="cart-badge" id="cartBadge" onclick="openCart()">🛒 0</div>
</nav>

<div class="container">
  <h2 style="font-family:'Poppins';color:#78350f">Koleksi Best Seller - Mulai 18rb</h2>
  <div class="grid" id="produkGrid"></div>
</div>

<div id="cartModal" onclick="if(event.target==this) closeCart()">
  <div id="cartBox">
    <h3 style="font-family:'Poppins'">Keranjang Kamu 🛒</h3>
    <div id="cartList"></div>
    <hr>
    <div style="display:flex;justify-content:space-between;font-weight:700"><span>Total:</span><span id="cartTotal">Rp 0</span></div>
    <a id="waCheckout" class="btn-wa" href="#" target="_blank">Checkout via WA →</a>
    <button onclick="closeCart()" style="width:100%;margin-top:10px;padding:10px;border:0;background:#eee;border-radius:10px">Tutup</button>
  </div>
</div>

<script>
const products=[
 {id:1,name:'Arinda Hijab Hitam Pekat',price:18000,img:'testi1.jpg'},
 {id:2,name:'Arinda Hijab Krem Elegan',price:18000,img:'testi2.jpg'},
 {id:3,name:'Arinda Hijab Maroon',price:18000,img:'banner-v2.jpg'},
 {id:4,name:'Arinda Hijab Navy',price:18000,img:'banner-v2.jpg'},
 {id:5,name:'Paket 4 Warna Best Seller',price:65000,img:'banner-v2.jpg'},
];
let cart=JSON.parse(localStorage.getItem('cart'))||[];
const grid=document.getElementById('produkGrid');
products.forEach(p=>{
 grid.innerHTML+=`<div class="card"><img src="${p.img}"><div class="card-body"><h3>${p.name}</h3><div class="harga">Rp ${p.price.toLocaleString('id-ID')}</div><button class="btn-cart" onclick="addCart(${p.id})">+ Keranjang</button></div></div>`;
});
function updateBadge(){document.getElementById('cartBadge').innerText='🛒 '+cart.length;localStorage.setItem('cart',JSON.stringify(cart));}
function addCart(id){const prod=products.find(x=>x.id==id);cart.push(prod);updateBadge();openCart();}
function openCart(){renderCart();document.getElementById('cartModal').style.display='flex';}
function closeCart(){document.getElementById('cartModal').style.display='none';}
function renderCart(){
 const list=document.getElementById('cartList');list.innerHTML='';let total=0;let textWA='Halo Kak Aeni, mau order:%0A';
 if(cart.length==0){list.innerHTML='<p>Keranjang masih kosong</p>';}
 cart.forEach((c,i)=>{
   total+=c.price;
   textWA+=`%0A${i+1}. ${c.name} - Rp ${c.price.toLocaleString('id-ID')}`;
   list.innerHTML+=`<div class="cart-item"><span>${c.name}</span><span><b>Rp ${c.price.toLocaleString('id-ID')}</b> <a href="#" onclick="removeItem(${i});return false" style="color:red">x</a></span></div>`;
 });
 document.getElementById('cartTotal').innerText='Rp '+total.toLocaleString('id-ID');
 textWA+=`%0A%0ATotal: Rp ${total.toLocaleString('id-ID')}%0A%0Adari website: s.id/arinda_hijab`;
 document.getElementById('waCheckout').href=`https://wa.me/6285178098354?text=${textWA}`;
}
function removeItem(i){cart.splice(i,1);updateBadge();renderCart();}
updateBadge();
</script>
</body>
</html>
