<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODUK</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Inter:wght@300&display=swap" rel="stylesheet">
<script>const C=localStorage.getItem('store_name_cache')||'ARINDA',O=localStorage.getItem('toko_origin_id')||'17523',OL=localStorage.getItem('store_origin_label')||'CENGKARENG BARAT';</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>body{margin:0;background:#fff;color:#000;font-family:Inter,sans-serif;font-weight:300}*{box-sizing:border-box}nav{position:sticky;top:0;z-index:99;background:rgba(255,255,255,.96);border-bottom:1px solid #E9E9E9}.nav-top{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}.logo{font-family:Cormorant Garamond;letter-spacing:8px;font-size:20px}.logo span{display:block;font-family:Inter;font-size:7px;letter-spacing:5px;opacity:.4}.icon{position:relative;width:34px;height:34px;display:flex;align-items:center;justify-content:center;background:none;border:none;cursor:pointer}.icon svg{width:18px;height:18px;stroke:#000;fill:none;stroke-width:1.1}.badge{position:absolute;top:-2px;right:-2px;background:#000;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}.menu{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:28px;overflow-x:auto;border-top:1px solid #F2F2F2}.menu a{font-size:9px;letter-spacing:3px;color:#000;text-decoration:none;padding:12px 0;opacity:.35}.menu a.on{opacity:1;border-bottom:1px solid #000}.search{max-width:1240px;margin:0 auto;padding:0 16px}.search input{width:100%;padding:14px 0;border:none;border-bottom:1px solid #E9E9E9;background:0 0;outline:0;font-size:12px;letter-spacing:2px}.section{max-width:1240px;margin:0 auto;padding:16px 8px 0}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#E9E9E9;border:1px solid #E9E9E9}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}.card{background:#fff;position:relative;cursor:pointer}.card img{width:100%;height:200px;object-fit:cover;display:block}.heart{position:absolute;top:6px;right:6px;width:22px;height:22px;background:rgba(255,255,255,.9);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid #E9E9E9}.heart svg{width:10px;height:10px;stroke:#000;fill:none}.fly{position:fixed;z-index:99999;width:68px;height:68px;border-radius:50%;object-fit:cover;border:3px solid #fff;pointer-events:none;transition:all.75s cubic-bezier(.4,0,.2,1)}#cart{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;display:none}#cart.on{display:flex;align-items:flex-end}#cartBox{background:#fff;width:100%;max-width:430px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px}.btn{width:100%;padding:13px;background:#000;color:#fff;border:0;font-size:9px;letter-spacing:3px;cursor:pointer}#prod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:10px}#prod.on{display:flex}.pbox{background:#fff;max-width:900px;width:100%;display:grid;grid-template-columns:1.1fr.9fr;max-height:90vh;border:1px solid #E9E9E9;overflow:hidden}.pg{display:grid;grid-template-columns:1fr 60px;gap:8px;padding:10px}.pm{height:300px;background:#FAFAFA;border:1px solid #F2F2F2}.pm img{width:100%;height:100%;object-fit:cover}.th{height:300px;overflow:auto;display:flex;flex-direction:column;gap:5px}.th img{width:56px;height:56px;object-fit:cover;opacity:.5;border:1px solid #E9E9E9;cursor:pointer}.th img.a{opacity:1;border-color:#000}.pi{padding:14px;border-left:1px solid #F2F2F2;overflow:auto}.vw{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.vw button{padding:7px 10px;border:1px solid #E9E9E9;background:#fff;font-size:8px;cursor:pointer}.vw button.a{background:#000;color:#fff}@media(max-width:800px){.pbox{grid-template-columns:1fr;overflow:auto}.pi{border:0;border-top:1px solid #F2F2F2}}#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(120px);background:#000;color:#fff;padding:9px 16px;border-radius:20px;transition:.4s;opacity:0;z-index:9999;font-size:10px}#toast.on{transform:translateX(-50%) translateY(0);opacity:1}</style>
</head><body>
<nav><div class="nav-top"><div class="logo" id="logo"></div><button class="icon" id="cartIcon" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="cc">0</span></button></div><div class="menu"><a href="index.html">BERANDA</a><a class="on">PRODUK</a><a href="kategori.html">KATEGORI</a><a href="kontak.html">KONTAK</a></div><div class="search"><input id="q" oninput="s()" placeholder=""></div></nav>
<main class="section"><div id="list" class="grid"></div></main>
<footer style="text-align:center;padding:30px 0;border-top:1px solid #E9E9E9;margin-top:20px"><div id="flogo" style="font-family:Cormorant Garamond;letter-spacing:8px"></div></footer>
<div id="cart" onclick="if(event.target.id=='cart')closeCart()"><div id="cartBox"><div style="display:flex;justify-content:space-between"><b style="font-size:11px">KERANJANG</b><button onclick="closeCart()" style="border:0;background:0;font-size:20px">×</button></div><div id="cList"></div><div style="margin-top:10px"><div style="display:flex;gap:6px"><input id="dc" placeholder="Kota tujuan" style="flex:1;padding:10px;border:1px solid #000"><button onclick="sd(true)" style="padding:10px 14px;background:#000;color:#fff;border:0">CEK</button></div><div id="dl" style="display:none;background:#fff;border:1px solid #E9E9E9;max-height:110px;overflow:auto;margin-top:6px"></div><div id="oc" style="margin-top:8px"></div></div><div style="margin-top:10px;display:flex;justify-content:space-between"><span>TOTAL</span><b id="ct">Rp0</b></div><button class="btn" style="margin-top:10px" onclick="goCheck()">CHECKOUT →</button></div></div>
<div id="prod" onclick="if(event.target.id=='prod')closeProd()"><div class="pbox" id="pbox"></div></div>
<div id="toast"></div>
<script>
const U='https://qjgevvizqeebtdqcbqmt.supabase.co',K='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';let supa,all=[],vm={},oid=O,ol=OL,did=null,did2=null,cost=0,serv='',cur={},cv=[],ci='',cc='';
const esc=t=>(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const getCart=()=>{try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch{return[]}};
const saveCart=c=>{localStorage.setItem('arinda_cart2',JSON.stringify(c));upd()};
function upd(){let t=getCart().reduce((a,b)=>a+b.qty,0);document.getElementById('cc').innerText=t;}
function out(v){return v.is_available===false||(v.stock!=null&&+v.stock<=0)}
function ready(id){return (vm[id]||[]).some(v=>!out(v))}
function mReady(id){return (vm[id]||[]).find(v=>!out(v))}
function img(u,w=400){if(!u)return '';if(u.includes('/storage/v1/object/public/')){let p=u.split('/storage/v1/object/public/')[1];return `${U}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`}return u}
function fly(u,el){document.querySelectorAll('.fly').forEach(e=>e.remove());let ic=document.getElementById('cartIcon'),r=ic.getBoundingClientRect(),tx=r.left+r.width/2-34-6,ty=r.top+r.height/2-34-4,rr=el.getBoundingClientRect(),f=document.createElement('img');f.src=img(u,120);f.className='fly';f.style.left=rr.left+rr.width/2-34+'px';f.style.top=rr.top+rr.height/2-34+'px';document.body.appendChild(f);requestAnimationFrame(()=>requestAnimationFrame(()=>{f.style.left=tx+'px';f.style.top=ty+'px';f.style.transform='scale(.14)';f.style.opacity='.2'}));setTimeout(()=>f.remove(),700)}
function s(){let q=document.getElementById('q').value.toLowerCase().trim();if(!q)return ren(all);ren(all.filter(p=>p.name.toLowerCase().includes(q)||(vm[p.id]||[]).some(v=>v.color_name.toLowerCase().includes(q))))}
function ren(list){let e=document.getElementById('list'),r=(list||[]).filter(p=>ready(p.id));e.innerHTML=r.map((p,i)=>{let m=mReady(p.id);return `<div class="card"><div style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:7px;padding:4px 6px;z-index:2">SISA ${m.stock}</div><div class="heart" onclick="event.stopPropagation();qa('${p.id}',this,${i},'${esc(m.color_name)}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="im-${p.id}-${i}" src="${img(m.image_url,400)}" onclick="op('${p.id}','${esc(m.color_name)}')"><div style="padding:8px;border-top:1px solid #F2F2F2" onclick="op('${p.id}','${esc(m.color_name)}')"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.color_name)}</div><div style="font-size:10px;font-weight:600;margin-top:2px">Rp${(+p.price).toLocaleString('id-ID')}</div></div></div>`}).join('')}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function qa(id,btn,i,cn){let p=all.find(x=>x.id==id),v=(vm[id]||[]).find(x=>x.color_name==cn)||mReady(id);if(!v||out(v))return toast('Habis');let im=document.getElementById(`im-${id}-${i}`);if(im)fly(v.image_url,im);let c=getCart(),ix=c.findIndex(a=>a.warna==p.name+' - '+v.color_name);if(ix>-1)c[ix].qty++;else c.push({warna:p.name+' - '+v.color_name,qty:1,harga:+p.price,img:v.image_url});saveCart(c);renderCart();toast(v.color_name+' masuk keranjang')}
async function op(id,cn){document.getElementById('prod').classList.add('on');document.getElementById('pbox').innerHTML='Loading...';let {data:p}=await supa.from('products').select('*').eq('id',id).single(),{data:vars}=await supa.from('product_variants').select('*').eq('product_id',id).order('id');cur=p;cv=(vars||[]).filter(v=>!out(v));let iniv=cv.find(v=>v.color_name==cn)||cv[0];cc=iniv.color_name;ci=iniv.image_url;document.getElementById('pbox').innerHTML=`<div class="pg"><div class="pm"><img id="bimg" src="${img(ci,600)}"></div><div class="th">${cv.map((v,i)=>`<div style="position:relative"><img src="${img(v.image_url,80)}" class="${v.image_url==ci?'a':''}" onclick="pick(${i})"><span style="position:absolute;bottom:2px;left:2px;background:#000;color:#fff;font-size:5px;padding:2px 3px">SISA ${v.stock}</span></div>`).join('')}</div></div><div class="pi"><div style="font-family:Cormorant Garamond;font-size:20px">${esc(p.name)}</div><div style="font-size:18px;margin-top:4px">Rp${(+p.price).toLocaleString('id-ID')}</div><div style="margin-top:10px;font-size:8px;opacity:.5">PILIH WARNA</div><div class="vw">${cv.map((v,i)=>`<button id="vb${i}" class="${v.image_url==ci?'a':''}" onclick="pick(${i})">${esc(v.color_name)}</button>`).join('')}</div><div style="margin-top:12px;background:#FAFAFA;border:1px solid #F0EBE3;padding:8px"><div style="display:flex;gap:6px"><input id="dp" placeholder="Kota tujuan" style="flex:1;padding:10px;border:1px solid #000"><button onclick="sd(false)" style="padding:10px;background:#000;color:#fff;border:0;font-size:8px">CEK</button></div><div id="dlp" style="display:none;background:#fff;border:1px solid #E9E9E9;max-height:100px;overflow:auto;margin-top:6px"></div><div style="display:flex;gap:6px;margin-top:6px"><select id="cs" style="flex:1;padding:8px;border:1px solid #E9E9E9"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="pos">POS</option></select><button onclick="co()" style="flex:1;padding:8px;background:#fff;border:1px solid #000;font-size:8px">CEK ONGKIR</button></div><div id="or" style="margin-top:6px"></div><div id="os" style="margin-top:6px;font-size:10px;font-weight:600"></div></div><div style="display:flex;gap:6px;margin-top:12px"><button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="addM()">+ KERANJANG</button><button class="btn" onclick="buyM()">BELI</button></div></div>`}
function pick(i){let v=cv[i];cc=v.color_name;ci=v.image_url;document.getElementById('bimg').src=img(ci,600);document.querySelectorAll('.th img').forEach((e,j)=>e.classList.toggle('a',j==i));document.querySelectorAll('.vw button').forEach((b,j)=>b.classList.toggle('a',j==i))}
function closeProd(){document.getElementById('prod').classList.remove('on')}
function addM(){let c=cv.find(v=>v.image_url==ci);if(out(c))return toast('Habis');fly(ci,document.getElementById('bimg'));let cart=getCart(),ix=cart.findIndex(a=>a.warna==cur.name+' - '+cc);if(ix>-1)cart[ix].qty++;else cart.push({warna:cur.name+' - '+cc,qty:1,harga:+cur.price,img:ci});saveCart(cart);renderCart();toast('Masuk keranjang')}
function openCart(){renderCart();document.getElementById('cart').classList.add('on')}
function closeCart(){document.getElementById('cart').classList.remove('on')}
function renderCart(){let c=getCart(),sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('ct').innerText='Rp'+(sub+cost).toLocaleString('id-ID');document.getElementById('cList').innerHTML=c.length?c.map((it,i)=>`<div style="display:flex;gap:8px;padding:8px 0;border-bottom:1px solid #F2F2F2;align-items:center"><img src="${img(it.img,80)}" style="width:44px;height:44px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${esc(it.warna)}</div><div style="font-size:9px;opacity:.5">${it.qty} x Rp${it.harga.toLocaleString('id-ID')}</div></div><button onclick="ch(${i},-1)" style="width:26px;height:26px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><button onclick="ch(${i},1)" style="width:26px;height:26px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join(''):'<div style="padding:20px;text-align:center;opacity:.4">Kosong</div>'}
function ch(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);renderCart()}
function saveLS(city,did){let p={city,cost,service:serv,origin:ol,origin_id:oid,destination_id:did};sessionStorage.setItem('checkout_ongkir',JSON.stringify(p));localStorage.setItem('checkout_ongkir_backup',JSON.stringify(p))}
async function sd(isCart){let inp=isCart?document.getElementById('dc'):document.getElementById('dp'),dl=isCart?document.getElementById('dl'):document.getElementById('dlp'),q=inp.value.trim();if(q.length<2)return toast('Ketik 3 huruf');dl.style.display='block';dl.innerHTML='Mencari...';try{let r=await fetch('/api/search?q='+encodeURIComponent(q),{cache:'no-store'}),t=await r.text();if(!r.ok)throw new Error(t);let j=JSON.parse(t);dl.innerHTML=(j.data||[]).map(d=>`<div style="padding:8px;border-bottom:1px solid #eee;cursor:pointer;font-size:11px" onclick="sel('${d.id}','${esc(d.label)}',${isCart})">${esc(d.label)}</div>`).join('')||'Tidak ketemu'}catch(e){dl.innerHTML='GAGAL: '+esc(e.message)}}
function sel(id,label,isCart){if(isCart){did2=id;document.getElementById('dc').value=label;document.getElementById('dl').style.display='none';cekC()}else{did=id;document.getElementById('dp').value=label;document.getElementById('dlp').style.display='none'}}
async function cekC(){if(!did2)return;let b=document.getElementById('oc');b.innerHTML='Cek...';try{let r=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:oid,destination:did2,weight:1000,courier:'jne'})}),t=await r.text(),j=JSON.parse(t),list=j.data||[];b.innerHTML=list.map(c=>`<label style="display:flex;justify-content:space-between;padding:8px;border:1px solid #000;margin-top:4px"><span style="font-size:10px">${esc(c.service)}</span><span>Rp${(+c.cost).toLocaleString('id-ID')} <input type="radio" name="oc" onchange="setC(${c.cost},'${esc(c.service)}')"></span></label>`).join('')}catch(e){b.innerHTML='GAGAL'}}}
function setC(c,s){cost=+c;serv=s;saveLS(document.getElementById('dc').value,did2);renderCart()}
async function co(){if(!did)return toast('Pilih kota');let b=document.getElementById('or');b.innerHTML='Cek...';try{let r=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:oid,destination:did,weight:1000,courier:document.getElementById('cs').value})}),t=await r.text(),j=JSON.parse(t),list=j.data||[];b.innerHTML=list.map(c=>`<div onclick="setP(${c.cost},'${esc(c.service)}')" style="padding:8px;border:1px solid #000;margin-top:4px;cursor:pointer;font-size:11px">Rp${(+c.cost).toLocaleString('id-ID')} - ${esc(c.service)}</div>`).join('')}catch(e){b.innerHTML='GAGAL: '+esc(e.message)}}
function setP(c,s){cost=+c;serv=s;document.getElementById('os').innerText='✓ '+s+' Rp'+cost.toLocaleString('id-ID');document.getElementById('or').innerHTML='';saveLS(document.getElementById('dp').value,did);renderCart()}
function goCheck(){if(!getCart().length)return toast('Kosong');if(cost<5000)return toast('Cek ongkir dulu');window.location='checkout.html'}
function buyM(){if(cost<5000)return toast('Cek ongkir dulu');addM();goCheck()}
</script>
<script>
document.getElementById('logo').innerHTML=C.toUpperCase()+'<span>HIJAB PREMIUM</span>';document.getElementById('flogo').innerText=C.toUpperCase();
(async()=>{supa=supabase.createClient(U,K);try{let {data}=await supa.from('settings').select('key,value').in('key',['store_name','toko_origin_id','toko_origin_label']);let g=k=>data?.find(x=>x.key==k)?.value||'';let n=g('store_name'),id=g('toko_origin_id'),lb=g('toko_origin_label');if(n&&n!=C){localStorage.setItem('store_name_cache',n);document.getElementById('logo').innerHTML=n.toUpperCase()+'<span>HIJAB PREMIUM</span>';document.getElementById('flogo').innerText=n.toUpperCase()}if(id){oid=id;localStorage.setItem('toko_origin_id',id)}if(lb){ol=lb;localStorage.setItem('store_origin_label',lb)}}catch{}let {data:ap}=await supa.from('products').select('id,name,price,image_url').order('id',{ascending:false}).limit(80);let {data:av}=await supa.from('product_variants').select('product_id,color_name,image_url,stock,is_available').limit(500);all=ap||[];vm={};(av||[]).forEach(v=>{if(!vm[v.product_id])vm[v.product_id]=[];vm[v.product_id].push(v)});ren(all);upd();renderCart();let o=JSON.parse(sessionStorage.getItem('checkout_ongkir')||localStorage.getItem('checkout_ongkir_backup')||'null');if(o){cost=o.cost||0;serv=o.service||''}})();
</script></body></html>
