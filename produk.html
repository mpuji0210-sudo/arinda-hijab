<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PRODUK - ARINDA</title>
<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(17,17,17,0.06)}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px}.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}
.icons{display:flex;gap:20px;align-items:center}.icon-btn{background:none;border:none;cursor:pointer;position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-2px;right:-2px;background:#111;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center;display:none}
.nav-menu{border-top:1px solid rgba(17,17,17,0.06);overflow-x:auto}.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35;white-space:nowrap}.menu a.active{opacity:1;border-bottom:1px solid #111}
.prod-grid{display:grid!important;grid-template-columns:repeat(2,1fr)!important;gap:8px!important}@media(min-width:700px){.prod-grid{grid-template-columns:repeat(4,1fr)!important;gap:10px!important}}
.prod-card{border:1px solid var(--line);background:#fff;cursor:pointer;position:relative;overflow:hidden;border-radius:12px!important}
.prod-card img{width:100%!important;height:200px!important;object-fit:cover!important;object-position:center top!important;display:block!important;background:#F8F4EF!important}
@media(min-width:700px){.prod-card img{height:230px!important}}
.heart-btn{position:absolute;top:6px;right:6px;width:26px;height:26px;background:rgba(255,255,255,.92);border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid var(--line);z-index:2}.heart-btn svg{width:12px;height:12px;stroke:#111;fill:none;stroke-width:1.2}
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}#cartModal.open{display:flex}#cartBox{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:none;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:8px}.btn-light{width:100%;padding:11px;background:#fff;border:1px solid var(--line);font-size:9px;letter-spacing:2px;cursor:pointer;margin-top:8px;border-radius:8px}
#prodModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:300;align-items:center;justify-content:center;padding:8px}#prodModal.show{display:flex}
.p-box{background:#fff;max-width:960px;width:100%;display:grid;grid-template-columns:1.15fr 0.85fr;max-height:90vh;border:1px solid var(--line);overflow:hidden;border-radius:18px}
.p-gallery{display:grid;grid-template-columns:1fr 66px;gap:8px;padding:8px;background:#FFFCF9;align-items:start}
.p-main{width:100%;aspect-ratio:1/1;height:264px;max-height:264px;overflow:hidden;display:flex;justify-content:center;background:#F8F4EF;border-radius:14px}
.p-main img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block}
.p-thumbs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;height:264px;max-height:264px;padding-right:2px}
.p-thumbs img{width:60px;height:60px;min-height:60px;object-fit:cover;opacity:.5;border:2px solid transparent;cursor:pointer;border-radius:10px;background:#eee;flex-shrink:0}
.p-thumbs img.active{opacity:1;border-color:#111}
.p-info{padding:12px 14px 10px;overflow:auto;background:#fff;display:flex;flex-direction:column;max-height:90vh}
@media(max-width:720px){.p-box{grid-template-columns:1fr;max-height:92vh;overflow-y:auto}.p-gallery{grid-template-columns:1fr 64px}.p-main{height:280px;max-height:280px}.p-thumbs{height:280px;max-height:280px}.p-info{max-height:none}}
#cartToast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(120px);background:#111;color:#fff;padding:10px 18px;border-radius:30px;display:flex;align-items:center;gap:12px;z-index:9999;transition:.5s;opacity:0}#cartToast.show{transform:translateX(-50%) translateY(0);opacity:1}#cartToast img{width:32px;height:32px;border-radius:50%;object-fit:cover}
</style></head><body>
<nav><div class="nav-top"><div class="logo">ARINDA<span>HIJAB PREMIUM</span></div><div class="icons">
<button class="icon-btn" onclick="document.getElementById('q').focus()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<button type="button" class="icon-btn" id="cartIcon" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></button>
</div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a class="active">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div></nav>

<main style="max-width:1280px;margin:0 auto;padding:16px">
<div style="display:flex;gap:10px;align-items:center;margin:12px 0 18px">
<input id="q" onkeyup="if(event.key==='Enter')doSearch()" placeholder="CARI WARNA - MIS: PUTIH, NAVY, BLUSH" style="flex:1;padding:14px 20px;border:1px solid #111;border-radius:30px;font-size:12px;outline:none">
<button onclick="doSearch()" style="padding:14px 24px;background:#111;color:#fff;border-radius:30px;border:none;font-size:10px;font-weight:700">CARI</button>
</div>
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
<div style="font-size:10px;letter-spacing:2px;font-weight:700" id="judulPage">PRODUK READY</div>
<div id="prodCount" style="font-size:10px;opacity:.6">0 PRODUK</div>
</div>
<div id="list" class="prod-grid"></div>
</main>

<div id="prodModal" onclick="if(event.target.id=='prodModal')closeProd()"><div class="p-box" id="pBox">Loading...</div></div>

<div id="cartModal" onclick="if(event.target.id==='cartModal')closeCart()"><div id="cartBox">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="letter-spacing:2px;font-size:11px">KERANJANG (<span id="cartTotalQty">0</span>)</b><button onclick="closeCart()" style="border:none;background:none;font-size:22px">×</button></div>
<div id="cartList" style="margin-top:12px"></div>
<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
<div style="display:flex;justify-content:space-between;font-size:11px"><span>SUBTOTAL</span><span id="cartSubtotal">Rp0</span></div>
<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px"><span>ONGKIR <small id="ongkirLabel" style="opacity:.5"></small></span><span id="ongkirPriceCart">Rp0</span></div>
<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><b>TOTAL</b><b id="cartTotalPrice">Rp0</b></div>
<button onclick="checkoutWA()" class="btn" style="margin-top:14px">CHAT WA & PESAN SEKARANG</button>
<button onclick="clearCart()" class="btn-light">KOSONGKAN</button>
</div>
</div></div>

<div id="cartToast"><img id="toastImg"><span id="toastText" style="font-size:9px"></span></div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
let supabaseClient,allProducts=[],WA_NUMBER="6285178098354",tokoOriginId="17523",selectedDestId=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[],activeUnder='ALL';
const COCOK_UNTUK={COOL:['PUTIH','WHITE','NAVY','BLUE','ABU','GREY','LILAC','PLUM','BURGUNDY','ROSE','PINK','CHARCOAL','HITAM','BLACK','DUSTY'],WARM:['KREM','CREAM','MILO','MUSTARD','CARAMEL','OLIVE','BROWN','COKSU','MAROON','PEACH','CORAL','BEIGE','MOCCA'],NEUTRAL:['HITAM','PUTIH','KREM','ABU','BEIGE','NUDE','IVORY','MOCCA'],OLIVE:['OLIVE','SAGE','ARMY','GREEN','KHAKI','MOSS','FOREST','EMERALD']};

function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){let t=getCart().reduce((a,b)=>a+(b.qty||0),0);let el=document.getElementById('cCount');if(el){el.innerText=t;el.style.display=t>0?'flex':'none';}}
function clearCart(){if(!confirm('Kosongkan keranjang?'))return;saveCart([]);selectedOngkirCost=0;selectedService='';document.getElementById('ongkirLabel').innerText='';}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function getOptImg(u,w=300){if(!u) return ''; if(u.includes('/storage/v1/object/public/')){const p=u.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return u;}
function doSearch(){applyFilters(document.getElementById('q').value.toLowerCase().trim());}
function applyFilters(qOverride){
  const q=(qOverride!==undefined?qOverride:(document.getElementById('q').value||'')).toLowerCase().trim();
  let filtered=[];
  if(activeUnder!=='ALL'){
    const kata=COCOK_UNTUK[activeUnder]||[];
    document.getElementById('judulPage').innerText='PRODUK UNTUK '+activeUnder;
    allProducts.forEach(p=>{const vars=window._varMap[p.id]||[];vars.forEach(v=>{if(kata.some(k=>(v.color_name||'').toUpperCase().includes(k))) filtered.push({p:p,v:v});});});
  }else if(q){
    document.getElementById('judulPage').innerText='HASIL: '+q.toUpperCase();
    allProducts.forEach(p=>{const vars=window._varMap[p.id]||[];vars.forEach(v=>{if(p.name.toLowerCase().includes(q)||(v.color_name||'').toLowerCase().includes(q)) filtered.push({p:p,v:v});});});
  }else{
    document.getElementById('judulPage').innerText='PRODUK READY';
    allProducts.forEach(p=>{const v=(window._varMap[p.id]||[])[0];if(v) filtered.push({p:p,v:v});});
  }
  document.getElementById('prodCount').innerText=filtered.length+' WARNA';
  render(filtered);
}
function handleUrlSearch(){const params=new URLSearchParams(location.search);const ut=(params.get('undertone')||'').toUpperCase();const q=params.get('q')||'';if(ut) activeUnder=ut;if(q) document.getElementById('q').value=q;setTimeout(()=>{applyFilters(q.toLowerCase());},300);}
function render(list){
  const el=document.getElementById('list');
  if(!list.length){el.innerHTML='<div style="grid-column:1/-1;text-align:center;padding:40px;opacity:.5">TIDAK ADA<br><button onclick="location.href=\'produk.html\'" style="margin-top:10px;padding:8px 16px;border-radius:20px;border:1px solid #111;background:#fff;font-size:9px">LIHAT SEMUA</button></div>';return;}
  el.innerHTML=list.map((item)=>{
    const p=item.p;const v=item.v;const out=isOut(v);const opt=getOptImg(v.image_url||p.image_url,400);
    return `<div class="prod-card" onclick="${out?'':'openProd(\''+p.id+'\',\''+v.color_name+'\')'}"><div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}','${v.color_name}',this)"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img src="${opt}" loading="lazy"><div style="padding:8px;border-top:1px solid #F6F1EB"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${v.color_name}</div><div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;
  }).join('');
}
function quickAdd(id,colorName,btn){const p=allProducts.find(x=>String(x.id)===String(id));const vars=window._varMap[id]||[];let v=vars.find(x=>(x.color_name||'').toUpperCase()===colorName.toUpperCase())||vars[0];if(!v||isOut(v))return;addCart(p.name+' - '+v.color_name,p.price,v.image_url);showCartToast(v.color_name,v.image_url);}
async function openProd(id,colorName){
  document.getElementById('prodModal').classList.add('show');
  document.getElementById('pBox').innerHTML='<div style="padding:40px;text-align:center">Loading...</div>';
  const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();
  const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');
  curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:'KREM',image_url:p.image_url,stock:1}];
  let initial=curVariants[0];if(colorName){const f=curVariants.find(v=>v.color_name.toUpperCase()===colorName.toUpperCase());if(f) initial=f;}
  curColor=initial.color_name;curImg=initial.image_url;
  document.getElementById('pBox').innerHTML=`
  <div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}"></div><div class="p-thumbs">${curVariants.map((v,i)=>`<img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})">`).join('')}</div></div>
  <div class="p-info">
    <div style="font-size:20px;font-family:'Cormorant Garamond';font-weight:600">${p.name}</div><div style="font-size:22px;margin-top:4px">Rp${Number(p.price).toLocaleString('id-ID')}</div>
    <div style="margin-top:10px;font-size:8px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${curColor}</b></div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;max-height:80px;overflow-y:auto">${curVariants.map((v,i)=>`<button id="btn-${i}" onclick="pickColor('${v.color_name}','${v.image_url}',${i})" style="padding:8px 12px;border:1px solid ${v.image_url===curImg?'#111':'#eee'};background:${v.image_url===curImg?'#111':'#fff'};color:${v.image_url===curImg?'#fff':'#111'};border-radius:20px;font-size:7px">${v.color_name}</button>`).join('')}</div>
    <div style="margin-top:14px;padding:12px;background:#FFFCF9;border:1px solid #EDE8E1;border-radius:12px">
      <div style="font-size:8px;letter-spacing:2px;opacity:.5;margin-bottom:8px;font-weight:700">CEK ONGKIR DULU SEBELUM BELI</div>
      <div style="display:flex;gap:6px"><input id="destSearchProd" placeholder="Kecamatan - Beji Depok" style="flex:1;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:11px"><button onclick="searchDestProd()" style="padding:10px 14px;background:#111;color:#fff;border:none;border-radius:8px;font-size:9px">CARI</button></div>
      <div id="destListProd" style="display:none;margin-top:8px;max-height:100px;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:8px"></div>
      <div style="display:flex;gap:6px;margin-top:8px"><select id="courierSelectProd" style="flex:1;padding:9px;border:1px solid var(--line);border-radius:8px;font-size:11px"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="sicepat">SiCepat</option><option value="pos">POS</option></select><button onclick="cekOngkirProd()" style="flex:1;padding:9px;background:#fff;border:1px solid #111;border-radius:8px;font-size:9px">CEK ONGKIR</button></div>
      <div id="ongkirResultProd" style="margin-top:8px"></div><div id="ongkirSelectedProd" style="margin-top:8px;font-size:10px;font-weight:600">${selectedService?'✓ '+selectedService+' - Rp'+selectedOngkirCost.toLocaleString('id-ID'):''}</div>
    </div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="btn" style="background:#fff;color:#111;border:1px solid #111" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI</button></div>
  </div>`;
}
function pickColor(c,i,idx){curColor=c;curImg=i;document.getElementById('bigImg').src=getOptImg(i,600);document.getElementById('selCol').innerText=c;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j==idx));}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function showCartToast(c,i){const t=document.getElementById('cartToast');document.getElementById('toastImg').src=getOptImg(i,80);document.getElementById('toastText').innerText=c+' MASUK KERANJANG';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur))return;addCart(curProd.name+' - '+curColor,curProd.price,curImg);showCartToast(curColor,curImg);}
function buyFromModal(){let msg=`Halo ARINDA %0A- ${curProd.name} - ${curColor} = Rp${Number(curProd.price).toLocaleString('id-ID')}%0A`;if(selectedOngkirCost>0) msg+=`ONGKIR ${selectedService}: Rp${selectedOngkirCost.toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna===n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){
  const c=getCart();const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);
  document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');
  document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');
  document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');
  document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';
  const list=document.getElementById('cartList');
  if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4">KOSONG</p>';return;}
  list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2EFEA;align-items:center"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;border-radius:8px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');
}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`TOTAL Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
async function searchDestProd(){const q=document.getElementById('destSearchProd').value.trim();if(!q)return;const dl=document.getElementById('destListProd');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestProd('${d.id}','${d.label.replace(/'/g,'')}')">${d.label}</div>`).join('');}catch(e){dl.innerHTML='GAGAL';}}
function pilihDestProd(id,label){selectedDestId=id;document.getElementById('destSearchProd').value=label;document.getElementById('destListProd').style.display='none';}
async function cekOngkirProd(){if(!selectedDestId){document.getElementById('ongkirResultProd').innerHTML='<div style="color:red;font-size:10px">Pilih kecamatan</div>';return;}document.getElementById('ongkirResultProd').innerHTML='CEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelectProd').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:(arr.costs||[]);let h='';list.forEach(c=>{h+=`<div onclick="setOngkirProd(${c.cost||0},'${c.service}','${c.etd}')" style="padding:10px;border:1px solid #111;margin:4px 0;cursor:pointer;border-radius:8px;font-size:11px"><b>${c.service}</b> - Rp${Number(c.cost).toLocaleString('id-ID')} (${c.etd})</div>`;});document.getElementById('ongkirResultProd').innerHTML=h||'TIDAK ADA';}catch(e){document.getElementById('ongkirResultProd').innerHTML='ERROR';}}
function setOngkirProd(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirSelectedProd').innerHTML=`✓ ${selectedService} - Rp${selectedOngkirCost.toLocaleString('id-ID')}`;document.getElementById('ongkirResultProd').innerHTML='';renderCart();}
</script>
