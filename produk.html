<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title id="pageTitle">PRODUK - ARINDA</title>
<script>const STORE_CACHE=localStorage.getItem('store_name_cache')||'ARINDA';document.title='PRODUK - '+STORE_CACHE.toUpperCase();</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;font-family:Inter,sans-serif}
nav{position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid #E9E9E9}
.nav-top{max-width:1240px;margin:0 auto;padding:14px 16px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:Cormorant Garamond;letter-spacing:8px;font-size:20px}.logo span{font-family:Inter;display:block;font-size:7px;letter-spacing:5px;opacity:.4}
.badge{position:absolute;top:-2px;right:-2px;background:#000;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.menu{max-width:1240px;margin:0 auto;padding:0 16px;display:flex;gap:28px;border-top:1px solid #F2F2F2;overflow-x:auto}.menu a{font-size:9px;letter-spacing:3px;color:#000;text-decoration:none;padding:12px 0;opacity:.35}.menu a.on{opacity:1;border-bottom:1px solid #000}
.search-wrap{max-width:1240px;margin:0 auto;padding:12px 20px;display:flex;gap:10px;border-top:1px solid #F2F2F2}
.search-wrap input{flex:1;padding:12px 0;border:none;border-bottom:1px solid #000;background:transparent;font-size:12px;outline:none}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#E9E9E9;border:1px solid #E9E9E9;max-width:1240px;margin:0 auto}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
.card{background:#fff;position:relative;cursor:pointer}.card img{width:100%;height:220px;object-fit:cover;display:block}
.under-badge{display:inline-block;padding:3px 6px;background:#000;color:#fff;font-size:6px;letter-spacing:1px;margin:2px}
#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(100px);background:#000;color:#fff;padding:10px 18px;border-radius:20px;font-size:10px;transition:.4s;opacity:0;z-index:9999}#toast.on{transform:translateX(-50%) translateY(0);opacity:1}
#prod{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:300;align-items:center;justify-content:center;padding:10px}#prod.on{display:flex}.pbox{background:#fff;max-width:900px;width:100%;display:grid;grid-template-columns:1.1fr.9fr;max-height:90vh;overflow:hidden;border:1px solid #E9E9E9}
.pg{display:grid;grid-template-columns:1fr 60px;gap:8px;padding:10px}.pm{height:320px;background:#FAFAFA;border:1px solid #F2F2F2}.pm img{width:100%;height:100%;object-fit:cover}.th{height:320px;overflow:auto;display:flex;flex-direction:column;gap:5px}.th img{width:56px;height:56px;object-fit:cover;border:1px solid #E9E9E9;cursor:pointer}
.pi{padding:14px;border-left:1px solid #F2F2F2;overflow:auto}.vw{display:flex;gap:6px;flex-wrap:wrap}.vw button{padding:7px 10px;border:1px solid #E9E9E9;background:#fff;font-size:8px;cursor:pointer}.vw button.a{background:#000;color:#fff}.vw button:disabled{opacity:.35;text-decoration:line-through}
.btn{width:100%;padding:12px;background:#000;color:#fff;border:0;font-size:9px;letter-spacing:3px;cursor:pointer;margin-top:8px}
@media(max-width:800px){.pbox{grid-template-columns:1fr}}
</style>
</head><body>
<nav><div class="nav-top"><div class="logo" id="logo"></div><button style="position:relative;width:34px;height:34px;background:none;border:none" onclick="location='checkout.html'"><svg viewBox="0 0 24 24" width="18" height="18" style="stroke:#000;fill:none;stroke-width:1.2"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5a3 3 0 0 1 6 0v2"/></svg><span class="badge" id="cc">0</span></button></div><div class="menu"><a href="index.html">BERANDA</a><a class="on">PRODUK</a><a href="kategori.html">KATEGORI</a><a href="kontak.html">KONTAK</a></div><div class="search-wrap"><input id="q" oninput="doSearch()" placeholder="CARI WARNA..."><button onclick="doSearch()" style="background:#000;color:#fff;border:none;padding:10px 18px;font-size:9px">CARI</button></div></nav>
<div id="list" class="grid"></div>
<div id="prod" onclick="if(event.target.id=='prod')closeP()"><div class="pbox" id="pbox"></div></div>
<div id="toast"></div>
<script>
const U='https://qjgevvizqeebtdqcbqmt.supabase.co',K='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';let supa,all=[],vm={},cur={},cv=[],ci='',cn='',activeUnder='ALL',lastQ='';
const esc=s=>(s||'').toString().replace(/</g,'&lt;');const getC=()=>{try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch{return[]}};const saveC=c=>{localStorage.setItem('arinda_cart2',JSON.stringify(c));upd()};function upd(){document.getElementById('cc').innerText=getC().reduce((a,b)=>a+b.qty,0)}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false}
function hasReady(pid){let vs=vm[pid]||[];if(!vs.length)return true;return vs.some(v=>!isOut(v));}
function img(u,w=400){if(!u)return '';if(u.includes('/storage/v1/object/public/')){let p=u.split('/storage/v1/object/public/')[1];return `${U}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=70&format=webp&resize=cover`}return u}
function toast(t){let e=document.getElementById('toast');e.innerText=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2000)}
function normalizeUnder(a){if(!a)return[];let arr=Array.isArray(a)?a:[a];try{if(typeof a==='string'&&a.startsWith('['))arr=JSON.parse(a);}catch{}return arr.map(x=>String(x).toUpperCase());}
function getReadyVariant(pid,q,under){let vs=vm[pid]||[];let ready=vs.filter(v=>!isOut(v));let pool=ready.length?ready:vs;if(under&&under!=='ALL'){let f=pool.find(v=>normalizeUnder(v.undertone||[]).includes(under));if(f)return f;}if(q){let f=pool.find(v=>v.color_name.toLowerCase().includes(q));if(f)return f;}return pool[0]||vs[0]||null}
function doSearch(){let q=document.getElementById('q').value.toLowerCase().trim();lastQ=q;applyFilters(q)}
function applyFilters(qOverride){
 let q=(qOverride!==undefined?qOverride:lastQ).toLowerCase().trim();
 let base=all.filter(p=>hasReady(p.id));
 if(activeUnder!=='ALL' || q){
   let flat=[];base.forEach(p=>{(vm[p.id]||[]).filter(v=>!isOut(v)).forEach(v=>{let u=normalizeUnder(v.undertone||p.undertone||[]);let matchU=activeUnder==='ALL'||u.includes(activeUnder);let matchQ=!q||v.color_name.toLowerCase().includes(q)||p.name.toLowerCase().includes(q);if(matchU&&matchQ)flat.push({p,v})})});
   let seen=new Set();flat=flat.filter(it=>{let k=it.p.id+'|'+it.v.color_name;if(seen.has(k))return false;seen.add(k);return true});
   document.getElementById('list').innerHTML=flat.length?flat.map(({p,v})=>`<div class="card" onclick="openP('${p.id}','${esc(v.color_name)}')"><div style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:7px;padding:4px 6px">SISA ${v.stock??0}</div><img src="${img(v.image_url,400)}"><div style="padding:8px"><div style="font-size:9px">${esc(v.color_name)}</div><div style="font-size:6px;margin-top:2px">${normalizeUnder(v.undertone||[]).map(u=>`<span class="under-badge">${esc(u)}</span>`).join('')}</div><div style="font-size:10px;font-weight:600">Rp${(+p.price).toLocaleString('id-ID')}</div></div></div>`).join(''):`<div style="grid-column:1/-1;padding:60px;text-align:center;opacity:.4">Tidak ada warna ${esc(activeUnder)} untuk "${esc(q)}"</div>`;
   return;
 }
 document.getElementById('list').innerHTML=base.map(p=>{let m=getReadyVariant(p.id,'','ALL');if(!m)return '';return `<div class="card" onclick="openP('${p.id}','${esc(m.color_name)}')"><div style="position:absolute;top:0;left:0;background:#000;color:#fff;font-size:7px;padding:4px 6px">SISA ${m.stock??0}</div><img src="${img(m.image_url,400)}"><div style="padding:8px"><div style="font-size:9px">${esc(m.color_name)}</div><div style="font-size:6px">${normalizeUnder(m.undertone||[]).map(u=>`<span class="under-badge">${esc(u)}</span>`).join('')}</div></div></div>`}).join('');
}
async function openP(id,color){document.getElementById('prod').classList.add('on');document.getElementById('pbox').innerHTML='Loading...';let {data:p}=await supa.from('products').select('*').eq('id',id).single();let {data:vars}=await supa.from('product_variants').select('*').eq('product_id',id).order('id');cur=p;cv=vars||[];let init=cv.find(v=>v.color_name===color)||cv.find(v=>!isOut(v))||cv[0];cn=init.color_name;ci=init.image_url;document.getElementById('pbox').innerHTML=`<div class="pg"><div class="pm"><img id="bimg" src="${img(ci,600)}"></div><div class="th">${cv.map((v,i)=>`<div style="opacity:${isOut(v)?'.4':1}"><img src="${img(v.image_url,80)}" onclick="${isOut(v)?'':'pick('+i+')'}" style="${isOut(v)?'filter:grayscale(1)':''}"><span style="font-size:5px;background:${isOut(v)?'#999':'#000'};color:#fff;padding:2px">${isOut(v)?'HABIS':'SISA '+(v.stock??0)}</span></div>`).join('')}</div></div><div class="pi"><div style="font-size:20px">${esc(p.name)}</div><div style="font-size:18px">Rp${(+p.price).toLocaleString('id-ID')}</div><div style="margin-top:10px;font-size:8px;opacity:.5">PILIH WARNA</div><div class="vw" style="margin-top:6px">${cv.map((v,i)=>`<button ${isOut(v)?'disabled':''} class="${v.image_url==ci?'a':''}" onclick="pick(${i})">${esc(v.color_name)}${isOut(v)?' (HABIS)':''}</button>`).join('')}</div><div style="margin-top:8px;font-size:7px;opacity:.6">${normalizeUnder(init.undertone||[]).join(', ')}</div><button class="btn" onclick="addCart()">+ KERANJANG</button><button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="buyNow()">BELI SEKARANG</button></div>`;}
function pick(i){let v=cv[i];if(isOut(v))return;cn=v.color_name;ci=v.image_url;document.getElementById('bimg').src=img(ci,600)}
function closeP(){document.getElementById('prod').classList.remove('on')}
function addCart(){let v=cv.find(x=>x.image_url==ci);if(isOut(v))return toast('Habis');let c=getC(),k=cur.name+' - '+cn,ix=c.findIndex(a=>a.warna==k);if(ix>-1)c[ix].qty++;else c.push({warna:k,qty:1,harga:+cur.price,img:ci});saveC(c);toast(cn+' masuk keranjang')}
function buyNow(){addCart();location='checkout.html'}
</script>
<script>
document.getElementById('logo').innerHTML=(localStorage.getItem('store_name_cache')||'ARINDA').toUpperCase()+'<span>HIJAB PREMIUM</span>';
(async()=>{supa=supabase.createClient(U,K);let {data:ap}=await supa.from('products').select('*').order('id',{ascending:false}).limit(200);let {data:av}=await supa.from('product_variants').select('*').limit(2000);all=ap||[];vm={};(av||[]).forEach(v=>{if(!vm[v.product_id])vm[v.product_id]=[];vm[v.product_id].push(v)});let params=new URLSearchParams(location.search);let u=params.get('undertone');if(u)activeUnder=u.toUpperCase();let q=params.get('warna')||params.get('q');if(q){document.getElementById('q').value=q;lastQ=q.toLowerCase();}applyFilters(lastQ);upd();})();
</script></body></html>
