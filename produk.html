<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';let supabaseClient,allProducts=[],tokoOriginId=ORIGIN_ID_CACHE,tokoOriginLabel=ORIGIN_LABEL_CACHE,selectedDestId=null,selectedDestIdCart=null,selectedOngkirCost=0,selectedService='',curProd={},curColor='',curImg='',curVariants=[];let lastSearchQuery='';
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');let t=getCart().reduce((a,b)=>a+(b.qty||0),0);el.innerText=t;el.style.display=t>0?'flex':'none';}
function clearCart(){document.getElementById('confirmModal').classList.add('show');}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');}
function doClearCart(){saveCart([]);selectedOngkirCost=0;selectedService='';closeConfirm();sessionStorage.removeItem('checkout_ongkir');localStorage.removeItem('checkout_ongkir_backup');}
function isOut(v){if(v.is_available===false)return true;if(v.stock!=null)return Number(v.stock)<=0;return false;}
function getOptImg(u,w=300){if(!u) return ''; if(u.includes('/storage/v1/object/public/')){const p=u.split('/storage/v1/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${p}?width=${w}&height=${w}&quality=65&format=webp&resize=cover`;}return u;}
function flyToCart(imgUrl,startEl){document.querySelectorAll('.fly-img').forEach(e=>e.remove());const cartIcon=document.getElementById('cartIcon');if(!cartIcon)return;const cartRect=cartIcon.getBoundingClientRect();const targetX=cartRect.left+cartRect.width/2-34-6;const targetY=cartRect.top+cartRect.height/2-34-4;let rect=startEl?startEl.getBoundingClientRect():{left:innerWidth/2-34,top:innerHeight/2-34,width:68,height:68};const fly=document.createElement('img');fly.src=getOptImg(imgUrl,120);fly.className='fly-img';fly.style.left=(rect.left+rect.width/2-34)+'px';fly.style.top=(rect.top+rect.height/2-34)+'px';document.body.appendChild(fly);requestAnimationFrame(()=>{requestAnimationFrame(()=>{fly.style.left=targetX+'px';fly.style.top=targetY+'px';fly.style.transform='scale(0.14)';fly.style.opacity='0.15';});});setTimeout(()=>{fly.remove();cartIcon.classList.remove('cart-boom');void cartIcon.offsetWidth;cartIcon.classList.add('cart-boom');setTimeout(()=>cartIcon.classList.remove('cart-boom'),420);},720);}
function doSearch(){let raw=document.getElementById('q').value.trim();if(!raw){lastSearchQuery='';renderProducts(allProducts);document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';return;}if(raw.length<2)return;let q=raw.toLowerCase();lastSearchQuery=q;let flat=[];allProducts.forEach(p=>{const vars=window._varMap[p.id]||[];vars.forEach(v=>{if((v.color_name||'').toLowerCase().includes(q)||p.name.toLowerCase().includes(q))flat.push({p,v});});});document.getElementById('prodCount').innerText=flat.length+' WARNA';renderVariants(flat);}
function getMatchedVariant(pid,q){const vars=window._varMap[pid]||[];if(!vars.length)return null;if(q){const f=vars.find(v=>(v.color_name||'').toLowerCase().includes(q.toLowerCase()));if(f)return f;}return vars[0];}
function renderProducts(list){const el=document.getElementById('list');if(!list||!list.length){el.innerHTML='<div style="grid-column:1/-1;padding:40px;text-align:center">KOSONG</div>';return;}el.innerHTML=list.map((p,i)=>{const m=getMatchedVariant(p.id,lastSearchQuery)||{image_url:p.image_url,color_name:p.name,stock:1};let out=isOut(m);let stokLabel=out?'HABIS':'SISA '+(m.stock??0);let stokColor=out?'background:#D32F2F':'background:#000';return `<div class="prod-card"><div style="position:absolute;top:0;left:0;${stokColor};color:#fff;font-size:7px;padding:4px 6px;z-index:2">${stokLabel}</div><div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}',this,${i},'${esc(m.color_name)}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}-${i}" src="${getOptImg(m.image_url,400)}" loading="lazy" onclick="openProd('${p.id}','${esc(m.color_name)}')" style="${out?'opacity:.45;filter:grayscale(1)':''}"><div style="padding:8px;border-top:1px solid #F2F2F2" onclick="openProd('${p.id}','${esc(m.color_name)}')"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(p.name)}</div><div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;}).join('');}
function renderVariants(list){const el=document.getElementById('list');el.innerHTML=list.map((item,i)=>{const p=item.p;const m=item.v;let out=isOut(m);let stokLabel=out?'HABIS':'SISA '+(m.stock??0);let stokColor=out?'background:#D32F2F':'background:#000';return `<div class="prod-card"><div style="position:absolute;top:0;left:0;${stokColor};color:#fff;font-size:7px;padding:4px 6px;z-index:2">${stokLabel}</div><div class="heart-btn" onclick="event.stopPropagation();quickAdd('${p.id}',this,${i},'${esc(m.color_name)}')"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><img id="img-${p.id}-${i}" src="${getOptImg(m.image_url,400)}" loading="lazy" onclick="openProd('${p.id}','${esc(m.color_name)}')" style="${out?'opacity:.45;filter:grayscale(1)':''}"><div style="padding:8px;border-top:1px solid #F2F2F2" onclick="openProd('${p.id}','${esc(m.color_name)}')"><div style="font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(m.color_name)}</div><div style="font-size:10px;margin-top:3px;font-weight:600">Rp${Number(p.price).toLocaleString('id-ID')}</div></div></div>`;}).join('');}
function showToast(t){const el=document.getElementById('cartToast');document.getElementById('toastText').innerText=t;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function quickAdd(id,btnEl,idx,colorName){const p=allProducts.find(x=>String(x.id)===String(id));const vars=window._varMap[id]||[];let v=vars.find(x=>x.color_name===colorName)||getMatchedVariant(id,lastSearchQuery)||vars[0];if(!v)return;if(isOut(v)){showToast(v.color_name+' habis');return;}const imgEl=document.getElementById(`img-${id}-${idx}`)||btnEl?.closest('.prod-card')?.querySelector('img');if(imgEl)flyToCart(v.image_url,imgEl);addCart(p.name+' - '+v.color_name,p.price,v.image_url);showToast(v.color_name+' masuk keranjang');}
async function openProd(id,colorName){document.getElementById('prodModal').classList.add('show');document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main">MEMUAT...</div></div><div class="p-info">MEMUAT...</div>`;const {data:p}=await supabaseClient.from('products').select('*').eq('id',id).single();const {data:vars}=await supabaseClient.from('product_variants').select('*').eq('product_id',id).order('id');curProd=p;curVariants=vars||[];if(!curVariants.length)curVariants=[{color_name:'KREM',image_url:p.image_url,stock:1}];let initial=getMatchedVariant(id,colorName||lastSearchQuery)||curVariants[0];curColor=initial.color_name;curImg=initial.image_url;document.getElementById('pBox').innerHTML=`<div class="p-gallery"><div class="p-main"><img id="bigImg" src="${getOptImg(curImg,600)}"></div><div class="p-thumbs">${curVariants.map((v,i)=>{let out=isOut(v);return `<div style="position:relative"><img src="${getOptImg(v.image_url,80)}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})" style="${out?'opacity:.4;filter:grayscale(1)':''}"><span style="position:absolute;bottom:2px;left:2px;${out?'background:#D32F2F':'background:#000'};color:#fff;font-size:5px;padding:2px 3px">${out?'HABIS':'SISA '+(v.stock??0)}</span></div>`;}).join('')}</div></div><div class="p-info"><div style="font-size:22px;font-family:'Cormorant Garamond'">${esc(p.name)}</div><div style="font-size:20px;margin-top:6px">Rp${Number(p.price).toLocaleString('id-ID')}</div><div style="margin-top:12px;font-size:10px;padding:8px 12px;border:1px solid #000;display:inline-block">● SISA ${(curVariants.find(v=>v.image_url===curImg)||curVariants[0]).stock??0} PCS</div><div style="margin-top:14px;font-size:8px;letter-spacing:2px">PILIH WARNA: <b id="selCol">${esc(curColor)}</b></div><div class="variant-wrap">${curVariants.map((v,i)=>{let out=isOut(v);return `<button id="btn-${i}" class="${v.image_url===curImg?'active':''}" onclick="pickColorByIdx(${i})">${esc(v.color_name)} - ${out?'HABIS':'SISA '+(v.stock??0)}</button>`;}).join('')}</div><div style="margin-top:16px;background:#FAFAFA;border:1px solid #F0EBE3;padding:10px"><div style="display:flex;gap:6px"><input id="destSearchProd" placeholder="Kota tujuan" style="flex:1;padding:11px;border:1px solid #111;background:#fff;font-size:12px"><button onclick="searchDestProd()" style="padding:11px 14px;background:#000;color:#fff;border:none;font-size:8px">CEK</button></div><div id="destListProd" style="display:none;margin-top:8px;max-height:100px;overflow:auto;background:#fff;border:1px solid #E9E9E9"></div><div style="display:flex;gap:6px;margin-top:8px"><select id="courierSelectProd" style="flex:1;padding:10px;border:1px solid #E9E9E9;font-size:11px"><option value="jne">JNE</option><option value="jnt">J&T</option><option value="sicepat">SiCepat</option><option value="pos">POS</option></select><button onclick="cekOngkirProd()" style="flex:1;padding:10px;background:#fff;border:1px solid #000;font-size:8px">CEK ONGKIR</button></div><div id="ongkirResultProd" style="margin-top:8px"></div><div id="ongkirSelectedProd" style="margin-top:8px;font-size:10px;font-weight:600"></div></div><div style="display:flex;gap:8px;margin-top:16px"><button class="btn" style="background:#fff;color:#000;border:1px solid #000" onclick="addToCartFromModal()">+ KERANJANG</button><button class="btn" onclick="buyFromModal()">BELI SEKARANG</button></div></div>`;}
function pickColorByIdx(idx){const v=curVariants[idx];if(!v)return;curColor=v.color_name;curImg=v.image_url;const big=document.getElementById('bigImg');if(big)big.src=getOptImg(v.image_url,600);document.getElementById('selCol').innerText=v.color_name;document.querySelectorAll('.p-thumbs img').forEach((el,j)=>el.classList.toggle('active',j===idx));document.querySelectorAll('.variant-wrap button').forEach((b,j)=>b.classList.toggle('active',j===idx));}
function closeProd(){document.getElementById('prodModal').classList.remove('show');}
function addToCartFromModal(){const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur)){showToast('Habis');return;}const big=document.getElementById('bigImg');if(big)flyToCart(curImg,big);addCart(curProd.name+' - '+curColor,curProd.price,curImg);showToast(curColor+' masuk keranjang');}
function wajibCekOngkir(){if(!selectedOngkirCost||selectedOngkirCost<5000){document.getElementById('ongkirLockModal').classList.add('show');return false;}return true;}
function closeOngkirLock(){document.getElementById('ongkirLockModal').classList.remove('show');openCart();}
function buyFromModal(){if(!wajibCekOngkir())return;const cur=curVariants.find(v=>v.image_url===curImg);if(cur&&isOut(cur)){showToast('Habis');return;}addCart(curProd.name+' - '+curColor,curProd.price,curImg);if(!saveOngkirLS())return;window.location.href='checkout.html';}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1){c[idx].qty++;}else{c.push({warna:n,qty:1,harga:Number(p),img:i});}saveCart(c);}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';const list=document.getElementById('cartList');if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4">KOSONG</p>';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #F2F2F2;align-items:center"><img src="${getOptImg(it.img,80)}" style="width:50px;height:50px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${esc(it.warna)}</div><div style="font-size:9px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #eee;background:#fff">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function saveOngkirLS(){const cityCart=document.getElementById('destCityCart')?.value||'';const cityProd=document.getElementById('destSearchProd')?.value||'';const finalCity=cityCart||cityProd||'';const finalDestId=selectedDestIdCart||selectedDestId||'';if(!finalCity){showToast('Pilih kota dulu');return false;}const payload={city:finalCity,cost:selectedOngkirCost,service:selectedService,origin:tokoOriginLabel,origin_id:tokoOriginId,destination_id:finalDestId};sessionStorage.setItem('checkout_ongkir',JSON.stringify(payload));localStorage.setItem('checkout_ongkir_backup',JSON.stringify(payload));return true;}
async function searchDestCart(){const q=document.getElementById('destCityCart').value.trim();if(!q||q.length<3){showToast('Ketik 3 huruf');return;}const dl=document.getElementById('destListCart');dl.style.display='block';dl.innerHTML='<div style="padding:10px;font-size:10px">MENCARI...</div>';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestCart('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='Gagal';}}
function pilihDestCart(id,label){selectedDestIdCart=id;document.getElementById('destCityCart').value=label;document.getElementById('destListCart').style.display='none';cekOngkirCartReal();}
async function cekOngkirCartReal(){if(!selectedDestIdCart)return;const box=document.getElementById('ongkirOptionsCart');box.style.display='block';box.innerHTML='CEK ONGKIR...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestIdCart,weight:1000,courier:'jne'})});const data=await res.json();const list=data.data||data.costs||[];const arr=Array.isArray(list)?list:list.costs||[];box.innerHTML=arr.map(c=>`<label style="display:flex;justify-content:space-between;padding:10px;border:1px solid #000;margin-top:6px;cursor:pointer"><span style="font-size:10px"><b>${esc(c.service)}</b> ${esc(c.etd||'')}</span><span><b>Rp${Number(c.cost).toLocaleString('id-ID')}</b> <input type="radio" name="ongkirCart" onchange="pilihOngkirCart(${c.cost},'${esc(c.service)}')"></span></label>`).join('');}catch(e){box.innerHTML='Gagal';}}
function pilihOngkirCart(cost,service){selectedOngkirCost=Number(cost);selectedService=service;saveOngkirLS();renderCart();}
async function searchDestProd(){const q=document.getElementById('destSearchProd').value.trim();if(!q||q.length<3){showToast('Min 3 huruf');return;}const dl=document.getElementById('destListProd');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer;border-bottom:1px solid #eee;font-size:11px" onclick="pilihDestProd('${d.id}','${esc(d.label)}')">${esc(d.label)}</div>`).join('');}catch(e){dl.innerHTML='GAGAL';}}
function pilihDestProd(id,label){selectedDestId=id;document.getElementById('destSearchProd').value=label;document.getElementById('destListProd').style.display='none';}
async function cekOngkirProd(){if(!selectedDestId){showToast('Pilih kota dulu');return;}document.getElementById('ongkirResultProd').innerHTML='CEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelectProd').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:arr.costs||[];let h='';list.forEach(c=>{h+=`<div onclick="setOngkirProd(${c.cost},'${esc(c.service)}','${esc(c.etd)}')" style="padding:10px;border:1px solid #000;margin:4px 0;cursor:pointer;font-size:11px"><b>${esc(c.service)}</b> - Rp${Number(c.cost).toLocaleString('id-ID')} (${esc(c.etd)})</div>`;});document.getElementById('ongkirResultProd').innerHTML=h||'TIDAK ADA';}catch(e){document.getElementById('ongkirResultProd').innerHTML='ERROR';}}
function setOngkirProd(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirSelectedProd').innerHTML=`✓ ${esc(selectedService)} - Rp${selectedOngkirCost.toLocaleString('id-ID')}`;document.getElementById('ongkirResultProd').innerHTML='';renderCart();saveOngkirLS();}
function checkoutWA(){const c=getCart();if(!c.length){showToast('Keranjang kosong');return;}if(!wajibCekOngkir())return;if(!saveOngkirLS()){openCart();return;}window.location.href='checkout.html';}
</script>
<script>
(async()=>{
  supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);
  try{const {data:cfg}=await supabaseClient.from('settings').select('key,value').in('key',['store_name','wa_number','toko_origin_id','toko_origin_label']);const get=k=>cfg?.find(s=>s.key===k)?.value||'';const sName=get('store_name');const sWa=get('wa_number');const sId=get('toko_origin_id');const sLabel=get('toko_origin_label');if(sName){localStorage.setItem('store_name_cache',sName);document.getElementById('storeLogo').innerHTML=sName.toUpperCase()+'<span>HIJAB PREMIUM</span>';document.getElementById('footLogo').innerText=sName.toUpperCase();}if(sWa) localStorage.setItem('wa_number_cache',sWa);if(sId){tokoOriginId=sId;localStorage.setItem('toko_origin_id',sId);}if(sLabel){tokoOriginLabel=sLabel;localStorage.setItem('store_origin_label',sLabel);}}catch(e){}
  const {data:all,error:e1}=await supabaseClient.from('products').select('id,name,price,image_url').order('id',{ascending:false}).limit(100);
  const {data:vars,error:e2}=await supabaseClient.from('product_variants').select('product_id,color_name,image_url,stock,is_available').limit(500);
  if(e1||e2){document.getElementById('list').innerHTML='<div style="padding:20px">ERROR: '+(e1?.message||e2?.message)+'</div>';return;}
  allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{const key=(v.color_name||'').toLowerCase().trim()+'|'+(v.image_url||'');if(!window._varMap[v.product_id]){window._varMap[v.product_id]=[];window._varMap[v.product_id]._seen=new Set();}if(window._varMap[v.product_id]._seen.has(key))return;window._varMap[v.product_id]._seen.add(key);window._varMap[v.product_id].push(v);});
  // INI KUNCI BIAR GAK 0 PRODUK
  renderProducts(allProducts);
  document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';
  updateCount();
  renderCart();
})();
</script></body></html>
