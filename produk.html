function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){const c=getCart();const list=document.getElementById('cartList');const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');document.getElementById('ongkirPrice').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');if(!c.length){list.innerHTML='KOSONG';return;}list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:10px 0"><img src="${getOptImg(it.img,100)}" style="width:54px;height:54px;border-radius:50%"><div style="flex:1">${it.warna}<br>Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div><button onclick="changeQty(${i},-1)">-</button><span>${it.qty}</span><button onclick="changeQty(${i},1)">+</button></div>`).join('');}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function askClearCart(){showConfirm('KOSONGKAN?','Hapus semua?',()=>{saveCart([]);selectedOngkirCost=0;});}
async function searchDest(){const q=document.getElementById('destSearch').value.trim();if(!q)return;const dl=document.getElementById('destList');dl.style.display='block';dl.innerHTML='MENCARI...';try{const r=await fetch('/api/search?q='+encodeURIComponent(q));const j=await r.json();dl.innerHTML=j.data.map(d=>`<div style="padding:10px;cursor:pointer" onclick="pilihDest('${d.id}','${d.label.replace(/'/g,'')}')">${d.label}</div>`).join('');}catch(e){dl.innerHTML='ERROR';}}
function pilihDest(id,label){selectedDestId=id;document.getElementById('destSearch').value=label;document.getElementById('destList').innerHTML=label;}
async function cekOngkir(){if(!selectedDestId)return;document.getElementById('ongkirResult').innerHTML='MENGECEK...';try{const res=await fetch('/api/cost',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({origin:tokoOriginId,destination:selectedDestId,weight:1000,courier:document.getElementById('courierSelect').value})});const data=await res.json();const arr=data.data||data.costs||[];const list=Array.isArray(arr)?arr:(arr.costs||[]);let h='';list.forEach(c=>{h+=`<div onclick="setOngkir(${c.cost||0},'${c.service}','${c.etd}')" style="padding:10px;border:1px solid #ddd;margin:4px 0;cursor:pointer"><b>${c.service}</b> - Rp${Number(c.cost).toLocaleString('id-ID')} (${c.etd} hari)</div>`;});document.getElementById('ongkirResult').innerHTML=h;}catch(e){document.getElementById('ongkirResult').innerHTML='ERROR';}}
function setOngkir(cost,service,etd){selectedOngkirCost=Number(cost);selectedService=service+' ('+etd+')';document.getElementById('ongkirLabel').innerText=selectedService;renderCart();}
function checkoutWA(){const c=getCart();if(!c.length)return;let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`Total: Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
document.getElementById('confirmOk').onclick=()=>{if(confirmCb)confirmCb();closeConfirm();};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js" onload="(async()=>{supabaseClient=supabase.createClient(SUPA_URL,SUPA_KEY);const {data:all}=await supabaseClient.from('products').select('id,name,price,image_url,category,undertone').order('id',{ascending:false}).limit(24);const {data:vars}=await supabaseClient.from('product_variants').select('product_id,color_name,image_url,stock,is_available').limit(200);allProducts=all||[];window._varMap={};(vars||[]).forEach(v=>{if(!window._varMap[v.product_id])window._varMap[v.product_id]=[];window._varMap[v.product_id].push(v);});document.getElementById('prodCount').innerText=allProducts.length+' PRODUK';render(allProducts);await loadFilters();updateCount();})()"></script>
</body></html>
