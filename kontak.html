<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontak - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--off:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--off);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif}
nav{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:rgba(255,252,249,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--champ)}

.menu a.active{color:var(--esp);border-color:var(--esp)}

.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:40px}
@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:24px 16px}h1{font-size:42px}nav{padding:14px 16px}.menu{gap:14px}.menu a{font-size:10.5px;letter-spacing:1.8px}.logo{font-size:18px;letter-spacing:3px}}

<div class="wrap">
<div>

<div style="border:1px solid var(--champ);background:#fff;padding:14px 16px;display:flex;gap:14px"><span>📷</span><div><b style="font-size:14px">Instagram</b><div style="color:var(--taupe);font-size:13px">@arinda.hijab</div></div></div>
