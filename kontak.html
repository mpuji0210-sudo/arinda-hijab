<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontak - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--off:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--off);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif}
nav{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:rgba(255,252,249,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--champ)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:4px;font-size:22px}.menu{display:flex;gap:22px}.menu a{text-decoration:none;font-size:11.5px;letter-spacing:2.8px;color:var(--taupe);padding-bottom:4px;border-bottom:1.5px solid transparent}.menu a.active{color:var(--esp);border-color:var(--esp)}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px}
html{scroll-behavior:smooth}body{opacity:0;animation:fadeIn .45s ease forwards}@keyframes fadeIn{to{opacity:1}}body.fadeOut{opacity:0;transition:opacity .28s ease}
</style>
<script>document.addEventListener('DOMContentLoaded',()=>{const s=!!document.startViewTransition;document.querySelectorAll('a[href$=".html"]').forEach(a=>{a.addEventListener('click',e=>{const h=a.getAttribute('href');if(h.startsWith('http'))return;e.preventDefault();if(s){document.startViewTransition(()=>window.location.href=h)}else{document.body.classList.add('fadeOut');setTimeout(()=>window.location.href=h,280)}})})})</script>
</head><body>
<nav><div class="logo">ARINDA</div><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a href="kontak.html" class="active">KONTAK</a></div></nav>
<div class="wrap">

<p style="color:var(--taupe);font-size:13px">Konsultasi warna, ukuran, dan pre-order koleksi terbaru. Kami balas dalam 1 jam kerja.</p>
<div style="margin-top:24px;display:grid;gap:12px">

<div style="border:1px solid var(--champ);background:#fff;padding:14px 16px;display:flex;gap:14px">💬<div><b style="font-size:11px;letter-spacing:2px">WHATSAPP</b><br><span style="font-size:13px">+62 812-xxxx-xxxx (fast response)</span></div></div>

</div>

<label style="font-size:10px;letter-spacing:2px">NAMA</label><input id="nama" style="width:100%;padding:12px;border:1px solid var(--champ);margin:6px 0 14px">

<button onclick="const n=document.getElementById('nama').value;const p=document.getElementById('pesan').value;window.open('https://wa.me/62812xxxx?text='+encodeURIComponent('Halo Arinda, saya '+n+': '+p))" style="width:100%;padding:14px;background:var(--esp);color:#fff;border:none;letter-spacing:2.5px;font-size:11px;cursor:pointer">KIRIM KE WHATSAPP</button>
</div>
</div>
</body></html>
