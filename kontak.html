<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kontak - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--esp:#2B1B12;--taupe:#8C7A6B;--champ:#EAE6E1;--off:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--off);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif}
nav{position:sticky;top:0;z-index:99;display:flex;justify-content:space-between;align-items:center;padding:18px 24px;background:rgba(255,252,249,.95);backdrop-filter:blur(12px);border-bottom:1px solid var(--champ)}
.logo{font-family:'Cormorant Garamond',serif;font-weight:700;letter-spacing:4px;font-size:22px;color:var(--esp)}
.menu{display:flex;align-items:center;gap:22px}
.menu a{text-decoration:none;font-size:11.5px;font-weight:500;letter-spacing:2.8px;color:var(--taupe);padding-bottom:4px;border-bottom:1.5px solid transparent}
.menu a.active{color:var(--esp);border-color:var(--esp)}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:56px;line-height:0.9;letter-spacing:-1px;margin:0}
h1 i{font-weight:400;font-style:italic}
.wrap{max-width:1120px;margin:0 auto;padding:40px 24px 80px;display:grid;grid-template-columns:1.1fr .9fr;gap:32px}
@media(max-width:850px){.wrap{grid-template-columns:1fr;padding:24px 16px}h1{font-size:42px}nav{padding:14px 16px}}
html{scroll-behavior:smooth}body{opacity:0;animation:fadeIn .45s ease forwards}@keyframes fadeIn{to{opacity:1}}body.fadeOut{opacity:0;transition:opacity .28s ease}
</style>
<script>document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('a[href$=".html"]').forEach(a=>{a.addEventListener('click',e=>{const h=a.getAttribute('href');if(h.startsWith('http'))return;e.preventDefault();document.body.classList.add('fadeOut');setTimeout(()=>window.location.href=h,280)})})})</script>
</head><body>
<nav><div class="logo">ARINDA</div><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a href="kontak.html" class="active">KONTAK</a></div></nav>
<div class="wrap">
<div>

<div style="display:grid;gap:12px">

<div style="border:1px solid var(--champ);background:#fff;padding:14px 16px;display:flex;gap:14px"><div>✉️</div><div><b style="font-size:12px;letter-spacing:2px">EMAIL</b><br><span style="font-size:13px">halo@arinda.id</span></div></div>
</div></div>

<label style="font-size:10px;letter-spacing:2px">NAMA</label><input id="nama" style="width:100%;padding:12px;border:1px solid var(--champ);margin:6px 0 14px">
<label style="font-size:10px;letter-spacing:2px">PESAN</label><textarea id="pesan" style="width:100%;padding:12px;border:1px solid var(--champ);height:120px;margin:6px 0 18px"></textarea>

</div>
</div>
</body></html>
