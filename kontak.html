.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35;border-bottom:1px solid transparent;white-space:nowrap}.menu a.active{opacity:1;border-bottom-color:#111}
.wrap{max-width:1240px;margin:0 auto;padding:28px 16px;display:grid;grid-template-columns:1fr 1fr;gap:20px}

input,textarea,select{width:100%;padding:12px 0;border:none;border-bottom:1px solid #111;font-size:12px;margin-top:8px;background:transparent;outline:none}
.btn{padding:14px;background:#111;color:#fff;text-align:center;font-size:9px;letter-spacing:3px;cursor:pointer;border:none;width:100%;margin-top:18px}

</style></head><body>
<nav><div class="nav-top"><div class="logo" id="storeLogo">ARINDA<span>HIJAB PREMIUM</span></div><div class="icons"><a href="produk.html" class="icon-btn" aria-label="Keranjang"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></a></div></div><div class="nav-menu"><div class="menu"><a href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a href="kategori.html">KATEGORI</a><a class="active" aria-current="page">KONTAK</a></div></div></nav>

<div class="wrap">
<div>
<h1 style="font-family:'Cormorant Garamond';font-size:42px;line-height:.9;margin:0;font-weight:300">Hubungi<br><i>Kami</i></h1>
<p style="opacity:.5;font-size:11px;margin-top:12px;line-height:1.8">Konsultasi warna sesuai undertone, cek stok & ongkir.</p>
<div style="display:grid;gap:12px;margin-top:20px">
<div class="card" style="font-size:11px">📍 <span id="originText">Jakarta</span></div>
<div class="card" style="font-size:11px">💬 <span id="waText">Memuat...</span></div>
</div>
<div style="margin-top:24px"><div style="font-family:'Cormorant Garamond';font-size:18px;letter-spacing:2px;margin-bottom:12px">FAQ</div>
<div id="faqList"><div style="padding:20px;text-align:center;opacity:.4;font-size:10px;letter-spacing:2px">MEMUAT FAQ...</div></div>
</div>
</div>
<div class="card">
<div style="font-size:9px;letter-spacing:4px">FORM PESAN</div>
<label for="nama" style="font-size:9px;letter-spacing:2px;margin-top:14px;display:block;opacity:.6">NAMA</label><input id="nama" placeholder="Nama kamu" autocomplete="name" aria-label="Nama">
<label for="warna" style="font-size:9px;letter-spacing:2px;margin-top:14px;display:block;opacity:.6">WARNA</label><select id="warna" aria-label="Pilih warna"><option>Loading warna...</option></select>
<label for="pesan" style="font-size:9px;letter-spacing:2px;margin-top:14px;display:block;opacity:.6">PESAN</label><textarea id="pesan" rows="4" placeholder="Tanya stok, undertone, ongkir..." aria-label="Pesan"></textarea>
<button class="btn" onclick="kirimWA()" aria-label="Kirim ke WhatsApp">KIRIM KE WHATSAPP</button>
</div>
</div>

<footer style="margin-top:32px;padding:36px 16px 28px;text-align:center;border-top:1px solid var(--line)"><div style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:14px">ARINDA</div><div style="margin-top:14px;font-size:8px;letter-spacing:3px;opacity:.3">© 2026 ARINDA HIJAB PREMIUM</div></footer>
<script>
let supa; let WA_NUMBER="6285178098354"; let STORE_NAME="ARINDA";
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toggleFaq(el){ el.classList.toggle('open'); }
async function init(){
  document.getElementById('cCount').innerText=getCart().reduce((a,b)=>a+(b.qty||0),0);
  await new Promise(r=>{ const check=()=>{ if(window.supabase){ supa=supabase.createClient("https://qjgevvizqeebtdqcbqmt.supabase.co","sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19"); r(); } else setTimeout(check,50); }; check(); });
  try{
    const {data} = await supa.from('settings').select('key,value').in('key',['store_name','wa_number','toko_origin_label','home_koleksi_terlaris','home_faq_list']).limit(10);
    const {data:vars} = await supa.from('product_variants').select('color_name').limit(20);
    const get=k=>data?.find(s=>s.key===k)?.value||'';
    const sName=get('store_name'); const sWa=get('wa_number'); const sOrigin=get('toko_origin_label');
    if(sName){STORE_NAME=sName; document.getElementById('storeLogo').innerHTML=sName.split(' ')[0]+'<span>'+sName.split(' ').slice(1).join(' ')+'</span>';}
    if(sWa){WA_NUMBER=sWa; document.getElementById('waText').innerText=sWa;}
    if(sOrigin){document.getElementById('originText').innerText=sOrigin;}
    let warnaList=[]; try{const raw=JSON.parse(get('home_koleksi_terlaris')||'[]'); warnaList=raw.map(x=>x.title||x).filter(Boolean);}catch(e){}
    if(!warnaList.length && vars) warnaList=[...new Set(vars.map(v=>v.color_name))];
    if(warnaList.length) document.getElementById('warna').innerHTML=warnaList.slice(0,20).map(w=>`<option>${esc(w)}</option>`).join('');
    let faqData=[]; try{faqData=JSON.parse(get('home_faq_list')||'[]');}catch(e){}
    const faqEl=document.getElementById('faqList');
    if(faqData.length){
      faqEl.innerHTML=faqData.map(f=>`<div class="faq-item" onclick="toggleFaq(this)" role="button" tabindex="0" aria-label="FAQ ${esc(f.q)}"><div class="faq-q"><span>${esc(f.q)}</span><span class="faq-arrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></span></div><div class="faq-a">${esc(f.a)}</div></div>`).join('');
    } else {
      faqEl.innerHTML=`<div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span>Bahannya adem & tidak nerawang?</span><span class="faq-arrow"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></div><div class="faq-a">Ya, Paris Premium 110x110 adem & tidak nerawang.</div></div><div class="faq-item" onclick="toggleFaq(this)"><div class="faq-q"><span>Pengiriman dari mana?</span><span class="faq-arrow"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></span></div><div class="faq-a">Kirim dari Jakarta, cek ongkir otomatis di keranjang.</div></div>`;
    }
  }catch(e){console.error(e)}
}
function kirimWA(){
  const n=document.getElementById('nama').value.trim(); if(!n){alert('Isi nama dulu Bosquee');return;}
  const w=document.getElementById('warna').value; const p=document.getElementById('pesan').value;
  const msg=`Halo ${STORE_NAME}, saya ${n}\nWarna: ${w}\nPesan: ${p}`;
  window.open('https://wa.me/'+WA_NUMBER+'?text='+encodeURIComponent(msg),'_blank');
}
init();
</script></body></html>
