<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIN - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--bg:#FFFCF9;--line:#F2EFEA;--black:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif;color:var(--black)}
.card{background:#fff;border:1px solid var(--line);padding:32px 26px;width:360px}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:20px;text-align:center}
.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:5px;opacity:.4;margin-top:6px}
.label{font-size:8px;letter-spacing:3px;opacity:.4;margin-top:16px;display:block}
.input{width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--black);background:transparent;outline:none;font-size:12px;letter-spacing:.5px;margin-top:6px}
.input:focus{border-bottom-color:var(--black)}
.btn{width:100%;background:var(--black);color:#fff;border:none;padding:13px;margin-top:22px;font-size:9px;letter-spacing:3px;cursor:pointer}
.small{font-size:8px;letter-spacing:2px;opacity:.4;text-align:center;margin-top:14px;line-height:1.6}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);cursor:pointer;opacity:.5}
.eye svg{width:16px;height:16px;stroke:#111;fill:none;stroke-width:1.1}
</style></head><body>
<div class="card">
<div class="logo">ARINDA<span>ADMIN PANEL</span></div>

<span class="label">USERNAME</span>
<input id="user" class="input" value="admin" autocomplete="username">

<span class="label">PASSWORD</span>
<div style="position:relative">
<input id="pass" class="input" type="password" placeholder="••••••••" autocomplete="current-password">
<span class="eye" onclick="togglePass()" id="eyeBtn"><svg viewBox="0 0 24 24"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="2.5"/></svg></span>
</div>

<button class="btn" onclick="doLogin()">LOGIN</button>

<div class="small"><br><a href="index.html" style="color:var(--black);text-decoration:none;border-bottom:1px solid var(--black);padding-bottom:2px">KEMBALI KE BERANDA</a></div>
<div id="msg" class="small" style="color:#B42318;opacity:1;display:none"></div>
</div>

<script>
function togglePass(){const p=document.getElementById('pass');p.type=p.type==='password'?'text':'password';}
function doLogin(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(u==='admin' && p==='admin123'){
    localStorage.setItem('arinda_admin','login');
    localStorage.setItem('arinda_login_time',Date.now());
    location.href='admin.html';
  } else {
    const m=document.getElementById('msg');
    m.style.display='block'; m.innerText='USERNAME / PASSWORD SALAH';
    setTimeout(()=>m.style.display='none',2000);
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(localStorage.getItem('arinda_admin')==='login'){location.href='admin.html';}
</script></body></html>
