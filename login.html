<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIN - ARINDA Admin (Private)</title>
<meta name="robots" content="noindex, nofollow">
<style>
:root{--bg:#FFFCF9;--line:#F2EFEA;--black:#111}
*{box-sizing:border-box}body{margin:0;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif;color:var(--black)}
.card{background:#fff;border:1px solid var(--line);padding:32px 26px;width:360px}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:20px;text-align:center}
.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:5px;opacity:.4;margin-top:6px}
.label{font-size:8px;letter-spacing:3px;opacity:.4;margin-top:16px;display:block}
.input{width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--black);background:transparent;outline:none;font-size:12px;letter-spacing:.5px;margin-top:6px}
.btn{width:100%;background:var(--black);color:#fff;border:none;padding:13px;margin-top:22px;font-size:9px;letter-spacing:3px;cursor:pointer}
.small{font-size:8px;letter-spacing:2px;opacity:.4;text-align:center;margin-top:14px;line-height:1.6}
.eye{position:absolute;right:0;top:50%;transform:translateY(-50%);cursor:pointer;opacity:.5;background:none;border:none}
</style></head><body>
<div class="card">
<div class="logo" style="font-family:'Cormorant Garamond'">ARINDA<span>ADMIN</span></div>
<label class="label">USERNAME</label>
<input id="user" class="input" value="admin">
<label class="label">PASSWORD</label>
<div style="position:relative">
<input id="pass" class="input" type="password" placeholder="••••••••">
<button class="eye" onclick="togglePass()" id="eyeBtn" type="button">👁</button>
</div>
<button class="btn" onclick="doLogin()">LOGIN</button>
<div class="small"><br><a href="index.html" style="color:#111;text-decoration:none;border-bottom:1px solid #111">KEMBALI KE BERANDA</a></div>
<div id="msg" class="small" style="color:#B42318;opacity:1;display:none"></div>
</div>
<script>
function togglePass(){const p=document.getElementById('pass');p.type=p.type==='password'?'text':'password';}
function doLogin(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  // FIX: TERIMA DUA PASSWORD - biar foto arinda123 bisa masuk
  const ok = (u==='admin' && (p==='admin123' || p==='arinda123'));
  if(ok){
    localStorage.setItem('arinda_admin','login');
    localStorage.setItem('arinda_login_time',Date.now().toString());
    localStorage.setItem('admin_login','true'); // untuk admin-orders
    // kalau habis coba buka admin-orders, balikin ke sana
    if(document.referrer.includes('admin-orders')) location.href='admin-orders.html';
    else location.href='admin.html';
  } else {
    const m=document.getElementById('msg');
    m.style.display='block'; m.innerText='USERNAME / PASSWORD SALAH - coba admin / arinda123';
    setTimeout(()=>m.style.display='none',2500);
  }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
if(localStorage.getItem('arinda_admin')==='login'){
  const t=Number(localStorage.getItem('arinda_login_time')||0);
  if(Date.now()-t < 1000*60*60*12){ location.href='admin.html'; }
  else { localStorage.removeItem('arinda_admin'); localStorage.removeItem('admin_login'); }
}
</script></body></html>
