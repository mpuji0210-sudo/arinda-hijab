<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login Arinda</title>
<style>
body{background:#FFFCF9;display:flex;justify-content:center;align-items:center;height:100vh;font-family:sans-serif;margin:0}
.card{background:#fff;padding:24px;border-radius:16px;width:300px;border:1px solid #EAE6E1}
.input{width:100%;padding:12px;margin:8px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}
.btn{background:#2B1B12;color:#fff;border:none;padding:12px;width:100%;border-radius:10px;font-weight:bold;cursor:pointer}
</style>
</head>
<body>
<div class="card">
<h2 style="margin:0 0 10px">Login Arinda</h2>
<input id="user" class="input" placeholder="Username">
<input id="pass" class="input" type="password" placeholder="Password">
<button class="btn" onclick="doLogin()">LOGIN</button>
<p style="font-size:12px;color:#888;margin-top:10px">admin / admin123</p>
</div>
<script>
function doLogin(){
  if(document.getElementById('user').value==='admin' && document.getElementById('pass').value==='admin123'){
    localStorage.setItem('arinda_admin','login');
    location.href='admin.html';
  } else {
    alert('Salah! Pakai admin / admin123');
  }
}
</script>
</body>
</html>
