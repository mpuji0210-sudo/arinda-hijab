<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIN - ARINDA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>:root{--bg:#FFFCF9;--line:#F2EFEA;--black:#111}*{box-sizing:border-box}body{margin:0;background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif;color:var(--black)}.card{background:#fff;border:1px solid var(--line);padding:32px 26px;width:360px}.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:20px;text-align:center}.label{font-size:8px;letter-spacing:3px;opacity:.4;margin-top:16px;display:block}.input{width:100%;padding:11px 0;border:none;border-bottom:1px solid var(--black);background:transparent;outline:none;font-size:12px;letter-spacing:.5px;margin-top:6px}.btn{width:100%;background:var(--black);color:#fff;border:none;padding:13px;margin-top:22px;font-size:9px;letter-spacing:3px;cursor:pointer}.small{font-size:8px;letter-spacing:2px;opacity:.4;text-align:center;margin-top:14px}</style>
</head><body>
<div class="card">
<div class="logo">ARINDA<span style="display:block;font-size:7px;letter-spacing:5px;opacity:.4;margin-top:6px">ADMIN SECURE</span></div>
<label class="label">EMAIL ADMIN</label>
<input id="email" class="input" value="admin@arinda.id">
<label class="label">PASSWORD</label>
<input id="pass" class="input" type="password" placeholder="••••••••">
<button class="btn" onclick="doLogin()" id="btn">LOGIN AMAN</button>
<div id="msg" class="small" style="color:#B42318;opacity:1;display:none"></div>
</div>
<script>
const supa = window.supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
async function doLogin(){
  const b=document.getElementById('btn'), m=document.getElementById('msg');
  m.style.display='none'; b.innerText='CEK...'; b.disabled=true;
  try{
    const { error } = await supa.auth.signInWithPassword({email: document.getElementById('email').value.trim(), password: document.getElementById('pass').value.trim()});
    if(error) throw error;
    location.href='admin.html';
  }catch(e){ m.style.display='block'; m.innerText='GAGAL: '+e.message; b.innerText='LOGIN AMAN'; b.disabled=false; }
}
document.addEventListener('keydown',e=>{if(e.key==='Enter')doLogin();});
</script></body></html>
