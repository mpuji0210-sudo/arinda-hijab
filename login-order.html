<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LOGIN ORDER - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FFFCF9;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'Inter',sans-serif}
.card{background:#fff;border:1px solid #F2EFEA;padding:32px 26px;width:360px}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:20px;text-align:center}
.label{font-size:8px;letter-spacing:3px;opacity:.4;margin-top:16px;display:block}
.input{width:100%;padding:11px 0;border:none;border-bottom:1px solid #111;background:transparent;outline:none;font-size:12px;margin-top:6px}
.btn{width:100%;background:#111;color:#fff;border:none;padding:13px;margin-top:22px;font-size:9px;letter-spacing:3px;cursor:pointer}
.small{font-size:8px;letter-spacing:2px;opacity:.4;text-align:center;margin-top:14px}
</style></head><body>
<div class="card">
<div class="logo">ARINDA<span style="display:block;font-family:'Inter';font-size:7px;letter-spacing:5px;opacity:.4;margin-top:6px">ADMIN ORDER</span></div>
<label class="label">USERNAME</label>
<input id="user" class="input" value="admin">
<label class="label">PASSWORD</label>
<input id="pass" class="input" type="password" placeholder="••••••••">
<button class="btn" onclick="doLogin()">LOGIN ORDER</button>
<div class="small">Password order: arinda123</div>
<div id="msg" class="small" style="color:#B42318;opacity:1;display:none"></div>
</div>
<script>
function doLogin(){
  const u=document.getElementById('user').value.trim();
  const p=document.getElementById('pass').value.trim();
  if(u==='admin' && p==='arinda123'){
    localStorage.setItem('admin_login','true');
    localStorage.setItem('admin_order_login_time',Date.now().toString());
    location.href='admin-orders.html';
  } else {
    document.getElementById('msg').style.display='block';
    document.getElementById('msg').innerText='USERNAME / PASSWORD SALAH - pakai admin / arinda123';
  }
}
</script></body></html>
