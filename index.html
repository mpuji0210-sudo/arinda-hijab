<!DOCTYPE html>
<html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARINDA HIJAB PREMIUM</title>
<style>
:root{--black:#111;--line:#EDE8E1;--bg:#FFFCF9}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--black);font-family:'Inter',sans-serif}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,.88);backdrop-filter:blur(18px);border-bottom:1px solid rgba(17,17,17,0.06)}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:21px}.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;opacity:.4;margin-top:4px}
.icons{display:flex;gap:20px;align-items:center}.icon-btn{background:none;border:none;cursor:pointer;position:relative;width:36px;height:36px;display:flex;align-items:center;justify-content:center}.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-2px;right:-2px;background:#111;color:#fff;font-size:7px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-menu{border-top:1px solid rgba(17,17,17,0.06);overflow-x:auto}.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:13px 0;opacity:.35;white-space:nowrap}.menu a.active{opacity:1;border-bottom:1px solid #111}
#cartModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:200;align-items:flex-end}#cartModal.open{display:flex}#cartBox{background:#fff;width:100%;max-width:480px;margin:0 auto;max-height:88vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px}
.btn{width:100%;padding:13px;background:#111;color:#fff;border:none;font-size:9px;letter-spacing:3px;cursor:pointer;border-radius:8px}.btn-light{width:100%;padding:11px;background:#fff;border:1px solid var(--line);font-size:9px;letter-spacing:2px;cursor:pointer;margin-top:8px;border-radius:8px}
.hero{max-width:1240px;margin:0 auto;padding:20px;display:grid;grid-template-columns:1.2fr .8fr;gap:16px}@media(max-width:700px){.hero{grid-template-columns:1fr}}
.hero-img{height:520px;background:#F8F4EF;border-radius:16px;overflow:hidden;position:relative}.hero-img img{width:100%;height:100%;object-fit:cover}
</style></head><body>
<nav><div class="nav-top"><div class="logo">ARINDA<span>HIJAB PREMIUM</span></div><div class="icons">
<button class="icon-btn" onclick="location.href='produk.html'"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<!-- FIX: type=button + onclick langsung openCart, gak pindah halaman -->
<button type="button" class="icon-btn" id="cartIcon" onclick="openCart()"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount" style="display:none">0</span></button>
</div></div><div class="nav-menu"><div class="menu"><a class="active">BERANDA</a><a href="produk.html">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div></nav>

<main style="max-width:1240px;margin:0 auto;padding:0 20px">
<div class="hero">
<div class="hero-img"><img src="https://images.unsplash.com/photo-1581044777550-4cfa60707c03?w=800"><div style="position:absolute;left:20px;bottom:20px;background:rgba(255,255,255,.9);padding:16px;border-radius:12px"><div style="font-size:10px;letter-spacing:3px;opacity:.5">NEW COLLECTION</div><div style="font-family:'Cormorant Garamond';font-size:26px;line-height:1">ARINDA HIJAB,<br>PREMIUM</div><button onclick="location.href='produk.html'" style="margin-top:10px;padding:10px 18px;background:#111;color:#fff;border:none;border-radius:20px;font-size:9px;letter-spacing:2px">LIHAT KOLEKSI -></button></div></div>
<div style="display:flex;flex-direction:column;gap:12px">
<div style="border:1px solid var(--line);padding:16px;border-radius:12px;background:#fff"><div style="font-size:10px;letter-spacing:3px;font-weight:700">FIND YOUR UNDERTONE</div><div style="display:flex;gap:6px;margin-top:10px;flex-wrap:wrap"><button onclick="setUndertone('COOL')" style="padding:8px 14px;border:1px solid #111;border-radius:20px;background:#fff;font-size:8px">COOL</button><button onclick="setUndertone('WARM')" style="padding:8px 14px;border:1px solid #111;border-radius:20px;background:#fff;font-size:8px">WARM</button><button onclick="setUndertone('NEUTRAL')" style="padding:8px 14px;border:1px solid #111;border-radius:20px;background:#fff;font-size:8px">NEUTRAL</button><button onclick="setUndertone('OLIVE')" style="padding:8px 14px;border:1px solid #111;border-radius:20px;background:#fff;font-size:8px">OLIVE</button></div><div style="font-size:8px;opacity:.4;margin-top:8px">Pilih Undertone Mu</div></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div style="height:100px;background:#eee;border-radius:10px"></div><div style="height:100px;background:#eee;border-radius:10px"></div></div>
</div>
</div>
</main>

<!-- MODAL KERANJANG WAJIB ADA DI BERANDA JUGA BIAR 1 KLIK LANGSUNG MUNCUL -->
<div id="cartModal" onclick="if(event.target.id==='cartModal')closeCart()"><div id="cartBox">
<div style="display:flex;justify-content:space-between;align-items:center"><b style="letter-spacing:2px;font-size:11px">KERANJANG (<span id="cartTotalQty">0</span>)</b><button onclick="closeCart()" style="border:none;background:none;font-size:22px">×</button></div>
<div id="cartList" style="margin-top:12px"></div>
<div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
<div style="display:flex;justify-content:space-between;font-size:11px"><span>SUBTOTAL</span><span id="cartSubtotal">Rp0</span></div>
<div style="display:flex;justify-content:space-between;font-size:11px;margin-top:6px"><span>ONGKIR <small id="ongkirLabel" style="opacity:.5"></small></span><span id="ongkirPriceCart">Rp0</span></div>
<div style="display:flex;justify-content:space-between;margin-top:10px;font-size:14px"><b>TOTAL BAYAR</b><b id="cartTotalPrice">Rp0</b></div>
<button onclick="checkoutWA()" class="btn" style="margin-top:14px;padding:14px">CHAT WA & PESAN SEKARANG</button>
<button onclick="clearCart()" class="btn-light">KOSONGKAN KERANJANG</button>
</div>
</div></div>

<script>
const WA_NUMBER="6285178098354";let selectedOngkirCost=0,selectedService='';
function setUndertone(t){location.href='produk.html?undertone='+t.toUpperCase();}
// KERANJANG 1 KLIK - SAMA PERSIS DENGAN DI PRODUK
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return[]}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){let total=getCart().reduce((a,b)=>a+(b.qty||0),0);let el=document.getElementById('cCount');if(el){el.innerText=total;el.style.display=total>0?'flex':'none';}}
function clearCart(){if(!confirm('Kosongkan keranjang?'))return;saveCart([]);selectedOngkirCost=0;selectedService='';}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){
  const c=getCart();const list=document.getElementById('cartList');
  const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);
  document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');
  document.getElementById('ongkirPriceCart').innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');
  document.getElementById('cartTotalPrice').innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');
  document.getElementById('ongkirLabel').innerText=selectedService?'('+selectedService+')':'';
  if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4;font-size:11px">KERANJANG KOSONG</p>';return;}
  list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F2EFEA;align-items:center"><img src="${it.img}" style="width:52px;height:52px;border-radius:10px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${it.warna}</div><div style="font-size:10px;opacity:.5">Rp${it.harga.toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff">-</button><span style="margin:0 8px;font-size:12px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:30px;height:30px;border-radius:50%;border:1px solid #ddd;background:#fff">+</button></div>`).join('');
}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function checkoutWA(){const c=getCart();if(!c.length){alert('Keranjang kosong!');return;}let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${it.warna} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);msg+=`%0ASUBTOTAL: Rp${sub.toLocaleString('id-ID')}%0AONGKIR ${selectedService}: Rp${selectedOngkirCost.toLocaleString('id-ID')}%0A*TOTAL: Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}*%0A`;window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');}
updateCount();
</script>
</body></html>
