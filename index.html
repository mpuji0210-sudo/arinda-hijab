<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARINDA HIJAB PREMIUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Plus+Jakarta+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--esp:#111;--taupe:#8C7A6B;--line:#E9E6E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--esp);font-family:'Plus Jakarta Sans',sans-serif;overflow-x:hidden}
nav{position:sticky;top:0;z-index:99;background:#FFFCF9;border-bottom:1px solid var(--line)}
.nav-top{max-width:1240px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Cormorant Garamond';font-weight:600;letter-spacing:7px;font-size:20px;line-height:1}
.logo span{display:block;font-family:'Plus Jakarta Sans';font-size:8px;letter-spacing:7px;color:var(--taupe);margin-top:4px;font-weight:400}
.icons{display:flex;gap:20px;align-items:center}
.icon-btn{background:none;border:none;cursor:pointer;position:relative;padding:0}
.icon-btn svg{width:19px;height:19px;stroke:#111;fill:none;stroke-width:1.2}
.badge{position:absolute;top:-7px;right:-9px;background:#111;color:#fff;font-size:8px;min-width:14px;height:14px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.nav-menu{border-top:1px solid #F6F1EB;background:#fff;overflow-x:auto;scrollbar-width:none}
.nav-menu::-webkit-scrollbar{display:none}
.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:36px}
.menu a{font-size:10px;letter-spacing:3.5px;color:#111;text-decoration:none;padding:13px 0;opacity:.5;white-space:nowrap;border-bottom:1px solid transparent}
.menu a.active,.menu a:hover{opacity:1;border-bottom-color:#111}
#searchBox{display:none;max-width:1240px;margin:0 auto;padding:12px 20px}
#searchBox input{width:100%;padding:12px 0;border:none;border-bottom:1px solid #111;background:transparent;font-size:13px;outline:none}
.hero{position:relative;width:100%;height:72vh;min-height:460px;background:#F6EEE3;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.desktop-only{display:block}.mobile-only{display:none}
.btn{display:inline-block;background:#111;color:#fff;padding:14px 28px;font-size:10px;letter-spacing:3px;text-decoration:none;border:none;cursor:pointer}
.section{max-width:1240px;margin:0 auto;padding:24px 16px}.sub{font-size:9px;letter-spacing:4px;color:var(--taupe);margin:6px 0 16px}
.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#E9E6E1;border:1px solid #E9E6E1}
.k-card{background:#fff;cursor:pointer}.k-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}
@media(min-width:700px){.colors{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){
.nav-top{padding:14px 16px}.logo{font-size:18px;letter-spacing:5px}.menu{padding:0 16px;gap:26px}.menu a{font-size:9px;padding:14px 0}.desktop-only{display:none!important}.mobile-only{display:block!important}.hero{height:78vh}.hero-text{left:16px;right:16px;bottom:16px;position:absolute;background:#fff;padding:22px}
}
</style></head><body>
<nav>
<div class="nav-top">
<div class="logo" id="storeLogo">ARINDA<span>HIJAB PREMIUM</span></div>
<div class="icons">
<button class="icon-btn" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<a href="kontak.html" class="icon-btn" title="Kontak - tetap ada biar gampang"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3"/><path d="M5 19c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></a>
<a href="produk.html" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></a>
</div>
</div>
<div class="nav-menu"><div class="menu"><a class="active" href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div>
<div id="searchBox"><form onsubmit="goSearch(event)"><input id="q" type="search" placeholder="Search"></form></div>
</nav>
<div class="hero" id="heroBanner"><img class="desktop-only" id="bannerPC" src="https://via.placeholder.com/1400x700/F6EEE3/8C7A6B?text=ARINDA+BANNER+PC"><img class="mobile-only" id="bannerHP" src="https://via.placeholder.com/800x1200/F6EEE3/8C7A6B?text=ARINDA+BANNER+HP"><div class="hero-text" style="position:absolute;left:20px;bottom:20px;background:#fff;padding:22px;max-width:340px"><div style="font-size:9px;letter-spacing:4px;color:#8C7A6B" id="bannerTitle">NEW COLLECTION</div><h1 style="font-family:'Cormorant Garamond';font-size:38px;line-height:.95;margin:8px 0;font-weight:400">Bahan Adem,<br>Dan Tidak Nerawang</h1><p style="font-size:12px;color:#8C7A6B;line-height:1.5;margin:0 0 18px">MENUTUP AURAT DENGAN BAHAN PREMIUM</p><a id="bannerLink" href="produk.html" class="btn">LIHAT KOLEKSI</a></div></div>
<div class="section"><div class="sub" id="koleksiTitle">KOLEKSI TERLARIS</div><div class="colors" id="koleksi4Grid">Loading koleksi...</div></div>
<script>
const supabaseClient=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
function toggleSearch(){const b=document.getElementById('searchBox');b.style.display=b.style.display=='block'?'none':'block';if(b.style.display=='block')document.getElementById('q').focus();}
function goSearch(e){e.preventDefault();const v=document.getElementById('q').value.trim();if(v)location.href='produk.html?q='+encodeURIComponent(v);}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function updateCount(){document.getElementById('cCount').innerText=getCart().reduce((a,b)=>a+Number(b.qty||0),0);}
async function load(){const {data:banners}=await supabaseClient.from('banners').select('*').eq('is_active',true).order('id',{ascending:false}).limit(1);if(banners&&banners[0]){document.getElementById('bannerPC').src=banners[0].image_url;document.getElementById('bannerHP').src=banners[0].image_mobile_url||banners[0].image_url;}updateCount();}
load();
</script></body></html>
