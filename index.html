<!DOCTYPE html><html lang="id"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARINDA HIJAB PREMIUM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,300;6..96,400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--esp:#111;--taupe:#8C7A6B;--line:#E9E6E1;--bg:#FFFCF9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--esp);font-family:'Inter',sans-serif;font-weight:300;overflow-x:hidden;letter-spacing:.2px}
nav{position:sticky;top:0;z-index:99;background:rgba(255,252,249,0.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.nav-top{max-width:1240px;margin:0 auto;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}
.logo{font-family:'Bodoni Moda';font-weight:300;letter-spacing:8px;font-size:21px;line-height:1}
.logo span{display:block;font-family:'Inter';font-size:7px;letter-spacing:6px;color:var(--taupe);margin-top:5px;font-weight:300}
.icons{display:flex;gap:22px;align-items:center}
.icon-btn{background:none;border:none;cursor:pointer;position:relative;padding:0}
.icon-btn svg{width:18px;height:18px;stroke:#111;fill:none;stroke-width:1.1}
.badge{position:absolute;top:-7px;right:-9px;background:#111;color:#fff;font-size:7px;min-width:13px;height:13px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Inter'}
.nav-menu{border-top:1px solid #F6F1EB;background:transparent;overflow-x:auto;scrollbar-width:none}
.nav-menu::-webkit-scrollbar{display:none}
.menu{max-width:1240px;margin:0 auto;padding:0 20px;display:flex;gap:40px}
.menu a{font-size:9px;letter-spacing:4px;color:#111;text-decoration:none;padding:14px 0;opacity:.4;white-space:nowrap;border-bottom:1px solid transparent;transition:.3s;font-weight:300}
.menu a.active,.menu a:hover{opacity:1;border-bottom-color:#111}
#searchBox{display:none;max-width:1240px;margin:0 auto;padding:12px 20px}
#searchBox input{width:100%;padding:12px 0;border:none;border-bottom:1px solid #111;background:transparent;font-size:13px;outline:none;font-family:'Inter';font-weight:300}
.hero{position:relative;width:100%;height:84vh;min-height:560px;background:#F6EEE3;overflow:hidden}.hero img{width:100%;height:100%;object-fit:cover;display:block}
.desktop-only{display:block}.mobile-only{display:none}
.btn{display:inline-block;background:#111;color:#fff;padding:16px 32px;font-size:9px;letter-spacing:4px;text-decoration:none;border:none;cursor:pointer;font-weight:300;font-family:'Inter'}
.section{max-width:1240px;margin:0 auto;padding:40px 16px}
.sub{font-size:9px;letter-spacing:5px;color:#111;margin:0;font-weight:300}
.colors{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:#E9E6E1;border:1px solid #E9E6E1;margin-top:20px}
.k-card{background:#fff;cursor:pointer}.k-card img{width:100%;aspect-ratio:3/4;object-fit:cover;display:block}

/* CARD TRANSPARAN LV - KACA BLUR */
.hero-text{
position:absolute;left:24px;bottom:24px;
background:rgba(255,255,255,0.58);
backdrop-filter:blur(22px);
-webkit-backdrop-filter:blur(22px);
border:1px solid rgba(255,255,255,0.35);
padding:32px 32px;
max-width:380px;
}

@media(min-width:700px){.colors{grid-template-columns:repeat(4,1fr)}}
@media(max-width:800px){
.nav-top{padding:15px 16px}.logo{font-size:18px;letter-spacing:6px}.menu{padding:0 16px;gap:28px}.menu a{font-size:9px}.desktop-only{display:none!important}.mobile-only{display:block!important}.hero{height:86vh}
.hero-text{left:12px;right:12px;bottom:12px;max-width:none;padding:26px;background:rgba(255,255,255,0.64);backdrop-filter:blur(18px)}
}
</style></head><body>
<nav>
<div class="nav-top">
<div class="logo" id="storeLogo">ARINDA<span>HIJAB PREMIUM</span></div>
<div class="icons">
<button class="icon-btn" onclick="toggleSearch()"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="5.5"/><path d="M16 16L20 20"/></svg></button>
<a href="kontak.html" class="icon-btn"><svg viewBox="0 0 24 24"><circle cx="12" cy="7.5" r="3"/><path d="M5 19c0-3.5 3-6 7-6s7 2.5 7 6"/></svg></a>
<a href="produk.html" class="icon-btn"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 10H7L6 7z"/><path d="M9 7V5.5A3 3 0 0 1 12 2.5a3 3 0 0 1 3 3V7"/></svg><span class="badge" id="cCount">0</span></a>
</div>
</div>
<div class="nav-menu"><div class="menu"><a class="active" href="index.html">BERANDA</a><a href="produk.html">PRODUK</a><a href="kategori.html">KATEGORI</a></div></div>
<div id="searchBox"><form onsubmit="goSearch(event)"><input id="q" type="search" placeholder="Search"></form></div>
</nav>

<div class="hero" id="heroBanner">
<img class="desktop-only" id="bannerPC" src="https://via.placeholder.com/1400x900/F6EEE3/8C7A6B?text=ARINDA"><img class="mobile-only" id="bannerHP" src="https://via.placeholder.com/800x1200/F6EEE3/8C7A6B?text=ARINDA">
<div class="hero-text">
<div style="font-size:8px;letter-spacing:5px;color:#111;opacity:.6;font-weight:300" id="bannerTitle">JUST FOR YOU</div>
<h1 style="font-family:'Bodoni Moda';font-size:44px;line-height:.95;margin:12px 0 14px;font-weight:300;letter-spacing:-0.5px">Bahan Adem,<br>Dan Tidak Nerawang</h1>
<p style="font-size:11px;color:#111;opacity:.5;line-height:1.7;margin:0 0 26px;letter-spacing:1px;font-weight:300">MENUTUP AURAT DENGAN BAHAN PREMIUM</p>
<a id="bannerLink" href="produk.html" class="btn">LIHAT KOLEKSI</a>
</div>
</div>

<div class="section">
<div style="display:flex;justify-content:space-between;align-items:center">
<div class="sub" id="koleksiTitle">BEST SELLER COLLECTION</div>
<a href="produk.html" style="font-size:9px;letter-spacing:3px;color:#111;text-decoration:none;border-bottom:1px solid #111;padding-bottom:4px;font-weight:300">VIEW ALL</a>
</div>
<div class="colors" id="koleksi4Grid">Loading...</div>
</div>

<footer style="margin-top:80px;border-top:1px solid #E9E6E1;padding:32px 16px;text-align:center"><div style="font-family:'Bodoni Moda';letter-spacing:8px;font-size:13px;font-weight:300">ARINDA</div><div style="font-size:7px;letter-spacing:5px;color:#8C7A6B;margin-top:6px;font-weight:300">HIJAB PREMIUM — © 2026</div></footer>

<script>
const supabaseClient=supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
function toggleSearch(){const b=document.getElementById('searchBox');b.style.display=b.style.display=='block'?'none':'block';if(b.style.display=='block')document.getElementById('q').focus();}
function goSearch(e){e.preventDefault();const v=document.getElementById('q').value.trim();if(v)location.href='produk.html?q='+encodeURIComponent(v);}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function updateCount(){document.getElementById('cCount').innerText=getCart().reduce((a,b)=>a+Number(b.qty||0),0);}
async function load(){
  const {data:banners}=await supabaseClient.from('banners').select('*').eq('is_active',true).order('id',{ascending:false}).limit(1);
  if(banners && banners[0]){
    document.getElementById('bannerPC').src=banners[0].image_url;
    document.getElementById('bannerHP').src=banners[0].image_mobile_url||banners[0].image_url;
    if(banners[0].title) document.getElementById('bannerTitle').innerText=banners[0].title;
    if(banners[0].link_url) document.getElementById('bannerLink').href=banners[0].link_url;
  }
  const {data:settings}=await supabaseClient.from('settings').select('*');
  if(settings){
    const get=k=>settings.find(s=>s.key===k)?.value;
    if(get('store_name')){
      const parts=get('store_name').split(' ');
      document.getElementById('storeLogo').innerHTML=parts[0]+'<span>'+parts.slice(1).join(' ')+'</span>';
    }
    let raw=[]; try{if(get('home_koleksi_terlaris')) raw=JSON.parse(get('home_koleksi_terlaris'));}catch(e){}
    if(raw.length){
      let html='';
      if(typeof raw[0]==='object'){ html=raw.map(v=>`<div class="k-card" onclick="location.href='produk.html'"><img src="${v.url}"></div>`).join('');}
      else{
        const ids=raw.filter(v=>!String(v).startsWith('http'));
        if(ids.length){
          const {data:vars}=await supabaseClient.from('product_variants').select('*').in('id',ids);
          if(vars){ const ordered=ids.map(id=>vars.find(x=>String(x.id)===String(id))).filter(Boolean); html+=ordered.map(v=>`<div class="k-card" onclick="location.href='produk.html'"><img src="${v.image_url}"></div>`).join(''); }
        }
      }
      if(html) document.getElementById('koleksi4Grid').innerHTML=html;
    }
  }
  updateCount();
}
load();
</script></body></html>
