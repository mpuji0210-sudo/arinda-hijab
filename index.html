<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supabaseClient = window.supabase.createClient(SUPA_URL, SUPA_KEY);
let selectedOngkirCost=0,selectedService='';const WA_NUMBER="6285178098354";
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
function toggleSearch(){const b=document.getElementById('searchBox');const isHidden=!b.classList.contains('show');b.classList.toggle('show',isHidden);b.style.display=isHidden?'flex':'none';if(isHidden) setTimeout(()=>{const i=document.getElementById('q'); if(i){i.focus(); i.select();}},80);}
function doSearch(){const v=document.getElementById('q').value.trim();if(!v) return;location.href='produk.html?warna='+encodeURIComponent(v.toLowerCase());}
function getCart(){try{return JSON.parse(localStorage.getItem('arinda_cart2')||'[]')}catch(e){return []}}
function saveCart(c){localStorage.setItem('arinda_cart2',JSON.stringify(c));updateCount();renderCart();}
function updateCount(){const el=document.getElementById('cCount');if(!el)return;let t=getCart().reduce((a,b)=>a+Number(b.qty||0),0);el.innerText=t;el.style.display=t>0?'flex':'none';}
function clearCart(){document.getElementById('confirmModal').classList.add('show');}
function closeConfirm(){document.getElementById('confirmModal').classList.remove('show');}
function doClearCart(){saveCart([]);selectedOngkirCost=0;selectedService='';closeConfirm();}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('open');}
function closeCart(){document.getElementById('cartModal').classList.remove('open');}
function renderCart(){
  const c=getCart();const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);
  document.getElementById('cartTotalQty').innerText=c.reduce((a,b)=>a+b.qty,0);
  document.getElementById('cartSubtotal').innerText='Rp'+sub.toLocaleString('id-ID');
  const ongEl=document.getElementById('ongkirPriceCart');if(ongEl) ongEl.innerText='Rp'+selectedOngkirCost.toLocaleString('id-ID');
  const totEl=document.getElementById('cartTotalPrice');if(totEl) totEl.innerText='Rp'+(sub+selectedOngkirCost).toLocaleString('id-ID');
  const labEl=document.getElementById('ongkirLabel');if(labEl) labEl.innerText=selectedService?'('+esc(selectedService)+')':'';
  const list=document.getElementById('cartList');if(!list)return;
  if(!c.length){list.innerHTML='<p style="text-align:center;padding:30px;opacity:.4;font-size:11px">KERANJANG KOSONG</p>';return;}
  list.innerHTML=c.map((it,i)=>`<div style="display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #F2EFEA;align-items:center"><img src="${esc(it.img)}" style="width:52px;height:52px;border-radius:10px;object-fit:cover"><div style="flex:1"><div style="font-size:10px">${esc(it.warna)}</div><div style="font-size:9px;opacity:.5">Rp${Number(it.harga).toLocaleString('id-ID')} x ${it.qty}</div></div><button onclick="changeQty(${i},-1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff">-</button><span style="margin:0 6px;font-size:11px">${it.qty}</span><button onclick="changeQty(${i},1)" style="width:28px;height:28px;border-radius:50%;border:1px solid #ddd;background:#fff">+</button></div>`).join('');
}
function changeQty(i,d){let c=getCart();c[i].qty+=d;if(c[i].qty<=0)c.splice(i,1);saveCart(c);}
function cekOngkir(){
  const input=document.getElementById('destCity'); const city=(input.value||'').toLowerCase().trim();
  if(!city){alert('Ketik kota tujuan dulu kak'); input.focus(); return;}
  const btn=document.getElementById('btnCekOngkir'); if(btn){btn.innerText='...'; btn.disabled=true;}
  setTimeout(()=>{
    let base=25000;
    if(city.includes('jakarta')) base=10000;
    else if(city.includes('bogor')||city.includes('depok')||city.includes('tangerang')||city.includes('bekasi')) base=12000;
    else if(city.includes('bandung')||city.includes('semarang')||city.includes('yogyakarta')||city.includes('jogja')||city.includes('surabaya')||city.includes('solo')||city.includes('malang')) base=18000;
    else if(city.includes('medan')||city.includes('palembang')||city.includes('pekanbaru')||city.includes('lampung')||city.includes('bali')||city.includes('denpasar')) base=28000;
    else if(city.includes('makassar')||city.includes('manado')||city.includes('balikpapan')||city.includes('banjarmasin')||city.includes('pontianak')||city.includes('jayapura')||city.includes('ambon')) base=35000;
    const options=[
      {service:'REG - 2-3 HARI',cost:base,est:'2-3 hari'},
      {service:'CARGO - 3-5 HARI',cost:Math.max(10000,base-3000),est:'3-5 hari'},
      {service:'YES - 1 HARI',cost:base+15000,est:'1 hari'}
    ];
    const box=document.getElementById('ongkirOptions');
    box.style.display='block';
    box.innerHTML=options.map(o=>`<label style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid #000;margin-top:6px;cursor:pointer;background:#fff"><span style="font-size:10px"><b style="font-size:9px;letter-spacing:1px">${esc(o.service)}</b><br><small style="opacity:.5">${esc(o.est)} ke ${esc(city.toUpperCase())}</small></span><span style="display:flex;gap:8px;align-items:center"><b style="font-size:11px">Rp${o.cost.toLocaleString('id-ID')}</b><input type="radio" name="ongkirOpt" onchange="pilihOngkir(${o.cost},'${esc(o.service)}')"></span></label>`).join('');
    document.getElementById('ongkirNote').innerText='Pilih salah satu layanan di atas, ongkir akan langsung ditambahkan.';
    if(btn){btn.innerText='CEK'; btn.disabled=false;}
  },400);
}
function pilihOngkir(cost,service){selectedOngkirCost=cost; selectedService=service;renderCart();document.getElementById('ongkirNote').innerText='✓ Ongkir '+service+' dipilih - Rp'+cost.toLocaleString('id-ID');}
function checkoutWA(){
  const c=getCart();if(!c.length){alert('Keranjang kosong');return;}
  if(!selectedOngkirCost){ const city=document.getElementById('destCity'); if(city&&!city.value.trim()){alert('Cek ongkir dulu ya kak, ketik kota tujuan'); openCart(); if(city) city.focus(); return; } if(!confirm('Ongkir belum dipilih, lanjut tanpa ongkir?')) return; }
  let msg=`Halo ARINDA %0ASaya mau pesan:%0A`;c.forEach(it=>{msg+=`- ${esc(it.warna)} x${it.qty} = Rp${(it.harga*it.qty).toLocaleString('id-ID')}%0A`});
  const sub=c.reduce((a,b)=>a+b.harga*b.qty,0);
  const cityVal=document.getElementById('destCity')?document.getElementById('destCity').value:'-';
  msg+=`%0AKota Tujuan: ${esc(cityVal)}%0ASUBTOTAL Rp${sub.toLocaleString('id-ID')}%0AONGKIR ${esc(selectedService)||'-'}: Rp${selectedOngkirCost.toLocaleString('id-ID')}%0A*TOTAL Rp${(sub+selectedOngkirCost).toLocaleString('id-ID')}*`;
  window.open('https://wa.me/'+WA_NUMBER+'?text='+msg,'_blank');
}
function addCart(n,p,i){let c=getCart();let idx=c.findIndex(a=>a.warna==n);if(idx>-1)c[idx].qty++;else c.push({warna:n,qty:1,harga:Number(p),img:i});saveCart(c);}
function showToast(t,i){const img=document.getElementById('toastImg');const txt=document.getElementById('toastText');if(img)img.src=i;if(txt)txt.innerText=t;const el=document.getElementById('cartToast');el.classList.add('show');setTimeout(()=>el.classList.remove('show'),2200);}
function getOptImg(url,w=300){if(!url) return url; if(!url.includes('supabase.co/storage/v1/object/public/')) return url; try{const path=url.split('/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${path}?width=${w}&height=${w}&quality=75&format=webp&resize=contain`;}catch(e){return url;}}
function getBannerImg(url,w=1240){if(!url) return url; if(!url.includes('supabase.co/storage/v1/object/public/')) return url; try{const path=url.split('/object/public/')[1]; return `${SUPA_URL}/storage/v1/render/image/public/${path}?width=${w}&quality=80&format=webp&resize=contain`;}catch(e){return url;}}
function flyToCart(imgUrl, startEl){
  document.querySelectorAll('.fly-img').forEach(e=>e.remove());
  const cartIcon=document.getElementById('cartIcon'); if(!cartIcon) return;
  const cartRect=cartIcon.getBoundingClientRect();
  const targetX = cartRect.left + cartRect.width/2 - 24;
  const targetY = cartRect.top + cartRect.height/2 - 22;
  let startRect = startEl? startEl.getBoundingClientRect() : null;
  if(!startRect || startRect.width===0){startRect={left:innerWidth/2-34,top:innerHeight/2-34,width:68,height:68};}
  const fly=document.createElement('img');
  fly.src=getOptImg(imgUrl,120);
  fly.className='fly-img';
  fly.style.left=(startRect.left + startRect.width/2 - 34)+'px';
  fly.style.top=(startRect.top + startRect.height/2 - 34)+'px';
  fly.style.transform='scale(1)';fly.style.opacity='1';
  document.body.appendChild(fly);
  requestAnimationFrame(()=>{requestAnimationFrame(()=>{
    fly.style.left=targetX+'px';
    fly.style.top=targetY+'px';
    fly.style.transform='scale(0.14)';fly.style.opacity='0.15';
  });});
  setTimeout(()=>{
    fly.remove();
    cartIcon.classList.remove('cart-boom');
    void cartIcon.offsetWidth;
    cartIcon.classList.add('cart-boom');
    setTimeout(()=>cartIcon.classList.remove('cart-boom'),420);
  },720);
}
function quickAdd(title,img,el,idx){const imgEl=document.getElementById('img-best-'+idx)||(el?el.closest('.k-card')?.querySelector('img'):null);if(imgEl)flyToCart(imgEl.src||img,imgEl);addCart(title,99000,img);showToast(title+' MASUK KERANJANG',getOptImg(img,80));}
const underData={cool:{desc:'<b>COOL</b> — Ciri khas visual:Pembuluh darah cenderung berwarna biru atau keunguan,dengan rona kulit dasar kemerahan atau merah muda(pinkish/rosy). Warna Yang Cocok: <b>Warna Soft&Pastel:Dusty pink,soft mauve,baby blue,lilac. Warna Netral:Putih bersih,abu-abu,charcoal. Warna Bold&jewel tones:Navy,emerald green,ruby red,deep plum.</b>',col:'COOL'},warm:{desc:'<b>WARM</b> — Ciri Khas Visual:Pembuluh darah terlihat kehijauan,dengan rona kulit dasar keemasasan,kekuningan,atau peach. Warna Yang Cocok: <b>Eart Tones:Cokelat karamel,teracota,mustard,olive green,brick red. Netral Hangat:Cream,beige,taupe,cokelat susu. Cerah Berunsur Hangat:peach coaral,dusty orange.</b>',col:'WARM'},neutral:{desc:'<b>NEUTRAL</b> — Ciri Khas Visual:Perpaduan pembuluh darah biru/kehijauan,dengan rona kulit yang menyatu antara hangat dan dingin. Warna Yang Cocok: <b>Warna Netral&Earty:Tape,beige,dusty pink,mauve cokelat susu,cream. Warna Soft&muted:Sage green,dusty blue,soft lavender. Warna Bold&Jawel tones:Navy,emerald green,maroon,plum</b>',col:'NEUTRAL'},olive:{desc:'<b>OLIVE</b> — Ciri Khas Visual:Pembuluh darah biasanya berwarna hijau tua/keabu-abuan dengan rona kulit dasar bernuansa kehijauan(grenish/ashy atau muted golden. Warna Yang Cocok: <b>Warna Warm&Earty:terracotta,merah bata,mocca latte,camel,mustard,warm bronze. Warna Jewel Tones:Emerald green,forest green,burgundy,wine,plum,navy blue. Warna netral&soft:Cream,off-white,ivory,sage green,olive,taupe,dusty mauve</b>',col:'OLIVE'}};
function setUndertone(t){document.querySelectorAll('[id^="u-"]').forEach(b=>{b.style.background='#fff';b.style.color='#111'});const cur=document.getElementById('u-'+t);if(cur){cur.style.background='#111';cur.style.color='#fff';}const d=underData[t];const res=document.getElementById('uResult');if(res){res.innerHTML=d.desc+` <br><a href="produk.html?undertone=${esc(d.col)}" style="font-size:8px;letter-spacing:3px;color:#111;text-decoration:none;border-bottom:1px solid #111;margin-top:6px;display:inline-block">LIHAT ${esc(d.col)} →</a>`;}}
<!--SPLIT-->async function init(){
  try{
    // === FIX UTAMA - BACA banner_pc_url & banner_hp_url ===
    const {data:banners} = await supabaseClient.from('banners').select('banner_pc_url,banner_hp_url').eq('is_active',true).order('created_at',{ascending:false}).limit(1);
    if(banners && banners[0]){
      const img=document.getElementById('bannerImg');
      const srcPC=document.getElementById('bannerSourcePC');
      const pcUrl = banners[0].banner_pc_url;
      const hpUrl = banners[0].banner_hp_url || pcUrl;
      // Tampilkan sesuai device
      if(img){
        img.src = getBannerImg(hpUrl,800);
        img.onerror = ()=>{ img.src = pcUrl; };
        if(srcPC) srcPC.srcset = getBannerImg(pcUrl,1240);
      }
      // Update OG image biar share WA bagus
      try{
        const ogUrl = getBannerImg(pcUrl, 1200);
        const ogTag = document.querySelector('meta[property="og:image"]');
        const twTag = document.querySelector('meta[name="twitter:image"]');
        if(ogTag && ogUrl) ogTag.setAttribute('content', ogUrl);
        if(twTag && ogUrl) twTag.setAttribute('content', ogUrl);
      }catch(e){}
    }
    const{data:settings}=await supabaseClient.from('settings').select('key,value').in('key',['home_koleksi_terlaris','home_undertone_images']);
    if(settings){
      const get=k=>settings.find(s=>s.key===k)?.value;
      try{
        let raw=JSON.parse(get('home_koleksi_terlaris')||'[]');
        if(Array.isArray(raw)){
          const seen = new Set();
          raw = raw.filter(v=>{
            const url = (typeof v==='string'?v:v.url||'').trim();
            const titleKey = (typeof v==='object'?(v.title||''):'').toLowerCase().trim();
            const key = (url + '|' + titleKey).toLowerCase();
            if(!url || seen.has(key)) return false;
            seen.add(key);
            return true;
          });
        }
        if(raw.length){
          const grid=document.getElementById('koleksi4Grid');
          if(grid) grid.innerHTML=raw.slice(0,9).map((v,i)=>{
            const url=typeof v==='string'?v:v.url;
            const rawTitle=(typeof v==='object'?v.title:'')||'';
            const upperTitle = esc(rawTitle.replace(/'/g,"").toUpperCase());
            const cleanColor = upperTitle.split('-')[0].replace(/BEST SELLER/g,'').trim() || 'BEST';
            const displayTitle = upperTitle || 'BEST';
            const link='produk.html?warna='+encodeURIComponent(cleanColor.toLowerCase());
            return `<div class="k-card"><img id="img-best-${i}" src="${getOptImg(url,300)}" loading="lazy" decoding="async" width="300" height="300" alt="${esc(displayTitle)}" onclick="location.href='${esc(link)}'"><div class="heart-btn" onclick="quickAdd('${esc(cleanColor)}','${esc(url)}', this, ${i})"><svg viewBox="0 0 24 24"><path d="M12 20l-1.5-1.3C5 14 2 11.2 2 7.8A4.3 4.3 0 0 1 6.3 3.5c1.3 0 2.6.6 3.7 1.6L12 7l2-1.9c1.1-1 2.4-1.6 3.7-1.6A4.3 4.3 0 0 1 22 7.8c0 3.4-3 5.8-8.5 10.4L12 20z"/></svg></div><div style="padding:6px;border-top:1px solid #F6F1EB;font-size:7px;letter-spacing:2px;opacity:.5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" onclick="location.href='${esc(link)}'">${esc(displayTitle)}</div></div>`
          }).join('');
        }
      }catch(e){}
      try{
        const rawU=get('home_undertone_images');
        if(rawU){
          let uImgs=JSON.parse(rawU);
          if(Array.isArray(uImgs)){
            const seenU = new Set();
            uImgs = uImgs.filter(it=>{
              const url=typeof it==='string'?it:it.url||'';
              if(!url || seenU.has(url)) return false;
              seenU.add(url);
              return true;
            });
          }
          const grid=document.getElementById('undertoneGrid');
          if(grid&&uImgs.length){
            grid.innerHTML=uImgs.slice(0,4).map((it,i)=>{
              const url=typeof it==='string'?it:it.url; const label=typeof it==='object'?(it.title||''):`FOTO ${i+1}`; const low=label.toLowerCase(); let ut='NEUTRAL'; if(low.includes('cool')) ut='COOL'; else if(low.includes('warm')) ut='WARM'; else if(low.includes('olive')) ut='OLIVE';
              return `<div class="u-item" onclick="location.href='produk.html?undertone=${esc(ut)}'"><img src="${getOptImg(url,200)}" loading="lazy" decoding="async" width="200" height="200" alt="${esc(label)}"><div class="u-label">${esc(label||ut)}</div></div>`
            }).join('');
          }
        }
      }catch(e){}
    }
  }catch(e){} updateCount();
}
init();
</script></body></html>
