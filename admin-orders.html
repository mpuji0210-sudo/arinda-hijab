<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Order - ARINDA</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// KUNCI ORDER - CUMA order@arinda.id
(async()=>{
  const supa = window.supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
  const {data:{session}} = await supa.auth.getSession();
  if(!session){ location.href='login-order.html'; return; }
  const {data} = await supa.from('settings').select('value').eq('key','order_admin_emails').maybeSingle();
  let allowed=["order@arinda.id"];
  try{
    let v=data?.value; if(typeof v==='string') try{v=JSON.parse(v)}catch(e){}; 
    if(Array.isArray(v)) allowed=v.map(e=>String(e).toLowerCase());
  }catch(e){}
  if(!allowed.includes(session.user.email.toLowerCase())){
    await supa.auth.signOut();
    alert('Akses ditolak untuk '+session.user.email);
    location.href='login-order.html';
  }
})();
</script>
<style>
body{margin:0;background:#FFFCF9;color:#000;font-family:'Inter',sans-serif}
.card{border:1px solid #E9E9E9;background:#fff;padding:16px}
.btn-black{height:44px;background:#000;color:#fff;border:1px solid #000;font-size:9px;letter-spacing:2px;cursor:pointer}
.btn-white{height:44px;background:#fff;color:#000;border:1px solid #000;font-size:9px;letter-spacing:2px;cursor:pointer}
.input{height:44px;padding:0 12px;border:1px solid #000;font-size:12px;width:100%;outline:none;background:#fff;box-sizing:border-box}
#delModal,#appModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(12px);z-index:9999;align-items:center;justify-content:center;padding:20px}
#delModal.show,#appModal.show{display:flex}
</style>
</head><body>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
</script>

<nav style="position:sticky;top:0;z-index:99;background:#fff;border-bottom:1px solid #E9E9E9">
  <div style="max-width:800px;margin:0 auto;padding:16px 20px;display:flex;justify-content:space-between;align-items:center">
    <div id="adminLogo" style="font-family:'Cormorant Garamond';letter-spacing:8px;font-size:22px">ARINDA ORDER</div>
    <button onclick="logout()" style="padding:10px 14px;background:#fff;border:1px solid #000;font-size:9px;letter-spacing:2px;cursor:pointer">LOGOUT</button>
  </div>
</nav>

<div style="max-width:800px;margin:0 auto;padding:24px 16px 60px">
  <div class="card" style="margin-bottom:20px">
    <div style="display:flex;justify-content:space-between;align-items:center"><div style="font-family:'Cormorant Garamond';font-size:20px">Rekening</div><button onclick="loadPayments()" class="btn-white" style="height:32px;padding:0 14px">REFRESH</button></div>
    <div id="payListAdmin" style="margin-top:16px;display:flex;flex-direction:column;gap:8px"></div>
    <div style="border-top:1px solid #F2F2F2;margin-top:18px;padding-top:16px">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <input id="p_bank" class="input" placeholder="BANK: BCA" maxlength="20">
        <input id="p_rek" class="input" placeholder="NO REK: 8740376161" maxlength="20" inputmode="numeric">
        <input id="p_nama" class="input" placeholder="ATAS NAMA" maxlength="40" style="grid-column:1/-1">
        <input id="p_qr" class="input" placeholder="LINK QR (opsional)" style="grid-column:1/-1">
      </div>
      <div style="margin-top:10px"><input type="file" id="qrFile" accept="image/*" style="display:none"><label for="qrFile" class="btn-white" style="display:flex;align-items:center;justify-content:center;height:40px;cursor:pointer">+ UPLOAD QR</label><img id="qrPrev" style="width:100%;max-height:180px;object-fit:contain;display:none;margin-top:8px;border:1px solid #eee"></div>
      <div style="display:flex;gap:8px;margin-top:12px"><button onclick="addPayMethod()" class="btn-black" style="flex:1">+ TAMBAH</button><button onclick="savePayments()" class="btn-white" style="flex:1">SIMPAN</button></div>
      <div id="payStatus" style="font-size:10px;opacity:.5;margin-top:8px"></div>
    </div>
  </div>

  <div class="card" style="padding:14px;margin-bottom:18px;background:#FAFAFA">
    <div style="display:flex;gap:16px;font-size:11px"><div>TOTAL <b id="statTotal">0</b></div><div>OMSET <b id="statOmset">Rp0</b></div><div>HARI INI <b id="statToday">Rp0</b></div></div>
    <input id="searchOrder" class="input" placeholder="Cari nama / WA / kota..." style="margin-top:12px;background:#fff" oninput="filterOrders()">
  </div>

  <div style="display:flex;justify-content:space-between;margin-bottom:12px"><div style="font-family:'Cormorant Garamond';font-size:22px">Pesanan</div><div id="count" style="font-size:9px;opacity:.4">0</div></div>
  <div id="list" style="display:flex;flex-direction:column;gap:12px">Loading...</div>
</div>

<div id="delModal" onclick="if(event.target.id==='delModal')closeDel()"><div style="background:#fff;width:100%;max-width:380px;border:1px solid #000;padding:20px"><div style="font-family:'Cormorant Garamond';font-size:18px">Hapus?</div><div id="delInfo" style="font-size:11px;opacity:.6;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:16px"><button onclick="closeDel()" class="btn-white" style="flex:1">BATAL</button><button onclick="confirmDel()" id="btnDel" class="btn-black" style="flex:1">YA, HAPUS</button></div></div></div>
<div id="appModal" onclick="if(event.target.id==='appModal')closeApp()"><div style="background:#fff;width:100%;max-width:380px;border:1px solid #000;padding:20px"><div id="appTitle" style="font-family:'Cormorant Garamond';font-size:16px">Info</div><div id="appMsg" style="font-size:12px;opacity:.7;margin-top:8px"></div><div style="display:flex;gap:8px;margin-top:16px"><button id="appCancel" onclick="closeApp()" class="btn-white" style="flex:1;display:none">BATAL</button><button id="appOk" onclick="closeApp()" class="btn-black" style="flex:1">OKE</button></div></div></div>

<script>
let delId=null,pendingDeletePayIndex=null,payMethods=[],allOrders=[],qrUploadUrl='';
function openApp({title,msg,showCancel=false,okText='OKE',onOk=null}){
  document.getElementById('appTitle').innerText=title;document.getElementById('appMsg').innerText=msg;
  document.getElementById('appCancel').style.display=showCancel?'block':'none';document.getElementById('appOk').innerText=okText;
  document.getElementById('appModal').classList.add('show');
  document.getElementById('appOk').onclick=()=>{closeApp(); if(onOk) onOk();};
}
function closeApp(){document.getElementById('appModal').classList.remove('show');}
function validatePay(bank,rek,nama){
  if(!bank||bank.length<2) return 'Bank minimal 2 huruf';
  if(!/^\d{8,20}$/.test(rek)) return 'No Rek 8-20 digit angka';
  if(!nama||nama.length<3) return 'Atas nama min 3 huruf';
  return '';
}
document.getElementById('qrFile').addEventListener('change', async e=>{
  const f=e.target.files[0]; if(!f) return;
  if(f.size>5*1024*1024){ openApp({title:'File besar',msg:'Max 5MB'}); return; }
  const fn='qr_'+Date.now()+'.jpg';
  const {error}=await supa.storage.from('banners').upload(fn,f,{upsert:true});
  if(error){ openApp({title:'Gagal',msg:error.message}); return; }
  const url=supa.storage.from('banners').getPublicUrl(fn).data.publicUrl;
  qrUploadUrl=url; document.getElementById('p_qr').value=url;
  document.getElementById('qrPrev').src=url; document.getElementById('qrPrev').style.display='block';
});
function parseSettingsValue(v){
  try{
    if(typeof v==='string'){ try{v=JSON.parse(v)}catch(e){} }
    if(typeof v==='string'){ try{v=JSON.parse(v)}catch(e){} }
    return v;
  }catch(e){ return null; }
}
async function loadPayments(){
  document.getElementById('payStatus').innerText='Loading...';
  try{
    const {data}=await supa.from('settings').select('value').eq('key','payment_methods').maybeSingle();
    let v=parseSettingsValue(data?.value);
    if(Array.isArray(v)) payMethods=v;
    else if(v) payMethods=[v];
    else payMethods=[];
  }catch(e){payMethods=[]}
  if(payMethods.length===0) payMethods=[{bank:'BCA',no_rek:'8740376161',atas_nama:'ARINDA ADMIN',qr_url:'',aktif:true}];
  renderPayments(); document.getElementById('payStatus').innerText=payMethods.length+' metode';
}
function renderPayments(){
  const el=document.getElementById('payListAdmin');
  el.innerHTML=payMethods.map((m,i)=>`<div style="border:1px solid ${m.aktif?'#000':'#E9E9E9'};padding:12px;display:flex;justify-content:space-between;background:#fff"><div><b style="font-size:12px">${esc(m.bank)} - ${esc(m.no_rek)}</b><div style="font-size:10px;opacity:.6">a.n ${esc(m.atas_nama)} ${m.qr_url?'• QR OK':''}</div></div><div style="display:flex;gap:6px"><button onclick="togglePay(${i})" style="font-size:9px;padding:6px 10px;border:1px solid #000;background:${m.aktif?'#000':'#fff'};color:${m.aktif?'#fff':'#000'}">${m.aktif?'AKTIF':'OFF'}</button><button onclick="removePay(${i})" style="font-size:9px;padding:6px 10px;border:1px solid #000;background:#fff">HAPUS</button></div></div>`).join('');
}
function addPayMethod(){
  const b=document.getElementById('p_bank').value.trim(),r=document.getElementById('p_rek').value.trim(),n=document.getElementById('p_nama').value.trim(),q=document.getElementById('p_qr').value.trim()||qrUploadUrl;
  const err=validatePay(b,r,n); if(err){ openApp({title:'Cek lagi',msg:err}); return; }
  if(payMethods.some(m=>m.no_rek===r)){ openApp({title:'Duplikat',msg:'No Rek sudah ada'}); return; }
  payMethods.push({bank:b.toUpperCase(),no_rek:r,atas_nama:n.toUpperCase(),qr_url:q,aktif:true}); renderPayments();
  document.getElementById('p_bank').value='';document.getElementById('p_rek').value='';document.getElementById('p_nama').value='';document.getElementById('p_qr').value='';qrUploadUrl='';document.getElementById('qrPrev').style.display='none';
}
function removePay(i){ pendingDeletePayIndex=i; const m=payMethods[i]; openApp({title:'Hapus?',msg:`Hapus ${m.bank} ${m.no_rek}?`,showCancel:true,okText:'HAPUS',onOk:()=>{payMethods.splice(pendingDeletePayIndex,1);renderPayments();}}); }
function togglePay(i){payMethods[i].aktif=!payMethods[i].aktif; renderPayments();}
async function savePayments(){
  if(!payMethods.length){ openApp({title:'Kosong',msg:'Minimal 1 rekening'}); return; }
  if(!payMethods.some(m=>m.aktif)){ openApp({title:'Harus aktif',msg:'Aktifkan 1 rekening'}); return; }
  document.getElementById('payStatus').innerText='Menyimpan...';
  const {error}=await supa.from('settings').upsert({key:'payment_methods',value:JSON.stringify(payMethods)},{onConflict:'key'});
  if(error){ openApp({title:'Gagal',msg:error.message}); document.getElementById('payStatus').innerText='Gagal'; }
  else { document.getElementById('payStatus').innerText='✓ Tersimpan!'; openApp({title:'Berhasil',msg:payMethods.length+' rekening tersimpan'}); }
}
async function loadOrders(){
  try{
    const {data,error}=await supa.from('orders').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    allOrders=data||[];
    let total=0,todayTotal=0; const today=new Date().toISOString().slice(0,10);
    allOrders.forEach(o=>{total+=Number(o.total||0); if((o.created_at||'').slice(0,10)===today) todayTotal+=Number(o.total||0);});
    document.getElementById('statTotal').innerText=allOrders.length;
    document.getElementById('statOmset').innerText='Rp'+total.toLocaleString('id-ID');
    document.getElementById('statToday').innerText='Rp'+todayTotal.toLocaleString('id-ID');
    renderOrderList(allOrders);
  }catch(e){
    document.getElementById('list').innerHTML='<div style="padding:20px;border:1px solid #E9E9E9;color:#B42318">Error load orders: '+esc(e.message)+'<br><small>Cek RLS policies di Supabase > orders harus allow select untuk authenticated</small></div>';
  }
}
function renderOrderList(data){
  const list=document.getElementById('list'),count=document.getElementById('count');
  if(!data.length){count.innerText='0'; list.innerHTML='<div style="text-align:center;padding:40px;border:1px solid #E9E9E9">Belum ada pesanan</div>'; return;}
  count.innerText=data.length;
  list.innerHTML=data.map(o=>{
    let items=o.items; try{ if(typeof items==='string') items=JSON.parse(items); }catch(e){}
    const itemText=Array.isArray(items)? items.map(i=>`${esc(i.warna||i.name||'')} x${i.qty||1}`).join(', '): esc(o.produk||'-');
    const st=(o.status||'BARU').toUpperCase();
    const stColor=st==='LUNAS'?'#0A7A42':st==='KIRIM'?'#1D4ED8':'#000';
    const resi=o.resi||o.no_resi||'';
    return `<div class="card"><div style="display:flex;justify-content:space-between"><div><div style="font-size:13px;font-weight:600">${esc(o.customer_name||'-')} - ${esc(o.kota_tujuan||o.kota||'-')}</div><div style="font-size:10px;opacity:.5;margin-top:2px">${esc(new Date(o.created_at).toLocaleString('id-ID'))} • ${esc(o.wa||'')}</div></div><select onchange="updateStatus('${o.id}',this.value,this)" style="font-size:10px;padding:4px;border:1px solid ${stColor};color:${stColor};font-weight:700" data-prev="${st}"><option ${st==='BARU'?'selected':''}>BARU</option><option ${st==='LUNAS'?'selected':''}>LUNAS</option><option ${st==='KIRIM'?'selected':''}>KIRIM</option><option ${st==='SELESAI'?'selected':''}>SELESAI</option></select></div>
    <div style="margin-top:10px;font-size:11px;line-height:1.6;border-top:1px solid #F2F2F2;padding-top:10px">Alamat: ${esc(o.alamat||'-')}<br>Tujuan: ${esc(o.destination_label||o.kota_tujuan||'-')}<br>Ongkir: Rp${Number(o.ongkir||0).toLocaleString('id-ID')}<br>Produk: ${itemText}<div style="display:flex;justify-content:space-between;font-weight:700;margin-top:8px"><span>TOTAL</span><span>Rp${Number(o.total||0).toLocaleString('id-ID')}</span></div>
    <div style="margin-top:10px"><input id="resi_${o.id}" class="input" style="height:36px" placeholder="No Resi" value="${esc(resi)}"><div style="display:flex;gap:6px;margin-top:6px"><button onclick="saveResi('${o.id}')" class="btn-white" style="flex:1;height:36px">SIMPAN RESI</button><button onclick="waCustomer('${o.id}')" class="btn-white" style="flex:1;height:36px">WA</button></div></div></div><div style="display:flex;gap:8px;margin-top:10px"><button onclick="openDel('${o.id}','${esc((o.customer_name||'').replace(/'/g,''))}','${st}')" class="btn-black" style="flex:1">HAPUS</button></div></div>`;
  }).join('');
}
function filterOrders(){ const q=document.getElementById('searchOrder').value.toLowerCase(); if(!q) renderOrderList(allOrders); else renderOrderList(allOrders.filter(o=> (o.customer_name||'').toLowerCase().includes(q)||(o.wa||'').toLowerCase().includes(q)||(o.kota_tujuan||'').toLowerCase().includes(q))); }
async function saveResi(id){ const resi=document.getElementById('resi_'+id).value.trim(); if(!resi||resi.length<8){ openApp({title:'Resi',msg:'Min 8 karakter'}); return; } await supa.from('orders').update({resi:resi,no_resi:resi}).eq('id',id); openApp({title:'OK',msg:'Resi '+resi+' tersimpan'}); }
async function updateStatus(id,st,el){
  const prev=el?.dataset.prev||'BARU'; const order=allOrders.find(o=>String(o.id)===String(id));
  if(st==='KIRIM'){ const rv=document.getElementById('resi_'+id)?.value.trim()||order?.resi||''; if(!rv||rv.length<8){ openApp({title:'Resi wajib',msg:'Isi resi dulu'}); if(el) el.value=prev; return; } }
  if(['LUNAS','KIRIM','SELESAI'].includes(st)){
    openApp({title:`Ubah ke ${st}?`,msg:`Yakin ubah ${order?.customer_name||''} ke ${st}?`,showCancel:true,okText:`YA, ${st}`,onOk:async()=>{ await supa.from('orders').update({status:st}).eq('id',id); const idx=allOrders.findIndex(x=>String(x.id)===String(id)); if(idx>-1) allOrders[idx].status=st; if(el) el.dataset.prev=st; }});
    if(el) el.value=prev; return;
  }
  await supa.from('orders').update({status:st}).eq('id',id); if(el) el.dataset.prev=st;
}
function openDel(id,nama,st){ if(['LUNAS','KIRIM'].includes(st)){ openApp({title:'Tidak bisa',msg:`Status ${st} tidak bisa hapus`}); return; } delId=id; document.getElementById('delInfo').innerText=`Hapus ${nama} (${st})?`; document.getElementById('delModal').classList.add('show'); }
function closeDel(){delId=null;document.getElementById('delModal').classList.remove('show');}
async function confirmDel(){ if(!delId) return; await supa.from('orders').delete().eq('id',delId); closeDel(); loadOrders(); }
function waCustomer(id){ const o=allOrders.find(x=>String(x.id)===String(id)); if(!o) return; let n=(o.wa||'').replace(/[^0-9]/g,''); if(n.startsWith('0')) n='62'+n.slice(1); const resi=o.resi||o.no_resi||''; const msg=resi? `Halo ${o.customer_name}, pesanan sudah KIRIM. Resi: ${resi}` : `Halo ${o.customer_name}, pesanan diterima. Total Rp${Number(o.total||0).toLocaleString('id-ID')}`; window.open(`https://wa.me/${n}?text=${encodeURIComponent(msg)}`,'_blank'); }
async function logout(){await supa.auth.signOut(); localStorage.clear(); location.href='login-order.html';}
loadPayments(); loadOrders();
</script></body></html>
