<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Pesanan Arinda Hijab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{background:#FFF5F7;font-family:'Inter',sans-serif}.title{color:#E91E63;font-family:cursive;font-size:26px;padding:16px;font-weight:bold}</style>
</head><body>
<div class="title">Admin Pesanan Arinda Hijab</div>
<div style="padding:0 16px;display:flex;gap:10px">
<input id="search" placeholder="Cari nama / kota..." style="flex:1;padding:14px 18px;border-radius:99px;border:1px solid #ddd">
<button onclick="load()" style="background:#E91E63;color:#fff;padding:14px 24px;border-radius:99px;font-weight:bold">Refresh</button>
</div>
<div style="padding:0 16px;margin-top:12px">
<button onclick="hapusCache()" style="width:100%;background:#000;color:#fff;padding:12px;font-size:10px;letter-spacing:2px">HAPUS CACHE HP - KLIK DISINI JIKA MASIH ADA Pppp</button>
</div>
<div id="list" style="padding:16px"></div>
<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa=window.supabase.createClient(SUPA_URL,SUPA_KEY);

function hapusCache(){
  localStorage.clear();
  alert('Cache HP bersih! Reload...');
  location.href='/ad';
}
if(location.search.includes('clear')){ localStorage.clear(); location.href='/ad'; }

async function load(){
  const el=document.getElementById('list');
  el.innerHTML='<div style="text-align:center;padding:40px">Loading Supabase...</div>';
  try{
    const {data,error}=await supa.from('orders').select('*').order('created_at',{ascending:false});
    if(error) throw error;
    if(!data || data.length===0){
      el.innerHTML='<div style="background:white;border-radius:20px;padding:40px;text-align:center"><div style="font-size:40px">✨</div><b>Belum ada pesanan</b><div style="font-size:11px;opacity:.5;margin-top:6px">Supabase bersih. Toko siap jualan!</div></div>';
      return;
    }
    const q=document.getElementById('search').value.toLowerCase();
    let html='';
    data.forEach(o=>{
      if(q && !((o.customer_name||'')+ (o.kota||'')).toLowerCase().includes(q)) return;
      html+=`<div style="background:white;border-radius:20px;padding:20px;margin-bottom:12px">
        <div style="display:flex;justify-content:space-between"><b>${o.customer_name} - ${o.kota}</b><span style="background:black;color:white;font-size:9px;padding:5px 12px;border-radius:99px">${o.status||'LUNAS'}</span></div>
        <div style="font-size:10px;opacity:.5;margin-top:4px">ID: ${o.id} • ${new Date(o.created_at).toLocaleString('id-ID')}</div>
        <div style="background:#FFF5F7;border-radius:12px;padding:12px;margin-top:12px;font-size:12px">${(o.items||[]).map(i=>`• ${i.warna||i.nama||'Item'} x${i.qty}`).join('<br>')}</div>
        <div style="font-weight:bold;margin-top:12px">TOTAL: Rp${(o.total||o.total_price||0).toLocaleString('id-ID')}</div>
      </div>`;
    });
    el.innerHTML=html;
  }catch(e){
    el.innerHTML='<div style="background:white;padding:20px;border-radius:20px;color:red">Error: '+e.message+'</div>';
  }
}
document.getElementById('search').addEventListener('input',load);
load();
</script>
</body></html>
