<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Pesanan - Arinda Hijab</title>
<style>
body{font-family:sans-serif;background:#f5f5f5;padding:20px}
.login-box{max-width:350px;margin:100px auto;background:white;padding:30px;border-radius:15px;box-shadow:0 5px 20px rgba(0,0,0,0.1);text-align:center}
input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:8px;box-sizing:border-box}
button{width:100%;padding:12px;background:#111;color:white;border:none;border-radius:8px;cursor:pointer;font-weight:bold}
#adminContent{display:none}
.order-card{background:white;padding:15px;border-radius:10px;margin-bottom:15px}
</style>
</head>
<body>

<div id="loginBox" class="login-box">
<h2>🔒 Admin Pesanan</h2>
<p>Masukkan password untuk lihat pesanan</p>
<input type="password" id="pass" placeholder="Password">
<button onclick="checkPass()">Masuk</button>
<p id="err" style="color:red;display:none">Password salah!</p>
</div>

<div id="adminContent">
<h1>Pesanan Masuk - BCA 8740376161</h1>
<button onclick="logout()" style="width:auto;padding:8px 15px;background:red;margin-bottom:20px">Logout</button>
<div id="orders"><p>Belum ada pesanan</p></div>
</div>

<script>
const PASSWORD = "arinda123"; // GANTI PASSWORD DISINI KAK

function checkPass(){
  if(document.getElementById('pass').value === PASSWORD){
    localStorage.setItem('ad_login','true');
    showAdmin();
  } else {
    document.getElementById('err').style.display='block';
  }
}
function showAdmin(){
  document.getElementById('loginBox').style.display='none';
  document.getElementById('adminContent').style.display='block';
  loadOrders();
}
function logout(){
  localStorage.removeItem('ad_login');
  location.reload();
}
function loadOrders(){
  const data = JSON.parse(localStorage.getItem('arinda_orders') || '[]');
  const el = document.getElementById('orders');
  if(data.length === 0){
    el.innerHTML = '<p>Belum ada pesanan</p>';
  } else {
    el.innerHTML = data.map(o=>`<div class="order-card"><b>${o.nama}</b> - ${o.total}</div>`).join('');
  }
}
if(localStorage.getItem('ad_login')==='true'){ showAdmin(); }
</script>
</body>
</html>
