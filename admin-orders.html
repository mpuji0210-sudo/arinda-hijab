<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Pesanan v9 - Arinda Hijab</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 p-3">
<h1 class="text-2xl font-bold text-pink-600 mb-3" style="font-family:cursive">Admin Pesanan Arinda Hijab</h1>
<div class="flex gap-2 mb-3">
  <input id="search" oninput="load()" placeholder="Cari nama / kota..." class="flex-1 border rounded-xl px-4 py-2.5">
  <button onclick="load()" class="bg-pink-600 text-white px-5 rounded-xl font-bold">Refresh</button>
</div>
<div id="list" class="space-y-3">Loading...</div>
<script>
const SUPABASE_URL="https://qjgevvizqeebtdqcbqmt.supabase.co";
const SUPABASE_ANON="sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19";
const supa=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON);
async function load(){
  const q=document.getElementById('search').value.toLowerCase();
  const {data,error}=await supa.from('orders').select('*').order('created_at',{ascending:false}).limit(100);
  if(error){document.getElementById('list').innerHTML=error.message;return;}
  let f=data.filter(o=>(o.customer_name||'').toLowerCase().includes(q)||(o.kota_tujuan||'').toLowerCase().includes(q));
  document.getElementById('list').innerHTML=f.map(o=>`
    <div class="bg-white rounded-2xl p-4 shadow">
      <div class="flex justify-between items-start">
        <div>
          <div class="font-bold">${o.customer_name||'-'}</div>
          <div class="text-xs text-gray-500">${new Date(o.created_at).toLocaleString('id-ID')}</div>
          <div class="text-sm mt-1">📍 ${o.kota_tujuan||'-'} - ${o.alamat||'-'}</div>
        </div>
        <div class="text-right">
          <div class="font-bold">Rp${(o.total||0).toLocaleString('id-ID')}</div>
          <div class="text-[11px] px-2 py-1 rounded-full bg-yellow-100 text-yellow-800 mt-1 inline-block">${o.status||'pending'}</div>
        </div>
      </div>
      <div class="flex gap-2 mt-3">
        <button onclick="upd('${o.id}','DIPROSES')" class="flex-1 bg-blue-500 text-white py-2 rounded-xl text-sm">Proses</button>
        <button onclick="upd('${o.id}','SELESAI')" class="flex-1 bg-green-500 text-white py-2 rounded-xl text-sm">Selesai</button>
        <button onclick="del('${o.id}')" class="bg-red-500 text-white px-4 py-2 rounded-xl text-sm">Hapus</button>
      </div>
    </div>`).join('')||'<div class="text-center p-10 bg-white rounded-2xl">Belum ada pesanan</div>';
}
async function upd(id,s){await supa.from('orders').update({status:s}).eq('id',id);load();}
async function del(id){if(confirm('Hapus?')){await supa.from('orders').delete().eq('id',id);load();}}
load();
</script>
</body>
</html>
