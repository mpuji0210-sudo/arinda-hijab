<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bayar - ARINDA</title>
<style>body{font-family:Inter,sans-serif;max-width:480px;margin:0 auto;padding:16px;background:#fff} .pay-card{border:1px solid #111;padding:14px;margin-top:10px} .btn{width:100%;padding:14px;background:#000;color:#fff;border:none;letter-spacing:2px;font-size:10px;cursor:pointer} .qr{width:100%;max-width:280px;display:block;margin:10px auto;border:1px solid #E9E9E9}</style>
</head><body>
<h2 style="letter-spacing:4px">PEMBAYARAN</h2>
<div id="totalBox" style="font-size:12px;margin:10px 0"></div>
<div id="payList">Loading metode bayar...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<script>
const supabaseClient = supabase.createClient('https://qjgevvizqeebtdqcbqmt.supabase.co','sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19');
async function loadPay(){
  const total = localStorage.getItem('arinda_total')||'-';
  document.getElementById('totalBox').innerHTML = 'Total yang harus dibayar: <b>Rp'+total+'</b>';
  const {data} = await supabaseClient.from('settings').select('value').eq('key','payment_methods').single();
  if(!data){document.getElementById('payList').innerHTML='Belum ada metode bayar di admin';return;}
  const methods = JSON.parse(data.value).filter(m=>m.aktif);
  document.getElementById('payList').innerHTML = methods.map(m=>`
    <div class="pay-card">
      <div style="display:flex;justify-content:space-between"><b>${m.bank}</b><span style="font-size:10px;border:1px solid #111;padding:2px 6px">${m.logo||m.bank}</span></div>
      <div style="margin-top:8px;font-size:13px">No: <b id="rek-${m.bank}">${m.no_rek}</b> a.n ${m.atas_nama}</div>
      ${m.qr_url?`<img src="${m.qr_url}" class="qr" onclick="window.open(this.src)">`:''}
      <button class="btn" style="margin-top:10px" onclick="navigator.clipboard.writeText('${m.no_rek}');alert('No rek ${m.bank} disalin')">SALIN NO REK</button>
    </div>
  `).join('');
}
loadPay();
</script>
</body></html>
