<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bayar - Arinda Hijab</title>
<style>
body{font-family:sans-serif;background:#f7f7f7;margin:0;padding:15px}
.box{max-width:450px;margin:0 auto;background:white;border-radius:15px;padding:20px;box-shadow:0 5px 15px rgba(0,0,0,0.1)}
h2{text-align:center;margin:0 0 15px}
.rek{background:#f0f8ff;border:2px dashed #007bff;padding:15px;border-radius:10px;text-align:center;margin:15px 0}
.rek b{font-size:18px;display:block;color:#007bff}
.btn{width:100%;padding:14px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin-top:10px}
.btn-copy{background:#e3f2fd;color:#007bff}
.btn-lunas{background:#111;color:white;font-size:16px}
.detail{font-size:14px;line-height:1.6}
.detail b{display:inline-block;width:70px}
</style>
</head>
<body>
<div class="box">
<h2>💳 Selesaikan Pembayaran</h2>
<div class="detail" id="detailPesanan">
Memuat pesanan...
</div>

<div class="rek">
<small>TRANSFER KE REKENING:</small>
<b>BCA 8740376161</b>
<b>a.n MUHAMMAD PUJIANTO</b>
<p style="font-size:13px;margin:10px 0 0">Total Transfer Sesuai Pesanan</p>
<h3 id="totalTransfer" style="margin:5px 0;color:red">Rp55.000</h3>
</div>

<button class="btn btn-copy" onclick="salinRek()">📋 SALIN NO REKENING</button>
<button class="btn btn-lunas" onclick="konfirmasiLunas()">SAYA SUDAH TRANSFER - KONFIRMASI LUNAS ✅</button>
<p style="text-align:center;font-size:12px;color:gray;margin-top:15px">Setelah transfer, klik konfirmasi. Pesanan akan masuk ke Admin.</p>
</div>

<script>
// Ambil data dari checkout
const nama = localStorage.getItem('checkout_nama') || 'Puji';
const kota = localStorage.getItem('checkout_kota') || 'Si';
const alamat = localStorage.getItem('checkout_alamat') || 'Sa';
const produk = localStorage.getItem('checkout_produk') || 'Segi empat Paris premium - OLIVE GREEN';
const total = localStorage.getItem('checkout_total') || 'Rp55.000';

document.getElementById('detailPesanan').innerHTML = `
<b>Nama:</b> ${nama}<br>
<b>Kota:</b> ${kota}<br>
<b>Alamat:</b> ${alamat}<br>
<b>Produk:</b> ${produk}<br>
<b>Total:</b> ${total}
`;
document.getElementById('totalTransfer').innerText = total;

function salinRek(){
  navigator.clipboard.writeText('8740376161');
  alert('No rekening BCA 8740376161 disalin! a.n MUHAMMAD PUJIANTO');
}

function konfirmasiLunas(){
  let orders = JSON.parse(localStorage.getItem('arinda_orders') || '[]');
  orders.unshift({
    nama: nama,
    kota: kota,
    alamat: alamat,
    produk: produk,
    total: total,
    rekening: 'BCA 8740376161 a.n MUHAMMAD PUJIANTO',
    waktu: new Date().toLocaleString('id-ID')
  });
  localStorage.setItem('arinda_orders', JSON.stringify(orders));
  
  // Hapus cart
  localStorage.removeItem('cart');
  
  alert('✅ Terima kasih! Pesanan kamu sudah masuk ke Admin. Cek di /ad');
  window.location.href = '/';
}
</script>
</body>
</html>
