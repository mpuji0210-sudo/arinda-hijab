<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bayar - ARINDA</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const STORE_CACHE = localStorage.getItem('store_name_cache') || 'ARINDA';
const WA_CACHE = localStorage.getItem('wa_number_cache') || '6285178098354';
document.title = 'Bayar - ' + STORE_CACHE;
</script>
<style>
body{margin:0;background:#FFFCF9;color:#111;font-family:'Inter',sans-serif}
.wrap{max-width:480px;margin:0 auto;padding:18px 14px 60px}
.card{border:1px solid #E9E9E9;background:#fff;padding:16px}
.pay-card{border:1px solid #111;background:#fff;padding:16px;margin-top:12px}
.btn{width:100%;height:48px;background:#000;color:#fff;border:1px solid #000;font-size:10px;letter-spacing:3px;cursor:pointer}
.btn-white{width:100%;height:48px;background:#fff;color:#000;border:1px solid #000;font-size:10px;letter-spacing:3px;cursor:pointer}
.btn-wa{width:100%;height:52px;background:#000;color:#fff;border:1px solid #000;font-size:11px;letter-spacing:3px;cursor:pointer}
.qr{width:100%;max-width:260px;display:block;margin:14px auto;border:1px solid #eee}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#111;color:#fff;padding:12px 18px;border-radius:20px;font-size:11px;opacity:0;transition:.35s;z-index:9999}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head><body>
<div class="wrap">
  <div style="text-align:center;padding:24px 0 10px">
    <div id="storeLogo" style="font-family:'Cormorant Garamond';font-weight:300;letter-spacing:8px;font-size:28px">ARINDA</div>
  </div>

  <div class="card">
    <div id="totalBox" style="font-family:'Cormorant Garamond';font-size:42px;letter-spacing:1px">Rp-</div>
    <div id="orderInfo" style="font-size:11px;opacity:.7;margin-top:10px;line-height:1.7;background:#FAF7F2;padding:10px;border:1px solid #F0E8D8"></div>
  </div>

  <div style="margin-top:26px"><div style="font-family:'Cormorant Garamond';font-size:22px">Pembayaran</div><div id="payCount" style="font-size:9px;opacity:.4;margin-top:2px"></div></div>
  <div id="payList" style="margin-top:12px"></div>

  <div style="margin-top:26px;display:flex;flex-direction:column;gap:10px">
    <button onclick="confirmWA()" class="btn-wa" id="btnWA">KONFIRMASI PESANAN →</button>
    <button onclick="location.href='index.html'" class="btn-white">KEMBALI</button>
  </div>
</div>
<div id="toast"></div>

<script>
const SUPA_URL='https://qjgevvizqeebtdqcbqmt.supabase.co';
const SUPA_KEY='sb_publishable_stWClQvunFQfTyT_5gpVYQ_klrTgW19';
const supa = window.supabase.createClient(SUPA_URL,SUPA_KEY);
let WA_ADMIN = WA_CACHE; let STORE_NAME = STORE_CACHE;
let lastTotal=0; let lastMethods=[]; let lastCustomer={}; let lastOrderId=null; let lastOrder=null;
function esc(s){return (s||'').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function toast(t){ const el=document.getElementById('toast'); el.innerText=t; el.classList.add('show'); setTimeout(()=>el.classList.remove('show'),2200); }
function copyText(txt,bank){ navigator.clipboard.writeText(txt).then(()=>toast(bank+' '+txt+' disalin')); }

async function loadStoreConfig(){
  document.getElementById('storeLogo').innerText = STORE_CACHE.toUpperCase();
  try{
    const {data}=await supa.from('settings').select('*').in('key',['store_name','wa_number']);
    if(data){
      const g=k=>data.find(s=>s.key===k)?.value;
      if(g('store_name')){ STORE_NAME=g('store_name'); localStorage.setItem('store_name_cache', STORE_NAME); document.getElementById('storeLogo').innerText=STORE_NAME.toUpperCase(); document.title='Bayar - '+STORE_NAME; }
      if(g('wa_number')){ WA_ADMIN=g('wa_number'); localStorage.setItem('wa_number_cache', WA_ADMIN); }
    }
  }catch(e){}
}

function confirmWA(){
  if(!lastOrderId){ toast('Order tidak ditemukan'); return; }
  const c=lastCustomer; const total=lastTotal;
  const rekLines=lastMethods.map(m=>`- ${m.bank} ${m.no_rek} a.n ${m.atas_nama}`).join('\n');
  const msg=`Halo ${STORE_NAME}\n\nKonfirmasi pembayaran:\n\nID: ${lastOrderId}\nNama: ${c.name||'-'}\nAlamat: ${c.alamat||''} ${c.kota||''}\nTotal: Rp${Number(total||0).toLocaleString('id-ID')}\n\nTujuan:\n${rekLines}\n\nSaya sudah transfer, terima kasih 🙏`;
  window.open(`https://wa.me/${WA_ADMIN}?text=${encodeURIComponent(msg)}`,'_blank');
}

async function loadPay(){
  await loadStoreConfig();
  lastOrderId = localStorage.getItem('arinda_last_order_id') || sessionStorage.getItem('arinda_last_order_id');

  if(lastOrderId){
    try{
      const {data}=await supa.from('orders').select('*').eq('id',lastOrderId).maybeSingle();
      if(data){
        lastOrder=data;
        lastTotal=Number(data.total||0);
        lastCustomer={name:data.customer_name||data.nama||'', wa:data.wa||'', alamat:data.alamat||'', kota:data.kota_tujuan||data.destination_label||data.kota||''};
      }
    }catch(e){}
  }
  if(!lastTotal){
    lastTotal=Number(localStorage.getItem('arinda_total')||0);
    try{ const o=JSON.parse(localStorage.getItem('arinda_customer')||'{}'); lastCustomer={name:o.name||'', wa:o.wa||'', alamat:o.alamat||'', kota:o.destLengkap||o.kota||''}; }catch(e){}
  }
  document.getElementById('totalBox').innerText='Rp'+Number(lastTotal||0).toLocaleString('id-ID');
  document.getElementById('orderInfo').innerHTML=`<b>${esc(lastCustomer.name||'-')}</b> • ${esc(lastCustomer.wa||'')}<br>${esc(lastCustomer.alamat||'')}<br>${esc(lastCustomer.kota||'')}`;

  // PAYMENT - FIX V21: baca dari settings + fallback BCA kakak
  try{
    const {data}=await supa.from('settings').select('value').eq('key','payment_methods').maybeSingle();
    let methods=data?.value; if(typeof methods==='string') try{methods=JSON.parse(methods)}catch(e){methods=[]}
    lastMethods=(methods||[]).filter(m=> m.aktif!==false && m.active!==false && (m.aktif==null||m.aktif) );
    // kalau admin save pakai format baru
    if(lastMethods.length===0 && Array.isArray(methods)) lastMethods=methods;
  }catch(e){}

  if(lastMethods.length===0){
    // Fallback biar gak kosong seperti di screenshot
    lastMethods=[{bank:'BCA', no_rek:'8740376161', atas_nama:'ARINDA ADMIN', qr_url:''}];
  }

  document.getElementById('payCount').innerText=lastMethods.length+' METODE';
  document.getElementById('payList').innerHTML=lastMethods.map(m=>`
    <div class="pay-card">
      <div style="font-size:10px;letter-spacing:2px;opacity:.5">${esc(m.bank)}</div>
      <div style="font-size:20px;font-weight:600;margin-top:4px">${esc(m.no_rek)}</div>
      <div style="font-size:11px;opacity:.6;margin-top:4px">a.n ${esc(m.atas_nama)}</div>
      ${m.qr_url?`<img src="${esc(m.qr_url)}" class="qr">`:''}
      <div style="display:flex;gap:8px;margin-top:14px"><button class="btn-white" onclick="copyText('${esc(m.no_rek)}','${esc(m.bank)}')">SALIN NO</button><button class="btn" onclick="copyText('${esc(m.no_rek)}','${esc(m.bank)}')">SALIN</button></div>
    </div>`).join('');
}
loadPay();
</script></body></html>
